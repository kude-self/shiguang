*{box-sizing:border-box}body{margin:0;color:#514946;background:#fffdfa;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:760px;margin:auto;padding:34px 20px 60px}.top{text-align:center;margin-bottom:30px}.top h1{font-size:30px;margin:0 0 8px;font-weight:800}.top p{margin:0;color:#9b908a;font-size:14px}
