<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e9"><title>我的系統｜正式入口</title>
<link rel="icon" href="../assets/icon-home.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4">
<style>
*{box-sizing:border-box}body{margin:0;color:#514946;background:#fffaf5;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 10%,#f9ddd744 0 70px,transparent 72px),radial-gradient(circle at 88% 28%,#e3edf355 0 85px,transparent 87px),radial-gradient(circle at 18% 78%,#e8f0df55 0 90px,transparent 92px)}
main{position:relative;max-width:820px;margin:auto;padding:34px 18px 64px}.top{text-align:center;margin-bottom:30px}.top h1{font-size:30px;margin:0 0 8px;font-weight:800;letter-spacing:.04em}.top p{margin:0;color:#9a8d86;font-size:14px}
.group{margin:27px 0 14px}.group h2{font-size:16px;letter-spacing:.08em;color:#8e8179;margin:0 0 13px 5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{text-decoration:none;color:inherit;background:#fffdf9;border:1.5px solid #eee2d8;border-radius:26px;padding:18px 10px 16px;min-height:166px;box-shadow:0 8px 22px #796c5e12;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;transition:transform .15s ease,box-shadow .15s ease}
.card:active{transform:scale(.975);box-shadow:0 4px 12px #796c5e14}
.card img{width:82px;height:82px;aspect-ratio:1/1;object-fit:contain;margin-bottom:13px;border-radius:23px;filter:drop-shadow(0 4px 8px #8b776510)}
.card b{font-size:17px;font-weight:750;letter-spacing:.015em}.card span{font-size:12.5px;color:#9a8d86;margin-top:5px;line-height:1.45}
.card:nth-child(4n+1){border-color:#efd6d1}.card:nth-child(4n+2){border-color:#dce8ee}.card:nth-child(4n+3){border-color:#e8dced}.card:nth-child(4n){border-color:#dfe7d7}
.note{text-align:center;color:#b0a39c;font-size:11px;margin-top:32px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.card{min-height:180px}.card img{width:88px;height:88px}}
@media(max-width:370px){main{padding-left:12px;padding-right:12px}.grid{gap:10px}.card{padding:14px 7px;min-height:154px;border-radius:23px}.card img{width:72px;height:72px;border-radius:21px}.card b{font-size:15px}.card span{font-size:11.5px}}
</style></head><body><main>
<div class="top"><h1>我的系統</h1><p>只保留目前正式、可使用的入口</p></div>
<section class="group"><h2>拾光所</h2><div class="grid">

<a class="card" href="../booking/"><img src="../assets/icon-booking.svg"><b>旅人預約</b><span>初遇・拾光・同行</span></a>
<a class="card" href="../birthday/"><img src="../assets/icon-birthday.svg"><b>生日拾光</b><span>生日日期制</span></a>
<a class="card" href="../admin/"><img src="../assets/icon-admin.svg"><b>拾光者後台</b><span>旅程紀錄本 V2</span></a>
<a class="card" href="../keyword-draw/"><img src="../assets/icon-keyword.svg"><b>關鍵詞抽取</b><span>陪伴關鍵字</span></a>
</div></section>
<section class="group"><h2>我的生活與工作</h2><div class="grid">
<a class="card" href="../shift-scheduler-cloud/"><img src="../assets/icon-shift-scheduler.svg"><b>我的上班小日子</b><span>班表・薪資・預約</span></a>
<a class="card" href="../daily-life/"><img src="../assets/icon-daily-life.svg"><b>我的日常生活</b><span>生活安排與紀錄</span></a>
<a class="card" href="https://kude-self.github.io/idea-bloom/course-manager/"><img src="https://kude-self.github.io/idea-bloom/assets/icon-course-manager.svg"><b>學習日誌</b><span>課程與學員管理</span></a>

</div></section>
<div class="note">正式入口整理版・舊版與重複系統不列入</div>
</main></body></html>
