<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4e8ef"><title>我的小日子</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#5f5965}body{background:linear-gradient(160deg,#f9dfd8 0%,#eee2f5 28%,#dfeef5 54%,#e4f1e5 78%,#fff0cf 100%)}.wrap{width:min(100%,560px);height:100dvh;margin:auto;padding:14px 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.top{position:relative;padding:16px 16px 15px;border-radius:23px;background:linear-gradient(135deg,#fff8f0d9,#f5e9f8d9,#e8f5f2d9);border:2px solid #fff9;box-shadow:0 10px 28px #67586c12;overflow:hidden;flex:0 0 auto}.tiny{font-size:8.5px;letter-spacing:.18em;color:#958c99}.top h1{font-size:24px;margin:5px 0 3px}.top p{margin:0;font-size:10.5px;line-height:1.45;color:#8c8490;padding-right:48px}.deco{position:absolute;right:14px;top:10px;font-size:25px;opacity:.7}.stars{position:absolute;right:16px;bottom:10px;color:#c5a8d1;font-size:14px}.hello{margin:1px 3px 0;font-size:10.5px;color:#827a86;flex:0 0 auto}.grid{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0;flex:1}.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;padding:14px 15px;border-radius:22px;border:2px solid #fff9;box-shadow:0 8px 22px #65576a10;transition:.18s transform;min-height:0}.card:active{transform:scale(.985)}.work{background:linear-gradient(135deg,#f8d8d0,#eee0f5 48%,#dcecf4)}.life{background:linear-gradient(135deg,#f7e9bd,#e0eedf 48%,#e1edf6)}.icon{font-size:26px;line-height:1}.card h2{font-size:17px;margin:7px 0 3px}.card p{font-size:10px;line-height:1.45;margin:0;color:#827b86}.go{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;font-size:10px;font-weight:800}.arrow{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;background:#fff9;font-size:15px}.bottom{text-align:center;font-size:9px;color:#958d97;letter-spacing:.06em;flex:0 0 auto}@media(min-width:560px){.wrap{padding-top:18px;padding-bottom:18px}.grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.card{padding:18px}.card h2{font-size:19px}.card p{font-size:10.5px}}@media(max-height:700px){.wrap{gap:7px;padding-top:9px}.top{padding:12px 14px}.top h1{font-size:21px}.top p{font-size:9.5px}.grid{gap:7px}.card{padding:10px 13px}.icon{font-size:22px}.card h2{font-size:15px;margin:5px 0 2px}.card p{font-size:9px}.bottom{font-size:8px}}</style></head><body><main class="wrap"><section class="top"><div class="tiny">MY LITTLE DAYS ✦</div><h1>🌷 我的小日子</h1><p>把每天要照顧的事情，放在自己的小小空間裡 ♡</p><div class="deco">☁️</div><div class="stars">✦ ˚ ·</div></section><div class="hello">今天想先去哪裡？</div><section class="grid"><a class="card work" href="../shift-scheduler/"><div class="icon">🗓️</div><h2>我的上班小日子</h2><p>班表、休假、薪資與兼職預約，一起整理。</p><div class="go"><span>打開上班小日子</span><span class="arrow">›</span></div></a><a class="card life" href="../daily-life/"><div class="icon">🌤️</div><h2>我的日常安排</h2><p>早晨、白天、睡前與休假安排，都放在這裡。</p><div class="go"><span>打開日常安排</span><span class="arrow">›</span></div></a></section><div class="bottom">平凡的生活，過著不平凡的人生 ✦</div></main></body></html>
