<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f5"><title>我的系統｜生活與拾光所</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet"><style>:root{--ink:#675d59;--muted:#948781;--pink:#f8e6e6;--sage:#e7f1e5;--cream:#fff3dc;--lav:#f0e9f2;--border:#eee0da}*{box-sizing:border-box}body{margin:0;font-family:"Huninn","PingFang TC",ui-rounded,sans-serif;color:var(--ink);background:radial-gradient(circle at 0 0,#ffe8ed,transparent 32%),radial-gradient(circle at 100% 10%,#eaf3e5,transparent 30%),#fffaf6;min-height:100dvh}.wrap{max-width:720px;margin:auto;padding:45px 20px 65px}.eyebrow{font-size:14px;letter-spacing:.22em;color:#bb9290}.header{text-align:center;padding:20px 0 27px}h1{font-size:37px;margin:9px 0 7px;letter-spacing:.08em}p{color:var(--muted);line-height:1.75;margin:0}.section{margin:26px 0 13px;font-size:15px;font-weight:700;color:#9a827d;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-decoration:none;color:var(--ink);min-height:173px;border:1px solid var(--border);border-radius:26px;padding:19px 10px;box-shadow:0 7px 20px #957b7510;transition:transform .15s,box-shadow .15s}.item:active{transform:scale(.97)}.item:focus-visible{outline:3px solid #bb939a;outline-offset:3px}.icon{display:grid;place-items:center;width:62px;height:62px;border-radius:22px;background:#ffffffb8;font-size:31px}.item strong{font-size:20px;letter-spacing:.04em}.item small{font-size:12px;color:#867c78;text-align:center;line-height:1.5}.pink{background:var(--pink)}.sage{background:var(--sage)}.cream{background:var(--cream)}.lav{background:var(--lav)}.pending{border-style:dashed;cursor:default}.pending small{color:#a38c87}.note{margin-top:30px;text-align:center;font-size:12px;color:#a39792;line-height:1.8}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.item{min-height:185px}}</style></head><body><main class="wrap"><header class="header"><div class="eyebrow">MY LITTLE SPACE ✿</div><h1>我的系統</h1><p>把日常與喜歡的事，好好放在一起 ♡</p></header><div class="section">𓂃 拾光所・服務與管理</div><div class="grid"><a class="item pink" href="../booking/"><span class="icon" aria-hidden="true">🌷</span><strong>拾光所</strong><small>旅人預約・選擇療癒旅程</small></a><a class="item cream" href="../birthday/"><span class="icon" aria-hidden="true">🎂</span><strong>生日拾光</strong><small>生日祝福與拾光紀錄</small></a><a class="item sage" href="../admin/#/dashboard"><span class="icon" aria-hidden="true">📒</span><strong>拾光者後台</strong><small>旅人紀錄・服務設定</small></a></div><div class="section">𓂃 我的生活與工作</div><div class="grid"><div class="item cream pending"><span class="icon">🗓️</span><strong>我的上班小日子</strong><small>班表・薪資・預約<br>原網址待確認</small></div><div class="item sage pending"><span class="icon">📝</span><strong>我的日常生活</strong><small>生活安排與紀錄<br>原網址待確認</small></div><div class="item lav pending"><span class="icon">📖</span><strong>學習日誌</strong><small>課程與學員管理<br>原網址待確認</small></div></div><div class="section">𓂃 我的創作工具</div><div class="grid"><div class="item cream pending"><span class="icon">🔖</span><strong>關鍵詞抽取</strong><small>陪伴關鍵字<br>原網址待確認</small></div></div><div class="section">𓂃 其他創作工具</div><div class="grid"><a class="item lav" href="https://kude-self.github.io/idea-bloom/customer/"><span class="icon" aria-hidden="true">✨</span><strong>想法成形所</strong><small>從想法開始創作</small></a></div><p class="note">原有七個系統均已保留在版面。<br>尚未核對網址的入口暫不開放點擊，避免連到錯誤系統。</p></main></body></html>
