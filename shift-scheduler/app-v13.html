<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e7df"><title>🌷 我的上班小日子</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0}body{overflow:hidden;background:#f7e7df}</style></head><body><iframe id="app" src="./app-v11.html?v=salary-parttime-v13"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d||d.getElementById('partTimeSalary'))return;const pay=d.querySelector('#pay .calc');if(!pay)return;const box=d.createElement('div');box.id='partTimeSalary';box.innerHTML=`<div class="sectiontitle" style="margin-top:12px">🌷 兼職收入</div><div class="cr"><span>已完成預約收入</span><b id="ptIncome">$0</b></div><div class="notice" style="margin-top:8px">只有「已完成」的兼職預約會計入本月收入；待確認、已確認與取消不計入。</div><div class="big" style="margin-top:10px;background:linear-gradient(135deg,#f7dfe8,#f7e8b8,#dcecf5)"><span>💰 本月總收入</span><b id="allIncome">$0</b><small style="display:block;margin-top:4px;font-size:9px;color:#807783">正職實領 ＋ 兼職已完成收入</small></div>`;pay.appendChild(box);function money(n){return '$'+Math.round(n||0).toLocaleString('zh-TW')}function update(){let s={};try{s=JSON.parse(w.localStorage.getItem('shiftPayV5')||'{}')}catch{}const date=(d.querySelector('#payMonth')?.textContent||'').match(/(\d{4})[^0-9]+(\d{1,2})/);let ym;if(date)ym=date[1]+'-'+String(date[2]).padStart(2,'0');else{const n=new Date();ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')}const bs=Array.isArray(s.bookings)?s.bookings:[];const pt=bs.filter(b=>String(b.date||'').startsWith(ym)&&['completed','done','已完成'].includes(String(b.status||'').toLowerCase())).reduce((a,b)=>a+(+b.fee||0),0);const netText=d.querySelector('#net')?.textContent||'$0';const net=+(netText.replace(/[^0-9.-]/g,'')||0);d.querySelector('#ptIncome').textContent=money(pt);d.querySelector('#allIncome').textContent=money(net+pt)}update();new MutationObserver(update).observe(d.body,{subtree:true,childList:true,characterData:true});w.addEventListener('storage',update);setInterval(update,1200)})</script></body></html>
