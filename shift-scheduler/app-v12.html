<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7e7df">
<title>🌷 我的上班小日子</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#5f5965}body{background:linear-gradient(180deg,#f7e1d8,#eee3f6 28%,#e1eff5 55%,#e4f0e7 78%,#fff0cf)}
.gate{min-height:100vh;display:grid;place-items:center;padding:18px}.login{width:min(92vw,420px);padding:24px 20px;border-radius:28px;background:linear-gradient(135deg,#fff8f3ee,#f6eefbee,#edf7f3ee);border:2px solid #fff;box-shadow:0 18px 50px rgba(91,72,99,.14)}.tiny{font-size:10px;letter-spacing:.18em;color:#998f9c}.login h1{font-size:25px;margin:8px 0 5px}.login p{font-size:12px;line-height:1.65;color:#89808c}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input{width:100%;min-height:46px;border:1px solid #dfd4df;border-radius:14px;background:#fffaf7;padding:10px 12px;font-size:16px;outline:none}.field input:focus{border-color:#c6aecb;box-shadow:0 0 0 3px #d9c8df40}.login button{width:100%;min-height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,#d9a0aa,#a897c5);color:#fff;font-weight:900;margin-top:5px}.msg{min-height:20px;margin-top:8px;font-size:11px;color:#a06872}.loading{text-align:center;font-size:13px;color:#7d7481}.flower{font-size:34px}.syncbar{position:fixed;right:10px;bottom:12px;z-index:80;display:flex;gap:6px}.syncbar button{border:1px solid #fff;background:#fff9;color:#746b79;border-radius:99px;padding:8px 11px;font-size:10px;box-shadow:0 5px 15px #55495e1a}
</style>
</head>
<body>
<div id="root" class="gate"><div class="loading"><div class="flower">🌷</div><br>正在連接你的預約資料…</div></div>
<script>
const SUPA='https://tgfxrbghzzttqbpfwypw.supabase.co';
const KEY='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';
const AUTH_KEY='workdays_admin_session';
const APP_KEY='shiftPayV5';
const root=document.getElementById('root');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showLogin(msg=''){
 root.className='gate';root.innerHTML=`<section class="login"><div class="tiny">PRIVATE · BOOKING SYNC</div><h1>🌷 我的上班小日子</h1><p>登入後，旅人從「拾光所｜旅程預約」送出的資料，會自動同步到你的預約頁與班表月曆。</p><div class="field"><label>管理者 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">登入並同步 ♡</button><div id="msg" class="msg">${esc(msg)}</div></section>`;
 document.getElementById('loginBtn').onclick=login;
 document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()};
}
async function login(){
 const b=document.getElementById('loginBtn'),m=document.getElementById('msg');b.disabled=true;b.textContent='登入中…';m.textContent='';
 try{const r=await fetch(`${SUPA}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const x=await r.json();if(!r.ok||!x.access_token)throw new Error('登入資料不正確');localStorage.setItem(AUTH_KEY,JSON.stringify(x));await syncAndLoad(x.access_token)}catch(e){m.textContent=e.message||'登入失敗，請再試一次';b.disabled=false;b.textContent='登入並同步 ♡'}
}
async function refreshSession(s){
 if(!s?.refresh_token)return null;
 try{const r=await fetch(`${SUPA}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});const x=await r.json();if(!r.ok||!x.access_token)return null;localStorage.setItem(AUTH_KEY,JSON.stringify(x));return x}catch{return null}
}
async function getBookings(token){
 const url=`${SUPA}/rest/v1/traveler_bookings?select=id,traveler_name,journey,booking_date,booking_time,status,contact_method,instagram,contact_status,admin_note&status=neq.cancelled&order=booking_date.asc,booking_time.asc`;
 const r=await fetch(url,{headers:{apikey:KEY,Authorization:`Bearer ${token}`}});if(r.status===401||r.status===403)throw new Error('AUTH');if(!r.ok)throw new Error('預約資料同步失敗');return r.json();
}
function mergeIntoLocal(rows){
 let app;try{app=JSON.parse(localStorage.getItem(APP_KEY)||'null')}catch{};if(!app)app={};app.set=app.set||{};app.month=app.month||{};app.work=app.work||[];app.bookings=app.bookings||[];
 const existing=new Map(app.bookings.map(b=>[String(b.id),b]));
 const manual=app.bookings.filter(b=>!b.remote);
 const remote=rows.map(r=>{const old=existing.get(String(r.id))||{};return {id:r.id,remote:true,date:r.booking_date,time:String(r.booking_time||'').slice(0,5),client:r.traveler_name||'',service:r.journey||'',fee:+old.fee||0,note:old.note||r.admin_note||'',status:r.status||'pending',contactMethod:r.contact_method||'',contactValue:r.instagram||'',contactStatus:r.contact_status||'new'}});
 app.bookings=[...manual,...remote];localStorage.setItem(APP_KEY,JSON.stringify(app));
}
async function loadBase(){
 const r=await fetch('./app-v11.html?v=booking-base-v11');if(!r.ok)throw new Error('主系統載入失敗');let t=await r.text();
 const mobileFix=`<style>
.modal{padding:10px!important;align-items:flex-end!important;overflow:hidden!important}.sheet{width:calc(100vw - 20px)!important;max-width:540px!important;max-height:82dvh!important;height:auto!important;overflow:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;padding:0!important;border-radius:24px 24px 18px 18px!important;background:#fffdfc!important}.sheet>h3{position:sticky!important;top:0!important;z-index:4!important;margin:0!important;padding:16px 16px 12px!important;background:#fffdfcf2!important;backdrop-filter:blur(12px)!important;border-bottom:1px solid #eee5eb!important;font-size:18px!important}.sheet>#mb{padding:12px 14px calc(18px + env(safe-area-inset-bottom))!important}.sheet .fg{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important}.sheet .f{min-width:0!important}.sheet .f label{font-size:11px!important;margin-bottom:5px!important}.sheet .f input,.sheet .f select,.sheet .f textarea{width:100%!important;min-width:0!important;min-height:42px!important;height:42px!important;padding:8px 10px!important;border-radius:12px!important;font-size:16px!important;line-height:1.2!important;-webkit-appearance:none!important;appearance:none!important}.sheet .f textarea{height:72px!important;min-height:72px!important}.sheet .full{grid-column:1/-1!important}.sheet #bSave{position:sticky!important;bottom:0!important;width:100%!important;min-height:46px!important;margin-top:2px!important;border-radius:14px!important;box-shadow:0 -6px 18px #fffdfc!important}.sheet input[type=date],.sheet input[type=time]{text-align:center!important}.sheet input[type=date]::-webkit-date-and-time-value,.sheet input[type=time]::-webkit-date-and-time-value{text-align:center!important;margin:0!important}.sheet input[type=date]::-webkit-calendar-picker-indicator,.sheet input[type=time]::-webkit-calendar-picker-indicator{opacity:.65!important}
.shiftQuick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.shiftQuick button{border:1px solid #e7dce9;background:linear-gradient(135deg,#fff3ee,#f2ecfa);color:#675f6a;border-radius:14px;min-height:48px;font-size:13px;font-weight:900}.shiftQuick button:active{transform:scale(.98)}.shiftNote{font-size:11px;line-height:1.6;color:#8d8490;margin:2px 0 10px}.shiftBox{padding:12px;border-radius:16px;background:linear-gradient(135deg,#edf6fb,#f8edf4);margin-bottom:10px}.shiftBox b{font-size:15px}.otTag{display:inline-block;margin-left:4px;padding:1px 4px;border-radius:6px;background:#f7d9df;color:#9b6470;font-size:7px;font-weight:900}
@media(max-width:430px){.modal{padding:7px!important}.sheet{width:calc(100vw - 14px)!important;max-height:80dvh!important}.sheet>h3{padding:14px 14px 10px!important;font-size:17px!important}.sheet>#mb{padding:10px 12px calc(14px + env(safe-area-inset-bottom))!important}.sheet .fg{grid-template-columns:1fr 1fr!important;gap:8px!important}.sheet .f:nth-child(n+3){grid-column:1/-1!important}.sheet .f textarea{height:66px!important;min-height:66px!important}.shiftQuick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:360px){.sheet .fg{grid-template-columns:1fr!important}.sheet .f{grid-column:1!important}}
</style>`;
 const shiftPatch=`<script>(function(){
const PRESETS=[['08:00','22:00'],['08:00','14:00'],['08:00','12:00'],['08:00','16:00'],['12:00','22:00'],['14:00','22:00'],['16:00','22:00']];
const KEY='${APP_KEY}';
function getApp(){let a;try{a=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};a=a||{};a.work=a.work||[];return a}
function putApp(a){localStorage.setItem(KEY,JSON.stringify(a))}
function toMin(t){if(!t)return 0;const p=t.split(':').map(Number);return p[0]*60+p[1]}
function fromMin(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dateFromDay(day){const mt=document.getElementById('mt')?.textContent||'';const m=mt.match(/(\\d+) 年 (\\d+) 月/);if(!m)return null;return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
function modal(title,html){document.getElementById('mh').textContent=title;document.getElementById('mb').innerHTML=html;document.getElementById('modal').classList.add('show')}
function saveShift(date,start,scheduledEnd,actualEnd=''){const a=getApp();const diff=actualEnd?Math.max(0,toMin(actualEnd)-toMin(scheduledEnd)):0;const ot=Math.floor(diff/5)*5;const counted=fromMin(toMin(scheduledEnd)+ot);const old=a.work.find(x=>x.date===date)||{};a.work=a.work.filter(x=>x.date!==date);a.work.push({...old,id:old.id||Date.now(),date,start,scheduledEnd,actualEnd:actualEnd||'',otMinutes:ot,end:counted});putApp(a);location.reload()}
function choosePreset(date){modal(date+'・選擇上班時段',`<div class="shiftNote">點一下就完成排班 ♡ 之後如果延後下班，再點這一天填「實際下班時間」。</div><div class="shiftQuick">${PRESETS.map((p,i)=>`<button data-i="${i}">${p[0]}－${p[1]}</button>`).join('')}<button id="customShift">自訂時間</button></div>`);document.querySelectorAll('.shiftQuick button[data-i]').forEach(b=>b.onclick=()=>{const p=PRESETS[+b.dataset.i];saveShift(date,p[0],p[1])});document.getElementById('customShift').onclick=()=>customShift(date)}
function customShift(date,rec){modal(date+'・自訂上班時間',`<div class="fg"><div class="f"><label>上班時間</label><input id="qs" type="time" value="${rec?.start||''}"></div><div class="f"><label>原定下班時間</label><input id="qe" type="time" value="${rec?.scheduledEnd||rec?.end||''}"></div><div class="full"><button id="qsave" class="btn pri" style="width:100%">儲存班別</button></div></div>`);document.getElementById('qsave').onclick=()=>{const s=document.getElementById('qs').value,e=document.getElementById('qe').value;if(s&&e)saveShift(date,s,e)}}
function editShift(date,rec){const sched=rec.scheduledEnd||rec.end;const actual=rec.actualEnd||'';const raw=actual?Math.max(0,toMin(actual)-toMin(sched)):0;const counted=Math.floor(raw/5)*5;modal(date+'・班別與加班',`<div class="shiftBox"><b>${rec.start}－${sched}</b>${counted?`<span class="otTag">計薪 +${counted} 分</span>`:''}<div class="shiftNote" style="margin:5px 0 0">${actual?`實際下班 ${actual}｜延後 ${raw} 分鐘｜計薪 ${counted} 分鐘`:'目前沒有延後下班'}</div></div><div class="f"><label>實際下班時間</label><input id="actualEndQuick" type="time" value="${actual}"><div class="shiftNote">直接填真正打卡時間。加班會自動以每滿 5 分鐘計算：例如 22:17 → 15 分鐘。</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="saveActual" class="btn pri">儲存實際下班</button><button id="changeShift" class="btn" style="background:#eee8f4">更換班別</button><button id="clearActual" class="btn" style="background:#e8f2ed">清除加班</button><button id="deleteShift" class="btn" style="background:#f6e4e6;color:#976874">刪除這天</button></div>`);document.getElementById('saveActual').onclick=()=>saveShift(date,rec.start,sched,document.getElementById('actualEndQuick').value);document.getElementById('changeShift').onclick=()=>choosePreset(date);document.getElementById('clearActual').onclick=()=>saveShift(date,rec.start,sched,'');document.getElementById('deleteShift').onclick=()=>{if(confirm('刪除這天的班？')){const a=getApp();a.work=a.work.filter(x=>x.date!==date);putApp(a);location.reload()}}}
function decorate(){const a=getApp();document.querySelectorAll('#cal .day').forEach(day=>{const dn=day.querySelector('.dn');if(!dn)return;const date=dateFromDay(dn.textContent);const rec=a.work.find(x=>x.date===date);const chip=day.querySelector('.work');if(rec&&chip){const sched=rec.scheduledEnd||rec.end;chip.textContent=rec.start+'-'+sched;if(rec.otMinutes){const tag=document.createElement('span');tag.className='otTag';tag.textContent='+'+rec.otMinutes+'分';chip.appendChild(tag)}}})}
document.addEventListener('click',function(e){const day=e.target.closest('#cal .day');if(!day||e.target.closest('.book'))return;const dn=day.querySelector('.dn');if(!dn)return;const date=dateFromDay(dn.textContent);if(!date)return;e.preventDefault();e.stopImmediatePropagation();const a=getApp();const rec=a.work.find(x=>x.date===date);if(rec)editShift(date,rec);else choosePreset(date)},true);
setTimeout(decorate,50);setInterval(decorate,800);
})();<\/script>`;
 const addon=`<style>.book.remote-book{background:#f4d9e6!important;border-color:#e8bfd2!important;color:#775b69!important}.remoteBadge{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:99px;background:#f3dce7;color:#936b7f;font-size:8px}.syncInfo{font-size:9px;color:#8e8590;margin-top:5px}</style><div class="syncbar"><button onclick="location.reload()">↻ 同步預約</button><button onclick="localStorage.removeItem('${AUTH_KEY}');location.reload()">登出</button></div>`;
 t=t.replace('</head>',mobileFix+'</head>').replace('</body>',shiftPatch+addon+'</body>');document.open();document.write(t);document.close();
}
async function syncAndLoad(token){
 root.innerHTML='<div class="loading"><div class="flower">🌷</div><br>正在同步旅人的預約…</div>';
 try{const rows=await getBookings(token);mergeIntoLocal(rows);await loadBase()}catch(e){if(e.message==='AUTH'){let s;try{s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{};const fresh=await refreshSession(s);if(fresh)return syncAndLoad(fresh.access_token);localStorage.removeItem(AUTH_KEY);showLogin('登入已過期，請重新登入。')}else{root.innerHTML=`<section class="login"><h1>🌷 暫時無法同步</h1><p>${esc(e.message)}</p><button onclick="location.reload()">重新整理</button></section>`}}
}
(async()=>{let s;try{s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{};if(!s?.access_token)return showLogin();await syncAndLoad(s.access_token)})();
</script>
</body></html>
