<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e7df"><title>🌷 我的上班小日子</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#5f5965;background:linear-gradient(180deg,#f7e1d8,#eee3f6 28%,#e1eff5 55%,#e4f0e7 78%,#fff0cf)}.gate{min-height:100vh;display:grid;place-items:center;padding:18px}.login{width:min(92vw,420px);padding:24px 20px;border-radius:28px;background:#fffdfcee;border:2px solid #fff;box-shadow:0 18px 50px #5b48631f}.tiny{font-size:10px;letter-spacing:.18em;color:#998f9c}.login h1{font-size:25px;margin:8px 0 5px}.login p,.loading{font-size:12px;line-height:1.65;color:#89808c}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input{width:100%;min-height:46px;border:1px solid #dfd4df;border-radius:14px;background:#fffaf7;padding:10px 12px;font-size:16px}.login button{width:100%;min-height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,#d9a0aa,#a897c5);color:#fff;font-weight:900}.msg{min-height:20px;margin-top:8px;font-size:11px;color:#a06872}.loading{text-align:center}.flower{font-size:34px}</style></head><body><div id="root" class="gate"><div class="loading"><div class="flower">🌷</div><br>正在連接你的預約資料…</div></div><script>const SUPA='https://tgfxrbghzzttqbpfwypw.supabase.co',KEY='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',AUTH_KEY='workdays_admin_session',APP_KEY='shiftPayV5',root=document.getElementById('root');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function showLogin(msg=''){root.className='gate';root.innerHTML=`<section class="login"><div class="tiny">PRIVATE · BOOKING SYNC</div><h1>🌷 我的上班小日子</h1><p>登入後同步旅人預約資料。</p><div class="field"><label>管理者 Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button id="loginBtn">登入並同步 ♡</button><div id="msg" class="msg">${esc(msg)}</div></section>`;document.getElementById('loginBtn').onclick=login;document.getElementById('password').onkeydown=e=>{if(e.key==='Enter')login()}}async function login(){const b=document.getElementById('loginBtn'),m=document.getElementById('msg');b.disabled=true;b.textContent='登入中…';try{const r=await fetch(`${SUPA}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})}),x=await r.json();if(!r.ok||!x.access_token)throw Error('登入資料不正確');localStorage.setItem(AUTH_KEY,JSON.stringify(x));syncAndLoad(x.access_token)}catch(e){m.textContent=e.message;b.disabled=false;b.textContent='登入並同步 ♡'}}async function getBookings(token){const r=await fetch(`${SUPA}/rest/v1/traveler_bookings?select=id,traveler_name,journey,booking_date,booking_time,status,contact_method,instagram,contact_status,admin_note&status=neq.cancelled&order=booking_date.asc,booking_time.asc`,{headers:{apikey:KEY,Authorization:`Bearer ${token}`}});if(r.status===401||r.status===403)throw Error('AUTH');if(!r.ok)throw Error('預約資料同步失敗');return r.json()}function merge(rows){let a;try{a=JSON.parse(localStorage.getItem(APP_KEY)||'null')}catch{};a=a||{};a.set=a.set||{};a.month=a.month||{};a.work=a.work||[];a.bookings=a.bookings||[];const old=new Map(a.bookings.map(b=>[String(b.id),b])),manual=a.bookings.filter(b=>!b.remote),remote=rows.map(r=>{const o=old.get(String(r.id))||{};return{id:r.id,remote:true,date:r.booking_date,time:String(r.booking_time||'').slice(0,5),client:r.traveler_name||'',service:r.journey||'',fee:+o.fee||0,note:o.note||r.admin_note||'',status:r.status||'pending',contactMethod:r.contact_method||'',contactValue:r.instagram||'',contactStatus:r.contact_status||'new'}});a.bookings=[...manual,...remote];localStorage.setItem(APP_KEY,JSON.stringify(a))}async function loadBase(){const r=await fetch('./app-v11.html?v=quick-shifts-5min-fixed');if(!r.ok)throw Error('主系統載入失敗');let t=await r.text();t=t.replace('</body>',`<div style="position:fixed;right:10px;bottom:12px;z-index:80;display:flex;gap:6px"><button onclick="location.reload()" style="border:1px solid #fff;background:#fff9;border-radius:99px;padding:8px 11px">↻ 同步預約</button><button onclick="localStorage.removeItem('${AUTH_KEY}');location.reload()" style="border:1px solid #fff;background:#fff9;border-radius:99px;padding:8px 11px">登出</button></div></body>`);document.open();document.write(t);document.close()}async function syncAndLoad(token){try{root.innerHTML='<div class="loading"><div class="flower">🌷</div><br>正在同步旅人的預約…</div>';merge(await getBookings(token));await loadBase()}catch(e){if(e.message==='AUTH'){localStorage.removeItem(AUTH_KEY);showLogin('登入已過期，請重新登入。')}else root.innerHTML=`<section class="login"><h1>🌷 暫時無法同步</h1><p>${esc(e.message)}</p><button onclick="location.reload()">重新整理</button></section>`}}(async()=>{let s;try{s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{};if(!s?.access_token)return showLogin();syncAndLoad(s.access_token)})();</script></body></html>
