<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e7df"><title>🌷 我的上班小日子</title></head><body><script>fetch('./app-v11.html?v=base-v14').then(r=>r.text()).then(t=>{const old='<div class="big"><span>正職本月預估實領</span><b id="net"></b></div></div></main>';const neu='<div class="big"><span>正職本月預估實領</span><b id="net"></b></div><div id="partTimeSalary"><div class="sectiontitle" style="margin-top:12px">🌷 兼職收入</div><div class="cr"><span>已完成預約收入</span><b id="ptIncome">$0</b></div><div class="notice" style="margin-top:8px">只有「已完成」的兼職預約會計入本月收入；待確認、已確認與取消不計入。</div><div class="big" style="margin-top:10px;background:linear-gradient(135deg,#f7dfe8,#f7e8b8,#dcecf5)"><span>💰 本月總收入</span><b id="allIncome">$0</b><small style="display:block;margin-top:4px;font-size:9px;color:#807783">正職實領 ＋ 兼職已完成收入</small></div></div></div></main>';t=t.replace(old,neu);const addon=`<script>(function(){function money(n){return '$'+Math.round(n||0).toLocaleString('zh-TW')}function upd(){let s={};try{s=JSON.parse(localStorage.getItem('shiftPayV5')||'{}')}catch{}let ym=document.getElementById('payMonth')?.textContent||'';if(!/^\\d{4}-\\d{2}$/.test(ym)){const n=new Date();ym=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')}const bs=Array.isArray(s.bookings)?s.bookings:[];const pt=bs.filter(b=>String(b.date||'').startsWith(ym)&&['completed','done','已完成'].includes(String(b.status||'').toLowerCase())).reduce((a,b)=>a+(+b.fee||0),0);const net=+((document.getElementById('net')?.textContent||'$0').replace(/[^0-9.-]/g,'')||0);const p=document.getElementById('ptIncome'),a=document.getElementById('allIncome');if(p)p.textContent=money(pt);if(a)a.textContent=money(net+pt)}setInterval(upd,600);document.addEventListener('click',()=>setTimeout(upd,60));upd()})();<\/script>`;t=t.replace('</body>',addon+'</body>');document.open();document.write(t);document.close()}).catch(()=>{document.body.innerHTML='<div style="padding:24px;font-family:sans-serif">系統載入失敗，請重新整理一次。</div>'})</script></body></html>
