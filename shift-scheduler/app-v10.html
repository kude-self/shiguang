<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efe9"><title>🌷 我的上班小日子</title></head><body><script>fetch('./app-v9.html?v=workdays-base').then(r=>r.text()).then(t=>{t=t.replaceAll('我的排班與薪資系統','🌷 我的上班小日子').replace('點日期直接排班，月底自動整理工時、餐費、加班、獎金與預估實領。','記下每天的班，也偷偷算算這個月賺多少 ♡').replace('MY SHIFT & PAYROLL','MY WORK DAYS ✦').replace('🗓 本月班表','🗓 這個月的班班').replace('🌿 休假','🌿 休假統計').replace('💰 固定薪資設定','💰 薪資小設定').replace('✨ 本月工時與薪資','✨ 這個月賺多少').replace('📒 薪資明細','📒 我的薪資明細');t=t.replace(/<main id="leave" class="page">[\s\S]*?<\/main><main id="settings"/,`<main id="leave" class="page"><div class="head"><h2>🌿 休假統計</h2><span class="pill">自動感應</span></div><div class="notice">不用另外設定休假日期 ♡ 當月沒有安排上班時間的日期，系統就自動視為休假日。排上班後，該日會自動從休假移除。</div><div class="stats" style="margin-top:10px"><div class="stat green"><b id="autoOffCount">0</b><span>目前未排班日</span></div><div class="stat lav"><b id="allowedOffCount">0</b><span>本月休假額度</span></div></div><div class="card" style="margin-top:8px"><div id="autoOffList" class="list"></div></div></main><main id="settings"`);t=t.replace('<button class="tab" data-p="leave">休假</button>','<button class="tab" data-p="leave">休假</button>');const extra=`<style>:root{--mac-cream:#fff8ef;--mac-peach:#f8d8cf;--mac-pink:#f3d7e1;--mac-lav:#ded6f1;--mac-blue:#dcecf5;--mac-mint:#dcecdf;--mac-yellow:#f7e8b8;--mac-ink:#625b66}body{background:linear-gradient(180deg,#f7e7df 0%,#efe4f5 24%,#e4f0f5 48%,#e4f0e7 72%,#fff1d5 100%)!important;background-attachment:fixed!important;color:var(--mac-ink)!important}.hero{background:linear-gradient(135deg,#f8d9d0,#efdcef 34%,#dbeaf4 67%,#dcebdc)!important;border:2px solid #ffffffbf!important}.tabs{background:linear-gradient(90deg,#fff4eef5,#f4eefbf5,#ecf6f4f5)!important}.tab:nth-child(1){background:#f7dfd7}.tab:nth-child(2){background:#e1eedf}.tab:nth-child(3){background:#eee2f6}.tab:nth-child(4){background:#e0eef6}.tab.on{background:linear-gradient(135deg,#f1cfc6,#d8cff0)!important;color:#5d5364!important}.page{border-radius:24px;padding:9px 7px 13px}.page#schedule{background:linear-gradient(180deg,#f6dce285,#deebf794)}.page#leave{background:linear-gradient(180deg,#dceedea8,#fdefcf7a)}.page#settings{background:linear-gradient(180deg,#fce1d595,#e5dbf49e)}.page#pay{background:linear-gradient(180deg,#dcecf6a3,#f6dbe48c)}.month{padding:5px 7px;border-radius:17px;background:linear-gradient(90deg,#f8ddd4,#eee2f6,#deedf5)!important}.calendarwrap{padding:6px;border-radius:22px;background:linear-gradient(135deg,#f3d8e1,#ded6ef,#dbeaf4,#dcebdd,#f7e6b8)!important}.cal{background:#fff9f4c4!important}.day:nth-child(5n+1){background:linear-gradient(145deg,#fff7f0,#f8ddd4)!important}.day:nth-child(5n+2){background:linear-gradient(145deg,#fffaf2,#f5e8b9)!important}.day:nth-child(5n+3){background:linear-gradient(145deg,#f6fff7,#deedde)!important}.day:nth-child(5n+4){background:linear-gradient(145deg,#f5fbff,#dcecf5)!important}.day:nth-child(5n){background:linear-gradient(145deg,#fbf7ff,#e3daf3)!important}.day.autooff{opacity:.78}.day.autooff:after{content:'休';position:absolute;right:4px;bottom:3px;font-size:7px;color:#8ca18f;background:#edf6e9;border-radius:6px;padding:1px 3px}.day.today:after{content:'✦'!important;top:3px;bottom:auto;color:#c59fd5}.card{background:linear-gradient(135deg,#fff8efeb,#faf1f8e0)!important}.form.card{background:linear-gradient(135deg,#fff1e8,#f2e6f7,#e7f1f6)!important}.notice{background:linear-gradient(135deg,#fff0d0,#f7e2ea)!important}.stat.blue{background:linear-gradient(135deg,#f7fcff,#dcecf5)!important}.stat.green{background:linear-gradient(135deg,#fbfff9,#dcecdf)!important}.stat.peach{background:linear-gradient(135deg,#fff9f3,#f8d8cf)!important}.stat.lav{background:linear-gradient(135deg,#fcf9ff,#ded6f1)!important}.big{background:linear-gradient(135deg,#f7e8b8,#f5d7df,#ddd4f0,#dcecf5)!important}.btn.pri{background:linear-gradient(135deg,#d99eaa,#aa96c5)!important}.f input{background:#fffaf6!important}.auto-off-row{display:flex;justify-content:space-between;align-items:center;padding:9px 8px;border-bottom:1px dashed #e5dce3;font-size:11px}.auto-off-row span:last-child{background:#e4f0e5;color:#718276;padding:3px 7px;border-radius:99px}@media(max-width:430px){.page{padding-left:3px;padding-right:3px}.day{min-height:56px!important}}</style>`;const logic=`<script>(function(){function refreshAutoOff(){try{const mt=document.getElementById('mt');if(!mt)return;const m=mt.textContent.match(/(\\d+) 年 (\\d+) 月/);if(!m)return;const y=+m[1],mo=+m[2],days=new Date(y,mo,0).getDate();let raw=JSON.parse(localStorage.getItem('shiftPayV5')||'{}');let works=raw.work||[];const prefix=y+'-'+String(mo).padStart(2,'0')+'-';let workDates=new Set(works.filter(w=>w.date&&w.date.startsWith(prefix)).map(w=>w.date));let offs=[];for(let d=1;d<=days;d++){let date=prefix+String(d).padStart(2,'0');if(!workDates.has(date))offs.push(date)}document.querySelectorAll('#cal .day').forEach((el,i)=>{const dn=el.querySelector('.dn');if(dn){let date=prefix+String(+dn.textContent).padStart(2,'0');el.classList.toggle('autooff',!workDates.has(date))}});let c=document.getElementById('autoOffCount');if(c)c.textContent=offs.length;let red=document.getElementById('red');let ac=document.getElementById('allowedOffCount');if(ac)ac.textContent=red&&red.value?red.value:'0';let list=document.getElementById('autoOffList');if(list){list.innerHTML=offs.length?offs.map(d=>'<div class="auto-off-row"><span>'+d+'</span><span>休假 ♡</span></div>').join(''):'<div class="row"><span>這個月目前每天都有排班</span></div>'}}catch(e){}}setInterval(refreshAutoOff,500);document.addEventListener('click',()=>setTimeout(refreshAutoOff,80));})();<\/script>`;t=t.replace('</head>',extra+'</head>').replace('</body>',logic+'</body>');document.open();document.write(t);document.close()}).catch(()=>{document.body.innerHTML='<div style="font-family:sans-serif;padding:24px">系統載入中，請重新整理一次 ♡</div>'})</script></body></html>
