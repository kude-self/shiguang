<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e7df"><title>🌷 我的上班小日子</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#5f5965;background:linear-gradient(180deg,#f7e1d8,#eee3f6 28%,#e1eff5 55%,#e4f0e7 78%,#fff0cf)}*{box-sizing:border-box}.app{max-width:760px;margin:auto;padding:10px 10px 90px}.hero{padding:18px 16px;border-radius:24px;background:linear-gradient(135deg,#f7d5cf,#eddcf4,#dcecf5,#dcebdd);border:2px solid #fff9;box-shadow:0 8px 22px #665b7212}.ey{font-size:10px;letter-spacing:.18em;color:#928a98}.hero h1{margin:7px 0 4px;font-size:24px}.sub{font-size:11px;color:#8e8793}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0;padding:4px;background:#fff8;border:1px solid #fff;border-radius:17px}.tab{border:0;border-radius:13px;min-height:42px;font-weight:800;color:#746e78;background:#f8ddd7}.tab:nth-child(2){background:#dfeddd}.tab:nth-child(3){background:#eadff3}.tab:nth-child(4){background:#dcebf4}.tab.on{box-shadow:inset 0 0 0 2px #bca9c7;color:#554d5d}.page{display:none;border-radius:24px;padding:10px}.page.on{display:block}.page#schedule{background:#f4dce27d}.page#leave{background:#deeddf8c}.page#settings{background:#eee1f194}.page#pay{background:#dcecf49c}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 2px}.head h2{font-size:17px;margin:0}.pill{font-size:10px;padding:5px 8px;border-radius:99px;background:#fff9}.month{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;padding:6px;border-radius:18px;background:linear-gradient(90deg,#f8d7ce,#eadcf3,#dcebf4)}.month button{height:42px;border:0;border-radius:14px;background:#fff9;font-size:19px;color:#706a75}.mt{text-align:center;font-size:17px;font-weight:900}.cal{margin-top:8px;padding:7px;border-radius:20px;background:#fff9;border:4px solid #f1e2dc}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;font-size:9px;color:#9b949e;padding:5px 0}.day{position:relative;min-height:60px;padding:4px;border:1px solid #e4dce7;border-radius:11px;background:#fff8;overflow:hidden}.day:nth-child(5n+1){background:#fbe7df}.day:nth-child(5n+2){background:#fbf0ce}.day:nth-child(5n+3){background:#e8f3e6}.day:nth-child(5n+4){background:#e6f1f7}.day:nth-child(5n){background:#eee6f6}.dn{font-size:9px;font-weight:900}.chip{display:block;width:100%;border:0;border-radius:7px;margin-top:3px;padding:3px 1px;font-size:7px;text-align:center}.work{background:#dcecf6;color:#536a78}.rest{position:absolute;right:3px;bottom:3px;font-size:7px;padding:2px 4px;border-radius:6px;background:#dcebdc;color:#718274}.hint,.notice{font-size:10.5px;line-height:1.55;color:#89818d}.hint{padding:8px 3px}.notice{padding:11px;border-radius:14px;background:linear-gradient(135deg,#fff0ce,#f7dfe8);border:1px solid #eadcc7}.card,.stat{background:#fff9;border:1px solid #fff;border-radius:18px;box-shadow:0 6px 16px #62576d0d}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:9px 0}.stat{text-align:center;padding:13px 5px}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:#8c8690}.list{padding:7px 11px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #e3dbe4;font-size:11px}.form{padding:12px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}.f label{display:block;font-size:10px;margin-bottom:4px;color:#817b86}.f input{width:100%;min-height:42px;border:1px solid #dfd7e2;border-radius:11px;background:#fffaf6;padding:9px}.full{grid-column:1/-1}.btn{border:0;border-radius:11px;min-height:40px;padding:0 12px;font-weight:800}.pri{background:linear-gradient(135deg,#d99eaa,#a994c5);color:white}.calc{padding:12px}.sectiontitle{font-size:10px;font-weight:900;padding:11px 0 3px}.cr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #e3dbe4;font-size:11px}.big{margin-top:11px;padding:14px;text-align:center;border-radius:15px;background:linear-gradient(135deg,#f7e8b8,#f5d7df,#ddd4f0,#dcecf5)}.big b{display:block;font-size:25px}.modal{position:fixed;inset:0;background:#443b4c55;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-width:540px;padding:15px;background:#fff;border-radius:22px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#5d5364;color:white;padding:8px 13px;border-radius:99px;opacity:0}.toast.show{opacity:1}@media(max-width:430px){.app{padding:8px 7px 80px}.hero h1{font-size:22px}.tab{font-size:10.5px;padding:0 2px}.day{min-height:54px}.fg{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="app"><header class="hero"><div class="ey">MY WORK DAYS ✦</div><h1>🌷 我的上班小日子</h1><div class="sub">記下每天的班，也偷偷算算這個月賺多少 ♡</div></header><nav class="tabs"><button class="tab on" data-p="schedule">班表</button><button class="tab" data-p="leave">休假</button><button class="tab" data-p="settings">薪資設定</button><button class="tab" data-p="pay">薪資明細</button></nav><main id="schedule" class="page on"><div class="head"><h2>🗓️ 這個月的班班</h2><span class="pill">點日期新增</span></div><div class="month"><button id="prev">‹</button><div id="mt" class="mt"></div><button id="next">›</button></div><div class="cal"><div id="cal" class="grid"></div></div><div class="hint">♡ 沒有排班的日期會自動視為休假，不需要另外設定。</div></main><main id="leave" class="page"><div class="head"><h2>🌿 休假統計</h2><span class="pill">自動感應</span></div><div class="notice">沒有安排上班時間的日期，系統會自動視為休假；排上班後就會自動移除休假狀態。</div><div class="stats"><div class="stat"><b id="autoOff">0</b><span>目前未排班日</span></div><div class="stat"><b id="offQuota">0</b><span>本月休假額度</span></div></div><div class="card"><div id="offList" class="list"></div></div></main><main id="settings" class="page"><div class="head"><h2>💰 薪資小設定</h2></div><div class="card form"><div class="fg"><div class="f"><label>底薪</label><input id="base" type="number"></div><div class="f"><label>職務加給</label><input id="job" type="number"></div><div class="f"><label>每日正常工時</label><input id="daily" type="number"></div><div class="f"><label>本月紅字天數</label><input id="red" type="number"></div><div class="f"><label>最低時薪（兼職時薪）</label><input id="hourly" type="number"></div><div class="f"><label>每上班日餐費</label><input id="meal" type="number"></div><div class="f"><label>加班倍率</label><input id="rate" type="number" step=".01"></div><div class="f"><label>勞保員工負擔</label><input id="labor" type="number"></div><div class="f"><label>健保員工負擔</label><input id="health" type="number"></div><div class="full"><button id="saveSet" class="btn pri">儲存設定</button></div></div></div></main><main id="pay" class="page"><div class="head"><h2>✨ 這個月賺多少</h2><span id="payMonth" class="pill"></span></div><div class="stats"><div class="stat"><b id="actual">0</b><span>實際工時</span></div><div class="stat"><b id="target">0</b><span>應上時數</span></div><div class="stat"><b id="excess">0</b><span>加班時數</span></div><div class="stat"><b id="workDays">0</b><span>上班天數</span></div></div><div class="card form"><div class="fg"><div class="f"><label>本月處方張數</label><input id="rx" type="number"></div><div class="f"><label>本月門市營業額</label><input id="sales" type="number"></div><div class="full"><button id="saveMonth" class="btn pri">儲存本月資料</button></div></div></div><div class="card calc" style="margin-top:9px"><div class="sectiontitle">收入</div><div class="cr"><span>底薪</span><b id="baseOut"></b></div><div class="cr"><span>職務加給</span><b id="jobOut"></b></div><div class="cr"><span>餐費</span><b id="mealOut"></b></div><div class="cr"><span>加班時薪（最低時薪 × 1.33）</span><b id="otHour"></b></div><div class="cr"><span>加班費</span><b id="otPay"></b></div><div class="cr"><span>處方獎金</span><b id="rxBonus"></b></div><div class="cr"><span>門市獎金</span><b id="storeBonus"></b></div><div class="sectiontitle">扣款</div><div class="cr"><span>勞保</span><b id="laborOut"></b></div><div class="cr"><span>健保</span><b id="healthOut"></b></div><div class="big"><span>本月預估實領</span><b id="net"></b></div></div></main></div><div id="modal" class="modal"><div class="sheet"><h3 id="mh"></h3><div id="mb"></div></div></div><div id="toast" class="toast">已保存 ♡</div><script>(()=>{const K='shiftPayV5';let S;try{S=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(!S)S={set:{base:28000,job:5000,daily:8,red:{},hourly:196,meal:80,otRate:1.33,labor:738,health:458},month:{},work:[]};S.set=S.set||{};S.set.red=S.set.red||{};S.month=S.month||{};S.work=S.work||[];let C=new Date();C=new Date(C.getFullYear(),C.getMonth(),1);const $=s=>document.querySelector(s),ym=()=>C.getFullYear()+'-'+String(C.getMonth()+1).padStart(2,'0'),dim=()=>new Date(C.getFullYear(),C.getMonth()+1,0).getDate(),red=()=>+S.set.red[ym()]||0,daily=()=>+S.set.daily||8,target=()=>Math.max(0,dim()-red())*daily(),money=n=>'$'+Math.round(n||0).toLocaleString('zh-TW');function dur(a,b){let[x,y]=a.split(':').map(Number),[u,v]=b.split(':').map(Number),s=x*60+y,e=u*60+v;if(e<s)e+=1440;return(e-s)/60}function save(){localStorage.setItem(K,JSON.stringify(S));$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),700)}function workDates(){return new Set(S.work.filter(w=>w.date&&w.date.startsWith(ym())).map(w=>w.date))}function offDates(){let w=workDates(),a=[];for(let d=1;d<=dim();d++){let date=ym()+'-'+String(d).padStart(2,'0');if(!w.has(date))a.push(date)}return a}function modal(t,h){$('#mh').textContent=t;$('#mb').innerHTML=h;$('#modal').classList.add('show')}$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};function calendar(){$('#mt').textContent=C.getFullYear()+' 年 '+(C.getMonth()+1)+' 月';let g=$('#cal');g.innerHTML='';'日一二三四五六'.split('').forEach(x=>g.insertAdjacentHTML('beforeend','<div class="dow">'+x+'</div>'));let f=new Date(C.getFullYear(),C.getMonth(),1).getDay(),w=workDates();for(let i=0;i<f;i++)g.appendChild(document.createElement('div'));for(let d=1;d<=dim();d++){let date=ym()+'-'+String(d).padStart(2,'0'),c=document.createElement('div');c.className='day';c.innerHTML='<div class="dn">'+d+'</div>';let rec=S.work.find(x=>x.date===date);if(rec){c.insertAdjacentHTML('beforeend','<button class="chip work">'+rec.start+'-'+rec.end+'</button>')}else c.insertAdjacentHTML('beforeend','<span class="rest">休</span>');c.onclick=e=>{if(e.target.classList.contains('work')){if(confirm('刪除這天的班？')){S.work=S.work.filter(x=>x.date!==date);save();render()}return}addWork(date)};g.appendChild(c)}}function addWork(date){modal(date+' 上班時間','<div class="fg"><div class="f"><label>上班時間</label><input id="st" type="time"></div><div class="f"><label>下班時間</label><input id="en" type="time"></div><div class="full"><button id="ws" class="btn pri">儲存這一天</button></div></div>');$('#ws').onclick=()=>{if(!$('#st').value||!$('#en').value)return;S.work=S.work.filter(x=>x.date!==date);S.work.push({id:Date.now(),date,start:$('#st').value,end:$('#en').value});save();$('#modal').classList.remove('show');render()}}function settings(){S.set.base??=28000;S.set.job??=5000;S.set.daily??=8;S.set.hourly??=196;S.set.meal??=80;S.set.otRate??=1.33;S.set.labor??=738;S.set.health??=458;$('#base').value=S.set.base;$('#job').value=S.set.job;$('#daily').value=S.set.daily;$('#red').value=red();$('#hourly').value=S.set.hourly;$('#meal').value=S.set.meal;$('#rate').value=S.set.otRate;$('#labor').value=S.set.labor;$('#health').value=S.set.health}function rests(){let a=offDates();$('#autoOff').textContent=a.length;$('#offQuota').textContent=red();$('#offList').innerHTML=a.map(d=>'<div class="row"><span>'+d+'</span><span>休假 ♡</span></div>').join('')||'<div class="row">本月目前每天都有排班</div>'}function rxB(n){return n<3500?0:1000+Math.floor((n-3500)/500)*500}function storeB(n){return n<250000?0:1000+Math.floor((n-250000)/50000)*1000}function pay(){let w=S.work.filter(x=>x.date.startsWith(ym())),hrs=w.reduce((a,x)=>a+dur(x.start,x.end),0),days=new Set(w.map(x=>x.date)).size,t=target(),ex=Math.max(0,hrs-t),hour=+S.set.hourly||196,rate=+S.set.otRate||1.33,otHour=hour*rate,ot=ex*otHour,meal=days*(+S.set.meal||0),M=S.month[ym()]||{},rb=rxB(+M.rx||0),sb=storeB(+M.sales||0),net=(+S.set.base||0)+(+S.set.job||0)+meal+ot+rb+sb-(+S.set.labor||0)-(+S.set.health||0);$('#payMonth').textContent=ym();$('#actual').textContent=hrs.toFixed(1)+'h';$('#target').textContent=t+'h';$('#excess').textContent=ex.toFixed(1)+'h';$('#workDays').textContent=days;$('#rx').value=M.rx||'';$('#sales').value=M.sales||'';$('#baseOut').textContent=money(S.set.base);$('#jobOut').textContent=money(S.set.job);$('#mealOut').textContent=money(meal);$('#otHour').textContent=money(otHour);$('#otPay').textContent=money(ot);$('#rxBonus').textContent=money(rb);$('#storeBonus').textContent=money(sb);$('#laborOut').textContent='− '+money(S.set.labor);$('#healthOut').textContent='− '+money(S.set.health);$('#net').textContent=money(net)}function render(){calendar();settings();rests();pay()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('#'+t.dataset.p).classList.add('on');render()});$('#prev').onclick=()=>{C=new Date(C.getFullYear(),C.getMonth()-1,1);render()};$('#next').onclick=()=>{C=new Date(C.getFullYear(),C.getMonth()+1,1);render()};$('#saveSet').onclick=()=>{S.set.base=+$('#base').value;S.set.job=+$('#job').value;S.set.daily=+$('#daily').value;S.set.red[ym()]=+$('#red').value;S.set.hourly=+$('#hourly').value||196;S.set.meal=+$('#meal').value;S.set.otRate=+$('#rate').value||1.33;S.set.labor=+$('#labor').value;S.set.health=+$('#health').value;save();render()};$('#saveMonth').onclick=()=>{S.month[ym()]={rx:+$('#rx').value||0,sales:+$('#sales').value||0};save();render()};render()})();</script></body></html>
