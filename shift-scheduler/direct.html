<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5e5ef"><title>🌷 我的上班小日子</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#5f5965}body{background:linear-gradient(180deg,#f7e1d8,#eee3f6 30%,#e1eff5 60%,#e5f0e5)}button,input{font:inherit}.wrap{max-width:680px;margin:auto;padding:12px 10px 80px}.hero{padding:16px;border-radius:23px;background:linear-gradient(135deg,#fff6f2dd,#f2e7f7dd,#e6f3f1dd);border:2px solid #fff9}.hero small{letter-spacing:.16em;color:#948b99}.hero h1{font-size:24px;margin:6px 0 3px}.hero p{font-size:11px;margin:0;color:#8b828e}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:11px 0;padding:4px;border-radius:16px;background:#fff8}.tab{border:0;border-radius:12px;min-height:42px;font-size:11px;font-weight:800;color:#746c78;background:#f7ddd8}.tab:nth-child(2){background:#e1efdf}.tab:nth-child(3){background:#f5e7bd}.tab:nth-child(4){background:#e5def3}.tab.on{box-shadow:inset 0 0 0 2px #bca9c7;color:#514a57}.page{display:none}.page.on{display:block}.card{background:#fff9;border:1px solid #fff;border-radius:21px;padding:12px;box-shadow:0 8px 22px #675b6d10}.month{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:center}.month button{border:0;border-radius:12px;background:#fff;min-height:40px;font-size:18px}.month b{text-align:center}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}.dow{text-align:center;font-size:9px;color:#9b949d;padding:4px}.day{position:relative;min-height:60px;border:1px solid #e6dfe8;border-radius:10px;background:#fff8;padding:4px;font-size:9px;cursor:pointer;overflow:hidden}.day:nth-child(5n+1){background:#fbe6df}.day:nth-child(5n+2){background:#fbf0cf}.day:nth-child(5n+3){background:#e8f3e6}.day:nth-child(5n+4){background:#e6f1f7}.day:nth-child(5n){background:#eee6f6}.workchip{display:block;margin-top:4px;padding:3px;border-radius:6px;background:#dcecf6;color:#576b78;text-align:center;font-size:7px;line-height:1.2}.ot{display:block;margin-top:3px;font-size:7px;color:#a36d7a}.rest{position:absolute;right:3px;bottom:3px;background:#dcebdc;color:#718274;border-radius:6px;padding:2px 4px;font-size:7px}.title{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px}.title h2{font-size:17px;margin:0}.pill{font-size:9px;padding:5px 8px;border-radius:99px;background:#fff9}.hint,.notice{font-size:10px;line-height:1.55;color:#89818d}.hint{padding:8px 2px}.notice{padding:10px;border-radius:14px;background:linear-gradient(135deg,#fff0ce,#f7dfe8);border:1px solid #eadcc7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.stat{padding:13px 7px;border-radius:16px;background:#fff9;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:9px;color:#8e8791}.list{margin-top:9px;background:#fff9;border-radius:16px;padding:5px 10px}.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed #e5dfe6;font-size:10px}.row:last-child{border-bottom:0}.modal{display:none;position:fixed;inset:0;background:#4a405060;align-items:flex-end;justify-content:center;padding:8px;z-index:99}.modal.on{display:flex}.sheet{width:100%;max-width:520px;max-height:82dvh;overflow:auto;background:#fffdfc;border-radius:23px;padding:15px}.sheet h3{margin:0 0 10px;font-size:18px}.shifts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.shiftbtn{border:0;border-radius:12px;padding:12px 5px;background:#eee4f5;font-weight:800;color:#625a68}.shiftbtn:nth-child(2n){background:#e6f0e5}.section{margin-top:13px;padding-top:10px;border-top:1px dashed #e6dee6}.label{font-size:10px;color:#867e89;margin-bottom:5px}.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.timegrid input{width:100%;min-height:43px;border:1px solid #ddd5df;border-radius:11px;background:#fffaf7;padding:8px;font-size:16px}.save,.danger{width:100%;margin-top:9px;min-height:43px;border:0;border-radius:12px;font-weight:800}.save{background:linear-gradient(135deg,#d8a0aa,#aa98c6);color:#fff}.danger{background:#f6e5e7;color:#9b6670}.close{width:100%;margin-top:7px;min-height:40px;border:0;border-radius:12px;background:#f3f0f4;color:#746d78}.empty{font-size:11px;color:#918993;padding:12px 2px}@media(max-width:430px){.wrap{padding:8px 7px 70px}.tab{font-size:10px}.day{min-height:56px}.sheet{max-height:80dvh}}</style></head><body><main class="wrap"><header class="hero"><small>MY WORK DAYS ✦</small><h1>🌷 我的上班小日子</h1><p>班表、休假、預約與薪資，先穩穩地放在一起 ♡</p></header><nav class="tabs"><button type="button" class="tab on" data-page="schedule">班表</button><button type="button" class="tab" data-page="leave">休假</button><button type="button" class="tab" data-page="booking">預約</button><button type="button" class="tab" data-page="pay">薪資</button></nav><section id="schedule" class="page on"><div class="title"><h2>🗓️ 這個月的班班</h2><span class="pill">點日期排班</span></div><div class="card"><div class="month"><button type="button" id="prev">‹</button><b id="monthTitle"></b><button type="button" id="next">›</button></div><div id="calendar" class="grid"></div></div><div class="hint">♡ 點日期後直接選常用班別；已排班的日期再點一次，可以修改實際下班時間。</div></section><section id="leave" class="page"><div class="title"><h2>🌿 休假統計</h2><span class="pill">自動感應</span></div><div class="notice">沒有安排上班的日期，系統會自動視為休假。</div><div class="stats"><div class="stat"><b id="offCount">0</b><span>本月未排班日</span></div><div class="stat"><b id="workCount">0</b><span>本月上班日</span></div></div><div id="offList" class="list"></div></section><section id="booking" class="page"><div class="title"><h2>🔮 預約</h2></div><div class="notice">這個獨立穩定版先不阻塞班表載入。預約同步會在班表操作穩定後再接回來。</div></section><section id="pay" class="page"><div class="title"><h2>💰 工時小統計</h2></div><div class="stats"><div class="stat"><b id="hours">0h</b><span>排班總工時</span></div><div class="stat"><b id="otMinutes">0分</b><span>延後下班計薪</span></div></div><div class="notice">延後下班以每滿 5 分鐘計算：例如原定 22:00，實際 22:17，計薪加班為 15 分鐘。</div></section></main><div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle"></h3><div id="newShift"><div class="label">快速選班</div><div id="shiftButtons" class="shifts"></div><div class="section"><div class="label">或自訂時間</div><div class="timegrid"><input id="customStart" type="time"><input id="customEnd" type="time"></div><button type="button" id="saveCustom" class="save">儲存自訂時間</button></div></div><div id="editShift" style="display:none"><div id="planned" class="notice"></div><div class="section"><div class="label">實際下班時間</div><input id="actualEnd" type="time" style="width:100%;min-height:44px;border:1px solid #ddd5df;border-radius:11px;background:#fffaf7;padding:8px;font-size:16px"><button type="button" id="saveActual" class="save">儲存實際下班</button><button type="button" id="deleteShift" class="danger">刪除這天班表</button></div></div><button type="button" id="closeModal" class="close">關閉</button></div></div><script>(()=>{const KEY='shiftPayV5';const TIMES=[['08:00','22:00'],['08:00','14:00'],['08:00','12:00'],['08:00','16:00'],['12:00','22:00'],['14:00','22:00'],['16:00','22:00']];let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}S.work=Array.isArray(S.work)?S.work:[];let C=new Date();C=new Date(C.getFullYear(),C.getMonth(),1);let picked='';const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),ym=()=>C.getFullYear()+'-'+pad(C.getMonth()+1),daysInMonth=()=>new Date(C.getFullYear(),C.getMonth()+1,0).getDate();function store(){localStorage.setItem(KEY,JSON.stringify(S))}function mins(t){const[a,b]=t.split(':').map(Number);return a*60+b}function shiftMinutes(w,useActual=true){let s=mins(w.start),e=mins(useActual&&(w.actualEnd||w.end)||w.end);if(e<s)e+=1440;return Math.max(0,e-s)}function overtimeMinutes(w){if(!w.actualEnd)return 0;let planned=mins(w.end),actual=mins(w.actualEnd);if(actual<planned)actual+=1440;return Math.floor(Math.max(0,actual-planned)/5)*5}function renderCalendar(){$('monthTitle').textContent=C.getFullYear()+' 年 '+(C.getMonth()+1)+' 月';const g=$('calendar');g.innerHTML='';'日一二三四五六'.split('').forEach(x=>g.insertAdjacentHTML('beforeend','<div class="dow">'+x+'</div>'));for(let i=0;i<new Date(C.getFullYear(),C.getMonth(),1).getDay();i++)g.appendChild(document.createElement('div'));for(let d=1;d<=daysInMonth();d++){const date=ym()+'-'+pad(d),w=S.work.find(x=>x.date===date),el=document.createElement('button');el.type='button';el.className='day';el.innerHTML='<b>'+d+'</b>';if(w){el.innerHTML+='<span class="workchip">'+w.start+'–'+w.end+(w.actualEnd&&w.actualEnd!==w.end?'<br>實際 '+w.actualEnd:'')+'</span>';const ot=overtimeMinutes(w);if(ot)el.innerHTML+='<span class="ot">＋'+ot+'分</span>'}else el.innerHTML+='<span class="rest">休</span>';el.addEventListener('click',()=>openDay(date));g.appendChild(el)}}function renderStats(){const monthWorks=S.work.filter(w=>w.date&&w.date.startsWith(ym())),dates=new Set(monthWorks.map(w=>w.date)),off=[];for(let d=1;d<=daysInMonth();d++){const date=ym()+'-'+pad(d);if(!dates.has(date))off.push(date)}$('offCount').textContent=off.length;$('workCount').textContent=dates.size;$('offList').innerHTML=off.length?off.map(d=>'<div class="row"><span>'+d+'</span><span>休假 ♡</span></div>').join(''):'<div class="empty">本月每天都有排班</div>';const total=monthWorks.reduce((n,w)=>n+shiftMinutes(w),0),ot=monthWorks.reduce((n,w)=>n+overtimeMinutes(w),0);$('hours').textContent=(total/60).toFixed(1)+'h';$('otMinutes').textContent=ot+'分'}function render(){renderCalendar();renderStats()}function openDay(date){picked=date;const w=S.work.find(x=>x.date===date);$('modalTitle').textContent=date;$('newShift').style.display=w?'none':'block';$('editShift').style.display=w?'block':'none';if(w){$('planned').innerHTML='原定班別：<b>'+w.start+'–'+w.end+'</b>'+(w.actualEnd?'<br>目前實際下班：<b>'+w.actualEnd+'</b>':'');$('actualEnd').value=w.actualEnd||w.end}$('modal').classList.add('on')}function setWork(a,b){S.work=S.work.filter(x=>x.date!==picked);S.work.push({id:Date.now(),date:picked,start:a,end:b,actualEnd:b});store();$('modal').classList.remove('on');render()}const sb=$('shiftButtons');TIMES.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='shiftbtn';b.textContent=t[0]+'–'+t[1];b.addEventListener('click',()=>setWork(t[0],t[1]));sb.appendChild(b)});$('saveCustom').addEventListener('click',()=>{const a=$('customStart').value,b=$('customEnd').value;if(a&&b)setWork(a,b)});$('saveActual').addEventListener('click',()=>{const v=$('actualEnd').value;if(!v)return;const w=S.work.find(x=>x.date===picked);if(!w)return;w.actualEnd=v;store();$('modal').classList.remove('on');render()});$('deleteShift').addEventListener('click',()=>{S.work=S.work.filter(x=>x.date!==picked);store();$('modal').classList.remove('on');render()});$('closeModal').addEventListener('click',()=>$('modal').classList.remove('on'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('on')});$('prev').addEventListener('click',()=>{C=new Date(C.getFullYear(),C.getMonth()-1,1);render()});$('next').addEventListener('click',()=>{C=new Date(C.getFullYear(),C.getMonth()+1,1);render()});document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('on'));btn.classList.add('on');$(btn.dataset.page).classList.add('on');renderStats()}));render()})();</script></body></html>
