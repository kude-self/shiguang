<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的上班小日子</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:linear-gradient(180deg,#f7e1d8,#eee3f6,#e1eff5,#e4f0e7);color:#5f5965}.wrap{max-width:680px;margin:auto;padding:16px}.hero{padding:18px;border-radius:24px;background:#ffffffaa}.tabs{display:flex;gap:5px;margin:12px 0}.tabs button{flex:1;border:0;border-radius:12px;padding:12px 3px;background:#fff9;font-weight:700}.card{background:#fff9;border-radius:20px;padding:14px}.month{display:flex;justify-content:space-between;align-items:center}.month button{border:0;border-radius:12px;background:#fff;padding:10px 15px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.dow{text-align:center;font-size:11px}.day{min-height:58px;border-radius:10px;background:#fff8;padding:4px;font-size:10px}.rest{float:right;background:#dcebdc;border-radius:5px;padding:1px 3px}.modal{display:none;position:fixed;inset:0;background:#4a40505c;align-items:flex-end;padding:10px}.modal.on{display:flex}.sheet{width:100%;max-width:520px;margin:auto;background:#fff;border-radius:22px;padding:16px}.shifts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.shifts button{border:0;border-radius:12px;padding:12px 5px;background:#eee4f5;font-weight:700}.custom{margin-top:10px}.custom input{width:47%;padding:10px;border:1px solid #ddd;border-radius:10px}.save{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:#b49bc6;color:#fff;font-weight:800}</style></head><body><main class="wrap"><header class="hero"><small>MY WORK DAYS ✦</small><h1>🌷 我的上班小日子</h1><div>先把班表穩定打開，再繼續加功能 ♡</div></header><div class="tabs"><button>班表</button><button>休假</button><button>預約</button><button>薪資</button></div><section class="card"><div class="month"><button id="prev">‹</button><b id="title"></b><button id="next">›</button></div><div id="cal" class="grid"></div></section></main><div id="modal" class="modal"><div class="sheet"><h3 id="date"></h3><div class="shifts" id="shifts"></div><div class="custom"><input id="start" type="time"><span>－</span><input id="end" type="time"><button class="save" id="customSave">儲存自訂時間</button></div></div></div><script>const KEY='shiftPayV5',times=[['08:00','22:00'],['08:00','14:00'],['08:00','12:00'],['08:00','16:00'],['12:00','22:00'],['14:00','22:00'],['16:00','22:00']];let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}S.work=S.work||[];let C=new Date();C=new Date(C.getFullYear(),C.getMonth(),1),picked='';const pad=n=>String(n).padStart(2,'0'),ym=()=>C.getFullYear()+'-'+pad(C.getMonth()+1);function save(){localStorage.setItem(KEY,JSON.stringify(S))}function render(){document.getElementById('title').textContent=C.getFullYear()+' 年 '+(C.getMonth()+1)+' 月';let g=document.getElementById('cal');g.innerHTML='';'日一二三四五六'.split('').forEach(x=>g.insertAdjacentHTML('beforeend','<div class="dow">'+x+'</div>'));for(let i=0;i<new Date(C.getFullYear(),C.getMonth(),1).getDay();i++)g.appendChild(document.createElement('div'));let n=new Date(C.getFullYear(),C.getMonth()+1,0).getDate();for(let d=1;d<=n;d++){let date=ym()+'-'+pad(d),w=S.work.find(x=>x.date===date),el=document.createElement('div');el.className='day';el.innerHTML='<b>'+d+'</b>'+(w?'<div>'+w.start+'<br>'+w.end+'</div>':'<span class="rest">休</span>');el.onclick=()=>openDay(date);g.appendChild(el)}}function openDay(date){picked=date;document.getElementById('date').textContent=date;let box=document.getElementById('shifts');box.innerHTML='';times.forEach(t=>{let b=document.createElement('button');b.textContent=t[0]+'–'+t[1];b.onclick=()=>setWork(t[0],t[1]);box.appendChild(b)});document.getElementById('modal').classList.add('on')}function setWork(a,b){S.work=S.work.filter(x=>x.date!==picked);S.work.push({id:Date.now(),date:picked,start:a,end:b});save();document.getElementById('modal').classList.remove('on');render()}document.getElementById('customSave').onclick=()=>{let a=document.getElementById('start').value,b=document.getElementById('end').value;if(a&&b)setWork(a,b)};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on')};document.getElementById('prev').onclick=()=>{C=new Date(C.getFullYear(),C.getMonth()-1,1);render()};document.getElementById('next').onclick=()=>{C=new Date(C.getFullYear(),C.getMonth()+1,1);render()};render()</script></body></html>
