<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>班表排班系統</title>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--ink:#3f4650;--muted:#8a919b;--line:#e6e8ee;--blue:#eaf2ff;--lav:#f1ecfb;--sage:#ebf5ee;--peach:#fff0e7;--rose:#fbecef;--deep:#5e6b7a;--shadow:0 10px 28px rgba(70,78,90,.07)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f9fd,#f4f6fa);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.app{max-width:1100px;margin:auto;padding:16px 14px 100px}.hero{background:linear-gradient(135deg,#fff,#f6f2fb);border:1px solid #fff;border-radius:28px;padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:20px;top:14px;color:#c8bbdc;font-size:30px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#9298a0}h1{font-size:29px;margin:7px 0 5px}.quote{font-size:14px;color:#747b84}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:14px 0;padding:5px;border:1px solid var(--line);background:#fafbfde8;backdrop-filter:blur(10px);position:sticky;top:7px;z-index:10;border-radius:18px}.tab{min-height:44px;border:0;border-radius:13px;background:transparent;color:#858c95;font-weight:800}.tab.on{background:#fff;color:#4e5966;box-shadow:0 3px 10px rgba(50,55,65,.08)}.page{display:none}.page.on{display:block}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 3px 10px}.head h2{font-size:19px;margin:0}.pill{font-size:12px;color:#7f8690;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 9px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{min-height:42px;border-radius:12px;padding:0 14px;font-weight:800}.primary{border:0;background:#687687;color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#68717a}.danger{border:1px solid #efdadd;background:#fff8f8;color:#9a727a}.monthbar{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin-bottom:10px}.monthbar button{height:40px;border:0;background:#fff;border-radius:12px;box-shadow:0 3px 10px rgba(60,65,75,.06)}.monthtitle{text-align:center;font-weight:900}.calendar{padding:12px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:11px;color:#9a9fa6;text-align:center;padding:5px 0}.day{min-height:112px;border:1px solid var(--line);background:#fbfbfd;border-radius:14px;padding:7px;position:relative}.day.today{outline:2px solid #b8c9df}.daynum{font-size:12px;font-weight:800;margin-bottom:5px}.shiftchip{display:block;width:100%;border:0;text-align:left;border-radius:9px;padding:5px 7px;margin:4px 0;font-size:11px;line-height:1.25}.morning{background:var(--blue)}.evening{background:var(--lav)}.night{background:#edf0f5}.off{background:var(--sage)}.leave{background:var(--rose)}.legend{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px 0;font-size:11px;color:#777}.legend span{display:flex;align-items:center;gap:4px}.dot{width:9px;height:9px;border-radius:50%}.list{padding:6px 14px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}.row:last-child{border-bottom:0}.person{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#eaf2ff,#f0e9fa);display:grid;place-items:center;font-weight:900;color:#657183}.meta{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px}.icon{width:34px;height:34px;border:0;border-radius:10px;background:#f4f5f7;color:#7f8790}.form{padding:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:#7d848d;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3e8;background:#fff;border-radius:12px;padding:10px;min-height:42px}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:14px;background:#fff;border:1px solid var(--line);border-radius:18px;text-align:center;box-shadow:0 4px 14px rgba(60,65,75,.04)}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#8c9299}.notice{padding:12px 14px;border-radius:16px;background:#fff8ec;border:1px solid #f3e1bd;font-size:13px;line-height:1.6}.empty{padding:22px;text-align:center;color:#9aa0a8;font-size:13px}.modal{position:fixed;inset:0;background:rgba(43,48,56,.3);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-width:620px;background:#fff;border-radius:24px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.18)}.sheet h3{margin:0 0 12px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;background:#505964;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;transition:.2s;z-index:40}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.tabs{grid-template-columns:repeat(2,1fr)}.day{min-height:96px;padding:5px}.shiftchip{font-size:10px;padding:4px 5px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="eyebrow">SHIFT SCHEDULER</div><h1>班表排班系統</h1><div class="quote">把人員、班別、休假與每月班表整理在同一個地方。</div></header>
<nav class="tabs"><button class="tab on" data-page="schedule">班表</button><button class="tab" data-page="people">人員</button><button class="tab" data-page="leave">休假</button><button class="tab" data-page="summary">統計</button></nav>
<main id="schedule" class="page on"><div class="head"><h2>本月班表</h2><div class="toolbar"><button id="todayBtn" class="secondary">回到本月</button><button id="addShiftBtn" class="primary">＋ 新增排班</button></div></div><div class="monthbar"><button id="prevMonth">‹</button><div id="monthTitle" class="monthtitle"></div><button id="nextMonth">›</button></div><div class="card calendar"><div class="grid" id="calendarGrid"></div><div class="legend"><span><i class="dot" style="background:#cfe0f6"></i>早班</span><span><i class="dot" style="background:#d8ccef"></i>晚班</span><span><i class="dot" style="background:#d7dbe2"></i>夜班</span><span><i class="dot" style="background:#cfe4d4"></i>休假</span><span><i class="dot" style="background:#efccd4"></i>請假</span></div></div></main>
<main id="people" class="page"><div class="head"><h2>人員管理</h2><button id="addPersonBtn" class="primary">＋ 新增人員</button></div><div class="card"><div id="peopleList" class="list"></div></div><div class="head"><h2>班別設定</h2><span class="pill">可自訂</span></div><div class="card"><div id="shiftList" class="list"></div></div></main>
<main id="leave" class="page"><div class="head"><h2>休假 / 請假</h2><button id="addLeaveBtn" class="primary">＋ 新增休假</button></div><div id="leaveNotice" class="notice">新增休假後，月曆上會直接標記，排班時也會顯示衝突提醒。</div><div class="card" style="margin-top:10px"><div id="leaveList" class="list"></div></div></main>
<main id="summary" class="page"><div class="head"><h2>本月統計</h2><span id="summaryMonth" class="pill"></span></div><div class="stats"><div class="stat"><b id="totalAssignments">0</b><span>排班總筆數</span></div><div class="stat"><b id="totalPeople">0</b><span>人員數</span></div><div class="stat"><b id="totalLeaves">0</b><span>休假 / 請假</span></div><div class="stat"><b id="conflicts">0</b><span>衝突提醒</span></div></div><div class="head"><h2>每人班數</h2><span class="pill">本月</span></div><div class="card"><div id="personStats" class="list"></div></div></main>
</div><div id="toast" class="toast">已保存</div><div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle">新增</h3><div id="modalBody"></div></div></div>
<script>
(()=>{const KEY='shiftScheduler_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'')}catch(e){}if(!state)state={people:[{id:'p1',name:'小安',role:'正職'},{id:'p2',name:'小晴',role:'正職'},{id:'p3',name:'小宇',role:'兼職'}],shifts:[{id:'s1',name:'早班',start:'08:00',end:'16:00',class:'morning'},{id:'s2',name:'晚班',start:'14:00',end:'22:00',class:'evening'},{id:'s3',name:'夜班',start:'22:00',end:'08:00',class:'night'}],assignments:[],leaves:[]};let cursor=new Date();cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);const $=s=>document.querySelector(s);function save(msg=true){localStorage.setItem(KEY,JSON.stringify(state));if(msg){let t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),750)}}function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function nameOf(id){return state.people.find(p=>p.id===id)?.name||'未命名'}function shiftOf(id){return state.shifts.find(s=>s.id===id)}function isLeave(personId,date){return state.leaves.some(l=>l.personId===personId&&l.date===date)}function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('#'+t.dataset.page).classList.add('on');renderAll()});function renderCalendar(){$('#monthTitle').textContent=`${cursor.getFullYear()} 年 ${cursor.getMonth()+1} 月`;let g=$('#calendarGrid');g.innerHTML='';['日','一','二','三','四','五','六'].forEach(x=>{let d=document.createElement('div');d.className='dow';d.textContent=x;g.appendChild(d)});let y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)g.appendChild(document.createElement('div'));for(let d=1;d<=days;d++){let date=dateKey(new Date(y,m,d)),cell=document.createElement('div');cell.className='day'+(date===dateKey(new Date())?' today':'');cell.innerHTML=`<div class="daynum">${d}</div>`;state.leaves.filter(l=>l.date===date).forEach(l=>{let b=document.createElement('button');b.className='shiftchip '+(l.type==='請假'?'leave':'off');b.textContent=`${nameOf(l.personId)}・${l.type}`;cell.appendChild(b)});state.assignments.filter(a=>a.date===date).forEach(a=>{let s=shiftOf(a.shiftId);if(!s)return;let b=document.createElement('button');b.className='shiftchip '+s.class;b.textContent=`${nameOf(a.personId)}・${s.name}`;if(isLeave(a.personId,date))b.textContent+=' ⚠';b.onclick=()=>editAssignment(a.id);cell.appendChild(b)});cell.onclick=e=>{if(e.target===cell||e.target.classList.contains('daynum'))addAssignment(date)};g.appendChild(cell)}}function renderPeople(){let w=$('#peopleList');w.innerHTML='';if(!state.people.length){w.innerHTML='<div class="empty">尚未新增人員</div>';return}state.people.forEach(p=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<div class="person"><div class="avatar">${p.name.slice(0,1)}</div><div><b>${p.name}</b><div class="meta">${p.role||'未設定職別'}</div></div></div><div class="actions"><button class="icon edit">✎</button><button class="icon del">×</button></div>`;r.querySelector('.edit').onclick=()=>editPerson(p.id);r.querySelector('.del').onclick=()=>{if(confirm('刪除此人員？')){state.people=state.people.filter(x=>x.id!==p.id);state.assignments=state.assignments.filter(x=>x.personId!==p.id);state.leaves=state.leaves.filter(x=>x.personId!==p.id);save();renderAll()}};w.appendChild(r)});let s=$('#shiftList');s.innerHTML='';state.shifts.forEach(sh=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<div><b>${sh.name}</b><div class="meta">${sh.start}－${sh.end}</div></div><div class="actions"><button class="icon edit">✎</button></div>`;r.querySelector('.edit').onclick=()=>editShift(sh.id);s.appendChild(r)})}function renderLeaves(){let w=$('#leaveList');w.innerHTML='';let arr=[...state.leaves].sort((a,b)=>a.date.localeCompare(b.date));if(!arr.length){w.innerHTML='<div class="empty">尚未新增休假或請假</div>';return}arr.forEach(l=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<div><b>${nameOf(l.personId)}・${l.type}</b><div class="meta">${l.date}${l.note?'・'+l.note:''}</div></div><div class="actions"><button class="icon del">×</button></div>`;r.querySelector('.del').onclick=()=>{state.leaves=state.leaves.filter(x=>x.id!==l.id);save();renderAll()};w.appendChild(r)})}function renderStats(){let ym=`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}`;let as=state.assignments.filter(a=>a.date.startsWith(ym)),ls=state.leaves.filter(l=>l.date.startsWith(ym));$('#summaryMonth').textContent=`${cursor.getFullYear()} / ${cursor.getMonth()+1}`;$('#totalAssignments').textContent=as.length;$('#totalPeople').textContent=state.people.length;$('#totalLeaves').textContent=ls.length;let c=as.filter(a=>isLeave(a.personId,a.date)).length;$('#conflicts').textContent=c;let w=$('#personStats');w.innerHTML='';state.people.forEach(p=>{let n=as.filter(a=>a.personId===p.id).length;let r=document.createElement('div');r.className='row';r.innerHTML=`<div class="person"><div class="avatar">${p.name.slice(0,1)}</div><div><b>${p.name}</b><div class="meta">${p.role||''}</div></div></div><b>${n} 班</b>`;w.appendChild(r)})}function addAssignment(prefill=''){let people=state.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');let shifts=state.shifts.map(s=>`<option value="${s.id}">${s.name} ${s.start}-${s.end}</option>`).join('');openModal('新增排班',`<div class="form"><div class="formgrid"><div class="field"><label>日期</label><input id="fDate" type="date" value="${prefill||dateKey(new Date())}"></div><div class="field"><label>人員</label><select id="fPerson">${people}</select></div><div class="field"><label>班別</label><select id="fShift">${shifts}</select></div><div class="field full"><label>備註</label><input id="fNote" placeholder="可留白"></div><div class="full toolbar"><button id="fCancel" class="secondary">取消</button><button id="fSave" class="primary">儲存排班</button></div></div></div>`);$('#fCancel').onclick=closeModal;$('#fSave').onclick=()=>{let date=$('#fDate').value,personId=$('#fPerson').value,shiftId=$('#fShift').value;if(!date||!personId||!shiftId)return;state.assignments.push({id:'a'+Date.now(),date,personId,shiftId,note:$('#fNote').value.trim()});save();closeModal();renderAll()}}function editAssignment(id){let a=state.assignments.find(x=>x.id===id);if(!a)return;openModal('排班內容',`<div class="notice">${a.date}<br><b>${nameOf(a.personId)}</b>・${shiftOf(a.shiftId)?.name||''}${isLeave(a.personId,a.date)?'<br>⚠ 這一天已有休假 / 請假紀錄':''}</div><div class="toolbar" style="margin-top:12px"><button id="delA" class="danger">刪除排班</button><button id="closeA" class="secondary">關閉</button></div>`);$('#closeA').onclick=closeModal;$('#delA').onclick=()=>{state.assignments=state.assignments.filter(x=>x.id!==id);save();closeModal();renderAll()}}function editPerson(id){let p=id?state.people.find(x=>x.id===id):null;openModal(p?'修改人員':'新增人員',`<div class="form"><div class="formgrid"><div class="field"><label>姓名</label><input id="pName" value="${p?.name||''}"></div><div class="field"><label>職別</label><input id="pRole" value="${p?.role||''}" placeholder="正職 / 兼職 / 主管"></div><div class="full toolbar"><button id="pCancel" class="secondary">取消</button><button id="pSave" class="primary">儲存</button></div></div></div>`);$('#pCancel').onclick=closeModal;$('#pSave').onclick=()=>{let name=$('#pName').value.trim();if(!name)return;if(p){p.name=name;p.role=$('#pRole').value.trim()}else state.people.push({id:'p'+Date.now(),name,role:$('#pRole').value.trim()});save();closeModal();renderAll()}}function editShift(id){let s=state.shifts.find(x=>x.id===id);openModal('修改班別',`<div class="form"><div class="formgrid"><div class="field"><label>班別名稱</label><input id="sName" value="${s.name}"></div><div class="field"><label>開始</label><input id="sStart" type="time" value="${s.start}"></div><div class="field"><label>結束</label><input id="sEnd" type="time" value="${s.end}"></div><div class="full toolbar"><button id="sCancel" class="secondary">取消</button><button id="sSave" class="primary">儲存</button></div></div></div>`);$('#sCancel').onclick=closeModal;$('#sSave').onclick=()=>{s.name=$('#sName').value.trim()||s.name;s.start=$('#sStart').value;s.end=$('#sEnd').value;save();closeModal();renderAll()}}function addLeave(){let people=state.people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');openModal('新增休假 / 請假',`<div class="form"><div class="formgrid"><div class="field"><label>日期</label><input id="lDate" type="date" value="${dateKey(new Date())}"></div><div class="field"><label>人員</label><select id="lPerson">${people}</select></div><div class="field"><label>類型</label><select id="lType"><option>休假</option><option>請假</option></select></div><div class="field full"><label>備註</label><input id="lNote" placeholder="例如：特休、事假、家庭安排"></div><div class="full toolbar"><button id="lCancel" class="secondary">取消</button><button id="lSave" class="primary">儲存</button></div></div></div>`);$('#lCancel').onclick=closeModal;$('#lSave').onclick=()=>{state.leaves.push({id:'l'+Date.now(),date:$('#lDate').value,personId:$('#lPerson').value,type:$('#lType').value,note:$('#lNote').value.trim()});save();closeModal();renderAll()}}$('#prevMonth').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);renderAll()};$('#nextMonth').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);renderAll()};$('#todayBtn').onclick=()=>{let d=new Date;cursor=new Date(d.getFullYear(),d.getMonth(),1);renderAll()};$('#addShiftBtn').onclick=()=>addAssignment();$('#addPersonBtn').onclick=()=>editPerson();$('#addLeaveBtn').onclick=addLeave;function renderAll(){renderCalendar();renderPeople();renderLeaves();renderStats()}renderAll()})();
</script>
</body>
</html>
