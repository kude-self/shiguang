<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光所｜正式後台</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#45413d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e9e1d9;border-radius:20px;padding:16px;margin:10px 0}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f3eee7;border-radius:14px;padding:12px}.stat b{display:block;font-size:23px;margin-top:4px}button,input{font:inherit;padding:10px;border-radius:11px;border:1px solid #ddd4cb;background:#fff}button{font-weight:700}.primary{background:#55504b;color:#fff}.row{padding:11px 0;border-bottom:1px dashed #e6ded6}.meta{font-size:12px;color:#8b837b;margin-top:4px}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#e8f0e8;font-size:11px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div id="login" class="card"><h1>𓇼 拾光所｜正式後台</h1><p>預約、旅人、旅程、生日拾光與副業收入。</p><input id="email" type="email" placeholder="管理 Email"><input id="pw" type="password" placeholder="密碼"><button class="primary" id="loginBtn">登入</button><div id="msg"></div></div><div id="app" class="hide"><div class="card"><b>拾光所｜營運總覽</b> <button id="out">登出</button></div><div id="stats" class="grid"></div><div class="card"><h2>待確認預約</h2><div id="pending"></div></div><div class="card"><h2>近期旅程</h2><div id="bookings"></div></div><div class="card"><h2>生日拾光</h2><div id="birthday"></div></div><div class="card"><h2>副業收入</h2><div id="income"></div></div></div></div><script>const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';let S=JSON.parse(localStorage.getItem('sgadm')||'null');const H=()=>({apikey:K,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'}),e=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));async function loginNow(){let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:pw.value})}),d=await r.json();if(!r.ok){msg.textContent='登入失敗，請確認帳號密碼';return}S=d;localStorage.setItem('sgadm',JSON.stringify(d));start()}async function api(t,q=''){let r=await fetch(U+'/rest/v1/'+t+q,{headers:H()});if(!r.ok)throw Error(await r.text());return r.json()}async function patch(t,id,x){let r=await fetch(U+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:{...H(),Prefer:'return=minimal'},body:JSON.stringify(x)});if(!r.ok)throw Error(await r.text())}async function start(){login.classList.add('hide');app.classList.remove('hide');await load()}async function confirmB(id){await patch('traveler_bookings',id,{status:'confirmed'});await load()}async function cancelB(id){if(!confirm('確定取消？取消後不計入有效副業收入。'))return;await patch('traveler_bookings',id,{status:'cancelled'});await load()}async function paidBirthday(id){await patch('birthday_light_orders',id,{status:'paid'});await load()}function rows(a,fn){return a.length?a.map(fn).join(''):'<div class="meta">目前沒有資料</div>'}async function load(){try{let [b,bd,i,t,j]=await Promise.all([api('traveler_bookings','?select=*&order=booking_date.desc'),api('birthday_light_orders','?select=*&order=created_at.desc'),api('side_income','?select=*&order=created_at.desc'),api('travelers','?select=id,name'),api('journeys','?select=id,status')]);let valid=i.filter(x=>!['cancelled','pending'].includes(x.status)),sum=valid.reduce((n,x)=>n+(+x.amount||0),0);stats.innerHTML='<div class="stat">旅人<b>'+t.length+'</b></div><div class="stat">旅程<b>'+j.length+'</b></div><div class="stat">待確認<b>'+b.filter(x=>x.status==='pending').length+'</b></div><div class="stat">有效收入<b>$'+sum.toLocaleString()+'</b></div>';pending.innerHTML=rows(b.filter(x=>x.status==='pending'),x=>'<div class="row"><b>'+e(x.traveler_name)+'</b>・'+e(x.journey)+'<div class="meta">'+x.booking_date+' '+String(x.booking_time).slice(0,5)+'</div><button onclick="confirmB(\''+x.id+'\')">確認成立</button> <button onclick="cancelB(\''+x.id+'\')">取消</button></div>');bookings.innerHTML=rows(b.filter(x=>x.status!=='pending').slice(0,20),x=>'<div class="row"><b>'+e(x.traveler_name)+'</b> <span class="pill">'+e(x.journey)+'</span><div class="meta">'+x.booking_date+' '+String(x.booking_time).slice(0,5)+'｜'+e(x.status)+'</div></div>');birthday.innerHTML=rows(bd.slice(0,15),x=>'<div class="row"><b>'+e(x.display_name)+'</b><div class="meta">'+e(x.status)+(x.time_code?'｜'+e(x.time_code):'')+'</div>'+(x.status!=='paid'?'<button onclick="paidBirthday(\''+x.id+'\')">確認付款</button>':'')+'</div>');income.innerHTML=rows(i.slice(0,30),x=>'<div class="row"><b>'+e(x.service_name)+'</b>・'+e(x.traveler_name)+'<div class="meta">服務 $'+(+x.amount||0).toLocaleString()+(+x.shipping?'｜郵寄 $'+(+x.shipping).toLocaleString():'')+'｜'+e(x.status)+'</div></div>')}catch(err){alert('讀取失敗：'+err.message)}}loginBtn.onclick=loginNow;out.onclick=()=>{localStorage.removeItem('sgadm');location.reload()};if(S?.access_token)start();</script></body></html>
