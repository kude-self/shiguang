<div id="login" class="login paper"><h1>拾光者 <span class="v2">V2</span></h1><div class="sub">旅 程 紀 錄 本・初遇／拾光／同行</div><input id="email" type="email" placeholder="管理 Email"><input id="pw" type="password" placeholder="密碼"><button class="btn primary" id="loginBtn">進入旅程紀錄本</button><div id="msg" class="meta"></div></div>

<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';let S=JSON.parse(localStorage.getItem('sgadm')||'null'),DATA={b:[],bd:[],i:[],t:[],j:[]};const tabs=[['dashboard','總覽'],['bookings','預約管理'],['programs','三段旅程'],['birthday','生日拾光'],['travelers','旅人清單'],['journeys','旅程紀錄'],['incomePage','副業收入'],['backup','備份']];const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function saveSession(s){S=s;localStorage.setItem('sgadm',JSON.stringify(s))}function clearSession(){S=null;localStorage.removeItem('sgadm')}async function refreshSession(){if(!S?.refresh_token)return false;try{let r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh_token})}),d=await r.json();if(!r.ok)return false;saveSession(d);return true}catch{return false}}function H(){return {apikey:K,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'}}async function auth(){let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value.trim(),password:el('pw').value})}),d=await r.json();if(!r.ok){el('msg').textContent='登入失敗，請確認帳號密碼';return}saveSession(d);start()}async function request(path,opt={},retry=true){let r=await fetch(U+path,{...opt,headers:{...(opt.headers||{}),...H()}});if(r.status===401&&retry&&await refreshSession())return request(path,opt,false);if(!r.ok)throw Error(await r.text());return r}async function api(t,q=''){let r=await request('/rest/v1/'+t+q);return r.json()}async function patch(t,id,x){await request('/rest/v1/'+t+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(x)})}async function del(t,id){await request('/rest/v1/'+t+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}})}async function post(t,x){let r=await request('/rest/v1/'+t,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(x)});return r.json()}function statusLabel(s){return ({pending:'待確認',confirmed:'已成立',paid:'已付款',producing:'製作中',shipped:'已寄出',cancelled:'已取消',new:'待確認',active:'進行中',completed:'已完成'})[s]||s||'—'}function pill(s){return '<span class="pill '+esc(s)+'">'+esc(statusLabel(s))+'</span>'}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));el('title').textContent=tabs.find(x=>x[0]===id)?.[1]||'總覽';if(id==='bookings')renderBookings();if(id==='travelers')renderTravelers();if(id==='journeys')renderJourneys()}function buildNav(){let h=tabs.map(x=>'<button data-tab="'+x[0]+'">'+x[1]+'</button>').join('');el('nav').innerHTML=h;el('mobile').innerHTML=h;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));show('dashboard')}function empty(){return '<div class="empty">目前沒有資料</div>'}function findTraveler(id){return DATA.t.find(x=>x.id===id)}function parseNote(note){if(!note)return{};try{return JSON.parse(note)}catch{return{legacy:note}}}function closeModal(){el('modal').classList.remove('on');el('modalBody').innerHTML=''}function openModal(html){el('modalBody').innerHTML=html;el('modal').classList.add('on')}el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeModal()});async function confirmBooking(id){await patch('traveler_bookings',id,{status:'confirmed'});await load()}async function cancelBooking(id){if(confirm('確定取消這筆預約？取消會保留紀錄，且不計入有效收入。')){await patch('traveler_bookings',id,{status:'cancelled'});await load()}}async function deleteBooking(id){if(confirm('確定永久刪除這筆預約？此動作無法復原。')&&confirm('再次確認：真的要刪除嗎？')){await del('traveler_bookings',id);await load()}}async function paidBirthday(id){if(confirm('確認已收到付款並成立生日拾光？')){await patch('birthday_light_orders',id,{status:'paid'});await load()}}async function cancelBirthday(id){if(confirm('確定取消這筆生日拾光？')){await patch('birthday_light_orders',id,{status:'cancelled'});await load()}}async function deleteBirthday(id){if(confirm('確定永久刪除這筆生日拾光？')&&confirm('再次確認：真的要刪除嗎？')){await del('birthday_light_orders',id);await load()}}function bookingCard(x){return '<div class="row"><div class="rowhead"><div><b>'+esc(x.traveler_name||'旅人')+'</b> '+pill(x.status)+'</div><span class="pill">'+esc(x.journey||'')+'</span></div><div class="meta">'+esc(x.booking_date||'')+' '+esc(String(x.booking_time||'').slice(0,5))+(x.contact_value?'｜'+esc(x.contact_value):'')+'</div><div class="actions">'+(x.status==='pending'?'<button class="btn primary" onclick="confirmBooking(\''+x.id+'\')">確認成立</button>':'')+(x.status!=='cancelled'?'<button class="btn" onclick="cancelBooking(\''+x.id+'\')">取消</button>':'')+'<button class="btn soft" onclick="openBookingDetail(\''+x.id+'\')">管理</button><button class="btn danger" onclick="deleteBooking(\''+x.id+'\')">刪除</button></div></div>'}function openBookingDetail(id){let x=DATA.b.find(v=>v.id===id);if(!x)return;openModal('<h2>預約管理</h2><div class="kv"><b>旅人</b><div>'+esc(x.traveler_name)+'</div><b>服務</b><div>'+esc(x.journey)+'</div><b>日期／時段</b><div>'+esc(x.booking_date)+' '+esc(String(x.booking_time||'').slice(0,5))+'</div><b>狀態</b><div>'+statusLabel(x.status)+'</div><b>聯絡</b><div>'+esc(x.contact_value||x.instagram||'—')+'</div><b>金額</b><div>NT$'+esc(x.amount||'—')+'</div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">關閉</button></div>')}function renderBookings(){let f=el('bookingFilter')?.value||'all',a=DATA.b.filter(x=>f==='all'||x.status===f);el('bookingList').innerHTML=a.length?a.map(bookingCard).join(''):empty()}function birthdayCard(x){return '<div class="row"><div class="rowhead"><div><b>'+esc(x.display_name||x.recipient_name||'旅人')+'</b> '+pill(x.status)+'</div><span class="pill">'+esc(x.time_code||'尚未產生時光編碼')+'</span></div><div class="meta">生日 '+esc(x.birthday||'—')+'｜付款末五碼 '+esc(x.payment_last5||'—')+'</div><div class="actions">'+(!['paid','producing','shipped','cancelled'].includes(x.status)?'<button class="btn primary" onclick="paidBirthday(\''+x.id+'\')">確認付款</button>':'')+(x.status!=='cancelled'?'<button class="btn" onclick="cancelBirthday(\''+x.id+'\')">取消</button>':'')+'<button class="btn soft" onclick="openBirthdayDetail(\''+x.id+'\')">管理</button><button class="btn danger" onclick="deleteBirthday(\''+x.id+'\')">刪除</button></div></div>'}function openBirthdayDetail(id){let x=DATA.bd.find(v=>v.id===id);if(!x)return;openModal('<h2>生日拾光管理</h2><div class="kv"><b>旅人</b><div>'+esc(x.display_name||'—')+'</div><b>生日</b><div>'+esc(x.birthday||'—')+'</div><b>目前狀態</b><div>'+esc(x.current_state||'—')+'</div><b>最近常出現的話</b><div>'+esc(x.self_message||'—')+'</div><b>收件人</b><div>'+esc(x.recipient_name||'—')+'</div><b>電話</b><div>'+esc(x.phone||'—')+'</div><b>郵遞區號</b><div>'+esc(x.postal_code||'—')+'</div><b>地址</b><div>'+esc(x.address||'—')+'</div><b>付款末五碼</b><div>'+esc(x.payment_last5||'—')+'</div><b>照片</b><div>'+esc(x.photo_path||'尚無照片路徑')+'</div><b>時光編碼</b><div>'+esc(x.time_code||'尚未產生')+'</div><b>狀態</b><div>'+statusLabel(x.status)+'</div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">關閉</button></div>')}function travelerCard(t){let js=DATA.j.filter(j=>j.traveler_id===t.id),latest=js[0];return '<div class="row"><div class="rowhead"><div><b>'+esc(t.name)+'</b> '+pill(t.status)+'</div><span class="pill">'+js.length+' 段旅程</span></div><div class="meta">'+esc(t.concern||'尚未填寫主要關注')+(latest?'｜最近：'+esc(latest.journey_type)+' '+statusLabel(latest.status):'')+'</div><div class="actions"><button class="btn soft" onclick="openTravelerDetail(\''+t.id+'\')">管理</button><button class="btn" onclick="openJourneyForm(\''+t.id+'\')">開啟旅程</button><button class="btn danger" onclick="deleteTraveler(\''+t.id+'\')">刪除</button></div></div>'}function renderTravelers(){let q=(el('travelerSearch')?.value||'').trim().toLowerCase(),f=el('travelerFilter')?.value||'all',a=DATA.t.filter(t=>(!q||String(t.name).toLowerCase().includes(q))&&(f==='all'||t.status===f));el('travelerList').innerHTML=a.length?a.map(travelerCard).join(''):empty()}function openTravelerDetail(id){let t=findTraveler(id);if(!t)return;let js=DATA.j.filter(j=>j.traveler_id===id);openModal('<h2>'+esc(t.name)+'</h2><div class="kv"><b>初次相遇</b><div>'+esc(t.first_meeting_date||'—')+'</div><b>目前主題</b><div>'+esc(t.concern||'—')+'</div><b>期待</b><div>'+esc(t.hope||'—')+'</div><b>私人備註</b><div>'+esc(t.private_note||'—')+'</div></div><div class="detail"><h3>旅程</h3>'+(js.length?js.map(j=>'<div class="row"><b>'+esc(j.journey_type)+'</b> '+pill(j.status)+'<div class="meta">'+esc(j.start_date)+'</div><div class="actions"><button class="btn soft" onclick="openJourneyDetail(\''+j.id+'\')">管理</button></div></div>').join(''):empty())+'</div><div class="modalfoot"><button class="btn" onclick="closeModal()">關閉</button></div>')}function openTravelerForm(){openModal('<h2>新增旅人</h2><div class="formrow"><div class="field"><label>旅人名稱</label><input id="tf_name"></div><div class="field"><label>初次相遇日期</label><input id="tf_date" type="date"></div></div><div class="field"><label>主要關注</label><textarea id="tf_concern"></textarea></div><div class="field"><label>期待</label><textarea id="tf_hope"></textarea></div><div class="field"><label>私人備註</label><textarea id="tf_note"></textarea></div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveTraveler()">建立旅人</button></div>')}async function saveTraveler(){let name=el('tf_name').value.trim();if(!name){alert('請輸入旅人名稱');return}await post('travelers',{name,first_meeting_date:el('tf_date').value||null,concern:el('tf_concern').value||null,hope:el('tf_hope').value||null,private_note:el('tf_note').value||null,status:'active'});closeModal();await load();show('travelers')}async function deleteTraveler(id){let n=DATA.j.filter(j=>j.traveler_id===id).length;if(confirm('確定永久刪除這位旅人？'+(n?'他的 '+n+' 筆旅程也會一併刪除。':'') )&&confirm('再次確認：此動作無法復原。')){await del('travelers',id);await load()}}function journeyCard(j){let t=findTraveler(j.traveler_id),n=parseNote(j.note);return '<div class="row"><div class="rowhead"><div><b>'+esc(t?.name||'旅人')+'</b> <span class="pill">'+esc(j.journey_type)+'</span> '+pill(j.status)+'</div><span class="meta">'+esc(j.start_date)+'</span></div><div class="meta">'+esc(n.summary||n.legacy||'尚未留下這段旅程的紀錄')+'</div><div class="actions"><button class="btn soft" onclick="openJourneyDetail(\''+j.id+'\')">管理／紀錄</button>'+(j.status==='active'?'<button class="btn" onclick="cancelJourney(\''+j.id+'\')">取消</button>':'')+'<button class="btn danger" onclick="deleteJourney(\''+j.id+'\')">刪除</button></div></div>'}function renderJourneys(){let a=[...DATA.j].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));el('journeyList').innerHTML=a.length?a.map(journeyCard).join(''):empty()}function openJourneyForm(travelerId=''){let opts=DATA.t.map(t=>'<option value="'+t.id+'" '+(t.id===travelerId?'selected':'')+'>'+esc(t.name)+'</option>').join('');openModal('<h2>開啟旅程</h2><div class="field"><label>旅人</label><select id="jf_traveler"><option value="">請選擇</option>'+opts+'</select></div><div class="formrow"><div class="field"><label>旅程</label><select id="jf_type"><option>初遇</option><option>拾光</option><option>同行</option></select></div><div class="field"><label>開始日期</label><input id="jf_date" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveJourney()">建立旅程</button></div>')}async function saveJourney(){let traveler_id=el('jf_traveler').value;if(!traveler_id){alert('請選擇旅人');return}await post('journeys',{traveler_id,journey_type:el('jf_type').value,start_date:el('jf_date').value,status:'active'});closeModal();await load();show('journeys')}function journeyFields(type,n){let base='<div class="field"><label>這一次主要走過什麼</label><textarea id="jn_summary">'+esc(n.summary||'')+'</textarea></div><div class="field"><label>旅人的重要原話</label><textarea id="jn_quote">'+esc(n.quote||'')+'</textarea></div><div class="field"><label>陪伴中的看見</label><textarea id="jn_seen">'+esc(n.seen||'')+'</textarea></div><div class="field"><label>我還在好奇（私人）</label><textarea id="jn_curious">'+esc(n.curious||'')+'</textarea></div><div class="field"><label>這一次拾起了什麼</label><textarea id="jn_picked">'+esc(n.picked||'')+'</textarea></div><div class="field"><label>留給接下來的觀察</label><textarea id="jn_next">'+esc(n.next||'')+'</textarea></div><div class="field"><label>陪伴者私人備註</label><textarea id="jn_private">'+esc(n.private||'')+'</textarea></div>';if(type==='初遇')return '<div class="formrow"><div class="field"><label>此刻的光｜顏色</label><input id="jn_color" value="'+esc(n.color||'')+'"></div><div class="field"><label>我感受到的訊息</label><input id="jn_color_msg" value="'+esc(n.color_msg||'')+'"></div></div>'+base;if(type==='拾光')return '<div class="field"><label>目前走到的位置／路線變化</label><textarea id="jn_route">'+esc(n.route||'')+'</textarea></div>'+base;return '<div class="field"><label>生活裡正在發生的軌跡</label><textarea id="jn_life">'+esc(n.life||'')+'</textarea></div>'+base}function openJourneyDetail(id){let j=DATA.j.find(v=>v.id===id),t=findTraveler(j?.traveler_id);if(!j)return;let n=parseNote(j.note);openModal('<h2>'+esc(t?.name||'旅人')+'｜'+esc(j.journey_type)+'</h2><div class="meta">開始 '+esc(j.start_date)+'｜'+statusLabel(j.status)+'</div>'+journeyFields(j.journey_type,n)+'<div class="modalfoot"><button class="btn" onclick="closeModal()">關閉</button><button class="btn primary" onclick="saveJourneyNote(\''+j.id+'\')">儲存紀錄</button></div>')}async function saveJourneyNote(id){let j=DATA.j.find(v=>v.id===id),n={summary:el('jn_summary').value,quote:el('jn_quote').value,seen:el('jn_seen').value,curious:el('jn_curious').value,picked:el('jn_picked').value,next:el('jn_next').value,private:el('jn_private').value};if(j.journey_type==='初遇'){n.color=el('jn_color').value;n.color_msg=el('jn_color_msg').value}if(j.journey_type==='拾光')n.route=el('jn_route').value;if(j.journey_type==='同行')n.life=el('jn_life').value;await patch('journeys',id,{note:JSON.stringify(n)});closeModal();await load();show('journeys')}async function cancelJourney(id){if(confirm('確定取消這段旅程？資料會保留。')){await patch('journeys',id,{status:'cancelled'});await load()}}async function deleteJourney(id){if(confirm('確定永久刪除這段旅程？')&&confirm('再次確認：此動作無法復原。')){await del('journeys',id);await load()}}async function load(){try{let [b,bd,i,t,j]=await Promise.all([api('traveler_bookings','?select=*&order=booking_date.desc'),api('birthday_light_orders','?select=*&order=created_at.desc'),api('side_income','?select=*&order=created_at.desc'),api('travelers','?select=*&order=created_at.desc'),api('journeys','?select=*&order=created_at.desc')]);DATA={b,bd,i,t,j};let valid=i.filter(x=>!['cancelled','pending'].includes(x.status)),sum=valid.reduce((n,x)=>n+(+x.amount||0)+(+x.shipping||0),0),pend=b.filter(x=>x.status==='pending'),activeJ=j.filter(x=>x.status==='active');el('stats').innerHTML='<div class="stat">旅人<b>'+t.length+'</b></div><div class="stat">進行中旅程<b>'+activeJ.length+'</b></div><div class="stat">待確認預約<b>'+pend.length+'</b></div><div class="stat">有效收入<b>$'+sum.toLocaleString()+'</b></div>';el('pending').innerHTML=pend.length?pend.slice(0,8).map(bookingCard).join(''):empty();let done=b.filter(x=>!['pending','cancelled'].includes(x.status)).slice(0,10);el('recent').innerHTML=done.length?done.map(bookingCard).join(''):empty();[['initial','初遇'],['shiguang','拾光'],['companion','同行']].forEach(([id,nm])=>{let a=j.filter(x=>x.journey_type===nm&&x.status!=='cancelled').slice(0,8);el(id).innerHTML=a.length?a.map(journeyCard).join(''):empty()});el('birthdays').innerHTML=bd.length?bd.slice(0,40).map(birthdayCard).join(''):empty();renderBookings();renderTravelers();renderJourneys();el('income').innerHTML=i.length?i.slice(0,80).map(x=>'<div class="row"><div class="rowhead"><div><b>'+esc(x.traveler_name||'旅人')+'</b> <span class="pill">'+esc(x.service_name||'')+'</span></div>'+pill(x.status)+'</div><div class="meta">服務 NT$'+(+x.amount||0).toLocaleString()+(+x.shipping?'｜郵寄 NT$'+(+x.shipping).toLocaleString():'')+(x.paid_at?'｜'+esc(String(x.paid_at).slice(0,16).replace('T',' ')):'')+'</div></div>').join(''):empty()}catch(e){if(String(e.message).includes('JWT expired')){clearSession();el('app').classList.add('hide');el('login').classList.remove('hide');el('msg').textContent='登入已逾時，請重新登入。';return}alert('讀取失敗：'+e.message)}}function exportData(){let blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='拾光所_雲端資料備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function start(){el('login').classList.add('hide');el('app').classList.remove('hide');buildNav();if(S?.expires_at&&S.expires_at*1000<Date.now()+60000){if(!await refreshSession()){clearSession();el('app').classList.add('hide');el('login').classList.remove('hide');el('msg').textContent='登入已逾時，請重新登入。';return}}await load()}el('loginBtn').onclick=auth;el('out').onclick=()=>{clearSession();location.reload()};el('bookingFilter').onchange=renderBookings;el('travelerSearch').oninput=renderTravelers;el('travelerFilter').onchange=renderTravelers;if(S?.access_token)start();
</script></body></html>
