h2{font:20px Georgia,"Noto Serif TC",serif;margin:0 0 13px}.row{padding:12px 2px;border-bottom:1px dashed #ddd2c5}.row:last-child{border:0}.meta{font-size:12px;color:#91877b;margin:5px 0}.pill{display:inline-block;background:#e6eee5;padding:3px 8px;border-radius:99px;font-size:11px}.empty{color:#a3998d;font-size:13px;padding:14px 0}.page{display:none}.page.on{display:block}.service{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service .paper{padding:20px}.service h3{font:21px Georgia,"Noto Serif TC",serif;margin:0 0 6px}.sage{border-top:4px solid #9aaa96}.blue{border-top:4px solid #9caeba}.rose{border-top:4px solid #c8aaa4}.mobile{display:none}@media(max-width:760px){.layout{display:block}.side{display:none}.main{padding:16px 14px 85px}.stats{grid-template-columns:1fr 1fr}.grid,.service{grid-template-columns:1fr}.top h1{font-size:23px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffaf4;border-top:1px solid #ded4c7;z-index:9;overflow:auto}.mobile button{min-width:80px;flex:1;border:0;background:transparent;padding:11px 5px;font-size:11px}.mobile button.on{color:#657562;font-weight:700}}</style></head><body><div id="login" class="login paper"><h1>拾光者 <span class="v2">V2</span></h1><div class="sub">旅 程 紀 錄 本・初遇／拾光／同行</div><input id="email" type="email" placeholder="管理 Email"><input id="pw" type="password" placeholder="密碼"><button class="btn primary" id="loginBtn">進入旅程紀錄本</button><div id="msg" class="meta"></div></div><div id="app" class="layout hide"><aside class="side"><div class="brand">拾光者 <span class="v2">V2</span></div><div class="sub">旅 程 紀 錄 本</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><h1 id="title">總覽</h1><div><span class="season">此刻・拾光日</span> <button class="btn" id="out">登出</button></div></div><section id="dashboard" class="page on"><div id="stats" class="stats"></div><div class="grid"><div class="paper card"><h2>待確認預約</h2><div id="pending"></div></div><div class="paper card"><h2>最近的旅程</h2><div id="recent"></div></div></div></section><section id="programs" class="page"><div class="service"><div class="paper sage"><h3>初遇</h3><div class="meta">一場相遇，留下第一次看見。</div><div id="initial"></div></div><div class="paper blue"><h3>拾光</h3><div class="meta">4 次・約 4–6 週，把一路看見的自己留下來。</div><div id="shiguang"></div></div><div class="paper rose"><h3>同行</h3><div class="meta">把真正發生在生活裡的改變留下來。</div><div id="companion"></div></div></div></section><section id="birthday" class="page"><div class="paper card"><h2>生日拾光</h2><div id="birthdays"></div></div></section><section id="travelers" class="page"><div class="paper card"><h2>旅人清單</h2><div id="travelerList"></div></div></section><section id="incomePage" class="page"><div class="paper card"><h2>副業收入</h2><div id="income"></div></div></section><section id="backup" class="page"><div class="paper card"><h2>備份</h2><p>正式資料目前以 Supabase 為主要資料來源。</p><button class="btn" onclick="exportData()">匯出目前雲端資料 JSON</button></div></section></main><div class="mobile" id="mobile"></div></div><script>const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';let S=JSON.parse(localStorage.getItem('sgadm')||'null'),DATA={};const tabs=[['dashboard','總覽'],['programs','三段旅程'],['birthday','生日拾光'],['travelers','旅人清單'],['incomePage','副業收入'],['backup','備份']];const el=id=>document.getElementById(id),H=()=>({apikey:K,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'}),esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));async function auth(){let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value.trim(),password:el('pw').value})}),d=await r.json();if(!r.ok){el('msg').textContent='登入失敗，請確認帳號密碼';return}S=d;localStorage.setItem('sgadm',JSON.stringify(d));start()}async function api(t,q=''){let r=await fetch(U+'/rest/v1/'+t+q,{headers:H()});if(!r.ok)throw Error(await r.text());return r.json()}async function patch(t,id,x){let r=await fetch(U+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:{...H(),Prefer:'return=minimal'},body:JSON.stringify(x)});if(!r.ok)throw Error(await r.text())}function row(x,extra=''){return '<div class="row"><b>'+esc(x.traveler_name||x.name||x.display_name||'旅人')+'</b>'+extra+'</div>'}function empty(){return '<div class="empty">目前沒有資料</div>'}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));el('title').textContent=tabs.find(x=>x[0]===id)?.[1]||'總覽'}function buildNav(){let h=tabs.map(x=>'<button data-tab="'+x[0]+'">'+x[1]+'</button>').join('');el('nav').innerHTML=h;el('mobile').innerHTML=h;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));show('dashboard')}async function confirmBooking(id){await patch('traveler_bookings',id,{status:'confirmed'});await load()}async function cancelBooking(id){if(confirm('確定取消這筆預約？')){await patch('traveler_bookings',id,{status:'cancelled'});await load()}}async function paidBirthday(id){await patch('birthday_light_orders',id,{status:'paid'});await load()}async function load(){try{let [b,bd,i,t,j]=await Promise.all([api('traveler_bookings','?select=*&order=booking_date.desc'),api('birthday_light_orders','?select=*&order=created_at.desc'),api('side_income','?select=*&order=created_at.desc'),api('travelers','?select=*&order=created_at.desc'),api('journeys','?select=*&order=created_at.desc')]);DATA={b,bd,i,t,j};let valid=i.filter(x=>!['cancelled','pending'].includes(x.status)),sum=valid.reduce((n,x)=>n+(+x.amount||0)+(+x.shipping||0),0),pend=b.filter(x=>x.status==='pending');el('stats').innerHTML='<div class="stat">旅人<b>'+t.length+'</b></div><div class="stat">旅程<b>'+j.length+'</b></div><div class="stat">待確認<b>'+pend.length+'</b></div><div class="stat">有效收入<b>$'+sum.toLocaleString()+'</b></div>';el('pending').innerHTML=pend.length?pend.map(x=>row(x,'<div class="meta">'+esc(x.journey)+'｜'+esc(x.booking_date)+' '+String(x.booking_time||'').slice(0,5)+'</div><button class="btn primary" onclick="confirmBooking(\''+x.id+'\')">確認成立</button> <button class="btn" onclick="cancelBooking(\''+x.id+'\')">取消</button>')).join(''):empty();let done=b.filter(x=>x.status!=='pending').slice(0,12);el('recent').innerHTML=done.length?done.map(x=>row(x,' <span class="pill">'+esc(x.journey)+'</span><div class="meta">'+esc(x.booking_date)+'｜'+esc(x.status)+'</div>')).join(''):empty();[['initial','初遇'],['shiguang','拾光'],['companion','同行']].forEach(([id,n])=>{let a=b.filter(x=>x.journey===n&&x.status!=='cancelled').slice(0,10);el(id).innerHTML=a.length?a.map(x=>row(x,'<div class="meta">'+esc(x.booking_date)+'｜'+esc(x.status)+'</div>')).join(''):empty()});el('birthdays').innerHTML=bd.length?bd.slice(0,30).map(x=>row(x,'<div class="meta">'+esc(x.status)+(x.time_code?'｜'+esc(x.time_code):'')+'</div>'+(x.status!=='paid'?'<button class="btn primary" onclick="paidBirthday(\''+x.id+'\')">確認付款</button>':''))).join(''):empty();el('travelerList').innerHTML=t.length?t.map(x=>row(x,'<div class="meta">旅人主檔</div>')).join(''):empty();el('income').innerHTML=i.length?i.slice(0,50).map(x=>row(x,' <span class="pill">'+esc(x.service_name)+'</span><div class="meta">服務 $'+(+x.amount||0).toLocaleString()+(+x.shipping?'｜郵寄 $'+(+x.shipping).toLocaleString():'')+'｜'+esc(x.status)+'</div>')).join(''):empty()}catch(e){alert('讀取失敗：'+e.message)}}function exportData(){let blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='拾光所_雲端資料備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function start(){el('login').classList.add('hide');el('app').classList.remove('hide');buildNav();await load()}el('loginBtn').onclick=auth;el('out').onclick=()=>{localStorage.removeItem('sgadm');location.reload()};if(S?.access_token)start();</script></body></html>
