<div id="app">
  <div style="min-height:100vh;background:#FAFAF8;color:#37352F;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;padding:28px 18px;box-sizing:border-box;">
    <div style="max-width:900px;margin:0 auto;">
      <div style="margin-bottom:24px;">
        <div style="font-size:26px;font-weight:700;letter-spacing:.05em;">拾光者</div>
        <div style="font-size:12px;color:#9B9A97;letter-spacing:.12em;margin-top:3px;">旅 程 紀 錄 本</div>
      </div>
      <div style="background:#FFFDF8;border:1px solid rgba(55,53,47,.09);border-radius:22px;padding:28px 24px;box-shadow:0 8px 24px rgba(120,100,80,.08);">
        <div style="font-size:12px;color:#C9938A;font-weight:700;letter-spacing:.14em;margin-bottom:8px;">JOURNEY RECORD</div>
        <h1 style="font-size:24px;line-height:1.45;margin:0 0 10px;">每一段相遇，都值得被好好記下。</h1>
        <p style="font-size:14px;line-height:1.9;color:#5A5248;margin:0;">這裡收著每一位旅人的基本資料、每一次相遇，以及旅程裡重要的話與方向。</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;">
        <div style="background:#FFFDF8;border:1px solid rgba(55,53,47,.09);border-radius:16px;padding:18px;"><div style="font-size:13px;color:#9B9A97;">旅人總數</div><div style="font-size:30px;font-weight:800;margin-top:8px;">0</div></div>
        <div style="background:#FFFDF8;border:1px solid rgba(55,53,47,.09);border-radius:16px;padding:18px;"><div style="font-size:13px;color:#9B9A97;">累計旅程</div><div style="font-size:30px;font-weight:800;margin-top:8px;">0</div></div>
      </div>
