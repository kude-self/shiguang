<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光所｜光之療癒與服務管理</title><style>
:root{--ink:#554b47;--rose:#b9857d;--line:#e8ddd5}*{box-sizing:border-box}body{margin:0;background:#fbf7f2;color:var(--ink);font-family:-apple-system,"Noto Sans TC",sans-serif}main{max-width:850px;margin:auto;padding:25px 16px 80px}h1{font-size:26px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.tabs button{background:#f1e9e3;color:#74635d;padding:12px 5px;font-size:13px}.tabs button.active{background:#b9857d;color:white}.panel{display:none}.panel.active{display:block}.chakra{padding:13px;margin:9px 0;background:#faf7f3;border:1px solid var(--line);border-radius:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:540px){.two{grid-template-columns:1fr}}h2{font-size:19px;margin:0 0 14px}p{line-height:1.8;color:#867a74}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #967b6a10}a{color:var(--rose)}label{display:block;font-weight:650;margin:12px 0 6px;font-size:14px}input,textarea,select{width:100%;border:1px solid #dfd4cd;border-radius:12px;padding:11px;font-size:16px;background:#fff;color:var(--ink)}textarea{min-height:75px;resize:vertical}button{border:0;border-radius:12px;padding:11px 18px;background:var(--rose);color:white;font-weight:700;cursor:pointer}button.secondary{background:#f2e9e4;color:var(--ink)}button:disabled{opacity:.5}.service{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.service:last-child{border:0}.switch{width:25px;height:25px;accent-color:#829d81}.oil{background:#fcf8f4;border:1px solid var(--line);border-radius:16px;padding:14px;margin:13px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{font-size:13px;color:#988981}.record{padding:15px;border:1px solid var(--line);border-radius:15px;margin:12px 0}#msg{position:sticky;top:8px;background:#edf4eb;border-radius:12px;padding:12px;display:none;z-index:3}.hide{display:none}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet"><style id="sg-global-round-font">html,body,button,input,select,textarea,option,table,th,td,label,a,h1,h2,h3,h4,h5,h6,p,span,div{font-family:"Huninn","Zen Maru Gothic","PingFang TC",ui-rounded,sans-serif!important}button,input,select,textarea{font-size:inherit}h1,h2,h3,h4{letter-spacing:.025em}</style></head><body><main><a href="./#/dashboard">← 返回旅程紀錄本</a><h1>𓂃 光之療癒｜旅人紀錄</h1><p>這是旅人紀錄的編輯畫面，請從個別旅人資料進入。</p><div id="msg"></div><section class="card" id="auth"><h2>管理員驗證</h2><p>請先從原本的管理後台登入，再回到此頁。</p><a href="./#/dashboard">前往管理後台</a></section><div id="work" class="hide"><nav class="tabs" style="display:none"><button type="button" class="active" data-tab="settings">服務設定</button><button type="button" data-tab="new">療癒紀錄</button><button type="button" data-tab="history">歷次紀錄</button></nav><div id="settings" class="panel active"><section class="card"><h2>預約服務開關</h2><p class="muted">關閉的服務不會出現在公開預約頁；原本的紀錄不會刪除。</p><div id="switches"></div><p class="muted">光之療癒的個別紀錄請到「旅人清單 → 旅人詳情」新增或編輯。</p><a href="./#/travelers">前往旅人清單</a></section></div><div id="new" class="panel"><section class="card"><h2 id="formTitle">新增光之療癒紀錄</h2><form id="recordForm"><input type="hidden" id="rid"><label>選擇既有旅人</label><select id="travelerId"><option value="">不連結旅人／手動輸入</option></select><label>旅人稱呼 *</label><input id="traveler" required placeholder="旅人姓名或稱呼"><label>服務日期 *</label><input id="date" type="date" required><label>第幾次服務</label><input id="count" type="number" min="1" value="1"><h2 style="margin-top:25px">七脈輪｜本次觀察</h2><p class="muted">自由紀錄本次感受，不必每個欄位都填寫。</p><div id="chakras"></div><h2 style="margin-top:24px">植物訊息｜三支精油</h2><div id="oils"></div><label>三支精油的整體訊息</label><textarea id="overall" placeholder="三支精油放在一起，呈現了什麼共同主題？"></textarea><label>旅人的回饋</label><textarea id="feedback" placeholder="旅人實際分享的感受"></textarea><label>自己的補充筆記（僅後台）</label><textarea id="note"></textarea><div class="row" style="margin-top:18px"><button type="submit" id="save">儲存紀錄</button><button type="button" class="secondary" onclick="resetForm()">清空／新增下一筆</button></div></form></section></div><div id="history" class="panel"><section class="card"><h2>歷次光之療癒紀錄</h2><p class="muted">可重新開啟修改；不同場次分開保存。</p><div id="records"></div></section></div></div></main><script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';let session=null,rows=[],travelers=[];const chakraNames=['海底輪','臍輪','太陽神經叢輪','心輪','喉輪','眉心輪','頂輪'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(s){$('msg').textContent=s;$('msg').style.display='block';setTimeout(()=>$('msg').style.display='none',4500)}
async function req(path,options={}){const headers={apikey:K,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})};const r=await fetch(U+'/rest/v1/'+path,{...options,headers});if(!r.ok)throw Error((await r.text()).slice(0,240));return r.status===204?null:await r.text().then(t=>t?JSON.parse(t):null)}
function oilForm(i,o={}){return '<div class="oil"><b>第 '+i+' 支精油</b><label>精油名稱</label><input id="oil'+i+'" value="'+esc(o.name||'')+'" placeholder="自由填寫"><label>身體感受</label><textarea id="body'+i+'">'+esc(o.body||'')+'</textarea><label>情緒感受</label><textarea id="emotion'+i+'">'+esc(o.emotion||'')+'</textarea><label>靈性／直覺訊息</label><textarea id="spirit'+i+'">'+esc(o.spirit||'')+'</textarea><label>核心關鍵字</label><input id="keyword'+i+'" value="'+esc(o.keyword||'')+'"></div>'}
function chakraForm(data={}){return chakraNames.map((name,i)=>'<div class="chakra"><b>'+String(i+1).padStart(2,'0')+'｜'+name+'</b><textarea data-chakra="'+name+'" placeholder="感受、畫面、能量變化或當下的提醒">'+esc(data[name]||'')+'</textarea></div>').join('')}function showTab(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab))}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));function resetForm(){ $('recordForm').reset();$('rid').value='';$('formTitle').textContent='新增光之療癒紀錄';$('oils').innerHTML=[1,2,3].map(i=>oilForm(i)).join('');$('chakras').innerHTML=chakraForm();$('travelerId').value='';$('date').value=new Date().toLocaleDateString('sv-SE');$('count').value=1}
async function load(){const settings=await req('shiguang_service_settings?select=service_name,enabled,duration_label,price_amount,description&order=service_name');$('switches').innerHTML=settings.map(s=>'<div class="service" style="display:block"><div class="row" style="justify-content:space-between"><b>'+esc(s.service_name)+'</b><label style="margin:0"><input class="switch" type="checkbox" data-service="'+esc(s.service_name)+'" '+(s.enabled?'checked':'')+'><span class="muted">'+(s.enabled?'開放':'暫停')+'</span></label></div><div class="two"><div><label>服務時間</label><input data-field="duration_label" data-name="'+esc(s.service_name)+'" value="'+esc(s.duration_label||'')+'"></div><div><label>費用（NT$）</label><input type="number" min="0" data-field="price_amount" data-name="'+esc(s.service_name)+'" value="'+(s.price_amount??'')+'"></div></div><label>服務介紹</label><textarea data-field="description" data-name="'+esc(s.service_name)+'">'+esc(s.description||'')+'</textarea><button type="button" class="secondary" data-save-service="'+esc(s.service_name)+'">儲存這項服務</button></div>').join('');document.querySelectorAll('[data-service]').forEach(el=>el.addEventListener('change',async()=>{el.disabled=true;try{await req('shiguang_service_settings?service_name=eq.'+encodeURIComponent(el.dataset.service),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({enabled:el.checked,updated_at:new Date().toISOString()})}).then(r=>{if(!r?.length)throw Error('沒有修改權限')});message('已更新服務開關');el.parentElement.querySelector('.muted').textContent=el.checked?'開放':'暫停'}catch(e){el.checked=!el.checked;message('設定失敗：'+e.message)}finally{el.disabled=false}}));document.querySelectorAll('[data-save-service]').forEach(b=>b.addEventListener('click',async()=>{const name=b.dataset.saveService;const fields=[...document.querySelectorAll('[data-field]')].filter(x=>x.dataset.name===name);const data={};fields.forEach(x=>data[x.dataset.field]=x.dataset.field==='price_amount'?Number(x.value):x.value.trim());b.disabled=true;try{const out=await req('shiguang_service_settings?service_name=eq.'+encodeURIComponent(name),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({...data,updated_at:new Date().toISOString()})});if(!out?.length)throw Error('未能儲存');message('服務內容已儲存')}catch(e){message('儲存失敗：'+e.message)}finally{b.disabled=false}}));travelers=await req('travelers?select=id,name&order=name.asc');const selected=$('travelerId').value;$('travelerId').innerHTML='<option value="">不連結旅人／手動輸入</option>'+travelers.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('');$('travelerId').value=selected;$('travelerId').onchange=()=>{const t=travelers.find(t=>t.id===$('travelerId').value);if(t)$('traveler').value=t.name};rows=await req('light_healing_records?select=*&order=session_date.desc,created_at.desc');$('records').innerHTML=rows.length?rows.map(r=>'<div class="record"><b>'+esc(r.traveler_name)+'</b>　'+esc(r.session_date)+'　<span class="muted">第 '+r.session_number+' 次</span><p class="muted">'+esc((r.oils||[]).map(o=>o.name).filter(Boolean).join('・')||'尚未填寫精油')+'</p><button class="secondary" data-edit="'+r.id+'">查看／編輯</button></div>').join(''):'<p>目前還沒有光之療癒紀錄。</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>edit(b.dataset.edit)))}
function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;$('rid').value=r.id;$('travelerId').value=r.traveler_id||'';$('traveler').value=r.traveler_name;$('date').value=r.session_date;$('count').value=r.session_number;$('overall').value=r.overall_message||'';$('feedback').value=r.traveler_feedback||'';$('note').value=r.private_note||'';$('oils').innerHTML=[1,2,3].map(i=>oilForm(i,(r.oils||[])[i-1]||{})).join('');$('chakras').innerHTML=chakraForm(r.chakras||{});showTab('new');$('formTitle').textContent='編輯光之療癒紀錄';$('recordForm').scrollIntoView({behavior:'smooth'})}
$('recordForm').addEventListener('submit',async e=>{e.preventDefault();const oils=[1,2,3].map(i=>({name:$('oil'+i).value.trim(),body:$('body'+i).value.trim(),emotion:$('emotion'+i).value.trim(),spirit:$('spirit'+i).value.trim(),keyword:$('keyword'+i).value.trim(),chakra:$('oilChakra'+i)?.value||''}));const chakras={};document.querySelectorAll('[data-chakra]').forEach(x=>chakras[x.dataset.chakra]=x.value.trim());const data={traveler_id:$('travelerId').value||null,chakras,traveler_name:$('traveler').value.trim(),session_date:$('date').value,session_number:Number($('count').value)||1,oils,overall_message:$('overall').value,traveler_feedback:$('feedback').value,private_note:$('note').value,updated_at:new Date().toISOString()};if(!data.traveler_name)return;const id=$('rid').value;$('save').disabled=true;try{const out=await req('light_healing_records'+(id?'?id=eq.'+id:''),{method:id?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(data)});if(!out?.length)throw Error('沒有儲存成功');message('紀錄已儲存');resetForm();await load();if(new URLSearchParams(location.search).has('traveler'))location.href='./#/traveler/'+encodeURIComponent(new URLSearchParams(location.search).get('traveler'));else showTab('history')}catch(err){message('儲存失敗：'+err.message)}finally{$('save').disabled=false}});
async function init(){try{session=JSON.parse(localStorage.getItem('sgadm')||'null');if(!session?.access_token)throw Error('請先登入');if(session.expires_at&&Date.now()>session.expires_at*1000-60000&&session.refresh_token){const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)throw Error('登入已過期');session=await r.json();localStorage.setItem('sgadm',JSON.stringify(session))}await req('shiguang_service_settings?select=service_name&limit=1');$('auth').classList.add('hide');$('work').classList.remove('hide');resetForm();await load();const p=new URLSearchParams(location.search);if(p.has('traveler')){$('travelerId').value=p.get('traveler');$('travelerId').dispatchEvent(new Event('change'));showTab('new')}else if(p.has('record')){edit(p.get('record'))}else if(p.has('record-list')){showTab('history')}else {location.replace('./light-healing.html');return}}catch(e){$('auth').classList.remove('hide');$('work').classList.add('hide');$('auth').querySelector('p').textContent='請先登入原本管理後台。若已登入仍無法使用，請確認管理員權限。 '+e.message}}init();
</script>
<style>.oil-picker{background:#fff;border:1px solid #eadbd6;border-radius:12px;padding:10px;margin:8px 0}.oil-picker select{background:#fffaf8}.oil-tag{display:inline-block;background:#f6e9ef;border-radius:30px;padding:5px 11px;font-size:12px;margin:5px 0;color:#805e72}.oil-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.oil-actions button{font-size:13px;padding:9px 12px}</style>
<script>
