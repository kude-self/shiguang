<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光所｜光之療癒與服務管理</title><style>
:root{--ink:#554b47;--rose:#b9857d;--line:#e8ddd5}*{box-sizing:border-box}body{margin:0;background:#fbf7f2;color:var(--ink);font-family:-apple-system,"Noto Sans TC",sans-serif}main{max-width:850px;margin:auto;padding:25px 16px 80px}h1{font-size:26px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.tabs button{background:#f1e9e3;color:#74635d;padding:12px 5px;font-size:13px}.tabs button.active{background:#b9857d;color:white}.panel{display:none}.panel.active{display:block}.chakra{padding:13px;margin:9px 0;background:#faf7f3;border:1px solid var(--line);border-radius:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:540px){.two{grid-template-columns:1fr}}h2{font-size:19px;margin:0 0 14px}p{line-height:1.8;color:#867a74}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #967b6a10}a{color:var(--rose)}label{display:block;font-weight:650;margin:12px 0 6px;font-size:14px}input,textarea,select{width:100%;border:1px solid #dfd4cd;border-radius:12px;padding:11px;font-size:16px;background:#fff;color:var(--ink)}textarea{min-height:75px;resize:vertical}button{border:0;border-radius:12px;padding:11px 18px;background:var(--rose);color:white;font-weight:700;cursor:pointer}button.secondary{background:#f2e9e4;color:var(--ink)}button:disabled{opacity:.5}.service{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.service:last-child{border:0}.switch{width:25px;height:25px;accent-color:#829d81}.oil{background:#fcf8f4;border:1px solid var(--line);border-radius:16px;padding:14px;margin:13px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{font-size:13px;color:#988981}.record{padding:15px;border:1px solid var(--line);border-radius:15px;margin:12px 0}#msg{position:sticky;top:8px;background:#edf4eb;border-radius:12px;padding:12px;display:none;z-index:3}.hide{display:none}</style></head><body><main><a href="./#/dashboard">← 返回旅程紀錄本</a><h1>𓂃 拾光所｜服務設定</h1><p>在這裡決定哪些服務開放預約，並調整服務時間、費用與介紹。光之療癒紀錄請從旅人紀錄進入。</p><div id="msg"></div><section class="card" id="auth"><h2>管理員驗證</h2><p>請先從原本的管理後台登入，再回到此頁。</p><a href="./#/dashboard">前往管理後台</a></section><div id="work" class="hide"><nav class="tabs" style="display:none"><button type="button" class="active" data-tab="settings">服務設定</button><button type="button" data-tab="new">療癒紀錄</button><button type="button" data-tab="history">歷次紀錄</button></nav><div id="settings" class="panel active"><section class="card"><h2>預約服務開關</h2><p class="muted">關閉的服務不會出現在公開預約頁；原本的紀錄不會刪除。</p><div id="switches"></div><p class="muted">光之療癒的個別紀錄請到「旅人清單 → 旅人詳情」新增或編輯。</p><a href="./#/travelers">前往旅人清單</a></section></div></div></main><script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';let session;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,options={}){const r=await fetch(U+'/rest/v1/'+path,{...options,headers:{apikey:K,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error((await r.text()).slice(0,200));return r.status===204?null:await r.json()}
function message(s){$('msg').textContent=s;$('msg').style.display='block';setTimeout(()=>$('msg').style.display='none',4000)}
async function load(){const settings=await req('shiguang_service_settings?select=service_name,enabled,duration_label,price_amount,description&order=service_name');$('switches').innerHTML=settings.map(s=>'<div class="service" style="display:block"><div class="row" style="justify-content:space-between"><b>'+esc(s.service_name)+'</b><label style="margin:0"><input class="switch" type="checkbox" data-service="'+esc(s.service_name)+'" '+(s.enabled?'checked':'')+'><span class="muted">'+(s.enabled?'開放':'暫停')+'</span></label></div><div class="two"><div><label>服務時間</label><input data-field="duration_label" data-name="'+esc(s.service_name)+'" value="'+esc(s.duration_label||'')+'"></div><div><label>費用（NT$）</label><input type="number" min="0" data-field="price_amount" data-name="'+esc(s.service_name)+'" value="'+(s.price_amount??'')+'"></div></div><label>服務介紹</label><textarea data-field="description" data-name="'+esc(s.service_name)+'">'+esc(s.description||'')+'</textarea><button type="button" class="secondary" data-save-service="'+esc(s.service_name)+'">儲存這項服務</button></div>').join('');
document.querySelectorAll('[data-service]').forEach(el=>el.addEventListener('change',async()=>{el.disabled=true;try{const r=await req('shiguang_service_settings?service_name=eq.'+encodeURIComponent(el.dataset.service),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({enabled:el.checked,updated_at:new Date().toISOString()})});if(!r?.length)throw Error('沒有修改權限');el.parentElement.querySelector('.muted').textContent=el.checked?'開放':'暫停';message('已更新服務開關')}catch(e){el.checked=!el.checked;message('設定失敗：'+e.message)}finally{el.disabled=false}}));
document.querySelectorAll('[data-save-service]').forEach(b=>b.addEventListener('click',async()=>{const name=b.dataset.saveService,data={};document.querySelectorAll('[data-field]').forEach(x=>{if(x.dataset.name===name)data[x.dataset.field]=x.dataset.field==='price_amount'?Number(x.value):x.value.trim()});b.disabled=true;try{const r=await req('shiguang_service_settings?service_name=eq.'+encodeURIComponent(name),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({...data,updated_at:new Date().toISOString()})});if(!r?.length)throw Error('儲存失敗');message('服務資料已儲存')}catch(e){message(e.message)}finally{b.disabled=false}}))}
async function init(){try{session=JSON.parse(localStorage.getItem('sgadm')||'null');if(!session?.access_token)throw Error('請先登入');if(session.expires_at&&Date.now()>session.expires_at*1000-60000&&session.refresh_token){const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)throw Error('登入已過期');session=await r.json();localStorage.setItem('sgadm',JSON.stringify(session))}await load();$('auth').classList.add('hide');$('work').classList.remove('hide')}catch(e){$('auth').querySelector('p').textContent='請先登入管理後台，或確認管理權限：'+e.message}}init();
</script></body></html>
