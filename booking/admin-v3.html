<style>

card .btn{width:100%;margin-top:16px}.header{position:sticky;top:0;z-index:20;background:rgba(251,248,244,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head,.nav,.wrap{max-width:1080px;margin:auto}.head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head-left{display:flex;align-items:center;gap:9px;min-width:0}.mini{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--rose2),var(--sage2))}.who{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav{display:flex;gap:7px;padding:4px 16px 10px;overflow:auto}.nav button{border:0;background:transparent;color:var(--soft);padding:10px 14px;border-radius:999px;font-weight:650;white-space:nowrap}.nav button.active{background:#fff;box-shadow:0 4px 14px rgba(91,72,59,.06)}.badge-count{display:inline-flex;min-width:18px;height:18px;align-items:center;justify-content:center;border-radius:99px;background:var(--rose);color:#fff;font-size:10px}.wrap{padding:20px 16px calc(72px + env(safe-area-inset-bottom))}.toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.kicker{font-size:12px;color:var(--rose);font-weight:700}.toolbar h2{margin:3px 0 0;font-size:26px}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:17px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;right:-18px;top:-18px;opacity:.55}.metric:nth-child(1):after,.metric:nth-child(3):after{background:var(--rose2)}.metric:nth-child(2):after{background:var(--blue2)}.metric:nth-child(4):after{background:var(--sage2)}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:30px;margin-top:7px}.panel{padding:17px;margin-top:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.list{display:grid;gap:10px}.booking{background:#fff;border:1px solid var(--line);border-radius:21px;padding:15px}.booking-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.person{font-size:17px;font-weight:800}.tag{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700;margin-left:5px}.initial,.new{background:var(--rose2);color:#8D625A}.light,.done{background:var(--sage2);color:#617461}.walk,.contacted{background:var(--blue2);color:#5B7481}.cancelled{background:#F0EEEC;color:#777}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.info{background:#FBFAF8;border-radius:15px;padding:10px 11px}.info small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.info b{font-size:13px;word-break:break-word}.booking .actions{margin-top:12px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:12px}.calendar-card{padding:16px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cal-head h3{margin:0}.circle{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:82px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:7px;text-align:left;color:var(--ink)}.day.has{background:linear-gradient(180deg,#fff,var(--sage2))}.day .num{font-size:12px;font-weight:800}.day .count{font-size:10px;color:var(--muted);line-height:1.45;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(55,53,47,.34);display:none;place-items:center;padding:14px;z-index:50}.modal.show{display:grid}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#FBF8F4;border:1px solid var(--line);border-radius:28px}.modal-head,.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 17px;border-bottom:1px solid var(--line)}.modal-body{padding:17px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.quick-row .btn{min-width:0;padding:10px 7px;font-size:12px;white-space:normal}.hour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.hour{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 5px;font-weight:700;color:var(--soft)}.hour.on{background:var(--sage2);color:#617461;border-color:#C8D8C5}.hour.booked{text-decoration:line-through;background:#F1EFED;color:#999}.empty{text-align:center;color:var(--muted);padding:24px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;background:#554D47;color:#fff;padding:11px 15px;border-radius:99px;z-index:80;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1}
@media(max-width:720px){.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px 12px 11px;overflow:visible}.nav button{padding:10px 3px;font-size:12px}.wrap{padding:15px 12px 64px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:14px}.metric strong{font-size:26px}.filters{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr 1fr}.booking-top{display:block}.booking-top .tag{margin-top:5px}.booking .actions{display:grid;grid-template-columns:1fr 1fr}.booking .actions .btn{width:100%;font-size:13px;padding:10px 8px}.booking .actions .btn.danger{grid-column:1/-1}.day{min-height:60px;padding:5px}.calendar{gap:3px}.hour-grid{grid-template-columns:repeat(3,1fr)}.quick-row{grid-template-columns:1fr 1fr}.quick-row .btn:last-child{grid-column:1/-1}.modal{align-items:end;padding:8px}.modal-card{width:100%;max-height:88vh;border-radius:28px 28px 18px 18px}.modal-foot .btn{flex:1}.head{padding:11px 12px}.head b{font-size:14px}.who{max-width:170px}}
</style></head>

<div id="loginView" class="login"><div class="login-card"><div class="mark">𓇼</div><div class="brand">拾 光 所</div><h1>預約管理</h1><p class="sub">第一次登入後，之後會盡量保持登入狀態。</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub"></div></div></div>
<div id="app" class="hidden"><header class="header"><div class="head"><div class="head-left"><div class="mini">𓇼</div><div><b>拾光所｜預約管理</b><div id="who" class="who"></div></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約 <span id="newBadge" class="badge-count hidden">0</span></button><button data-page="calendar">開放月曆</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section></main></div>
<div id="slotModal" class="modal"><div class="modal-card"><div class="modal-head"><b id="slotTitle">設定時段</b><button class="btn" onclick="closeSlots()">關閉</button></div><div class="modal-body"><div class="sub">10:00～20:00，每小時一個時段。已被預約的時段會鎖定。</div><div class="quick-row"><button class="btn sage" onclick="selectAllHours()">全選整日時段</button><button class="btn soft" onclick="clearHours()">全部清空</button><button class="btn blue" onclick="copyPreviousWeek()">複製上週同一天</button></div><div id="hours" class="hour-grid"></div></div><div class="modal-foot"><button class="btn primary" onclick="saveSlots()">儲存時段</button></div></div></div>
<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><b>旅人預約資料</b><button class="btn" onclick="closeEdit()">關閉</button></div><div id="editBody" class="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeEdit()">取消</button><button class="btn primary" onclick="saveEdit()">儲存</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',STORE='sg_booking_admin_v5',OLD=['sg_booking_admin_v4','sg_booking_admin_stable_v3','sg_booking_admin_stable_v2'];const HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`);let session=null;const state={page:'dashboard',bookings:[],availability:[],month:new Date().toISOString().slice(0,7),slotDate:'',selected:new Set(),editing:null};const $=id=>document.getElementById(id),time5=t=>String(t||'').slice(0,5),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>$('toast').classList.remove('show'),1900)}function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}function admin(t){return jwt(t)?.app_metadata?.role==='admin'}function saveSession(s){session=s;localStorage.setItem(STORE,JSON.stringify(s))}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function refresh(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!admin(d.access_token))return false;saveSession(d);return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refresh())return api(path,opt,false);return r}async function login(){const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok||!admin(d.access_token)){$('loginMsg').textContent='登入失敗，請確認帳號密碼';return}saveSession(d);enter()}async function enter(){if(!session)return;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=jwt(session.access_token).email||'管理者';await loadAll()}function logout(){[STORE,...OLD].forEach(k=>localStorage.removeItem(k));location.reload()}async function boot(){try{for(const k of [STORE,...OLD]){const raw=localStorage.getItem(k);if(!raw)continue;const s=JSON.parse(raw);if(s?.refresh_token){session=s;if(await refresh()){await enter();return}}if(s?.access_token&&admin(s.access_token)){saveSession(s);await enter();return}}}catch(e){} }
async function loadAll(){const [b,a]=await Promise.all([api('traveler_bookings?select=*&order=booking_date.asc,booking_time.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc')]);if(!b.ok||!a.ok)return toast('資料讀取失敗');state.bookings=await b.json();state.availability=await a.json();render()}
function journeyClass(j){return j==='初遇'?'initial':j==='拾光'?'light':'walk'}function contactLabel(b){return `${b.contact_method==='LINE'?'LINE':'Instagram'}・${b.instagram||''}`}function contactStatus(b){return b.contact_status==='contacted'?'已聯絡':b.contact_status==='completed'?'已完成':'新預約'}function statusClass(b){return b.contact_status==='contacted'?'contacted':b.contact_status==='completed'?'done':'new'}function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));['dashboard','bookings','calendarPage'].forEach(id=>$(id).classList.add('hidden'));$(p==='calendar'?'calendarPage':p).classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});render()}function render(){renderDash();renderBookings();renderCalendar();const n=state.bookings.filter(b=>b.status==='confirmed'&&(b.contact_status||'new')==='new').length;$('newBadge').textContent=n;$('newBadge').classList.toggle('hidden',!n)}
function renderDash(){const active=state.bookings.filter(b=>b.status==='confirmed'),now=today(),up=active.filter(b=>b.booking_date>=now).slice(0,5);$('dashboard').innerHTML=`<div class="toolbar"><div><div class="kicker">今天的拾光所</div><h2>總覽</h2></div><div class="actions"><button class="btn primary" onclick="showPage('calendar')">開放時段</button><button class="btn" onclick="loadAll()">重新整理</button></div></div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${active.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${active.filter(b=>b.booking_date.startsWith(now.slice(0,7))).length}</strong></div><div class="card metric"><span>新預約</span><strong>${active.filter(b=>(b.contact_status||'new')==='new').length}</strong></div><div class="card metric"><span>可預約時段</span><strong>${state.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div><div class="card panel"><div class="panel-head"><b>接下來的預約</b><button class="btn" onclick="showPage('bookings')">全部旅人</button></div><div class="list">${up.length?up.map(miniBooking).join(''):'<div class="empty">目前沒有接下來的預約 ♡</div>'}</div></div>`}function miniBooking(b){return `<div class="booking"><div class="booking-top"><div><span class="person">${esc(b.traveler_name)}</span><span class="tag ${journeyClass(b.journey)}">${esc(b.journey)}</span></div><span class="tag ${statusClass(b)}">${contactStatus(b)}</span></div><div class="info-grid"><div class="info"><small>日期時間</small><b>${b.booking_date}・${time5(b.booking_time)}</b></div><div class="info"><small>聯繫帳號</small><b>${esc(contactLabel(b))}</b></div></div></div>`}
function renderBookings(){$('bookings').innerHTML=`<div class="toolbar"><div><div class="kicker">每一次相遇</div><h2>旅人預約</h2></div></div><div class="filters"><input id="q" placeholder="搜尋名字、LINE／IG" oninput="filterBookings()"><select id="fj" onchange="filterBookings()"><option value="">全部旅程</option><option>初遇</option><option>拾光</option><option>同行</option></select><select id="fc" onchange="filterBookings()"><option value="">全部聯絡狀態</option><option value="new">新預約</option><option value="contacted">已聯絡</option><option value="completed">已完成</option></select><select id="fs" onchange="filterBookings()"><option value="confirmed">有效預約</option><option value="cancelled">已取消</option><option value="">全部</option></select></div><div id="bookingList" class="list"></div>`;filterBookings()}function filterBookings(){const q=($('q')?.value||'').toLowerCase(),j=$('fj')?.value||'',c=$('fc')?.value||'',s=$('fs')?.value??'confirmed';const arr=state.bookings.filter(b=>(!q||`${b.traveler_name} ${b.instagram} ${b.contact_method}`.toLowerCase().includes(q))&&(!j||b.journey===j)&&(!c||(b.contact_status||'new')===c)&&(!s||b.status===s));$('bookingList').innerHTML=arr.length?arr.map(fullBooking).join(''):'<div class="card empty">沒有符合的旅人預約。</div>'}function fullBooking(b){const quick=b.status==='confirmed'?(b.contact_status==='completed'?'':b.contact_status==='contacted'?`<button class="btn sage" onclick="quickStatus('${b.id}','completed')">標記已完成</button>`:`<button class="btn blue" onclick="quickStatus('${b.id}','contacted')">標記已聯絡</button>`):'';return `<div class="booking"><div class="booking-top"><div><span class="person">${esc(b.traveler_name)}</span><span class="tag ${journeyClass(b.journey)}">${esc(b.journey)}</span>${b.status==='cancelled'?'<span class="tag cancelled">已取消</span>':''}</div><span class="tag ${statusClass(b)}">${contactStatus(b)}</span></div><div class="info-grid"><div class="info"><small>日期時間</small><b>${b.booking_date}・${time5(b.booking_time)}</b></div><div class="info"><small>聯繫帳號</small><b>${esc(contactLabel(b))}</b></div><div class="info"><small>生日</small><b>${b.birthday||'—'}</b></div><div class="info"><small>性別</small><b>${esc(b.gender||'—')}</b></div></div>${b.admin_note?`<div class="sub" style="margin-top:9px">備註：${esc(b.admin_note)}</div>`:''}${b.status==='confirmed'?`<div class="actions"><button class="btn soft" onclick="copyContact('${b.id}')">複製帳號</button>${quick}<button class="btn sage" onclick="openEdit('${b.id}')">查看／編輯</button><button class="btn" onclick="downloadIcs('${b.id}')">行事曆</button><button class="btn danger" onclick="cancelBooking('${b.id}')">取消預約</button></div>`:''}</div>`}
async function copyContact(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;const text=b.instagram||'';try{await navigator.clipboard.writeText(text);toast(`已複製 ${b.contact_method==='LINE'?'LINE ID':'IG 帳號'}`)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('帳號已複製')}}async function quickStatus(id,status){const r=await api(`traveler_bookings?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact_status:status})});if(!r.ok)return toast('更新失敗');await loadAll();toast(status==='contacted'?'已標記為已聯絡':'已標記為已完成')}
function renderCalendar(){const [y,m]=state.month.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let cells='';for(let i=0;i<start;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const d=`${state.month}-${String(n).padStart(2,'0')}`,slots=state.availability.filter(a=>a.booking_date===d),open=slots.filter(a=>a.is_open).length,booked=state.bookings.filter(b=>b.status==='confirmed'&&b.booking_date===d).length;cells+=`<button class="day ${slots.length?'has':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length||booked?`<div class="count">${open} 可約<br>${booked} 已約</div>`:''}</button>`}$('calendarPage').innerHTML=`<div class="toolbar"><div><div class="kicker">安排可預約時間</div><h2>開放月曆</h2></div></div><div class="card calendar-card"><div class="cal-head"><button class="circle" onclick="shiftMonth(-1)">‹</button><h3>${y} 年 ${m} 月</h3><button class="circle" onclick="shiftMonth(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}function shiftMonth(n){const [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+n,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}function openSlots(d){state.slotDate=d;state.selected=new Set(state.availability.filter(a=>a.booking_date===d&&a.is_open).map(a=>time5(a.booking_time)));$('slotTitle').textContent=`${d}｜設定時段`;renderHours();$('slotModal').classList.add('show')}function closeSlots(){$('slotModal').classList.remove('show')}function bookedSet(){return new Set(state.bookings.filter(b=>b.status==='confirmed'&&b.booking_date===state.slotDate).map(b=>time5(b.booking_time)))}function renderHours(){const booked=bookedSet();$('hours').innerHTML=HOURS.map(t=>`<button class="hour ${state.selected.has(t)?'on':''} ${booked.has(t)?'booked':''}" ${booked.has(t)?'disabled':''} onclick="toggleHour('${t}')">${t}</button>`).join('')}function toggleHour(t){state.selected.has(t)?state.selected.delete(t):state.selected.add(t);renderHours()}function selectAllHours(){const booked=bookedSet();state.selected=new Set(HOURS.filter(t=>!booked.has(t)));renderHours();toast('已選取所有可調整時段')}function clearHours(){state.selected.clear();renderHours();toast('已清空未預約時段')}function dateOffset(s,days){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function copyPreviousWeek(){const prev=dateOffset(state.slotDate,-7),booked=bookedSet(),prevOpen=state.availability.filter(a=>a.booking_date===prev&&a.is_open).map(a=>time5(a.booking_time));if(!prevOpen.length){toast('上週同一天沒有開放時段');return}state.selected=new Set(prevOpen.filter(t=>HOURS.includes(t)&&!booked.has(t)));renderHours();toast(`已帶入 ${prev} 的開放時段`)}async function saveSlots(){const d=state.slotDate,booked=bookedSet(),rows=HOURS.map(t=>({booking_date:d,booking_time:t+':00',is_open:state.selected.has(t)&&!booked.has(t)}));const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok)return toast('儲存失敗');await loadAll();closeSlots();toast('時段已更新')}
function openEdit(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;state.editing=b;$('editBody').innerHTML=`<div class="field"><label>名字／暱稱</label><input value="${esc(b.traveler_name)}" disabled></div><div class="field"><label>聯繫帳號</label><div style="display:grid;grid-template-columns:120px 1fr;gap:8px"><select id="em"><option value="IG" ${b.contact_method==='IG'?'selected':''}>Instagram</option><option value="LINE" ${b.contact_method==='LINE'?'selected':''}>LINE</option></select><input id="ev" value="${esc(b.instagram||'')}"></div></div><div class="field"><label>生日</label><input id="eb" type="date" value="${b.birthday||''}"></div><div class="field"><label>性別</label><select id="eg"><option value="女" ${b.gender==='女'?'selected':''}>女</option><option value="男" ${b.gender==='男'?'selected':''}>男</option></select></div><div class="field"><label>旅程</label><select id="ej">${['初遇','拾光','同行'].map(j=>`<option ${b.journey===j?'selected':''}>${j}</option>`).join('')}</select></div><div class="field"><label>日期</label><input id="ed" type="date" value="${b.booking_date}"></div><div class="field"><label>時段</label><select id="et">${HOURS.map(t=>`<option ${time5(b.booking_time)===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>聯絡狀態</label><select id="ec"><option value="new" ${(b.contact_status||'new')==='new'?'selected':''}>新預約</option><option value="contacted" ${b.contact_status==='contacted'?'selected':''}>已聯絡</option><option value="completed" ${b.contact_status==='completed'?'selected':''}>已完成</option></select></div><div class="field"><label>管理備註</label><textarea id="en">${esc(b.admin_note||'')}</textarea></div>`;$('editModal').classList.add('show')}function closeEdit(){$('editModal').classList.remove('show')}async function saveEdit(){const b=state.editing;if(!b)return;const body={contact_method:$('em').value,instagram:$('ev').value.trim(),birthday:$('eb').value,gender:$('eg').value,journey:$('ej').value,booking_date:$('ed').value,booking_time:$('et').value+':00',contact_status:$('ec').value,admin_note:$('en').value.trim()||null};const r=await api(`traveler_bookings?id=eq.${b.id}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok)return toast('儲存失敗');closeEdit();await loadAll();toast('旅人資料已更新')}async function cancelBooking(id){if(!confirm('確定取消這筆預約嗎？'))return;const r=await api(`traveler_bookings?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled'})});if(!r.ok)return toast('取消失敗');await loadAll();toast('預約已取消')}function downloadIcs(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;const start=`${b.booking_date.replaceAll('-','')}T${time5(b.booking_time).replace(':','')}00`,endHour=String(Number(time5(b.booking_time).slice(0,2))+1).padStart(2,'0'),end=`${b.booking_date.replaceAll('-','')}T${endHour}0000`,txt=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${start}\nDTEND:${end}\nSUMMARY:拾光所｜${b.journey}｜${b.traveler_name}\nDESCRIPTION:${contactLabel(b)}\nEND:VEVENT\nEND:VCALENDAR`,blob=new Blob([txt],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`拾光所-${b.booking_date}-${b.traveler_name}.ics`;a.click();URL.revokeObjectURL(a.href)}
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=logout;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('slotModal').onclick=e=>{if(e.target===$('slotModal'))closeSlots()};$('editModal').onclick=e=>{if(e.target===$('editModal'))closeEdit()};boot();
</script></body></html>
