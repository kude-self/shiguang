<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f3"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>拾光所｜預約管理</title><style>:root{--bg:#fff9f4;--paper:#fffdf9;--ink:#5b514a;--soft:#9b8f86;--line:#e8d8cc;--rose:#d7a7a0;--rose2:#f7e4e1;--sage:#9caf98;--sage2:#e7efe3;--blue:#e5edf3;--butter:#f6ebc9;--shadow:0 12px 28px rgba(112,86,68,.08)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#f8e6e2 0,transparent 26%),radial-gradient(circle at 100% 13%,#e8f0e4 0,transparent 28%),linear-gradient(180deg,#fffdf9,#fff8f2);color:var(--ink);font-family:"DFKai-SB","Kaiti TC","STKaiti","Yuanti TC","PingFang TC",ui-rounded,sans-serif;letter-spacing:.02em}button,input,select{font:inherit}.hidden{display:none!important}.btn{border:2px solid #e7d6ca;background:#fffaf6;color:var(--ink);padding:12px 16px;border-radius:22px;font-weight:700;min-height:48px;box-shadow:0 5px 0 #f0e4da}.btn.primary{background:#6d665d;color:#fff;border-color:#6d665d}.btn.soft{background:#faf0e8}.btn.danger{background:#fff2f0;color:#a16660}.btn:disabled{opacity:.45}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.login-card{position:relative;background:rgba(255,253,249,.98);border:2px solid #e7d7cb;border-radius:30px;box-shadow:var(--shadow)}.login-card{width:min(430px,100%);padding:31px 27px}.brand{font-weight:800;letter-spacing:.12em}.login-card h1{font-size:32px;margin:10px 0 8px}.sub{font-size:14px;color:var(--soft);line-height:1.75}.field{display:grid;gap:7px;margin-top:15px}.field label{font-size:13px;font-weight:800}input,select{width:100%;border:2px solid #e7d7cb;background:#fffaf6;border-radius:20px;padding:13px 15px;font-size:16px;outline:none;color:var(--ink)}.login-card .btn{width:100%;margin-top:17px}.header{position:sticky;top:0;z-index:20;background:rgba(255,250,246,.96);backdrop-filter:blur(18px);border-bottom:2px dashed #ead8cc}.head,.nav,.wrap{max-width:1060px;margin:auto}.head{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head-title{font-size:20px;font-weight:800}.who{font-size:12px;color:var(--soft);margin-top:4px}.nav{display:flex;gap:9px;padding:5px 16px 14px;overflow:auto}.nav button{border:2px solid transparent;background:transparent;padding:11px 18px;border-radius:20px;color:#6d625b;white-space:nowrap;font-weight:700}.nav button.active{background:#f7ebe4;border-color:#e9d4c8;box-shadow:0 4px 0 #eee0d7}.wrap{padding:25px 16px 78px}.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.toolbar h2{font-size:34px;margin:0;font-weight:800}.actions{display:flex;gap:9px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:21px;min-height:132px}.metric span{font-size:14px;color:#9b8f86}.metric strong{display:block;font-size:42px;margin-top:12px}.panel{padding:20px;margin-top:16px}.panel h3{margin:0 0 15px}.list{display:grid;gap:13px}.booking{border:2px solid #eadbd0;background:#fffefa;border-radius:28px;padding:18px}.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:21px;font-weight:800}.tag{display:inline-flex;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;margin-left:6px}.initial,.pendingtag{background:var(--rose2)}.light,.confirmedtag{background:var(--sage2)}.walk{background:var(--blue)}.cancelledtag{background:#f0edeb}.info{font-size:14px;color:#706760;line-height:1.85;margin-top:11px}.booking .actions{margin-top:13px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-bottom:13px}.calendar-card{padding:22px 18px 26px;background:rgba(255,253,249,.9);border:1.5px solid #eee3da;border-radius:32px;box-shadow:0 14px 32px rgba(112,86,68,.06)}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.cal-head b{font-size:22px;letter-spacing:.08em}.circle{width:42px;height:42px;border:0;border-radius:50%;background:#faf1ea;font-size:22px;color:#756960;box-shadow:none}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:4px;row-gap:8px}.dow{text-align:center;font-size:12px;color:#aaa097;padding:7px 0 11px;font-weight:700}.day{position:relative;min-height:68px;border:0;background:transparent;border-radius:22px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#655c55;transition:.15s}.day:active{transform:scale(.94);background:#faf3ed}.day.has{background:#eef3ea}.day.has:nth-of-type(3n){background:#f8ece9}.day.has:nth-of-type(4n){background:#edf2f5}.num{font-size:17px;font-weight:800;line-height:1}.count{font-size:9px;color:#8e857e;line-height:1.35;margin-top:7px;white-space:nowrap}.modal{position:fixed;inset:0;background:rgba(66,57,50,.34);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.show{display:flex}.modal-card{width:min(620px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:#fffaf5;border:2px solid #e2cfc2;border-radius:30px}.modal-head,.modal-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:16px 18px}.modal-body{padding:18px}.modal-foot{justify-content:flex-end}.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.hour{border:2px solid #e7d6ca;background:#fffaf6;border-radius:22px;padding:12px 5px;font-weight:800}.hour.on{background:var(--sage2)}.hour.booked{background:#f1efed;color:#aaa;text-decoration:line-through}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;background:#5a514b;color:#fff;padding:12px 16px;border-radius:999px;z-index:80}.toast.show{opacity:1}@media(max-width:760px){.wrap{padding:20px 12px 68px}.head,.nav{padding-left:12px;padding-right:12px}.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.toolbar h2{font-size:31px}.calendar-card{padding:18px 10px 24px;border-radius:28px}.calendar{column-gap:2px;row-gap:6px}.day{min-height:58px;border-radius:18px}.num{font-size:16px}.count{font-size:8px;margin-top:5px}.booking .actions{display:grid;grid-template-columns:1fr 1fr}.booking .actions .danger{grid-column:1/-1}.modal{align-items:flex-end;padding:8px}.modal-card{width:100%;max-height:88dvh}.hours{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="loginView" class="login"><div class="login-card"><div class="brand">𓇼 拾光所</div><h1>預約管理</h1><p class="sub">查看待確認與已確認預約、確認／取消安排與開放時段。</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub"></div></div></div><div id="appView" class="hidden"><header class="header"><div class="head"><div><div class="head-title">𓇼 拾光所｜預約管理</div><div id="who" class="who"></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約</button><button data-page="calendar">開放月曆</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section></main></div><div id="slotModal" class="modal"><div class="modal-card"><div class="modal-head"><b id="slotTitle">設定時段</b><button class="btn" onclick="closeSlots()">關閉</button></div><div class="modal-body"><div class="sub">10:00～20:00，每小時一個時段。已有待確認／已確認預約的時段會鎖定。</div><div id="hours" class="hours"></div></div><div class="modal-foot"><button class="btn primary" onclick="saveSlots()">儲存時段</button></div></div></div><div id="toast" class="toast"></div><script>const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',BOOKING_URL='https://kude-self.github.io/shiguang/booking/',STORE='sg_booking_admin_final_v2';const HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`);let session=null;const state={page:'dashboard',bookings:[],availability:[],month:new Date().toISOString().slice(0,7),slotDate:'',selected:new Set()};const $=id=>document.getElementById(id),time5=t=>String(t||'').slice(0,5),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},isActive=b=>['pending','confirmed'].includes(b.status);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function refresh(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refresh())return api(path,opt,false);return r}async function login(){const e=email.value.trim(),p=password.value;const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const d=await r.json();if(!r.ok||!isAdmin(d.access_token)){loginMsg.textContent='登入失敗';return}session=d;localStorage.setItem(STORE,JSON.stringify(d));await enter()}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadAll()}function logout(){localStorage.removeItem(STORE);location.reload()}async function boot(){const raw=localStorage.getItem(STORE);if(!raw)return;try{session=JSON.parse(raw);if(!(await refresh())&&!isAdmin(session?.access_token))throw 0;await enter()}catch{localStorage.removeItem(STORE)}}async function loadAll(){const [br,ar]=await Promise.all([api('traveler_bookings?select=*&order=booking_date.asc,booking_time.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc')]);if(!br.ok||!ar.ok)return;state.bookings=await br.json();state.availability=await ar.json();render()}function badge(j){return j==='初遇'?'initial':j==='拾光'?'light':'walk'}function statusTag(b){return b.status==='pending'?'<span class="tag pendingtag">待確認</span>':b.status==='confirmed'?'<span class="tag confirmedtag">已確認</span>':'<span class="tag cancelledtag">已取消</span>'}function bookingCard(b){return `<div class="booking"><div class="top"><div><span class="name">${esc(b.traveler_name)}</span><span class="tag ${badge(b.journey)}">${esc(b.journey)}</span></div>${statusTag(b)}</div><div class="info">${b.booking_date}・${time5(b.booking_time)}<br>${esc(b.contact_method||'IG')}：${esc(b.instagram||'—')}</div>${b.status!=='cancelled'?`<div class="actions">${b.status==='pending'?`<button class="btn primary" onclick="confirmBooking('${b.id}',this)">確認預約</button>`:''}<button class="btn soft" onclick="copyContact('${b.id}')">複製聯繫</button><button class="btn danger" onclick="cancelBooking('${b.id}',this)">取消預約</button></div>`:''}</div>`}function render(){renderDashboard();renderBookings();renderCalendar()}function renderDashboard(){const now=today(),active=state.bookings.filter(isActive),pending=active.filter(b=>b.status==='pending'),next=active.filter(b=>b.booking_date>=now).slice(0,8);dashboard.innerHTML=`<div class="toolbar"><div><h2>總覽</h2><div class="sub">${now.replaceAll('-','/')}｜近期安排</div></div><div class="actions"><button class="btn soft" onclick="copyLink()">複製旅人預約網址</button><button class="btn primary" onclick="showPage('calendar')">開放時段</button></div></div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${active.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${active.filter(b=>b.booking_date.startsWith(now.slice(0,7))).length}</strong></div><div class="card metric"><span>待確認</span><strong>${pending.length}</strong></div><div class="card metric"><span>可預約時段</span><strong>${state.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div><div class="card panel"><h3>近期預約</h3><div class="list">${next.length?next.map(bookingCard).join(''):'<div class="sub">目前沒有近期預約。</div>'}</div></div>`}function renderBookings(){bookings.innerHTML=`<div class="toolbar"><div><h2>旅人預約</h2></div></div><div id="bookingList" class="list">${state.bookings.map(bookingCard).join('')}</div>`}function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));dashboard.classList.toggle('hidden',p!=='dashboard');bookings.classList.toggle('hidden',p!=='bookings');calendarPage.classList.toggle('hidden',p!=='calendar');render()}async function copyLink(){try{await navigator.clipboard.writeText(BOOKING_URL);toast('預約網址已複製')}catch{}}async function copyContact(id){const b=state.bookings.find(x=>x.id===id);if(b)navigator.clipboard.writeText(b.instagram||'')}async function confirmBooking(id,btn){btn.disabled=true;const r=await fetch(`${U}/functions/v1/booking-confirm`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({booking_id:id})});if(r.ok){await loadAll();toast('已確認預約')}else{btn.disabled=false;toast('確認失敗')}}async function cancelBooking(id,btn){btn.disabled=true;const r=await fetch(`${U}/functions/v1/booking-cancel`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({booking_id:id})});if(r.ok){await loadAll();toast('已取消預約')}else{btn.disabled=false;toast('取消失敗')}}function renderCalendar(){const [y,m]=state.month.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let cells='';for(let i=0;i<start;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const d=`${state.month}-${String(n).padStart(2,'0')}`,slots=state.availability.filter(a=>a.booking_date===d),open=slots.filter(a=>a.is_open).length,booked=state.bookings.filter(b=>isActive(b)&&b.booking_date===d).length;cells+=`<button class="day ${slots.length?'has':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length||booked?`<div class="count">${open} 可約${booked?` · ${booked} 已約`:''}</div>`:''}</button>`}calendarPage.innerHTML=`<div class="toolbar"><div><h2>開放月曆</h2><div class="sub">點日期設定 10:00～20:00 時段。</div></div></div><div class="calendar-card"><div class="cal-head"><button class="circle" onclick="shiftMonth(-1)">‹</button><b>${y} 年 ${m} 月</b><button class="circle" onclick="shiftMonth(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}function shiftMonth(n){const [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+n,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}function openSlots(d){state.slotDate=d;const booked=bookedSet();state.selected=new Set(state.availability.filter(a=>a.booking_date===d&&a.is_open).map(a=>time5(a.booking_time)).filter(t=>!booked.has(t)));slotTitle.textContent=`${d}｜設定時段`;renderHours();slotModal.classList.add('show')}function closeSlots(){slotModal.classList.remove('show')}function bookedSet(){return new Set(state.bookings.filter(b=>isActive(b)&&b.booking_date===state.slotDate).map(b=>time5(b.booking_time)))}function renderHours(){const booked=bookedSet();hours.innerHTML=HOURS.map(t=>`<button class="hour ${state.selected.has(t)?'on':''} ${booked.has(t)?'booked':''}" ${booked.has(t)?'disabled':''} onclick="toggleHour('${t}')">${t}</button>`).join('')}function toggleHour(t){state.selected.has(t)?state.selected.delete(t):state.selected.add(t);renderHours()}async function saveSlots(){const d=state.slotDate,booked=bookedSet(),rows=HOURS.map(t=>({booking_date:d,booking_time:t+':00',is_open:state.selected.has(t)&&!booked.has(t)}));const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(r.ok){closeSlots();await loadAll();toast('時段已更新')}else toast('儲存失敗')}loginBtn.onclick=login;logoutBtn.onclick=logout;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));slotModal.onclick=e=>{if(e.target===slotModal)closeSlots()};password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();</script></body></html>
