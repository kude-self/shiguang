<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f2"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>拾光所｜預約管理</title><style>:root{--bg:#fffaf5;--paper:#fffdf9;--ink:#554c46;--soft:#92877e;--line:#eadfd5;--cream:#f8efe7;--rose:#cf9b94;--rose2:#f7e7e4;--sage:#94aa92;--sage2:#e8f0e4;--blue:#e8f0f5;--butter:#f7edcf;--lav:#eee8f4;--shadow:0 12px 28px rgba(98,76,61,.08)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 4%,rgba(247,231,228,.9),transparent 24%),radial-gradient(circle at 92% 13%,rgba(232,240,228,.9),transparent 25%),linear-gradient(180deg,#fffdf9,#fff8f2 65%,#faf4ee);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Yuanti TC","Noto Sans TC",sans-serif;letter-spacing:.015em}button,input,select{font:inherit}.hidden{display:none!important}.btn{border:1.5px solid var(--line);background:#fffdf9;color:var(--ink);padding:12px 15px;border-radius:999px;font-weight:800;min-height:48px;box-shadow:0 5px 12px rgba(105,87,67,.04);transition:.16s ease}.btn:active{transform:scale(.98)}.btn.primary{background:linear-gradient(135deg,#6d685d,#514c43);color:#fff;border-color:transparent;box-shadow:0 7px 16px rgba(81,76,67,.15)}.btn.soft{background:linear-gradient(135deg,#fbf4ed,#f7efe7)}.btn.danger{background:#fff4f2;color:#a16760;border-color:#f0d9d5}.btn:disabled{opacity:.45}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.login-card{position:relative;overflow:hidden;background:rgba(255,253,249,.96);border:1.5px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}.card:before,.login-card:before{content:"✦";position:absolute;right:16px;top:12px;font-size:12px;color:#d8b8a0;opacity:.55}.login-card{width:min(430px,100%);padding:30px 26px}.brand{font-weight:900;letter-spacing:.08em;color:#665d56}.login-card h1{font-size:31px;margin:10px 0 8px;letter-spacing:.03em}.sub{font-size:13px;color:var(--soft);line-height:1.75}.field{display:grid;gap:7px;margin-top:15px}.field label{font-size:12px;font-weight:800;color:#7f736b}input,select{width:100%;border:1.5px solid var(--line);background:#fffefa;border-radius:18px;padding:13px 15px;font-size:16px;outline:none;color:var(--ink)}input:focus,select:focus{border-color:#d6aaa4;box-shadow:0 0 0 4px rgba(207,155,148,.11)}.login-card .btn{width:100%;margin-top:17px}.header{position:sticky;top:0;z-index:20;background:rgba(255,251,247,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(234,223,213,.9);box-shadow:0 5px 18px rgba(92,76,63,.035)}.head,.nav,.wrap{max-width:1060px;margin:auto}.head{padding:15px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head-title{font-size:19px;font-weight:900;letter-spacing:.035em}.head-title:before{content:"♡";display:inline-block;margin-right:7px;color:#c69790;font-size:15px}.who{font-size:12px;color:var(--soft);margin-top:4px}.nav{display:flex;gap:8px;padding:4px 16px 13px;overflow:auto}.nav button{border:1px solid transparent;background:transparent;padding:11px 17px;border-radius:999px;color:#6a615b;white-space:nowrap;font-weight:700}.nav button.active{background:linear-gradient(135deg,#f9e9e5,#f8f1ea);border-color:#eddcd2;font-weight:900;box-shadow:0 5px 12px rgba(126,95,75,.06)}.wrap{padding:24px 16px 76px}.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:17px}.toolbar h2{font-size:31px;margin:0;letter-spacing:.025em}.toolbar h2:after{content:" ♡";font-size:15px;color:#cea19a;vertical-align:middle}.actions{display:flex;gap:9px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:21px;min-height:128px}.metric:nth-child(1){background:linear-gradient(145deg,#fffdf9 62%,#f7e7e4)}.metric:nth-child(2){background:linear-gradient(145deg,#fffdf9 62%,#e8f0f5)}.metric:nth-child(3){background:linear-gradient(145deg,#fffdf9 62%,#e8f0e4)}.metric:nth-child(4){background:linear-gradient(145deg,#fffdf9 62%,#f7edcf)}.metric span{font-size:13px;color:#9d9188}.metric strong{display:block;font-family:"Chalkboard SE","Marker Felt",ui-rounded,"PingFang TC",sans-serif;font-size:38px;font-weight:500;margin-top:12px;color:#655c55;transform:rotate(-1deg);transform-origin:left center}.panel{padding:19px;margin-top:15px}.panel h3{margin:0 0 15px;font-size:20px}.list{display:grid;gap:12px}.booking{position:relative;overflow:hidden;border:1.5px solid #eadfd6;background:linear-gradient(145deg,#fffefa,#fffaf6);border-radius:25px;padding:17px 17px 18px;box-shadow:0 7px 17px rgba(96,75,61,.045)}.booking:after{content:"";position:absolute;width:86px;height:86px;border-radius:50%;right:-34px;bottom:-35px;background:rgba(232,240,228,.55);pointer-events:none}.booking.pending{background:linear-gradient(145deg,#fffefa,#fff6f3);border-color:#e9cfc9}.booking.pending:after{background:rgba(247,231,228,.8)}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:relative;z-index:1}.name{font-size:20px;font-weight:900}.tag{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;margin-left:6px;border:1px solid rgba(0,0,0,.025)}.initial{background:var(--rose2);color:#8d625d}.light{background:var(--sage2);color:#617860}.walk{background:var(--blue);color:#607785}.pendingtag{background:#fff0e8;color:#9a6b52}.confirmedtag{background:var(--sage2);color:#5b725b}.cancelledtag{background:#f0edeb;color:#777}.info{position:relative;z-index:1;font-size:14px;color:#706760;line-height:1.85;margin-top:11px}.booking .actions{position:relative;z-index:1;margin-top:13px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin-bottom:13px}.calendar-card{padding:17px;background:linear-gradient(145deg,#fffdf9,#fff9f4)}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.cal-head b{font-size:18px}.circle{width:43px;height:43px;border-radius:50%;border:1.5px solid var(--line);background:#fffdfa;font-size:20px;color:#6f655e;box-shadow:0 4px 10px rgba(91,72,59,.04)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;color:#a59a92;padding:5px}.day{min-height:82px;border:1.5px solid #ece2da;background:#fffefa;border-radius:18px;padding:8px;text-align:left;color:#665d56;transition:.16s ease}.day:active{transform:scale(.97)}.day.has{background:linear-gradient(155deg,#fffefa,#edf4ea);border-color:#dce7d8}.num{font-size:13px;font-weight:900}.count{font-size:10px;color:#8f857e;line-height:1.5;margin-top:7px}.modal{position:fixed;inset:0;background:rgba(66,57,50,.34);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.show{display:flex}.modal-card{width:min(620px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:#fffaf5;border:1.5px solid #eadfd5;border-radius:28px;box-shadow:0 22px 55px rgba(74,57,46,.17)}.modal-head,.modal-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:16px 18px}.modal-head{border-bottom:1px dashed var(--line)}.modal-body{padding:18px}.modal-foot{border-top:1px dashed var(--line);justify-content:flex-end}.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.hour{border:1.5px solid var(--line);background:#fffefa;border-radius:999px;padding:12px 5px;font-weight:800;color:#675d57}.hour.on{background:var(--sage2);color:#5e755d;border-color:#d5e3d1}.hour.booked{background:#f1efed;color:#aaa;text-decoration:line-through}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;background:#514b43;color:#fff;padding:12px 16px;border-radius:999px;z-index:80;max-width:calc(100vw - 30px);text-align:center;box-shadow:0 8px 20px rgba(50,43,37,.15)}.toast.show{opacity:1}@media(max-width:760px){.wrap{padding:19px 12px 68px}.head,.nav{padding-left:12px;padding-right:12px}.head-title{font-size:18px}.metrics{grid-template-columns:1fr 1fr;gap:10px}.filters{grid-template-columns:1fr}.toolbar h2{font-size:28px}.metric{padding:18px;min-height:120px}.metric strong{font-size:35px}.day{min-height:61px;padding:6px;border-radius:15px}.calendar{gap:4px}.count{font-size:9px}.booking{border-radius:23px;padding:16px}.booking .actions{display:grid;grid-template-columns:1fr 1fr}.booking .actions .btn{width:100%}.booking .actions .danger{grid-column:1/-1}.modal{align-items:flex-end;padding:8px}.modal-card{width:100%;max-height:88dvh;border-radius:28px 28px 20px 20px}.hours{grid-template-columns:repeat(2,1fr)}.nav button{padding:10px 15px}.btn{min-height:47px}.panel{border-radius:26px}}</style></head><body><div id="loginView" class="login"><div class="login-card"><div class="brand">𓇼 拾光所</div><h1>預約管理</h1><p class="sub">查看待確認與已確認預約、確認／取消安排與開放時段。</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub" style="margin-top:10px;color:#995f59"></div></div></div><div id="appView" class="hidden"><header class="header"><div class="head"><div><div class="head-title">𓇼 拾光所｜預約管理</div><div id="who" class="who"></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約</button><button data-page="calendar">開放月曆</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section></main></div><div id="slotModal" class="modal"><div class="modal-card"><div class="modal-head"><b id="slotTitle">設定時段</b><button class="btn" onclick="closeSlots()">關閉</button></div><div class="modal-body"><div class="sub">10:00～20:00，每小時一個時段。已有待確認／已確認預約的時段會鎖定。</div><div id="hours" class="hours"></div></div><div class="modal-foot"><button class="btn primary" onclick="saveSlots()">儲存時段</button></div></div></div><div id="toast" class="toast"></div><script>const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',BOOKING_URL='https://kude-self.github.io/shiguang/booking/',STORE='sg_booking_admin_final_v2';const HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`);let session=null;const state={page:'dashboard',bookings:[],availability:[],month:new Date().toISOString().slice(0,7),slotDate:'',selected:new Set()};const $=id=>document.getElementById(id),time5=t=>String(t||'').slice(0,5),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},isActive=b=>['pending','confirmed'].includes(b.status);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>$('toast').classList.remove('show'),2200)}function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function refresh(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refresh())return api(path,opt,false);return r}async function login(){loginMsg.textContent='';const e=email.value.trim(),p=password.value;if(!e||!p){loginMsg.textContent='請輸入帳號密碼';return}loginBtn.disabled=true;try{const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const d=await r.json();if(!r.ok||!isAdmin(d.access_token))throw new Error('登入失敗，請確認帳號密碼');session=d;localStorage.setItem(STORE,JSON.stringify(d));await enter()}catch(e){loginMsg.textContent=e.message}finally{loginBtn.disabled=false}}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadAll()}function logout(){localStorage.removeItem(STORE);location.reload()}async function boot(){const raw=localStorage.getItem(STORE);if(!raw)return;try{session=JSON.parse(raw);if(!(await refresh())&&!isAdmin(session?.access_token))throw 0;await enter()}catch{localStorage.removeItem(STORE)}}async function loadAll(){const [br,ar]=await Promise.all([api('traveler_bookings?select=*&order=booking_date.asc,booking_time.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc')]);if(!br.ok||!ar.ok){toast('資料讀取失敗，請重新登入');return}state.bookings=await br.json();state.availability=await ar.json();render()}function badge(j){return j==='初遇'?'initial':j==='拾光'?'light':'walk'}function statusTag(b){return b.status==='pending'?'<span class="tag pendingtag">待確認</span>':b.status==='confirmed'?'<span class="tag confirmedtag">已確認</span>':'<span class="tag cancelledtag">已取消</span>'}function bookingCard(b){return `<div class="booking ${b.status==='pending'?'pending':''}"><div class="top"><div><span class="name">${esc(b.traveler_name)}</span><span class="tag ${badge(b.journey)}">${esc(b.journey)}</span></div>${statusTag(b)}</div><div class="info">${b.booking_date}・${time5(b.booking_time)}<br>${esc(b.contact_method||'IG')}：${esc(b.instagram||'—')}</div>${b.status!=='cancelled'?`<div class="actions">${b.status==='pending'?`<button class="btn primary" onclick="confirmBooking('${b.id}',this)">確認預約</button>`:''}<button class="btn soft" onclick="copyContact('${b.id}')">複製聯繫</button><button class="btn danger" onclick="cancelBooking('${b.id}',this)">取消預約</button></div>`:''}</div>`}function render(){renderDashboard();renderBookings();renderCalendar()}function renderDashboard(){const now=today(),month=now.slice(0,7),active=state.bookings.filter(isActive),pending=active.filter(b=>b.status==='pending'),up=active.filter(b=>b.booking_date>=now),next=[...up].sort((a,b)=>(a.booking_date+a.booking_time).localeCompare(b.booking_date+b.booking_time)).slice(0,8);dashboard.innerHTML=`<div class="toolbar"><div><h2>總覽</h2><div class="sub">${now.replaceAll('-','/')}｜近期安排</div></div><div class="actions"><button class="btn soft" onclick="copyLink()">複製旅人預約網址</button><button class="btn primary" onclick="showPage('calendar')">開放時段</button></div></div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${active.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${active.filter(b=>b.booking_date.startsWith(month)).length}</strong></div><div class="card metric"><span>待確認</span><strong>${pending.length}</strong></div><div class="card metric"><span>可預約時段</span><strong>${state.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div>${pending.length?`<div class="card panel"><h3>♡ 等你確認的預約</h3><div class="list">${pending.map(bookingCard).join('')}</div></div>`:''}<div class="card panel"><h3>近期預約</h3><div class="list">${next.length?next.map(bookingCard).join(''):'<div class="sub">目前沒有近期預約。</div>'}</div></div>`}function renderBookings(){bookings.innerHTML=`<div class="toolbar"><div><h2>旅人預約</h2><div class="sub">待確認與已確認都會顯示。</div></div><button class="btn" onclick="loadAll()">重新整理</button></div><div class="filters"><input id="q" placeholder="搜尋姓名或聯繫名稱" oninput="filterRows()"><select id="fj" onchange="filterRows()"><option value="">全部旅程</option><option>初遇</option><option>拾光</option><option>同行</option></select><select id="fs" onchange="filterRows()"><option value="active">待確認＋已確認</option><option value="pending">待確認</option><option value="confirmed">已確認</option><option value="cancelled">已取消</option><option value="">全部狀態</option></select></div><div id="bookingList" class="list"></div>`;filterRows()}function filterRows(){if(!$('bookingList'))return;const qv=($('q')?.value||'').toLowerCase(),j=$('fj')?.value||'',s=$('fs')?.value||'active';const rows=state.bookings.filter(b=>(!qv||`${b.traveler_name} ${b.instagram}`.toLowerCase().includes(qv))&&(!j||b.journey===j)&&(!s||(s==='active'?isActive(b):b.status===s)));$('bookingList').innerHTML=rows.length?rows.map(bookingCard).join(''):'<div class="card panel sub">沒有符合條件的預約。</div>'}function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));dashboard.classList.toggle('hidden',p!=='dashboard');bookings.classList.toggle('hidden',p!=='bookings');calendarPage.classList.toggle('hidden',p!=='calendar');render()}async function copyLink(){try{await navigator.clipboard.writeText(BOOKING_URL);toast('預約網址已複製')}catch{prompt('請複製網址',BOOKING_URL)}}async function copyContact(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;try{await navigator.clipboard.writeText(b.instagram||'');toast('已複製')}catch{toast('無法複製')}}async function confirmBooking(id,btn){if(btn){btn.disabled=true;btn.textContent='確認中…'}try{const r=await fetch(`${U}/functions/v1/booking-confirm`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({booking_id:id})});if(!r.ok)throw new Error(await r.text());await loadAll();toast('已確認預約')}catch(e){toast('確認失敗，請再試一次');if(btn){btn.disabled=false;btn.textContent='確認預約'}}}async function cancelBooking(id,btn){if(btn){btn.disabled=true;btn.textContent='取消中…'}try{const r=await fetch(`${U}/functions/v1/booking-cancel`,{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify({booking_id:id})});if(!r.ok)throw new Error(await r.text());await loadAll();toast('已取消預約，原時段已重新開放')}catch(e){toast('取消失敗，請再試一次');if(btn){btn.disabled=false;btn.textContent='取消預約'}}}function renderCalendar(){const [y,m]=state.month.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let cells='';for(let i=0;i<start;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const d=`${state.month}-${String(n).padStart(2,'0')}`,slots=state.availability.filter(a=>a.booking_date===d),open=slots.filter(a=>a.is_open).length,booked=state.bookings.filter(b=>isActive(b)&&b.booking_date===d).length;cells+=`<button class="day ${slots.length?'has':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length||booked?`<div class="count">${open} 可約<br>${booked} 已占用</div>`:''}</button>`}calendarPage.innerHTML=`<div class="toolbar"><div><h2>開放月曆</h2><div class="sub">點日期設定 10:00～20:00 時段。</div></div></div><div class="card calendar-card"><div class="cal-head"><button class="circle" onclick="shiftMonth(-1)">‹</button><b>${y} 年 ${m} 月</b><button class="circle" onclick="shiftMonth(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}function shiftMonth(n){const [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+n,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}function openSlots(d){state.slotDate=d;const booked=bookedSet();state.selected=new Set(state.availability.filter(a=>a.booking_date===d&&a.is_open).map(a=>time5(a.booking_time)).filter(t=>!booked.has(t)));$('slotTitle').textContent=`${d}｜設定時段`;renderHours();$('slotModal').classList.add('show')}function closeSlots(){$('slotModal').classList.remove('show')}function bookedSet(){return new Set(state.bookings.filter(b=>isActive(b)&&b.booking_date===state.slotDate).map(b=>time5(b.booking_time)))}function renderHours(){const booked=bookedSet();$('hours').innerHTML=HOURS.map(t=>`<button class="hour ${state.selected.has(t)?'on':''} ${booked.has(t)?'booked':''}" ${booked.has(t)?'disabled':''} onclick="toggleHour('${t}')">${t}</button>`).join('')}function toggleHour(t){state.selected.has(t)?state.selected.delete(t):state.selected.add(t);renderHours()}async function saveSlots(){const d=state.slotDate,booked=bookedSet(),rows=HOURS.map(t=>({booking_date:d,booking_time:t+':00',is_open:state.selected.has(t)&&!booked.has(t)}));const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok){toast('儲存失敗');return}closeSlots();await loadAll();toast('時段已更新')}loginBtn.onclick=login;logoutBtn.onclick=logout;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));slotModal.onclick=e=>{if(e.target===slotModal)closeSlots()};password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();</script></body></html>
