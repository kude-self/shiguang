<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF3EE"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>拾光所｜預約管理・月曆版</title>
<style>
:root{--pink:#C9938A;--light-pink:#F5E6E3;--blue:#7A9BAD;--light-blue:#E3EDF3;--sage:#9AAE9B;--light-sage:#E8F0E8;--cream:#FAF3EE;--bg:#FAFAF8;--dark:#37352F;--medium:#5A5248;--gray:#9B9A97;--line:#E8E3DE;--shadow:0 10px 28px rgba(55,53,47,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.login-card{width:min(430px,100%);padding:26px}.mark{font-size:13px;color:var(--sage);font-weight:700;letter-spacing:.08em}h1{font-size:28px;margin:8px 0}.sub{font-size:13px;color:var(--gray);line-height:1.7}.field{display:grid;gap:6px;margin-top:13px}label{font-size:12px;font-weight:700;color:var(--medium)}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--dark);outline:none}.btn{border:1px solid var(--line);background:#fff;color:var(--dark);padding:10px 13px;border-radius:12px;font-weight:700}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.soft{background:var(--cream)}.btn.danger{background:#fff7f6;color:#965e58}.login-card .btn{width:100%;margin-top:17px}.header{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{max-width:1080px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.nav{max-width:1080px;margin:auto;padding:6px 16px 9px;display:flex;gap:6px;overflow:auto}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:11px;white-space:nowrap;color:var(--medium)}.nav button.active{background:var(--cream);font-weight:700}.wrap{max-width:1080px;margin:auto;padding:20px 16px 70px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar h2{margin:0 0 3px;font-size:24px}.actions{display:flex;gap:7px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:15px}.metric span{font-size:11px;color:var(--gray)}.metric strong{display:block;font-size:27px;margin-top:6px}.section{margin-top:15px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:11px}.meta{font-size:11px;color:var(--gray);margin-top:4px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700}.initial{background:var(--light-pink);color:#845d56}.light{background:var(--light-sage);color:#60735e}.walk{background:var(--light-blue);color:#55707d}.cancel{background:#f1efed;color:#777}.calendar-card{padding:15px}.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.cal-head h3{margin:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;color:var(--gray);padding:4px}.day{min-height:88px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:8px;text-align:left;position:relative}.day.muted{opacity:.28}.day.today{outline:2px solid rgba(122,155,173,.35)}.day.has{background:linear-gradient(180deg,#fff,var(--light-sage))}.day .num{font-size:12px;font-weight:700}.day .count{font-size:10px;color:var(--gray);margin-top:7px;line-height:1.45}.day .dotrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}.dot.booked{background:var(--pink)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}.booking-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.booking-card .topline{display:flex;justify-content:space-between;gap:8px}.details{font-size:12px;line-height:1.8;color:var(--medium);margin-top:8px}.modal{position:fixed;inset:0;background:rgba(55,53,47,.36);display:none;place-items:center;padding:16px;z-index:50}.modal.show{display:grid}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px}.modal-head,.modal-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:15px 17px}.modal-head{border-bottom:1px solid var(--line)}.modal-body{padding:17px}.modal-foot{border-top:1px solid var(--line);justify-content:flex-end}.slot-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.slot{border:0;border-radius:999px;padding:8px 10px;background:var(--light-sage);font-size:11px}.slot.closed{background:var(--light-pink);color:#8a5e56;text-decoration:line-through}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;background:var(--dark);color:#fff;padding:10px 13px;border-radius:10px;transition:.2s;z-index:70}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}@media(max-width:620px){.wrap{padding:16px 12px 60px}.head,.nav{padding-left:12px;padding-right:12px}.day{min-height:64px;padding:6px;border-radius:10px}.day .count{font-size:9px}.calendar{gap:4px}.metric strong{font-size:23px}.actions .btn{flex:1}.actions{width:100%}.login-card{padding:22px}}
</style></head>
<body>
<div id="loginView" class="login"><div class="login-card"><div class="mark">𓇼 拾光所</div><h1>預約管理</h1><p class="sub">月曆版管理後台。登入後可以查看預約、改期與直接點月曆開放時段。</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">登入管理後台</button><div id="loginMsg" class="sub" style="margin-top:10px;color:#9a5d56"></div></div></div>
<div id="appView" class="hidden"><header class="header"><div class="head"><div><b>𓇼 拾光所｜預約管理</b><div id="who" class="sub"></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約</button><button data-page="calendar">開放月曆</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section></main></div>
<div id="slotModal" class="modal"><div class="modal-card"><div class="modal-head"><b id="slotTitle">設定時段</b><button class="btn" onclick="closeSlotModal()">關閉</button></div><div class="modal-body"><div class="field" style="margin-top:0"><label>新增時段</label><input id="slotTimes" placeholder="例如：10:00, 14:00, 16:30"></div><button class="btn primary" onclick="saveSlots()">新增／重新開放</button><div id="existingSlots" class="section"></div></div></div></div>
<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><b>編輯預約</b><button class="btn" onclick="closeEdit()">關閉</button></div><div id="editBody" class="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeEdit()">取消</button><button class="btn primary" onclick="saveEdit()">儲存變更</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',BOOKING_URL='https://kude-self.github.io/shiguang/booking/',STORE='sg_booking_admin_calendar_v1';
let session=null;let state={page:'dashboard',bookings:[],availability:[],month:new Date().toISOString().slice(0,7),slotDate:'',editing:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const time5=t=>String(t||'').slice(0,5);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`};const badge=j=>j==='初遇'?'initial':j==='拾光'?'light':'walk';function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}
async function refreshSession(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refreshSession())return api(path,opt,false);return r}
async function login(){const e=email.value.trim(),p=password.value;if(!e||!p){loginMsg.textContent='請輸入 Email 與密碼';return}loginBtn.disabled=true;loginBtn.textContent='登入中…';try{const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const d=await r.json();if(!r.ok)throw new Error('登入失敗，請確認帳號密碼');if(!isAdmin(d.access_token))throw new Error('這個帳號沒有管理權限');session=d;localStorage.setItem(STORE,JSON.stringify(d));await enter()}catch(err){loginMsg.textContent=err.message}finally{loginBtn.disabled=false;loginBtn.textContent='登入管理後台'}}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadAll()}function logout(){localStorage.removeItem(STORE);location.reload()}async function boot(){const raw=localStorage.getItem(STORE);if(!raw)return;try{session=JSON.parse(raw);if(!isAdmin(session.access_token)&&!(await refreshSession()))throw 0;await enter()}catch(e){localStorage.removeItem(STORE)}}
async function loadAll(){const [br,ar]=await Promise.all([api('traveler_bookings?select=*&order=booking_date.asc,booking_time.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc')]);if(!br.ok||!ar.ok){toast('讀取資料失敗');return}state.bookings=await br.json();state.availability=await ar.json();render()}
function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));dashboard.classList.toggle('hidden',p!=='dashboard');bookings.classList.toggle('hidden',p!=='bookings');calendarPage.classList.toggle('hidden',p!=='calendar');render()}
async function copyLink(){try{await navigator.clipboard.writeText(BOOKING_URL);toast('旅人預約網址已複製')}catch(e){prompt('請複製網址',BOOKING_URL)}}
function render(){renderDashboard();renderBookings();renderCalendar()}
function renderDashboard(){const now=today(),m=now.slice(0,7),c=state.bookings.filter(b=>b.status==='confirmed'),up=c.filter(b=>b.booking_date>=now),next=up.slice(0,6);dashboard.innerHTML=`<div class="toolbar"><div><h2>總覽</h2><div class="sub">${fmt(now)}｜近期安排</div></div><div class="actions"><button class="btn soft" onclick="copyLink()">複製旅人預約網址</button><button class="btn primary" onclick="showPage('calendar')">開放時段</button></div></div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${c.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${c.filter(b=>b.booking_date.startsWith(m)).length}</strong></div><div class="card metric"><span>接下來</span><strong>${up.length}</strong></div><div class="card metric"><span>可預約時段</span><strong>${state.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div><div class="card section" style="padding:15px"><b>近期預約</b><div class="list section">${next.length?next.map(b=>`<div class="item"><div><b>${esc(b.traveler_name)}</b> <span class="badge ${badge(b.journey)}">${b.journey}</span><div class="meta">${fmt(b.booking_date)} ・ ${time5(b.booking_time)} ・ ${esc(b.instagram)}</div></div><button class="btn" onclick="openEdit('${b.id}')">編輯</button></div>`).join(''):'<div class="sub">目前沒有近期預約。</div>'}</div></div>`}
function renderBookings(){const rows=[...state.bookings].sort((a,b)=>(a.booking_date+a.booking_time).localeCompare(b.booking_date+b.booking_time));bookings.innerHTML=`<div class="toolbar"><div><h2>旅人預約</h2><div class="sub">查看、改期與取消。</div></div><button class="btn" onclick="loadAll()">重新整理</button></div><div class="filters"><input id="q" placeholder="搜尋姓名或 IG" oninput="filterRows()"><select id="fj" onchange="filterRows()"><option value="">全部旅程</option><option>初遇</option><option>拾光</option><option>同行</option></select><select id="fs" onchange="filterRows()"><option value="confirmed">已確認</option><option value="">全部狀態</option><option value="cancelled">已取消</option></select></div><div id="bookingList" class="list"></div>`;filterRows()}
function filterRows(){if(!document.getElementById('bookingList'))return;const qv=(q?.value||'').toLowerCase(),j=fj?.value||'',s=fs?.value||'';const rows=state.bookings.filter(b=>(!qv||(b.traveler_name+' '+b.instagram).toLowerCase().includes(qv))&&(!j||b.journey===j)&&(!s||b.status===s));bookingList.innerHTML=rows.length?rows.map(b=>`<div class="booking-card"><div class="topline"><div><b>${esc(b.traveler_name)}</b> <span class="badge ${badge(b.journey)}">${b.journey}</span></div><span class="badge ${b.status==='confirmed'?'light':'cancel'}">${b.status==='confirmed'?'已確認':'已取消'}</span></div><div class="details">日期：${fmt(b.booking_date)}<br>時段：${time5(b.booking_time)}<br>IG：${esc(b.instagram)}<br>生日：${b.birthday?fmt(b.birthday):'—'}${b.gender?'・'+esc(b.gender):''}</div>${b.status==='confirmed'?`<div class="actions" style="margin-top:8px"><button class="btn" onclick="openEdit('${b.id}')">改期／編輯</button><button class="btn" onclick="downloadICS('${b.id}')">行事曆</button><button class="btn danger" onclick="cancelBooking('${b.id}')">取消</button></div>`:''}</div>`).join(''):'<div class="sub">沒有符合條件的預約。</div>'}
function toDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderCalendar(){const [y,m]=state.month.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),start=first.getDay(),days=last.getDate(),prev=new Date(y,m-1,0).getDate();let cells=[];for(let i=0;i<42;i++){let n,d,muted=false;if(i<start){n=prev-start+i+1;d=toDate(new Date(y,m-2,n));muted=true}else if(i>=start+days){n=i-start-days+1;d=toDate(new Date(y,m,n));muted=true}else{n=i-start+1;d=`${state.month}-${String(n).padStart(2,'0')}`}const slots=state.availability.filter(a=>a.booking_date===d),booked=state.bookings.filter(b=>b.booking_date===d&&b.status==='confirmed').length,open=slots.filter(a=>a.is_open).length;cells.push(`<button class="day ${muted?'muted':''} ${slots.length?'has':''} ${d===today()?'today':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length?`<div class="count">${open} 可約<br>${booked} 已約</div><div class="dotrow">${slots.slice(0,6).map((s,idx)=>`<span class="dot ${idx<booked?'booked':''}"></span>`).join('')}</div>`:''}</button>`)}calendarPage.innerHTML=`<div class="toolbar"><div><h2>開放月曆</h2><div class="sub">點日期直接設定時段。</div></div><button class="btn soft" onclick="copyLink()">複製預約網址</button></div><div class="card calendar-card"><div class="cal-head"><button class="btn" onclick="shiftMonth(-1)">←</button><h3>${y} 年 ${m} 月</h3><button class="btn" onclick="shiftMonth(1)">→</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function shiftMonth(n){const [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+n,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}
function openSlots(date){state.slotDate=date;slotTitle.textContent=`${fmt(date)}｜設定時段`;slotTimes.value='';renderExisting();slotModal.classList.add('show')}function closeSlotModal(){slotModal.classList.remove('show')}function renderExisting(){const date=state.slotDate,slots=state.availability.filter(a=>a.booking_date===date),booked=new Set(state.bookings.filter(b=>b.booking_date===date&&b.status==='confirmed').map(b=>time5(b.booking_time)));existingSlots.innerHTML=slots.length?`<b>目前時段</b><div class="slot-row">${slots.map(a=>`<button class="slot ${a.is_open?'':'closed'}" ${booked.has(time5(a.booking_time))?'disabled':''} onclick="toggleSlot(${a.id},${!a.is_open})">${time5(a.booking_time)}${booked.has(time5(a.booking_time))?'・已預約':a.is_open?'・開放':'・關閉'}</button>`).join('')}</div>`:'<div class="sub">這一天還沒有設定時段。</div>'}
async function saveSlots(){const date=state.slotDate,times=slotTimes.value.split(/[,，]/).map(x=>x.trim()).filter(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x));if(!date||!times.length){toast('請輸入有效時段');return}const booked=new Set(state.bookings.filter(b=>b.booking_date===date&&b.status==='confirmed').map(b=>time5(b.booking_time))),rows=times.filter(t=>!booked.has(t)).map(t=>({booking_date:date,booking_time:t+':00',is_open:true}));if(!rows.length){toast('沒有可新增的時段');return}const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok){toast('儲存失敗');return}await loadAll();renderExisting();toast('時段已更新')}
async function toggleSlot(id,next){const s=state.availability.find(a=>a.id===id);if(!s)return;const has=state.bookings.some(b=>b.booking_date===s.booking_date&&time5(b.booking_time)===time5(s.booking_time)&&b.status==='confirmed');if(next&&has){toast('這個時段已有預約');return}const r=await api(`booking_availability?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({is_open:next})});if(!r.ok){toast('更新失敗');return}await loadAll();renderExisting()}
function openEdit(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;state.editing=b;const av=state.availability.filter(a=>a.is_open||(a.booking_date===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))),dates=[...new Set(av.map(a=>a.booking_date))].sort();editBody.innerHTML=`<div class="field" style="margin-top:0"><label>旅人</label><input value="${esc(b.traveler_name)}" disabled></div><div class="field"><label>旅程</label><select id="editJourney">${['初遇','拾光','同行'].map(j=>`<option ${j===b.journey?'selected':''}>${j}</option>`).join('')}</select></div><div class="field"><label>日期</label><select id="editDate" onchange="refreshEditTimes()">${dates.map(d=>`<option value="${d}" ${d===b.booking_date?'selected':''}>${fmt(d)}</option>`).join('')}</select></div><div class="field"><label>時段</label><select id="editTime"></select></div>`;editModal.classList.add('show');refreshEditTimes()}function refreshEditTimes(){const b=state.editing,d=editDate.value,slots=state.availability.filter(a=>a.booking_date===d&&(a.is_open||(d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))));editTime.innerHTML=slots.map(a=>`<option value="${time5(a.booking_time)}" ${d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time)?'selected':''}>${time5(a.booking_time)}</option>`).join('')}function closeEdit(){editModal.classList.remove('show');state.editing=null}async function saveEdit(){const b=state.editing;if(!b||!editTime.value)return;const body={journey:editJourney.value,booking_date:editDate.value,booking_time:editTime.value+':00'},r=await api(`traveler_bookings?id=eq.${encodeURIComponent(b.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok){toast('修改失敗');return}closeEdit();await loadAll();toast('預約已更新')}
async function cancelBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b||!confirm(`確定取消 ${b.traveler_name} 的預約嗎？`))return;const r=await api(`traveler_bookings?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:'cancelled'})});if(!r.ok){toast('取消失敗');return}await loadAll();toast('預約已取消，原時段已重新開放')}
function mins(j){return j==='初遇'?50:75}function downloadICS(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;const [hh,mm]=time5(b.booking_time).split(':').map(Number),start=new Date(`${b.booking_date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`),end=new Date(start.getTime()+mins(b.journey)*60000),pad=n=>String(n).padStart(2,'0'),dt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;const body=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:${b.id}@shiguang\r\nDTSTART:${dt(start)}\r\nDTEND:${dt(end)}\r\nSUMMARY:拾光所｜${b.journey}｜${b.traveler_name}\r\nEND:VEVENT\r\nEND:VCALENDAR`;const blob=new Blob([body],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`拾光所_${b.booking_date}_${b.traveler_name}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
loginBtn.addEventListener('click',login);logoutBtn.addEventListener('click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));slotModal.addEventListener('click',e=>{if(e.target===slotModal)closeSlotModal()});editModal.addEventListener('click',e=>{if(e.target===editModal)closeEdit()});boot();
</script></body></html>
