<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf6"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>拾光所｜生日拾光管理</title><style>:root{--paper:#fffdf9;--ink:#675b54;--soft:#9c8f85;--line:#eadfd7;--rose:#fae9e8;--sage:#e8f0e4;--blue:#e8eff5;--butter:#f8edcf;--lav:#eee8f3;--gold:#c6a273}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#f9e8e8 0,transparent 25%),radial-gradient(circle at 100% 12%,#edf2e7 0,transparent 26%),linear-gradient(#fffaf6,#fffdf9);color:var(--ink);font-family:"Yuanti TC","PingFang TC","Noto Sans TC",sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.login-card{background:#fffdfaf5;border:1.4px solid var(--line);border-radius:23px;box-shadow:0 10px 27px #70564612}.login-card{width:min(420px,100%);padding:27px}.brand{font-family:"Kaiti TC","STKaiti",serif;color:#9a7e68;font-size:15px;letter-spacing:.09em}.login-card h1,.toolbar h1{font-family:"Kaiti TC","STKaiti",serif;font-weight:600;letter-spacing:.03em}.login-card h1{font-size:27px;margin:9px 0 6px}.sub{font-size:12px;color:var(--soft);line-height:1.7}.field{display:grid;gap:6px;margin-top:13px}label{font-size:12px;font-weight:600;color:#806f65}input,select,textarea{width:100%;border:1.3px solid #e7d8cd;background:#fffdfa;border-radius:16px;padding:12px 13px;font-size:15px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#d8b68e;box-shadow:0 0 0 3px #d8b68e18}textarea{min-height:95px}.btn{border:1.3px solid #e5d7cc;background:#fffaf6;color:var(--ink);padding:10px 14px;border-radius:16px;font-weight:600;min-height:43px}.btn.primary{background:linear-gradient(135deg,#85766d,#6c625c);color:#fff;border-color:transparent}.btn.soft{background:#fff1e8}.login-card .btn{width:100%;margin-top:15px}.header{position:sticky;top:0;z-index:10;background:#fffaf6f2;backdrop-filter:blur(16px);border-bottom:1px dashed #ead8cc}.head,.wrap{max-width:1000px;margin:auto}.head{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head-title{font-family:"Kaiti TC","STKaiti",serif;font-size:19px;font-weight:600}.head-actions{display:flex;gap:7px}.wrap{padding:22px 16px 65px}.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:15px}.toolbar h1{margin:0;font-size:27px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{padding:16px}.metric:nth-child(1){background:linear-gradient(145deg,#fffdf9,#fae9e8)}.metric:nth-child(2){background:linear-gradient(145deg,#fffdf9,#e8eff5)}.metric:nth-child(3){background:linear-gradient(145deg,#fffdf9,#f8edcf)}.metric:nth-child(4){background:linear-gradient(145deg,#fffdf9,#e8f0e4)}.metric span{font-size:12px;color:var(--soft)}.metric strong{display:block;font-family:"Kaiti TC","STKaiti",serif;font-size:29px;font-weight:500;margin-top:6px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:14px 0}.list{display:grid;gap:11px}.order{padding:16px;position:relative;overflow:hidden}.order:after{content:"✦";position:absolute;right:14px;top:10px;color:#d3ae83;font-size:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-family:"Kaiti TC","STKaiti",serif;font-size:20px;font-weight:600}.tag{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:600;margin-left:5px}.new{background:#fff0e8;color:#9a6b52}.confirmed{background:var(--blue);color:#607785}.paid{background:var(--butter);color:#806d34}.producing{background:var(--lav);color:#705e80}.shipped{background:var(--sage);color:#5b725b}.cancelled{background:#efedeb;color:#777}.info{font-size:13px;line-height:1.8;color:#706760;margin-top:9px}.paymark{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:12px;background:#fff7e9;border:1px dashed #e7cfab;color:#806749;font-size:12px;font-weight:700}.details{margin-top:11px;padding:13px;border-radius:16px;background:#fffaf6;border:1px dashed #e5d5c8;font-size:13px;line-height:1.75}.details b{color:#64574d}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.status-select{max-width:170px}.empty{padding:20px;text-align:center;color:var(--soft)}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.top{display:block}.tag{margin:7px 4px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr}.status-select{max-width:none;grid-column:1/-1}.head-title{font-size:17px}.head-actions .btn:first-child{display:none}.wrap{padding-left:12px;padding-right:12px}.toolbar h1{font-size:24px}}</style></head><body><div id="loginView" class="login"><div class="login-card"><div class="brand">✦ 拾光所</div><h1>生日拾光管理</h1><p class="sub">查看申請、付款、製作與寄送進度。</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub" style="margin-top:10px;color:#995f59"></div></div></div><div id="appView" class="hidden"><header class="header"><div class="head"><div><div class="head-title">✦ 拾光所｜生日拾光管理</div><div id="who" class="sub"></div></div><div class="head-actions"><a class="btn" href="./admin-calendar.html?v=17" style="text-decoration:none">一般預約管理</a><button id="logoutBtn" class="btn">登出</button></div></div></header><main class="wrap"><div class="toolbar"><div><h1>生日拾光</h1><div class="sub">旅人資料、付款核對與製作進度，都集中在這裡。</div></div><button class="btn soft" onclick="loadOrders()">重新整理</button></div><div id="metrics" class="metrics"></div><div class="filters"><input id="q" placeholder="搜尋姓名、IG、手機、後五碼" oninput="renderList()"><select id="status" onchange="renderList()"><option value="">全部狀態</option><option value="new">新申請</option><option value="confirmed">已確認</option><option value="paid">已付款</option><option value="producing">製作中</option><option value="shipped">已寄出</option><option value="cancelled">已取消</option></select><input id="month" type="month" onchange="renderList()"></div><div id="list" class="list"></div></main></div><script>const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',STORE='sg_booking_admin_final_v2';let session=null,orders=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function refresh(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refresh())return api(path,opt,false);return r}async function login(){loginMsg.textContent='';loginBtn.disabled=true;try{const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok||!isAdmin(d.access_token))throw new Error('登入失敗，請確認帳號密碼');session=d;localStorage.setItem(STORE,JSON.stringify(d));await enter()}catch(e){loginMsg.textContent=e.message}finally{loginBtn.disabled=false}}async function boot(){const raw=localStorage.getItem(STORE);if(!raw)return;try{session=JSON.parse(raw);if(!(await refresh())&&!isAdmin(session?.access_token))throw 0;await enter()}catch{localStorage.removeItem(STORE)}}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadOrders()}function logout(){localStorage.removeItem(STORE);location.reload()}async function loadOrders(){const r=await api('birthday_light_orders?select=*&order=created_at.desc');if(!r.ok){alert('資料讀取失敗');return}orders=await r.json();render()}function render(){renderMetrics();renderList()}function renderMetrics(){const ym=new Date().toISOString().slice(0,7);const current=orders.filter(o=>String(o.birthday||'').slice(0,7)===ym);metrics.innerHTML=`<div class="card metric"><span>全部申請</span><strong>${orders.length}</strong></div><div class="card metric"><span>本月生日</span><strong>${current.length}</strong></div><div class="card metric"><span>待處理</span><strong>${orders.filter(o=>['new','confirmed','paid','producing'].includes(o.status)).length}</strong></div><div class="card metric"><span>已寄出</span><strong>${orders.filter(o=>o.status==='shipped').length}</strong></div>`}function statusLabel(s){return {new:'新申請',confirmed:'已確認',paid:'已付款',producing:'製作中',shipped:'已寄出',cancelled:'已取消'}[s]||s}function card(o){return `<div class="card order"><div class="top"><div><span class="name">${esc(o.display_name)}</span><span class="tag ${esc(o.status)}">${statusLabel(o.status)}</span></div><div class="sub">申請 ${new Date(o.created_at).toLocaleString('zh-TW')}</div></div><div class="info">生日：${esc(o.birthday)}${o.turning_age?`・${o.turning_age} 歲`:''}<br>IG：${esc(o.instagram||'—')}｜手機：${esc(o.phone)}<br>收件人：${esc(o.recipient_name)}<br>地址：${esc((o.postal_code?o.postal_code+' ':'')+o.shipping_address)}</div><div class="paymark">付款帳號後五碼：${esc(o.payment_last5||'尚未填寫')}</div><details class="details"><summary><b>查看旅人填寫內容</b></summary><p><b>想對自己說的話：</b><br>${esc(o.self_message||'—')}</p><p><b>最近正在經歷：</b><br>${esc(o.current_state||'—')}</p><p><b>想把自己帶往：</b><br>${esc(o.wished_direction||'—')}</p>${o.notes?`<p><b>補充：</b><br>${esc(o.notes)}</p>`:''}</details><div class="actions"><select class="status-select" onchange="updateStatus('${o.id}',this.value,this)">${['new','confirmed','paid','producing','shipped','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select><button class="btn soft" onclick="copyText('${encodeURIComponent(o.phone)}')">複製手機</button><button class="btn soft" onclick="copyText('${encodeURIComponent((o.postal_code?o.postal_code+' ':'')+o.shipping_address)}')">複製地址</button></div></div>`}function renderList(){const qv=(q.value||'').toLowerCase(),sv=status.value,mv=month.value;const rows=orders.filter(o=>(!qv||`${o.display_name} ${o.recipient_name} ${o.instagram} ${o.phone} ${o.payment_last5||''}`.toLowerCase().includes(qv))&&(!sv||o.status===sv)&&(!mv||String(o.birthday).startsWith(mv)));list.innerHTML=rows.length?rows.map(card).join(''):'<div class="card empty">目前沒有符合條件的生日拾光資料。</div>'}async function updateStatus(id,value,el){el.disabled=true;const r=await api(`birthday_light_orders?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:value})});el.disabled=false;if(!r.ok){alert('狀態更新失敗');await loadOrders();return}const o=orders.find(x=>x.id===id);if(o)o.status=value;renderMetrics()}async function copyText(v){const t=decodeURIComponent(v);try{await navigator.clipboard.writeText(t)}catch{prompt('請複製',t)}}loginBtn.onclick=login;logoutBtn.onclick=logout;password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();</script></body></html>
