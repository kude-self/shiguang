<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f3"><title>拾光所｜生日拾光管理</title><style>:root{--bg:#fff9f4;--paper:#fffdf9;--ink:#5b514a;--soft:#9b8f86;--line:#e8d8cc;--rose:#f7e4e1;--sage:#e7efe3;--blue:#e5edf3;--butter:#f6ebc9;--gold:#b59670}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#f8e6e2 0,transparent 26%),radial-gradient(circle at 100% 13%,#e8f0e4 0,transparent 28%),linear-gradient(180deg,#fffdf9,#fff8f2);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.login-card{background:rgba(255,253,249,.98);border:2px solid #e7d7cb;border-radius:28px;box-shadow:0 12px 28px rgba(112,86,68,.08)}.login-card{width:min(430px,100%);padding:30px}.brand{font-weight:800;letter-spacing:.12em}.sub{font-size:14px;color:var(--soft);line-height:1.7}.field{display:grid;gap:7px;margin-top:14px}label{font-size:13px;font-weight:700;color:#806f65}input,select,textarea{width:100%;border:2px solid #e7d7cb;background:#fffaf6;border-radius:18px;padding:12px 14px;font-size:16px;color:var(--ink)}textarea{min-height:100px}.btn{border:2px solid #e7d6ca;background:#fffaf6;color:var(--ink);padding:11px 15px;border-radius:18px;font-weight:700;min-height:46px}.btn.primary{background:#6d665d;color:#fff;border-color:#6d665d}.btn.soft{background:#faf0e8}.login-card .btn{width:100%;margin-top:16px}.header{position:sticky;top:0;z-index:10;background:rgba(255,250,246,.96);backdrop-filter:blur(16px);border-bottom:2px dashed #ead8cc}.head,.wrap{max-width:1060px;margin:auto}.head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.head-title{font-size:20px;font-weight:800}.head-actions{display:flex;gap:8px}.wrap{padding:24px 16px 70px}.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar h1{margin:0;font-size:30px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:18px}.metric span{font-size:13px;color:var(--soft)}.metric strong{display:block;font-size:34px;margin-top:8px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px;margin:16px 0}.list{display:grid;gap:12px}.order{padding:18px;position:relative;overflow:hidden}.order:after{content:"✦";position:absolute;right:16px;top:12px;color:#c9a36b}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:21px;font-weight:800}.tag{display:inline-flex;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;margin-left:6px}.new{background:#fff0e8;color:#9a6b52}.confirmed{background:#e5edf3;color:#607785}.paid{background:#f6ebc9;color:#806d34}.producing{background:#eee7f3;color:#705e80}.shipped{background:#e7efe3;color:#5b725b}.cancelled{background:#efedeb;color:#777}.info{font-size:14px;line-height:1.85;color:#706760;margin-top:10px}.details{margin-top:12px;padding:14px;border-radius:18px;background:#fffaf6;border:1px dashed #e5d5c8;font-size:14px;line-height:1.8}.details b{color:#64574d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status-select{max-width:180px}.empty{padding:20px;text-align:center;color:var(--soft)}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.top{display:block}.tag{margin:8px 4px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr}.status-select{max-width:none;grid-column:1/-1}.head-title{font-size:18px}.head-actions .btn:first-child{display:none}}</style></head><body><div id="loginView" class="login"><div class="login-card"><div class="brand">𓇼 拾光所</div><h1>生日拾光管理</h1><p class="sub">使用與預約管理後台相同的管理者帳號登入。</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub" style="margin-top:10px;color:#995f59"></div></div></div><div id="appView" class="hidden"><header class="header"><div class="head"><div><div class="head-title">𓇼 拾光所｜生日拾光管理</div><div id="who" class="sub"></div></div><div class="head-actions"><a class="btn" href="./admin-calendar.html" style="text-decoration:none">一般預約管理</a><button id="logoutBtn" class="btn">登出</button></div></div></header><main class="wrap"><div class="toolbar"><div><h1>生日拾光</h1><div class="sub">查看旅人填寫資料、聯繫資訊、寄送地址與製作進度。</div></div><button class="btn soft" onclick="loadOrders()">重新整理</button></div><div id="metrics" class="metrics"></div><div class="filters"><input id="q" placeholder="搜尋姓名、IG、手機" oninput="renderList()"><select id="status" onchange="renderList()"><option value="">全部狀態</option><option value="new">新申請</option><option value="confirmed">已確認</option><option value="paid">已付款</option><option value="producing">製作中</option><option value="shipped">已寄出</option><option value="cancelled">已取消</option></select><input id="month" type="month" onchange="renderList()"></div><div id="list" class="list"></div></main></div><script>const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',STORE='sg_booking_admin_final_v2';let session=null,orders=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function refresh(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refresh())return api(path,opt,false);return r}async function login(){loginMsg.textContent='';loginBtn.disabled=true;try{const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok||!isAdmin(d.access_token))throw new Error('登入失敗，請確認帳號密碼');session=d;localStorage.setItem(STORE,JSON.stringify(d));await enter()}catch(e){loginMsg.textContent=e.message}finally{loginBtn.disabled=false}}async function boot(){const raw=localStorage.getItem(STORE);if(!raw)return;try{session=JSON.parse(raw);if(!(await refresh())&&!isAdmin(session?.access_token))throw 0;await enter()}catch{localStorage.removeItem(STORE)}}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadOrders()}function logout(){localStorage.removeItem(STORE);location.reload()}async function loadOrders(){const r=await api('birthday_light_orders?select=*&order=created_at.desc');if(!r.ok){alert('資料讀取失敗');return}orders=await r.json();render()}function render(){renderMetrics();renderList()}function renderMetrics(){const ym=new Date().toISOString().slice(0,7);const current=orders.filter(o=>String(o.birthday||'').slice(0,7)===ym);metrics.innerHTML=`<div class="card metric"><span>全部申請</span><strong>${orders.length}</strong></div><div class="card metric"><span>本月生日</span><strong>${current.length}</strong></div><div class="card metric"><span>待處理</span><strong>${orders.filter(o=>['new','confirmed','paid','producing'].includes(o.status)).length}</strong></div><div class="card metric"><span>已寄出</span><strong>${orders.filter(o=>o.status==='shipped').length}</strong></div>`}function statusLabel(s){return {new:'新申請',confirmed:'已確認',paid:'已付款',producing:'製作中',shipped:'已寄出',cancelled:'已取消'}[s]||s}function card(o){return `<div class="card order"><div class="top"><div><span class="name">${esc(o.display_name)}</span><span class="tag ${esc(o.status)}">${statusLabel(o.status)}</span></div><div class="sub">申請 ${new Date(o.created_at).toLocaleString('zh-TW')}</div></div><div class="info">生日：${esc(o.birthday)}${o.turning_age?`・${o.turning_age} 歲`:''}<br>IG：${esc(o.instagram||'—')}｜手機：${esc(o.phone)}<br>收件人：${esc(o.recipient_name)}<br>地址：${esc((o.postal_code?o.postal_code+' ':'')+o.shipping_address)}</div><details class="details"><summary><b>查看旅人填寫內容</b></summary><p><b>送給新一歲自己的話：</b><br>${esc(o.self_message||'—')}</p><p><b>最近正在經歷：</b><br>${esc(o.current_state||'—')}</p><p><b>希望這道光陪自己走向：</b><br>${esc(o.wished_direction||'—')}</p>${o.notes?`<p><b>補充：</b><br>${esc(o.notes)}</p>`:''}</details><div class="actions"><select class="status-select" onchange="updateStatus('${o.id}',this.value,this)">${['new','confirmed','paid','producing','shipped','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select><button class="btn soft" onclick="copyText('${encodeURIComponent(o.phone)}')">複製手機</button><button class="btn soft" onclick="copyText('${encodeURIComponent((o.postal_code?o.postal_code+' ':'')+o.shipping_address)}')">複製地址</button></div></div>`}function renderList(){const qv=(q.value||'').toLowerCase(),sv=status.value,mv=month.value;const rows=orders.filter(o=>(!qv||`${o.display_name} ${o.recipient_name} ${o.instagram} ${o.phone}`.toLowerCase().includes(qv))&&(!sv||o.status===sv)&&(!mv||String(o.birthday).startsWith(mv)));list.innerHTML=rows.length?rows.map(card).join(''):'<div class="card empty">目前沒有符合條件的生日拾光資料。</div>'}async function updateStatus(id,value,el){el.disabled=true;const r=await api(`birthday_light_orders?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:value})});el.disabled=false;if(!r.ok){alert('狀態更新失敗');await loadOrders();return}const o=orders.find(x=>x.id===id);if(o)o.status=value;renderMetrics()}async function copyText(v){const t=decodeURIComponent(v);try{await navigator.clipboard.writeText(t)}catch{prompt('請複製',t)}}loginBtn.onclick=login;logoutBtn.onclick=logout;password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();</script></body></html>
