<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><title>拾光所｜預約管理</title><style>html,body{margin:0;width:100%;height:100%;background:#FBF8F4}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="adminFrame" src="admin-v3.html?v=20260820e" title="拾光所預約管理"></iframe><script>const f=document.getElementById('adminFrame');f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow;const s=d.createElement('script');s.textContent=`(function(){try{const oldFull=fullBooking;window.notificationLabel=function(b){const s=b.notification_status||'pending';if(s==='sent')return '<span class="tag done">LINE通知已送出</span>';if(s==='failed')return '<span class="tag cancelled">LINE通知失敗</span>';return '<span class="tag contacted">LINE通知處理中</span>'};window.retryNotification=async function(id){try{const r=await api('rpc/retry_booking_notification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_booking_id:id})});if(!r.ok){toast('重新通知失敗');return}toast('已重新送出 LINE 通知');await loadAll()}catch(e){toast('重新通知失敗')}};fullBooking=function(b){let h=oldFull(b);h=h.replace('<div class="info-grid">','<div style="margin-top:8px">'+notificationLabel(b)+'</div><div class="info-grid">');if(b.status==='confirmed'&&(b.notification_status==='failed'))h=h.replace('</div></div>','</div></div>',1).replace('<button class="btn sage" onclick="openEdit','<button class="btn blue" onclick="retryNotification(\\''+b.id+'\\')">重送通知</button><button class="btn sage" onclick="openEdit');return h};const st=document.createElement('style');st.textContent='.booking .tag.done{background:#E7EFE5;color:#617461}.booking .tag.contacted{background:#E8F1F5;color:#5B7481}.booking .tag.cancelled{background:#F5E4E0;color:#8D625A}';document.head.appendChild(st);renderBookings();}catch(e){console.error('admin patch',e)}})();`;d.body.appendChild(s)}catch(e){console.error(e)}});</script></body></html>
