<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>拾光所｜預約管理</title><style>

rgin-top:17px}.header{position:sticky;top:0;z-index:20;background:rgba(251,248,244,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(234,225,218,.9)}.head{max-width:1080px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.head-brand{display:flex;gap:10px;align-items:center}.mini-mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#F7E6E1,#EDF2E9);color:#907C70}.head-title{font-weight:700}.who{font-size:11px;color:var(--muted);margin-top:2px}.nav{max-width:1080px;margin:auto;padding:3px 16px 9px;display:flex;gap:7px;overflow:auto}.nav button{border:0;background:transparent;color:var(--soft);padding:9px 13px;border-radius:999px;white-space:nowrap}.nav button.active{background:#fff;box-shadow:0 4px 14px rgba(91,72,59,.07);font-weight:700}.navbadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;align-items:center;justify-content:center;font-size:10px;margin-left:4px}.wrap{max-width:1080px;margin:auto;padding:22px 16px 72px}.toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{font-size:25px;margin:0 0 3px}.kicker{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--rose);margin-bottom:5px}.kicker:before{content:"✦ ";font-size:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{background:rgba(255,253,252,.97);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.metric{padding:17px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:29px;margin-top:7px}.metric:nth-child(1){background:linear-gradient(145deg,#FFFDFC,#FFF7F5)}.metric:nth-child(2){background:linear-gradient(145deg,#FFFDFC,#F7FBFD)}.metric:nth-child(3){background:linear-gradient(145deg,#FFFDFC,#FFF7F5)}.metric:nth-child(4){background:linear-gradient(145deg,#FFFDFC,#F7FBF6)}.section{margin-top:16px}.panel{padding:17px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.panel-title b{font-size:16px}.list{display:grid;gap:10px}.item,.booking-card{border:1px solid var(--line);background:#fff;border-radius:19px;padding:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.person{font-size:16px;font-weight:700}.meta,.details{font-size:12px;color:var(--muted);line-height:1.8;margin-top:5px}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:700}.initial,.new{background:var(--rose2);color:#8D625A}.light,.completed{background:var(--sage2);color:#617461}.walk,.contacted{background:var(--blue2);color:#5B7481}.cancel{background:#F0EEEC;color:#777}.notice{background:#F5F8F4;border:1px solid #E3EBE0;border-radius:19px;padding:13px 14px;font-size:12px;color:#647264;line-height:1.75;margin-bottom:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.calendar-card{padding:16px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cal-head h3{margin:0;font-size:18px}.circle{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:50%;color:var(--soft)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:87px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px;text-align:left;color:var(--ink)}.day.muted{opacity:.25}.day.today{outline:1px dashed #C9B9B0}.day.has{background:linear-gradient(180deg,#FFFDFC,#F1F6EF)}.num{font-size:12px;font-weight:700}.count{font-size:10px;color:var(--muted);line-height:1.5;margin-top:7px}.modal{position:fixed;inset:0;background:rgba(55,53,47,.34);display:none;place-items:center;padding:16px;z-index:50}.modal.show{display:grid}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#FBF8F4;border:1px solid var(--line);border-radius:26px;box-shadow:0 20px 60px rgba(55,53,47,.18)}.modal-head,.modal-foot{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px}.modal-head{border-bottom:1px solid var(--line)}.modal-body{padding:18px}.modal-foot{border-top:1px solid var(--line);justify-content:flex-end}.slot-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.slot{border:0;border-radius:999px;padding:9px 11px;background:var(--sage2);color:#617461;font-size:11px}.slot.closed{background:var(--rose2);color:#8D625A;text-decoration:line-through}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;background:#554D47;color:#fff;padding:11px 15px;border-radius:999px;transition:.2s;z-index:70}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:820px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:16px 12px 60px}.head,.nav{padding-left:12px;padding-right:12px}.toolbar{align-items:stretch}.toolbar .actions{width:100%}.toolbar .actions .btn{flex:1}.metrics{gap:8px}.metric{padding:14px;border-radius:20px}.metric strong{font-size:24px}.filters{grid-template-columns:1fr}.booking-card{border-radius:21px;padding:15px}.day{min-height:64px;padding:6px;border-radius:12px}.calendar{gap:4px}.actions .btn{flex:1}.login-card{padding:26px 20px}.panel{padding:14px}.item{align-items:flex-start;flex-direction:column}.item .btn{width:100%}}
</style></head><body>
<div id="loginView" class="login"><div class="login-card"><div class="login-mark">𓇼</div><div class="brand">拾 光 所</div><h1>預約管理</h1><p class="sub">把旅人的預約、時間與聯絡狀態，好好整理在這裡。</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub" style="margin-top:10px;color:#9a5d56"></div></div></div>
<div id="appView" class="hidden"><header class="header"><div class="head"><div class="head-brand"><div class="mini-mark">𓇼</div><div><div class="head-title">拾光所｜預約管理</div><div id="who" class="who"></div></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約 <span id="navNewBadge" class="navbadge hidden">0</span></button><button data-page="calendar">開放月曆</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section></main></div>

<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><b>旅人預約資料</b><button class="btn" onclick="closeEdit()">關閉</button></div><div id="editBody" class="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeEdit()">取消</button><button class="btn primary" onclick="saveEdit()">儲存變更</button></div></div></div><div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',BOOKING_URL='https://kude-self.github.io/shiguang/booking/',STORE='sg_booking_admin_stable_v3';let session=null,autoTimer=null;let state={page:'dashboard',bookings:[],availability:[],month:new Date().toISOString().slice(0,7),slotDate:'',editing:null,lastUpdated:null};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const time5=t=>String(t||'').slice(0,5);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`};const badge=j=>j==='初遇'?'initial':j==='拾光'?'light':'walk';const contactLabel=s=>s==='contacted'?'已聯絡':s==='completed'?'已完成':'新預約';function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function refreshSession(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refreshSession())return api(path,opt,false);return r}async function login(){const e=email.value.trim(),p=password.value;if(!e||!p){loginMsg.textContent='請輸入 Email 與密碼';return}loginBtn.disabled=true;loginBtn.textContent='登入中…';try{const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const d=await r.json();if(!r.ok)throw new Error('登入失敗，請確認帳號密碼');if(!isAdmin(d.access_token))throw new Error('這個帳號沒有管理權限');session=d;localStorage.setItem(STORE,JSON.stringify(d));await enter()}catch(err){loginMsg.textContent=err.message}finally{loginBtn.disabled=false;loginBtn.textContent='進入管理後台'}}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadAll(false);startAutoRefresh()}function logout(){clearInterval(autoTimer);localStorage.removeItem(STORE);location.reload()}async function boot(){const raw=localStorage.getItem(STORE);if(!raw)return;try{session=JSON.parse(raw);if(!isAdmin(session.access_token)&&!(await refreshSession()))throw 0;await enter()}catch(e){localStorage.removeItem(STORE)}}async function loadAll(checkNew=true){const oldIds=new Set(state.bookings.map(b=>b.id));const [br,ar]=await Promise.all([api('traveler_bookings?select=*&order=created_at.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc')]);if(!br.ok||!ar.ok){toast('讀取資料失敗');return}const nb=await br.json();state.bookings=nb;state.availability=await ar.json();state.lastUpdated=new Date();if(checkNew&&oldIds.size){const incoming=nb.filter(b=>!oldIds.has(b.id)&&b.status==='confirmed');if(incoming.length){toast(`有 ${incoming.length} 筆新預約`);notifyNew(incoming)}}render()}function startAutoRefresh(){clearInterval(autoTimer);autoTimer=setInterval(()=>{if(!document.hidden&&session)loadAll(true)},60000)}async function enableNotifications(){if(!('Notification'in window)){toast('這個瀏覽器不支援通知');return}const p=await Notification.requestPermission();toast(p==='granted'?'已開啟新預約通知':'通知權限未開啟')}function notifyNew(items){if(!('Notification'in window)||Notification.permission!=='granted')return;items.slice(0,3).forEach(b=>new Notification('拾光所｜有新的旅人預約',{body:`${b.traveler_name}・${b.journey}・${fmt(b.booking_date)} ${time5(b.booking_time)}`}))}function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));dashboard.classList.toggle('hidden',p!=='dashboard');bookings.classList.toggle('hidden',p!=='bookings');calendarPage.classList.toggle('hidden',p!=='calendar');render()}function render(){renderDashboard();renderBookings();renderCalendar();const newCount=state.bookings.filter(b=>b.status==='confirmed'&&(b.contact_status||'new')==='new').length;navNewBadge.textContent=newCount;navNewBadge.classList.toggle('hidden',!newCount)}function renderDashboard(){const now=today(),m=now.slice(0,7),c=state.bookings.filter(b=>b.status==='confirmed'),up=c.filter(b=>b.booking_date>=now),next=[...up].sort((a,b)=>(a.booking_date+a.booking_time).localeCompare(b.booking_date+b.booking_time)).slice(0,6),newCount=c.filter(b=>(b.contact_status||'new')==='new').length;dashboard.innerHTML=`<div class="toolbar"><div><div class="kicker">今天的拾光所</div><h2>總覽</h2><div class="sub">${fmt(now)}${state.lastUpdated?`・更新 ${state.lastUpdated.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`:''}</div></div><div class="actions"><button class="btn soft" onclick="copyLink()">複製預約網址</button><button class="btn primary" onclick="showPage('calendar')">開放時段</button></div></div><div class="notice">管理頁開著時會自動檢查新預約；需要的話，也可以開啟瀏覽器通知。</div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${c.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${c.filter(b=>b.booking_date.startsWith(m)).length}</strong></div><div class="card metric"><span>新預約待聯絡</span><strong>${newCount}</strong></div><div class="card metric"><span>可預約時段</span><strong>${state.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div><div class="card panel section"><div class="panel-title"><b>近期預約</b><button class="btn" onclick="showPage('bookings')">看全部</button></div><div class="list">${next.length?next.map(b=>`<div class="item"><div><div class="person">${esc(b.traveler_name)} <span class="badge ${badge(b.journey)}">${b.journey}</span> <span class="badge ${b.contact_status||'new'}">${contactLabel(b.contact_status||'new')}</span></div><div class="meta">${fmt(b.booking_date)}・${time5(b.booking_time)}・${esc(b.instagram)}</div></div><button class="btn" onclick="openEdit('${b.id}')">查看</button></div>`).join(''):'<div class="sub">目前沒有近期預約。</div>'}</div></div>`}function renderBookings(){bookings.innerHTML=`<div class="toolbar"><div><div class="kicker">旅人資料</div><h2>旅人預約</h2><div class="sub">查看、聯絡、備註、改期與取消。</div></div><div class="actions"><button class="btn soft" onclick="enableNotifications()">通知設定</button><button class="btn" onclick="loadAll(true)">重新整理</button></div></div><div class="filters"><input id="q" placeholder="搜尋姓名或 IG" oninput="filterRows()"><select id="fj" onchange="filterRows()"><option value="">全部旅程</option><option>初遇</option><option>拾光</option><option>同行</option></select><select id="fs" onchange="filterRows()"><option value="confirmed">已確認</option><option value="">全部預約狀態</option><option value="cancelled">已取消</option></select><select id="fc" onchange="filterRows()"><option value="">全部聯絡狀態</option><option value="new">新預約</option><option value="contacted">已聯絡</option><option value="completed">已完成</option></select></div><div id="bookingList" class="list"></div>`;filterRows()}function filterRows(){if(!bookingList)return;const qv=(q?.value||'').toLowerCase(),j=fj?.value||'',s=fs?.value||'',cs=fc?.value||'';const rows=[...state.bookings].sort((a,b)=>(a.booking_date+a.booking_time).localeCompare(b.booking_date+b.booking_time)).filter(b=>(!qv||(b.traveler_name+' '+b.instagram).toLowerCase().includes(qv))&&(!j||b.journey===j)&&(!s||b.status===s)&&(!cs||(b.contact_status||'new')===cs));bookingList.innerHTML=rows.length?rows.map(b=>`<div class="booking-card"><div class="person">${esc(b.traveler_name)} <span class="badge ${badge(b.journey)}">${b.journey}</span> <span class="badge ${b.contact_status||'new'}">${contactLabel(b.contact_status||'new')}</span></div><div class="details">${fmt(b.booking_date)}・${time5(b.booking_time)}<br>IG：${esc(b.instagram)}<br>生日：${b.birthday?fmt(b.birthday):'—'}${b.gender?'・'+esc(b.gender):''}${b.admin_note?`<br>備註：${esc(b.admin_note)}`:''}</div>${b.status==='confirmed'?`<div class="actions" style="margin-top:10px"><button class="btn" onclick="openEdit('${b.id}')">查看／編輯</button><button class="btn" onclick="downloadICS('${b.id}')">行事曆</button><button class="btn danger" onclick="cancelBooking('${b.id}')">取消</button></div>`:''}</div>`).join(''):'<div class="sub">沒有符合條件的預約。</div>'}function toDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function renderCalendar(){const [y,m]=state.month.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),start=first.getDay(),days=last.getDate(),prev=new Date(y,m-1,0).getDate();let cells=[];for(let i=0;i<42;i++){let n,d,muted=false;if(i<start){n=prev-start+i+1;d=toDate(new Date(y,m-2,n));muted=true}else if(i>=start+days){n=i-start-days+1;d=toDate(new Date(y,m,n));muted=true}else{n=i-start+1;d=`${state.month}-${String(n).padStart(2,'0')}`}const slots=state.availability.filter(a=>a.booking_date===d),booked=state.bookings.filter(b=>b.booking_date===d&&b.status==='confirmed').length,open=slots.filter(a=>a.is_open).length;cells.push(`<button class="day ${muted?'muted':''} ${slots.length?'has':''} ${d===today()?'today':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length?`<div class="count">${open} 可約<br>${booked} 已約</div>`:''}</button>`)}calendarPage.innerHTML=`<div class="toolbar"><div><div class="kicker">安排可預約時間</div><h2>開放月曆</h2><div class="sub">點日期，就能新增、開放或關閉時段。</div></div><button class="btn soft" onclick="copyLink()">複製預約網址</button></div><div class="card calendar-card"><div class="cal-head"><button class="circle" onclick="shiftMonth(-1)">‹</button><h3>${y} 年 ${m} 月</h3><button class="circle" onclick="shiftMonth(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div></div>`}function shiftMonth(n){const [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+n,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}function openSlots(date){state.slotDate=date;slotTitle.textContent=`${fmt(date)}｜設定時段`;slotTimes.value='';renderExisting();slotModal.classList.add('show')}function closeSlotModal(){slotModal.classList.remove('show')}function renderExisting(){const date=state.slotDate,slots=state.availability.filter(a=>a.booking_date===date),booked=new Set(state.bookings.filter(b=>b.booking_date===date&&b.status==='confirmed').map(b=>time5(b.booking_time)));existingSlots.innerHTML=slots.length?`<b>目前時段</b><div class="slot-row">${slots.map(a=>`<button class="slot ${a.is_open?'':'closed'}" ${booked.has(time5(a.booking_time))?'disabled':''} onclick="toggleSlot(${a.id},${!a.is_open})">${time5(a.booking_time)}${booked.has(time5(a.booking_time))?'・已預約':a.is_open?'・開放':'・關閉'}</button>`).join('')}</div>`:'<div class="sub">這一天還沒有設定時段。</div>'}async function saveSlots(){const date=state.slotDate,times=slotTimes.value.split(/[,，]/).map(x=>x.trim()).filter(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x));if(!date||!times.length){toast('請輸入有效時段');return}const booked=new Set(state.bookings.filter(b=>b.booking_date===date&&b.status==='confirmed').map(b=>time5(b.booking_time))),rows=times.filter(t=>!booked.has(t)).map(t=>({booking_date:date,booking_time:t+':00',is_open:true}));if(!rows.length){toast('沒有可新增的時段');return}const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok){toast('儲存失敗');return}await loadAll(false);renderExisting();toast('時段已更新')}async function toggleSlot(id,next){const s=state.availability.find(a=>a.id===id);if(!s)return;const has=state.bookings.some(b=>b.booking_date===s.booking_date&&time5(b.booking_time)===time5(s.booking_time)&&b.status==='confirmed');if(next&&has){toast('這個時段已有預約');return}const r=await api(`booking_availability?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({is_open:next})});if(!r.ok){toast('更新失敗');return}await loadAll(false);renderExisting()}function openEdit(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;state.editing=b;const av=state.availability.filter(a=>a.is_open||(a.booking_date===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))),dates=[...new Set(av.map(a=>a.booking_date))].sort();editBody.innerHTML=`<div class="field" style="margin-top:0"><label>旅人</label><input value="${esc(b.traveler_name)}" disabled></div><div class="field"><label>IG</label><input value="${esc(b.instagram)}" disabled></div><div class="field"><label>聯絡狀態</label><select id="editContact"><option value="new" ${(b.contact_status||'new')==='new'?'selected':''}>新預約</option><option value="contacted" ${b.contact_status==='contacted'?'selected':''}>已聯絡</option><option value="completed" ${b.contact_status==='completed'?'selected':''}>已完成</option></select></div><div class="field"><label>管理備註</label><textarea id="editNote" placeholder="例如：已透過 IG 確認、需提前提醒…">${esc(b.admin_note||'')}</textarea></div><div class="field"><label>旅程</label><select id="editJourney">${['初遇','拾光','同行'].map(j=>`<option ${j===b.journey?'selected':''}>${j}</option>`).join('')}</select></div><div class="field"><label>日期</label><select id="editDate" onchange="refreshEditTimes()">${dates.map(d=>`<option value="${d}" ${d===b.booking_date?'selected':''}>${fmt(d)}</option>`).join('')}</select></div><div class="field"><label>時段</label><select id="editTime"></select></div>`;editModal.classList.add('show');refreshEditTimes()}function refreshEditTimes(){const b=state.editing,d=editDate.value,slots=state.availability.filter(a=>a.booking_date===d&&(a.is_open||(d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))));editTime.innerHTML=slots.map(a=>`<option value="${time5(a.booking_time)}" ${d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time)?'selected':''}>${time5(a.booking_time)}</option>`).join('')}function closeEdit(){editModal.classList.remove('show');state.editing=null}async function saveEdit(){const b=state.editing;if(!b||!editTime.value)return;const body={journey:editJourney.value,booking_date:editDate.value,booking_time:editTime.value+':00',contact_status:editContact.value,admin_note:editNote.value.trim()||null},r=await api(`traveler_bookings?id=eq.${encodeURIComponent(b.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok){toast('修改失敗');return}closeEdit();await loadAll(false);toast('預約資料已更新')}async function cancelBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b||!confirm(`確定取消 ${b.traveler_name} 的預約嗎？`))return;const r=await api(`traveler_bookings?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:'cancelled'})});if(!r.ok){toast('取消失敗');return}await loadAll(false);toast('預約已取消，原時段已重新開放')}async function copyLink(){try{await navigator.clipboard.writeText(BOOKING_URL);toast('旅人預約網址已複製')}catch(e){prompt('請複製網址',BOOKING_URL)}}function mins(j){return j==='初遇'?50:75}function downloadICS(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;const [hh,mm]=time5(b.booking_time).split(':').map(Number),start=new Date(`${b.booking_date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`),end=new Date(start.getTime()+mins(b.journey)*60000),pad=n=>String(n).padStart(2,'0'),dt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;const body=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:${b.id}@shiguang\r\nDTSTART:${dt(start)}\r\nDTEND:${dt(end)}\r\nSUMMARY:拾光所｜${b.journey}｜${b.traveler_name}\r\nEND:VEVENT\r\nEND:VCALENDAR`;const blob=new Blob([body],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`拾光所_${b.booking_date}_${b.traveler_name}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}loginBtn.addEventListener('click',login);logoutBtn.addEventListener('click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));slotModal.addEventListener('click',e=>{if(e.target===slotModal)closeSlotModal()});editModal.addEventListener('click',e=>{if(e.target===editModal)closeEdit()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)loadAll(true)});boot();
</script></body></html>
