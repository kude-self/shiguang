ms:center;background:var(--sage2)}.who{font-size:11px;color:var(--muted)}.nav{padding:3px 16px 9px;display:flex;gap:7px;overflow:auto}.nav button{border:0;background:transparent;padding:9px 13px;border-radius:999px;white-space:nowrap;color:var(--soft)}.nav button.active{background:#fff;font-weight:700}.navbadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;align-items:center;justify-content:center;font-size:10px}.wrap{padding:22px 16px 72px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-start}.toolbar h2{font-size:25px;margin:0}.kicker{font-size:11px;font-weight:700;color:var(--rose);margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.metric{padding:17px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:29px;margin-top:7px}.section{margin-top:16px}.panel{padding:17px}.list{display:grid;gap:10px}.item,.booking-card{border:1px solid var(--line);background:#fff;border-radius:19px;padding:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.person{font-size:16px;font-weight:700}.meta,.details{font-size:12px;color:var(--muted);line-height:1.8;margin-top:5px}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:700}.initial,.new{background:var(--rose2);color:#8D625A}.light,.completed{background:var(--sage2);color:#617461}.walk,.contacted{background:var(--blue2);color:#5B7481}.cancel{background:#F0EEEC;color:#777}.notice{background:var(--sage2);border-radius:18px;padding:13px;font-size:12px;color:#647264;margin-bottom:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.calendar-card{padding:16px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.circle{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:50%}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:87px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px;text-align:left}.day.has{background:var(--sage2)}.day.today{outline:1px dashed #B9A89D}.num{font-size:12px;font-weight:700}.count{font-size:10px;color:var(--muted);margin-top:7px}.modal{position:fixed;inset:0;background:rgba(55,53,47,.34);display:none;place-items:center;padding:16px;z-index:50}.modal.show{display:grid}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#FBF8F4;border-radius:26px}.modal-head,.modal-foot{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.modal-body{padding:18px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.hour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.hour-option{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 7px;color:var(--soft);font-weight:700}.hour-option.selected{background:var(--sage2);border-color:#B8C9B5;color:#5D715E}.hour-option.booked{background:#F1EFED;color:#A39A93;text-decoration:line-through}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-section{padding:17px}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}.switchrow input{width:20px;height:20px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;background:#554D47;color:#fff;padding:11px 15px;border-radius:999px;transition:.2s;z-index:70}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:820px){.metrics{grid-template-columns:1fr 1fr}.filters,.settings-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:16px 12px 60px}.head,.nav{padding-left:12px;padding-right:12px}.metrics{gap:8px}.metric{padding:14px}.filters,.settings-grid{grid-template-columns:1fr}.day{min-height:64px;padding:6px;border-radius:12px}.calendar{gap:4px}.actions .btn{flex:1}.item{flex-direction:column;align-items:flex-start}.item .btn{width:100%}.hour-grid{grid-template-columns:repeat(3,1fr)}}

<div id="loginView" class="login"><div class="login-card"><div class="login-mark">𓇼</div><div class="brand">拾 光 所</div><h1>預約管理</h1><p class="sub">把旅人的預約、時間與聯絡狀態，好好整理在這裡。</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub"></div></div></div>
<div id="appView" class="hidden"><header class="header"><div class="head"><div class="head-brand"><div class="mini-mark">𓇼</div><div><b>拾光所｜預約管理</b><div id="who" class="who"></div></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約 <span id="navNewBadge" class="navbadge hidden">0</span></button><button data-page="calendar">開放月曆</button><button data-page="settings">設定</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section><section id="settingsPage" class="hidden"></section></main></div>
<div id="slotModal" class="modal"><div class="modal-card"><div class="modal-head"><b id="slotTitle">設定時段</b><button class="btn" onclick="closeSlotModal()">關閉</button></div><div class="modal-body"><div class="sub">從 10:00 開始，每小時一個時段。綠色代表開放，灰色劃線代表已有預約。</div><div id="hourGrid" class="hour-grid"></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveSlots()">儲存開放時段</button></div></div></div>
<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><b>旅人預約資料</b><button class="btn" onclick="closeEdit()">關閉</button></div><div id="editBody" class="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeEdit()">取消</button><button class="btn primary" onclick="saveEdit()">儲存變更</button></div></div></div><div id="toast" class="toast"></div><script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',BOOKING_URL='https://kude-self.github.io/shiguang/booking/',STORE='sg_booking_admin_v5',HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`);let session=null;let S={page:'dashboard',bookings:[],availability:[],settings:null,month:new Date().toISOString().slice(0,7),slotDate:'',selectedHours:new Set(),editing:null};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const time5=t=>String(t||'').slice(0,5);const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`};const badge=j=>j==='初遇'?'initial':j==='拾光'?'light':'walk';const contactLabel=s=>s==='contacted'?'已聯絡':s==='completed'?'已完成':'新預約';function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function api(path,opt={}){return fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})})}async function login(){loginMsg.textContent='';const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok||!isAdmin(d.access_token)){loginMsg.textContent='登入失敗，請確認帳號密碼';return}session=d;localStorage.setItem(STORE,JSON.stringify(d));enter()}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadAll()}function logout(){localStorage.removeItem(STORE);location.reload()}async function boot(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&isAdmin(x.access_token)){session=x;await enter()}}catch(e){}}async function loadAll(){const [br,ar,sr]=await Promise.all([api('traveler_bookings?select=*&order=booking_date.asc,booking_time.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc'),api('booking_page_settings?id=eq.1&select=*')]);if(!br.ok||!ar.ok||!sr.ok)return toast('讀取資料失敗');S.bookings=await br.json();S.availability=await ar.json();S.settings=(await sr.json())[0];render()}function showPage(p){S.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));dashboard.classList.toggle('hidden',p!=='dashboard');bookings.classList.toggle('hidden',p!=='bookings');calendarPage.classList.toggle('hidden',p!=='calendar');settingsPage.classList.toggle('hidden',p!=='settings');render()}function render(){renderDashboard();renderBookings();renderCalendar();renderSettings();const n=S.bookings.filter(b=>b.status==='confirmed'&&(b.contact_status||'new')==='new').length;navNewBadge.textContent=n;navNewBadge.classList.toggle('hidden',!n)}function renderDashboard(){const now=localToday(),c=S.bookings.filter(b=>b.status==='confirmed'),future=c.filter(b=>b.booking_date>=now),next=future.slice(0,6);dashboard.innerHTML=`<div class="toolbar"><div><div class="kicker">今天的拾光所</div><h2>總覽</h2><div class="sub">${fmt(now)}</div></div><div class="actions"><button class="btn soft" onclick="copyLink()">複製預約網址</button><button class="btn primary" onclick="showPage('calendar')">開放時段</button></div></div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${c.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${c.filter(b=>b.booking_date.startsWith(now.slice(0,7))).length}</strong></div><div class="card metric"><span>新預約待聯絡</span><strong>${c.filter(b=>(b.contact_status||'new')==='new').length}</strong></div><div class="card metric"><span>可預約時段</span><strong>${S.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div><div class="card panel section"><b>近期預約</b><div class="list section">${next.length?next.map(b=>bookingMini(b)).join(''):'<div class="sub">目前沒有近期預約。</div>'}</div></div>`}function bookingMini(b){return `<div class="item"><div><div class="person">${esc(b.traveler_name)} <span class="badge ${badge(b.journey)}">${b.journey}</span> <span class="badge ${b.contact_status||'new'}">${contactLabel(b.contact_status||'new')}</span></div><div class="meta">${fmt(b.booking_date)}・${time5(b.booking_time)}・${esc(b.instagram)}</div></div><button class="btn" onclick="openEdit('${b.id}')">查看</button></div>`}function renderBookings(){bookings.innerHTML=`<div class="toolbar"><div><div class="kicker">旅人資料</div><h2>旅人預約</h2><div class="sub">搜尋、聯絡、備註、改期與取消。</div></div><button class="btn" onclick="loadAll()">重新整理</button></div><div class="filters"><input id="q" placeholder="搜尋姓名或 IG" oninput="filterRows()"><select id="fj" onchange="filterRows()"><option value="">全部旅程</option><option>初遇</option><option>拾光</option><option>同行</option></select><select id="fs" onchange="filterRows()"><option value="confirmed">已確認</option><option value="">全部狀態</option><option value="cancelled">已取消</option></select><select id="fc" onchange="filterRows()"><option value="">全部聯絡狀態</option><option value="new">新預約</option><option value="contacted">已聯絡</option><option value="completed">已完成</option></select></div><div id="bookingList" class="list"></div>`;setTimeout(filterRows)}function filterRows(){if(!document.getElementById('bookingList'))return;const qv=(q.value||'').toLowerCase(),j=fj.value,s=fs.value,cs=fc.value;const rows=S.bookings.filter(b=>(!qv||(b.traveler_name+' '+b.instagram).toLowerCase().includes(qv))&&(!j||b.journey===j)&&(!s||b.status===s)&&(!cs||(b.contact_status||'new')===cs));bookingList.innerHTML=rows.length?rows.map(b=>`<div class="booking-card"><div class="person">${esc(b.traveler_name)} <span class="badge ${badge(b.journey)}">${b.journey}</span> <span class="badge ${b.contact_status||'new'}">${contactLabel(b.contact_status||'new')}</span></div><div class="details">${fmt(b.booking_date)}・${time5(b.booking_time)}<br>IG：${esc(b.instagram)}<br>生日：${b.birthday?fmt(b.birthday):'—'}${b.gender?'・'+esc(b.gender):''}${b.admin_note?`<br>備註：${esc(b.admin_note)}`:''}</div>${b.status==='confirmed'?`<div class="actions" style="margin-top:10px"><button class="btn" onclick="openEdit('${b.id}')">查看／編輯</button><button class="btn" onclick="downloadICS('${b.id}')">行事曆</button><button class="btn danger" onclick="cancelBooking('${b.id}')">取消</button></div>`:'<div class="badge cancel">已取消</div>'}</div>`).join(''):'<div class="sub">沒有符合條件的預約。</div>'}function renderCalendar(){const [y,m]=S.month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),start=first.getDay();let cells='';for(let i=0;i<start;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const d=`${S.month}-${String(n).padStart(2,'0')}`,slots=S.availability.filter(a=>a.booking_date===d),open=slots.filter(a=>a.is_open).length,booked=S.bookings.filter(b=>b.booking_date===d&&b.status==='confirmed').length;cells+=`<button class="day ${slots.length?'has':''} ${d===localToday()?'today':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length?`<div class="count">${open} 可約<br>${booked} 已約</div>`:''}</button>`}calendarPage.innerHTML=`<div class="toolbar"><div><div class="kicker">安排可預約時間</div><h2>開放月曆</h2><div class="sub">點日期，直接選擇 10:00～20:00 整點時段。</div></div></div><div class="card calendar-card"><div class="cal-head"><button class="circle" onclick="shiftMonth(-1)">‹</button><h3>${y} 年 ${m} 月</h3><button class="circle" onclick="shiftMonth(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}function shiftMonth(n){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1);S.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}function openSlots(date){S.slotDate=date;S.selectedHours=new Set(S.availability.filter(a=>a.booking_date===date&&a.is_open).map(a=>time5(a.booking_time)));slotTitle.textContent=`${fmt(date)}｜設定時段`;renderHourGrid();slotModal.classList.add('show')}function closeSlotModal(){slotModal.classList.remove('show')}function renderHourGrid(){const booked=new Set(S.bookings.filter(b=>b.booking_date===S.slotDate&&b.status==='confirmed').map(b=>time5(b.booking_time)));hourGrid.innerHTML=HOURS.map(t=>`<button class="hour-option ${S.selectedHours.has(t)?'selected':''} ${booked.has(t)?'booked':''}" ${booked.has(t)?'disabled':''} onclick="toggleHour('${t}')">${t}</button>`).join('')}function toggleHour(t){S.selectedHours.has(t)?S.selectedHours.delete(t):S.selectedHours.add(t);renderHourGrid()}async function saveSlots(){const booked=new Set(S.bookings.filter(b=>b.booking_date===S.slotDate&&b.status==='confirmed').map(b=>time5(b.booking_time)));const rows=HOURS.map(t=>({booking_date:S.slotDate,booking_time:t+':00',is_open:S.selectedHours.has(t)&&!booked.has(t)}));const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok)return toast('儲存失敗');await loadAll();renderHourGrid();toast('開放時段已儲存')}function openEdit(id){const b=S.bookings.find(x=>x.id===id);if(!b)return;S.editing=b;const dates=[...new Set(S.availability.filter(a=>a.is_open||(a.booking_date===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))).map(a=>a.booking_date))].sort();editBody.innerHTML=`<div class="field"><label>旅人</label><input value="${esc(b.traveler_name)}" disabled></div><div class="field"><label>IG</label><input value="${esc(b.instagram)}" disabled></div><div class="field"><label>聯絡狀態</label><select id="editContact"><option value="new" ${(b.contact_status||'new')==='new'?'selected':''}>新預約</option><option value="contacted" ${b.contact_status==='contacted'?'selected':''}>已聯絡</option><option value="completed" ${b.contact_status==='completed'?'selected':''}>已完成</option></select></div><div class="field"><label>管理備註</label><textarea id="editNote">${esc(b.admin_note||'')}</textarea></div><div class="field"><label>旅程</label><select id="editJourney">${['初遇','拾光','同行'].map(j=>`<option ${j===b.journey?'selected':''}>${j}</option>`).join('')}</select></div><div class="field"><label>日期</label><select id="editDate" onchange="refreshEditTimes()">${dates.map(d=>`<option value="${d}" ${d===b.booking_date?'selected':''}>${fmt(d)}</option>`).join('')}</select></div><div class="field"><label>時段</label><select id="editTime"></select></div>`;editModal.classList.add('show');refreshEditTimes()}function refreshEditTimes(){const b=S.editing,d=editDate.value,slots=S.availability.filter(a=>a.booking_date===d&&(a.is_open||(d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))));editTime.innerHTML=slots.map(a=>`<option value="${time5(a.booking_time)}" ${d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time)?'selected':''}>${time5(a.booking_time)}</option>`).join('')}function closeEdit(){editModal.classList.remove('show');S.editing=null}async function saveEdit(){const b=S.editing;if(!b||!editTime.value)return;const r=await api(`traveler_bookings?id=eq.${b.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({journey:editJourney.value,booking_date:editDate.value,booking_time:editTime.value+':00',contact_status:editContact.value,admin_note:editNote.value.trim()||null})});if(!r.ok)return toast('修改失敗');closeEdit();await loadAll();toast('預約資料已更新')}async function cancelBooking(id){if(!confirm('確定取消這筆預約嗎？'))return;const r=await api(`traveler_bookings?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled'})});if(!r.ok)return toast('取消失敗');await loadAll();toast('預約已取消，原時段已重新開放')}function renderSettings(){const x=S.settings;if(!x)return;settingsPage.innerHTML=`<div class="toolbar"><div><div class="kicker">旅人端內容</div><h2>設定</h2><div class="sub">這裡修改後，旅人預約頁會直接套用。</div></div><div class="actions"><button class="btn soft" onclick="window.open('${BOOKING_URL}','_blank')">預覽旅人頁</button><button class="btn primary" onclick="saveSettings()">儲存設定</button></div></div><div class="settings-grid"><div class="card settings-section"><b>首頁文字</b><div class="field"><label>頁面標題</label><input id="stTitle" value="${esc(x.booking_title)}"></div><div class="field"><label>主句</label><input id="stHeadline" value="${esc(x.headline)}"></div><div class="field"><label>副句</label><input id="stSubheadline" value="${esc(x.subheadline)}"></div><div class="field"><label>小字</label><input id="stIntro" value="${esc(x.intro_note)}"></div></div><div class="card settings-section"><b>預約提醒與完成頁</b><div class="field"><label>預約前提醒</label><textarea id="stReminder">${esc(x.reminder_text)}</textarea></div><div class="field"><label>預約完成文字</label><textarea id="stComplete">${esc(x.completion_text)}</textarea></div><div class="switchrow"><span>顯示生日欄位</span><input id="stBirthday" type="checkbox" ${x.show_birthday?'checked':''}></div><div class="switchrow"><span>顯示性別欄位</span><input id="stGender" type="checkbox" ${x.show_gender?'checked':''}></div></div>${journeySetting('初遇','initial',x)}${journeySetting('拾光','light',x)}${journeySetting('同行','walk',x)}</div>`}function journeySetting(name,key,x){return `<div class="card settings-section"><b>${name}</b><div class="switchrow"><span>旅人端顯示</span><input id="${key}Enabled" type="checkbox" ${x[key+'_enabled']?'checked':''}></div><div class="field"><label>時間標示</label><input id="${key}Time" value="${esc(x[key+'_time_label'])}"></div><div class="field"><label>旅程介紹</label><textarea id="${key}Desc">${esc(x[key+'_description'])}</textarea></div></div>`}async function saveSettings(){const body={booking_title:stTitle.value.trim(),headline:stHeadline.value.trim(),subheadline:stSubheadline.value.trim(),intro_note:stIntro.value.trim(),reminder_text:stReminder.value.trim(),completion_text:stComplete.value.trim(),show_birthday:stBirthday.checked,show_gender:stGender.checked,initial_enabled:initialEnabled.checked,initial_time_label:initialTime.value.trim(),initial_description:initialDesc.value.trim(),light_enabled:lightEnabled.checked,light_time_label:lightTime.value.trim(),light_description:lightDesc.value.trim(),walk_enabled:walkEnabled.checked,walk_time_label:walkTime.value.trim(),walk_description:walkDesc.value.trim(),updated_at:new Date().toISOString()};const r=await api('booking_page_settings?id=eq.1',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return toast('設定儲存失敗');await loadAll();toast('旅人頁設定已儲存')}async function copyLink(){try{await navigator.clipboard.writeText(BOOKING_URL);toast('預約網址已複製')}catch(e){prompt('請複製網址',BOOKING_URL)}}function mins(j){return j==='初遇'?50:75}function downloadICS(id){const b=S.bookings.find(x=>x.id===id);if(!b)return;const [h,m]=time5(b.booking_time).split(':').map(Number),start=new Date(`${b.booking_date}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`),end=new Date(start.getTime()+mins(b.journey)*60000),pad=n=>String(n).padStart(2,'0'),dt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;const text=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nDTSTART:${dt(start)}\r\nDTEND:${dt(end)}\r\nSUMMARY:拾光所｜${b.journey}｜${b.traveler_name}\r\nEND:VEVENT\r\nEND:VCALENDAR`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/calendar'}));a.download=`拾光所_${b.booking_date}_${b.traveler_name}.ics`;a.click()}loginBtn.addEventListener('click',login);logoutBtn.addEventListener('click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));boot();
</script></body></html>
