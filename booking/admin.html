<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>拾光所｜預約管理</title><style>
:root{--rose:#C9938A;--rose2:#F5E4E0;--sage:#93A994;--sage2:#E7EFE5;--blue:#89A8B8;--blue2:#E8F1F5;--cream:#FBF3EA;--paper:#FFFDFC;--ink:#4B4540;--soft:#786F68;--muted:#A39A93;--line:#EAE1DA;--shadow:0 14px 36px rgba(91,72,59,.08)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#FBF8F4;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login-card,.card{background:#FFFDFC;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.login-card{width:min(430px,100%);padding:28px 22px;text-align:center}.login-mark{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--rose2);font-size:25px}.brand{font-size:13px;font-weight:700;letter-spacing:.18em;color:#8D8077}.login-card h1{font-size:28px;margin:8px 0}.sub{font-size:13px;color:var(--muted);line-height:1.75}.field{text-align:left;margin-top:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--soft)}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 13px;color:var(--ink);outline:none}textarea{min-height:90px}.btn{border:1px solid var(--line);background:#fff;color:var(--soft);padding:11px 15px;border-radius:999px;font-weight:700}.btn.primary{background:var(--rose);color:#fff;border-color:transparent}.btn.soft{background:var(--cream)}.btn.danger{background:#FFF5F3;color:#9A615B}.login-card .btn{width:100%;margin-top:17px}.header{position:sticky;top:0;z-index:20;background:rgba(251,248,244,.94);border-bottom:1px solid var(--line)}.head,.nav,.wrap{max-width:1080px;margin:auto}.head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.head-brand{display:flex;gap:10px;align-items:center}.mini-mark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sage2)}.who{font-size:11px;color:var(--muted)}.nav{padding:3px 16px 9px;display:flex;gap:7px;overflow:auto}.nav button{border:0;background:transparent;padding:9px 13px;border-radius:999px;white-space:nowrap;color:var(--soft)}.nav button.active{background:#fff;font-weight:700}.navbadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;align-items:center;justify-content:center;font-size:10px}.wrap{padding:22px 16px 72px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{font-size:25px;margin:0}.kicker{font-size:11px;font-weight:700;color:var(--rose)}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.metric{padding:17px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;font-size:29px;margin-top:7px}.section{margin-top:16px}.panel{padding:17px}.list{display:grid;gap:10px}.item,.booking-card{border:1px solid var(--line);background:#fff;border-radius:19px;padding:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.person{font-size:16px;font-weight:700}.meta,.details{font-size:12px;color:var(--muted);line-height:1.8;margin-top:5px}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:700}.initial,.new{background:var(--rose2);color:#8D625A}.light,.completed{background:var(--sage2);color:#617461}.walk,.contacted{background:var(--blue2);color:#5B7481}.notice{background:var(--sage2);border-radius:18px;padding:13px;font-size:12px;color:#647264;margin-bottom:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.calendar-card{padding:16px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.circle{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:50%}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:87px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px;text-align:left}.day.muted{opacity:.25}.day.has{background:var(--sage2)}.num{font-size:12px;font-weight:700}.count{font-size:10px;color:var(--muted);margin-top:7px}.modal{position:fixed;inset:0;background:rgba(55,53,47,.34);display:none;place-items:center;padding:16px;z-index:50}.modal.show{display:grid}.modal-card{width:min(620px,100%);max-height:90vh;overflow:auto;background:#FBF8F4;border-radius:26px}.modal-head,.modal-foot{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.modal-body{padding:18px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.hour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.hour-option{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 7px;color:var(--soft);font-weight:700}.hour-option.selected{background:var(--sage2);border-color:#B8C9B5;color:#5D715E}.hour-option.booked{background:#F1EFED;color:#A39A93;text-decoration:line-through}.slot-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.slot{border:0;border-radius:999px;padding:9px 11px;background:var(--sage2);color:#617461;font-size:11px}.slot.closed{background:var(--rose2);color:#8D625A;text-decoration:line-through}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;background:#554D47;color:#fff;padding:11px 15px;border-radius:999px;transition:.2s;z-index:70}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:820px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:620px){.wrap{padding:16px 12px 60px}.head,.nav{padding-left:12px;padding-right:12px}.metrics{gap:8px}.metric{padding:14px}.filters{grid-template-columns:1fr}.day{min-height:64px;padding:6px;border-radius:12px}.calendar{gap:4px}.hour-grid{grid-template-columns:repeat(3,1fr)}.actions .btn{flex:1}.item{flex-direction:column;align-items:flex-start}.item .btn{width:100%}}
</style></head><body>
<div id="loginView" class="login"><div class="login-card"><div class="login-mark">𓇼</div><div class="brand">拾 光 所</div><h1>預約管理</h1><p class="sub">把旅人的預約與時間，好好整理在這裡。</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub"></div></div></div>
<div id="appView" class="hidden"><header class="header"><div class="head"><div class="head-brand"><div class="mini-mark">𓇼</div><div><b>拾光所｜預約管理</b><div id="who" class="who"></div></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約 <span id="navNewBadge" class="navbadge hidden">0</span></button><button data-page="calendar">開放月曆</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section></main></div>
<div id="slotModal" class="modal"><div class="modal-card"><div class="modal-head"><b id="slotTitle">設定時段</b><button class="btn" onclick="closeSlotModal()">關閉</button></div><div class="modal-body"><div class="field" style="margin-top:0"><label>選擇要開放的時段</label><div class="sub">從 10:00 開始，每小時一個時段。可一次選擇多個。</div><div id="hourGrid" class="hour-grid"></div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveSlots()">儲存開放時段</button><div id="existingSlots" class="section"></div></div></div></div>
<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><b>旅人預約資料</b><button class="btn" onclick="closeEdit()">關閉</button></div><div id="editBody" class="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeEdit()">取消</button><button class="btn primary" onclick="saveEdit()">儲存變更</button></div></div></div><div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',BOOKING_URL='https://kude-self.github.io/shiguang/booking/',STORE='sg_booking_admin_stable_v3',HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`);let session=null,autoTimer=null;let state={page:'dashboard',bookings:[],availability:[],month:new Date().toISOString().slice(0,7),slotDate:'',editing:null,lastUpdated:null,selectedHours:new Set()};const esc=s=>String(s??'');const time5=t=>String(t||'').slice(0,5);const today=()=>new Date().toISOString().slice(0,10);const fmt=d=>d||'';const badge=j=>j==='初遇'?'initial':j==='拾光'?'light':'walk';const contactLabel=s=>s==='contacted'?'已聯絡':s==='completed'?'已完成':'新預約';function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function jwt(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return {}}}function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}async function refreshSession(){if(!session?.refresh_token)return false;const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refreshSession())return api(path,opt,false);return r}async function login(){const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok||!isAdmin(d.access_token)){loginMsg.textContent='登入失敗，請確認帳號密碼';return}session=d;localStorage.setItem(STORE,JSON.stringify(d));enter()}async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadAll();}async function boot(){try{session=JSON.parse(localStorage.getItem(STORE));if(session)await enter()}catch(e){}}function logout(){localStorage.removeItem(STORE);location.reload()}async function loadAll(){const [br,ar]=await Promise.all([api('traveler_bookings?select=*&order=created_at.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc')]);if(!br.ok||!ar.ok)return toast('讀取資料失敗');state.bookings=await br.json();state.availability=await ar.json();render()}function showPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));dashboard.classList.toggle('hidden',p!=='dashboard');bookings.classList.toggle('hidden',p!=='bookings');calendarPage.classList.toggle('hidden',p!=='calendar');render()}function render(){renderDashboard();renderBookings();renderCalendar();const n=state.bookings.filter(b=>b.status==='confirmed'&&(b.contact_status||'new')==='new').length;navNewBadge.textContent=n;navNewBadge.classList.toggle('hidden',!n)}function renderDashboard(){const c=state.bookings.filter(b=>b.status==='confirmed'),now=today();dashboard.innerHTML=`<div class="toolbar"><div><div class="kicker">今天的拾光所</div><h2>總覽</h2></div><button class="btn primary" onclick="showPage('calendar')">開放時段</button></div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${c.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${c.filter(b=>b.booking_date.startsWith(now.slice(0,7))).length}</strong></div><div class="card metric"><span>新預約</span><strong>${c.filter(b=>(b.contact_status||'new')==='new').length}</strong></div><div class="card metric"><span>可預約時段</span><strong>${state.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div>`}function renderBookings(){bookings.innerHTML=`<div class="toolbar"><h2>旅人預約</h2></div><div id="bookingList" class="list">${state.bookings.map(b=>`<div class="booking-card"><div class="person">${esc(b.traveler_name)} <span class="badge ${badge(b.journey)}">${b.journey}</span></div><div class="details">${b.booking_date}・${time5(b.booking_time)}<br>IG：${esc(b.instagram)}</div>${b.status==='confirmed'?`<div class="actions"><button class="btn" onclick="openEdit('${b.id}')">查看／編輯</button><button class="btn danger" onclick="cancelBooking('${b.id}')">取消</button></div>`:''}</div>`).join('')}</div>`}function toDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function renderCalendar(){const [y,m]=state.month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),start=first.getDay();let cells='';for(let i=0;i<start;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const d=`${state.month}-${String(n).padStart(2,'0')}`,slots=state.availability.filter(a=>a.booking_date===d),open=slots.filter(a=>a.is_open).length,booked=state.bookings.filter(b=>b.booking_date===d&&b.status==='confirmed').length;cells+=`<button class="day ${slots.length?'has':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length?`<div class="count">${open} 可約<br>${booked} 已約</div>`:''}</button>`}calendarPage.innerHTML=`<div class="toolbar"><div><div class="kicker">安排可預約時間</div><h2>開放月曆</h2><div class="sub">點日期後，直接選擇整點時段。</div></div></div><div class="card calendar-card"><div class="cal-head"><button class="circle" onclick="shiftMonth(-1)">‹</button><h3>${y} 年 ${m} 月</h3><button class="circle" onclick="shiftMonth(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}function shiftMonth(n){const [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+n,1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}function openSlots(date){state.slotDate=date;state.selectedHours=new Set(state.availability.filter(a=>a.booking_date===date&&a.is_open).map(a=>time5(a.booking_time)));slotTitle.textContent=`${date}｜設定時段`;renderHourGrid();renderExisting();slotModal.classList.add('show')}function closeSlotModal(){slotModal.classList.remove('show')}function renderHourGrid(){const booked=new Set(state.bookings.filter(b=>b.booking_date===state.slotDate&&b.status==='confirmed').map(b=>time5(b.booking_time)));hourGrid.innerHTML=HOURS.map(t=>`<button class="hour-option ${state.selectedHours.has(t)?'selected':''} ${booked.has(t)?'booked':''}" ${booked.has(t)?'disabled':''} onclick="toggleHour('${t}')">${t}</button>`).join('')}function toggleHour(t){state.selectedHours.has(t)?state.selectedHours.delete(t):state.selectedHours.add(t);renderHourGrid()}function renderExisting(){const slots=state.availability.filter(a=>a.booking_date===state.slotDate);existingSlots.innerHTML=slots.length?`<div class="sub">目前已建立：${slots.map(a=>time5(a.booking_time)).join('、')}</div>`:'<div class="sub">這一天還沒有建立時段。</div>'}async function saveSlots(){const date=state.slotDate,booked=new Set(state.bookings.filter(b=>b.booking_date===date&&b.status==='confirmed').map(b=>time5(b.booking_time)));const existing=state.availability.filter(a=>a.booking_date===date);const rows=HOURS.map(t=>({booking_date:date,booking_time:t+':00',is_open:state.selectedHours.has(t)||booked.has(t)}));const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok)return toast('儲存失敗');await loadAll();renderHourGrid();renderExisting();toast('開放時段已儲存')}function openEdit(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;state.editing=b;editBody.innerHTML=`<div class="field"><label>旅人</label><input value="${esc(b.traveler_name)}" disabled></div><div class="field"><label>旅程</label><select id="editJourney">${['初遇','拾光','同行'].map(j=>`<option ${j===b.journey?'selected':''}>${j}</option>`).join('')}</select></div><div class="field"><label>日期</label><input id="editDate" type="date" value="${b.booking_date}"></div><div class="field"><label>時段</label><select id="editTime">${HOURS.map(t=>`<option ${time5(b.booking_time)===t?'selected':''}>${t}</option>`).join('')}</select></div>`;editModal.classList.add('show')}function closeEdit(){editModal.classList.remove('show')}async function saveEdit(){const b=state.editing;if(!b)return;const r=await api(`traveler_bookings?id=eq.${b.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({journey:editJourney.value,booking_date:editDate.value,booking_time:editTime.value+':00'})});if(!r.ok)return toast('修改失敗');closeEdit();await loadAll();toast('預約已更新')}async function cancelBooking(id){if(!confirm('確定取消這筆預約嗎？'))return;const r=await api(`traveler_bookings?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled'})});if(!r.ok)return toast('取消失敗');await loadAll();toast('預約已取消')}loginBtn.addEventListener('click',login);logoutBtn.addEventListener('click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));boot();
</script></body></html>
