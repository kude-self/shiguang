<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><title>拾光所｜預約管理</title><style>html,body{margin:0;width:100%;height:100%;background:#FBF8F4}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="adminFrame" src="admin-v4.html?v=20260820workflow3" title="拾光所預約管理"></iframe><script>
const f=document.getElementById('adminFrame');
function sync(){try{const w=f.contentWindow;if(w&&w.session&&typeof w.loadAll==='function')w.loadAll()}catch(e){}}
function installEnhancements(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||typeof w.loadAll!=='function')return;
const style=d.createElement('style');style.textContent=`.cancel-confirm-layer{position:fixed;inset:0;background:rgba(55,53,47,.38);z-index:9999;display:none;align-items:flex-end;justify-content:center;padding:10px}.cancel-confirm-layer.show{display:flex}.cancel-confirm-card{width:min(520px,100%);background:#FFFDFC;border:1px solid #EAE1DA;border-radius:28px 28px 20px 20px;padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 18px 48px rgba(70,55,45,.18);text-align:center}.cancel-confirm-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:#FFF1EF;color:#A96F66;font-size:24px}.cancel-confirm-card h3{margin:0 0 8px;font-size:21px;color:#4B4540}.cancel-confirm-card p{margin:0 0 16px;color:#786F68;font-size:13px;line-height:1.8}.cancel-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cancel-confirm-actions button{min-height:48px}.cancel-confirm-card .danger-confirm{border:0;background:#C9938A;color:white}.booking[data-workflow="attention"]{border:2px solid #D6A69C!important}.booking[data-workflow="overdue"]{border:2px solid #C88278!important;background:linear-gradient(180deg,#FFFDFC,#FFF3EF)!important}.booking[data-workflow="ready"]{border:2px solid #AFC7AD!important;background:linear-gradient(180deg,#fff,#F5FAF3)!important}.booking[data-workflow="confirmed"]{border-color:#C9D9C6!important}.booking[data-workflow="cancelled"]{opacity:.68;border-style:dashed!important;background:#F7F5F3!important}.workflow-note{margin-top:9px;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:750;line-height:1.55}.workflow-note.attention{background:#FFF0EA;color:#95665C}.workflow-note.overdue{background:#FCE3DE;color:#8E554C}.workflow-note.ready{background:#EAF4E8;color:#587158}.workflow-note.confirmed{background:#EAF2F5;color:#5B7481}.workflow-note.cancelled{background:#EFEEEC;color:#777}.created-note{margin-top:7px;color:#A39A93;font-size:10px}.admin-todo{margin:0 0 14px;padding:14px 15px;border:1px solid #E7DAD2;border-radius:20px;background:linear-gradient(135deg,#FFF9F5,#F5F8F1)}.admin-todo strong{display:block;font-size:15px;margin-bottom:7px}.admin-todo-row{display:flex;gap:7px;flex-wrap:wrap}.admin-chip{display:inline-flex;align-items:center;padding:7px 10px;border-radius:99px;background:#fff;border:1px solid #EAE1DA;font-size:11px;font-weight:800}.admin-chip.hot{background:#FFF0EA;color:#95665C}.admin-chip.alert{background:#FCE3DE;color:#8E554C}.admin-chip.ok{background:#EDF5EB;color:#587158}.inline-action{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap}.inline-action .btn{min-height:36px;padding:7px 10px;font-size:11px}.system-alert{margin:0 0 12px;padding:12px 14px;border-radius:17px;background:#FFF1EF;border:1px solid #EAC9C4;color:#8E554C;font-size:12px;font-weight:800}.journey-reminder{background:#F3F0FA!important;color:#6E6580!important;border-color:#DDD5E8!important}`;d.head.appendChild(style);
const layer=d.createElement('div');layer.id='cancelConfirmLayer';layer.className='cancel-confirm-layer';layer.innerHTML=`<div class="cancel-confirm-card"><div class="cancel-confirm-icon">♡</div><h3>確定取消這筆預約嗎？</h3><p id="cancelConfirmText">取消後，這個時段會重新開放。<br>如果旅人已連結官方 LINE，也會同步通知旅人。</p><div class="cancel-confirm-actions"><button id="cancelBackBtn" class="btn">先不要</button><button id="cancelYesBtn" class="btn danger-confirm">確認取消</button></div></div>`;d.body.appendChild(layer);
let cancelId=null;const back=d.getElementById('cancelBackBtn'),yes=d.getElementById('cancelYesBtn');back.onclick=()=>{cancelId=null;layer.classList.remove('show')};layer.onclick=e=>{if(e.target===layer){cancelId=null;layer.classList.remove('show')}};
w.cancelBooking=function(id){cancelId=id;const b=w.state?.bookings?.find(x=>x.id===id);const t=d.getElementById('cancelConfirmText');if(t&&b)t.innerHTML=`旅人：<b>${w.esc(b.traveler_name)}</b><br>${b.booking_date}・${w.time5(b.booking_time)}<br><br>取消後，這個時段會重新開放。${b.line_user_id?'<br>旅人也會收到官方 LINE 取消通知。':''}`;layer.classList.add('show')};
yes.onclick=async()=>{if(!cancelId)return;const id=cancelId;yes.disabled=true;yes.textContent='正在取消…';try{let ok=false,lineFailed=false;try{const r=await fetch(`${w.U}/functions/v1/booking-cancel`,{method:'POST',headers:w.headers({'Content-Type':'application/json'}),body:JSON.stringify({booking_id:id})});ok=r.ok;if(!r.ok)lineFailed=true}catch(e){lineFailed=true}if(!ok){const r2=await w.api(`traveler_bookings?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled'})});if(!r2.ok)throw new Error('fallback cancel failed')}layer.classList.remove('show');cancelId=null;await w.loadAll();w.toast(lineFailed?'預約已取消、時段已釋放；LINE 通知未送出':'預約已取消，時段已釋放 ♡')}catch(e){w.toast('取消失敗，請再試一次')}finally{yes.disabled=false;yes.textContent='確認取消'}};
async function copyText(text,msg){try{await navigator.clipboard.writeText(text)}catch(e){const ta=d.createElement('textarea');ta.value=text;d.body.appendChild(ta);ta.select();d.execCommand('copy');ta.remove()}w.toast(msg||'已複製 ♡')}
w.copyLineReminder=function(id){const b=w.state?.bookings?.find(x=>x.id===id);if(!b)return;return copyText(`嗨 ${b.traveler_name} ♡\n我有收到你的拾光所預約資料。\n目前還差最後一步：請加入拾光所官方 LINE，並貼上你的預約資料，完成後我才能為你確認預約。\n\n${b.journey}｜${b.booking_date}｜${w.time5(b.booking_time)}\n\n是否預約成功，一律以官方 LINE 的確認通知為準。`,'提醒文字已複製 ♡')};
w.copyJourneyReminder=function(id){const b=w.state?.bookings?.find(x=>x.id===id);if(!b)return;const j=String(b.journey||'');let prep='請為自己留一段不被打擾的時間，準備一杯水，找一個可以安心坐著或躺著的位置。';if(j.includes('初遇'))prep='請為自己留一段不被打擾的時間，準備一杯水。開始前，也可以想一想：此刻最想整理的是什麼？不需要先找到答案。';else if(j.includes('拾光'))prep='請帶著最近一週最有感的事件、情緒或反覆出現的念頭前來。不需要整理得很完整，真實就好。';else if(j.includes('同行'))prep='可以先回想最近生活裡真正發生的改變、卡住的地方，或這段時間想繼續練習的一件事。';return copyText(`𓇼 拾光所｜旅程前的小提醒\n\n親愛的 ${b.traveler_name}，\n你的「${j}」已完成預約 ♡\n\n日期｜${b.booking_date}\n時間｜${w.time5(b.booking_time)}\n\n${prep}\n\n慢慢來，帶著此刻真實的自己前來就好。\n𓇼 拾光所`,'旅程前提醒已複製 ♡')};
function decorate(){try{const bs=w.state?.bookings||[],now=Date.now(),overdueIds=new Set(bs.filter(x=>x.status==='pending'&&!x.line_user_id&&x.created_at&&(now-new Date(x.created_at).getTime())>=86400000).map(x=>x.id));[...d.querySelectorAll('.booking')].forEach(card=>{if(card.querySelector('.workflow-note'))return;const txt=card.innerText||'';const b=bs.find(x=>txt.includes(String(x.traveler_name||''))&&txt.includes(String(x.booking_date||''))&&txt.includes(w.time5(x.booking_time)));if(!b)return;let mode='attention',msg='待處理｜等待旅人加入官方 LINE 並完成確認。';if(b.status==='cancelled'){mode='cancelled';msg='已取消｜此筆保留作紀錄，原時段已重新釋放。'}else if(b.status==='confirmed'){mode='confirmed';msg='已確認｜預約完成，可直接準備旅程前提醒。'}else if(b.line_user_id){mode='ready';msg='可確認｜旅人已連結官方 LINE，可以進行預約確認。'}else if(overdueIds.has(b.id)){mode='overdue';msg='已超過 24 小時｜旅人尚未加入官方 LINE，建議主動提醒。'}card.dataset.workflow=mode;const n=d.createElement('div');n.className='workflow-note '+mode;n.textContent=msg;const actions=card.querySelector('.actions');actions?card.insertBefore(n,actions):card.appendChild(n);if(mode==='overdue'){const a=d.createElement('div');a.className='inline-action';a.innerHTML=`<button class="btn soft" onclick="copyLineReminder('${b.id}')">複製 LINE 提醒文字</button>`;n.after(a)}if(mode==='confirmed'){const a=d.createElement('div');a.className='inline-action';a.innerHTML=`<button class="btn journey-reminder" onclick="copyJourneyReminder('${b.id}')">♡ 複製旅程前提醒</button>`;n.after(a)}if(b.created_at){const c=d.createElement('div');c.className='created-note';try{c.textContent='送出時間：'+new Date(b.created_at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{};n.after(c)}});
const dash=d.getElementById('dashboard');if(dash&&!dash.querySelector('.admin-todo')){const pending=bs.filter(x=>x.status==='pending'),ready=pending.filter(x=>x.line_user_id),waiting=pending.filter(x=>!x.line_user_id),overdue=waiting.filter(x=>x.created_at&&(now-new Date(x.created_at).getTime())>=86400000),failed=bs.filter(x=>x.status!=='cancelled'&&x.notification_status==='failed');if(failed.length){const al=d.createElement('div');al.className='system-alert';al.textContent=`⚠ 有 ${failed.length} 筆管理者 LINE 通知發送失敗，請到旅人預約中確認。`;dash.prepend(al)}const box=d.createElement('div');box.className='admin-todo';box.innerHTML=`<strong>今天需要留意 ♡</strong><div class="admin-todo-row"><span class="admin-chip ${ready.length?'hot':'ok'}">可確認 ${ready.length}</span><span class="admin-chip ${waiting.length?'hot':'ok'}">等待 LINE ${waiting.length}</span><span class="admin-chip ${overdue.length?'alert':'ok'}">逾時 24h ${overdue.length}</span><span class="admin-chip ${failed.length?'alert':'ok'}">通知失敗 ${failed.length}</span><span class="admin-chip ok">已確認 ${bs.filter(x=>x.status==='confirmed').length}</span></div>`;dash.prepend(box)}}catch(e){console.error('decorate failed',e)}}
const oldLoad=w.loadAll;w.loadAll=async function(){const r=await oldLoad.apply(this,arguments);setTimeout(decorate,60);return r};setTimeout(decorate,100);
}catch(e){console.error('enhancement install failed',e)}}
f.addEventListener('load',()=>{installEnhancements();setTimeout(sync,400)});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});setInterval(sync,30000);
</script></body></html>
