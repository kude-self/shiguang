<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF3EE">
<title>拾光所｜預約管理</title>
<style>
:root{--pink:#C9938A;--light-pink:#F5E6E3;--blue:#7A9BAD;--light-blue:#E3EDF3;--sage:#9AAE9B;--light-sage:#E8F0E8;--cream:#FAF3EE;--bg:#FAFAF8;--dark:#37352F;--medium:#5A5248;--gray:#9B9A97;--line:#E8E3DE;--shadow:0 10px 28px rgba(55,53,47,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.login-card{width:min(430px,100%);padding:26px}.mark{font-size:13px;color:var(--sage);font-weight:700;letter-spacing:.08em}h1{font-size:28px;margin:8px 0}.sub{font-size:13px;color:var(--gray);line-height:1.7}.field{display:grid;gap:6px;margin-top:13px}label{font-size:12px;font-weight:700;color:var(--medium)}input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--dark);outline:none}.btn{border:1px solid var(--line);background:#fff;color:var(--dark);padding:10px 13px;border-radius:12px;font-weight:700}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.login-card .btn{width:100%;margin-top:17px}.header{position:sticky;top:0;z-index:20;background:rgba(250,250,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.head{max-width:1080px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand b{display:block}.brand span{font-size:11px;color:var(--gray)}.nav{max-width:1080px;margin:auto;padding:6px 16px 9px;display:flex;gap:6px;overflow:auto}.nav button{border:0;background:transparent;color:var(--medium);padding:9px 12px;border-radius:11px;white-space:nowrap}.nav button.active{background:var(--cream);font-weight:700}.wrap{max-width:1080px;margin:auto;padding:20px 16px 70px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar h2{margin:0 0 3px;font-size:24px}.grid{display:grid;gap:10px}.metrics{grid-template-columns:repeat(4,1fr)}.metric{padding:15px}.metric span{font-size:11px;color:var(--gray)}.metric strong{display:block;font-size:27px;margin-top:6px}.metric:nth-child(1){border-top:4px solid var(--sage)}.metric:nth-child(2){border-top:4px solid var(--blue)}.metric:nth-child(3){border-top:4px solid var(--pink)}.metric:nth-child(4){border-top:4px solid #D9BA98}.section{margin-top:15px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:11px}.meta{font-size:11px;color:var(--gray);margin-top:4px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700}.badge.initial{background:var(--light-pink);color:#845d56}.badge.light{background:var(--light-sage);color:#60735e}.badge.walk{background:var(--light-blue);color:#55707d}.badge.cancel{background:#f1efed;color:#777}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;min-width:860px;border-collapse:collapse;background:#fff}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{font-size:10px;color:var(--gray);background:#FCFBF9}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;font-size:11px}.slot-block{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px;background:#fff}.slot-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.slots{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.slot{border:0;border-radius:999px;padding:8px 10px;background:var(--light-sage);font-size:11px}.slot.closed{background:var(--light-pink);color:#8a5e56;text-decoration:line-through}.empty{text-align:center;color:var(--gray);padding:26px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;background:var(--dark);color:#fff;padding:10px 13px;border-radius:10px;transition:.2s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:16px 12px 60px}.head,.nav{padding-left:12px;padding-right:12px}.metric strong{font-size:23px}.login-card{padding:22px}}
</style>
</head>
<body>
<div id="loginView" class="login-wrap"><div class="login-card"><div class="mark">𓇼 拾光所</div><h1>預約管理</h1><p class="sub">管理者專用。登入後可以查看旅人預約與設定開放時段。</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">登入管理後台</button><div id="loginMsg" class="sub" style="margin-top:10px;color:#9a5d56"></div></div></div>
<div id="appView" class="hidden"><header class="header"><div class="head"><div class="brand"><b>𓇼 拾光所｜預約管理</b><span id="who">管理者</span></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約</button><button data-page="availability">開放時段</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="availability" class="hidden"></section></main></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://tgfxrbghzzttqbpfwypw.supabase.co';
const SUPABASE_KEY='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';
const STORE='sg_booking_admin_session_v1';
let session=null;
let state={page:'dashboard',bookings:[],availability:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const time5=t=>String(t||'').slice(0,5);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function badgeClass(j){return j==='初遇'?'initial':j==='拾光'?'light':'walk'}
function decodeJwt(token){try{const p=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return {}}}
function isAdmin(token){return decodeJwt(token)?.app_metadata?.role==='admin'}
function headers(extra={}){return {apikey:SUPABASE_KEY,Authorization:`Bearer ${session.access_token}`,...extra}}
async function refreshSession(){if(!session?.refresh_token)return false;try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}catch(e){return false}}
async function api(path,options={},retry=true){let r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...options,headers:headers(options.headers||{})});if(r.status===401&&retry&&await refreshSession())return api(path,options,false);return r}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg'),btn=document.getElementById('loginBtn');if(!email||!password){msg.textContent='請輸入 Email 與密碼';return}btn.disabled=true;btn.textContent='登入中…';msg.textContent='';try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error('登入失敗，請確認帳號密碼');if(!isAdmin(d.access_token))throw new Error('這個帳號沒有管理權限');session=d;localStorage.setItem(STORE,JSON.stringify(d));await enterAdmin()}catch(e){msg.textContent=e.message}finally{btn.disabled=false;btn.textContent='登入管理後台'}}
async function enterAdmin(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('who').textContent=decodeJwt(session.access_token).email||'管理者';await loadAll()}
function logout(){localStorage.removeItem(STORE);session=null;location.reload()}
async function boot(){const raw=localStorage.getItem(STORE);if(!raw)return;try{session=JSON.parse(raw);if(!isAdmin(session.access_token)&&!(await refreshSession()))throw new Error();await enterAdmin()}catch(e){localStorage.removeItem(STORE)}}
async function loadAll(){try{const [br,ar]=await Promise.all([api('traveler_bookings?select=*&order=booking_date.asc,booking_time.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc')]);if(!br.ok||!ar.ok)throw new Error('讀取資料失敗');state.bookings=await br.json();state.availability=await ar.json();render()}catch(e){toast(e.message)}}
function render(){renderDashboard();renderBookings();renderAvailability()}
function renderDashboard(){const now=today(),month=now.slice(0,7),confirmed=state.bookings.filter(b=>b.status==='confirmed'),upcoming=confirmed.filter(b=>b.booking_date>=now),open=state.availability.filter(a=>a.is_open&&a.booking_date>=now),next=[...upcoming].sort((a,b)=>(a.booking_date+a.booking_time).localeCompare(b.booking_date+b.booking_time)).slice(0,6);document.getElementById('dashboard').innerHTML=`<div class="toolbar"><div><h2>總覽</h2><div class="sub">${fmt(now)}｜近期旅程安排</div></div><button class="btn primary" onclick="showPage('availability')">＋ 開放時段</button></div><div class="grid metrics"><div class="card metric"><span>本月預約</span><strong>${confirmed.filter(b=>b.booking_date.startsWith(month)).length}</strong></div><div class="card metric"><span>接下來預約</span><strong>${upcoming.length}</strong></div><div class="card metric"><span>可預約時段</span><strong>${open.length}</strong></div><div class="card metric"><span>旅人人數</span><strong>${new Set(state.bookings.map(b=>b.traveler_name)).size}</strong></div></div><div class="card section"><div class="toolbar"><b>近期預約</b></div><div class="list">${next.length?next.map(b=>`<div class="item"><div><b>${esc(b.traveler_name)}</b> <span class="badge ${badgeClass(b.journey)}">${esc(b.journey)}</span><div class="meta">${fmt(b.booking_date)} ・ ${time5(b.booking_time)} ・ ${esc(b.instagram)}</div></div></div>`).join(''):'<div class="empty">目前沒有近期預約</div>'}</div></div>`}
function renderBookings(){document.getElementById('bookings').innerHTML=`<div class="toolbar"><div><h2>旅人預約</h2><div class="sub">查看、搜尋與取消預約。</div></div><button class="btn" onclick="loadAll()">重新整理</button></div><div class="card" style="padding:15px"><div class="filters"><input id="q" placeholder="搜尋姓名或 IG"><select id="fj"><option value="">全部旅程</option><option>初遇</option><option>拾光</option><option>同行</option></select><select id="fs"><option value="">全部狀態</option><option value="confirmed">已確認</option><option value="cancelled">已取消</option></select></div><div id="rows"></div></div>`;['q','fj','fs'].forEach(id=>document.getElementById(id).addEventListener('input',filterBookings));filterBookings()}
function filterBookings(){const q=(document.getElementById('q')?.value||'').toLowerCase(),j=document.getElementById('fj')?.value||'',s=document.getElementById('fs')?.value||'',rows=state.bookings.filter(b=>(!q||(b.traveler_name+' '+b.instagram).toLowerCase().includes(q))&&(!j||b.journey===j)&&(!s||b.status===s)),root=document.getElementById('rows');if(!root)return;root.innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>旅人</th><th>旅程</th><th>日期</th><th>時段</th><th>IG</th><th>生日／性別</th><th>狀態</th><th>操作</th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>${esc(b.traveler_name)}</b></td><td><span class="badge ${badgeClass(b.journey)}">${esc(b.journey)}</span></td><td>${fmt(b.booking_date)}</td><td>${time5(b.booking_time)}</td><td>${esc(b.instagram)}</td><td>${b.birthday?fmt(b.birthday):'—'}${b.gender?'・'+esc(b.gender):''}</td><td><span class="badge ${b.status==='confirmed'?'light':'cancel'}">${b.status==='confirmed'?'已確認':'已取消'}</span></td><td>${b.status==='confirmed'?`<div class="actions"><button class="mini" onclick="cancelBooking('${b.id}')">取消</button></div>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">沒有符合條件的預約</div>'}
function renderAvailability(){const grouped={};state.availability.forEach(a=>(grouped[a.booking_date]??=[]).push(a));const dates=Object.keys(grouped).sort();document.getElementById('availability').innerHTML=`<div class="toolbar"><div><h2>開放時段</h2><div class="sub">新增日期與時間後，旅人端會自動顯示。</div></div><button class="btn" onclick="loadAll()">重新整理</button></div><div class="card" style="padding:15px"><div class="field"><label>日期</label><input id="slotDate" type="date"></div><div class="field"><label>新增時段</label><input id="slotTimes" placeholder="例如：10:00, 14:00, 16:30"></div><button class="btn primary" onclick="addSlots()">儲存開放時段</button><div class="section">${dates.length?dates.map(d=>`<div class="slot-block"><div class="slot-head"><b>${fmt(d)}</b></div><div class="slots">${grouped[d].map(a=>`<button class="slot ${a.is_open?'':'closed'}" onclick="toggleSlot(${a.id},${!a.is_open})">${time5(a.booking_time)}${a.is_open?'・開放':'・關閉'}</button>`).join('')}</div></div>`).join(''):'<div class="empty">目前尚未設定開放時段。</div>'}</div></div>`}
async function addSlots(){const d=document.getElementById('slotDate').value,times=document.getElementById('slotTimes').value.split(/[,，]/).map(x=>x.trim()).filter(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x));if(!d||!times.length){toast('請輸入日期與有效時段');return}const booked=new Set(state.bookings.filter(b=>b.booking_date===d&&b.status==='confirmed').map(b=>time5(b.booking_time))),rows=times.filter(t=>!booked.has(t)).map(t=>({booking_date:d,booking_time:t+':00',is_open:true}));if(!rows.length){toast('這些時段已有預約或格式不正確');return}const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok){toast('時段儲存失敗');return}await loadAll();toast('開放時段已儲存')}
async function toggleSlot(id,next){const slot=state.availability.find(a=>a.id===id);if(!slot)return;const hasBooking=state.bookings.some(b=>b.booking_date===slot.booking_date&&time5(b.booking_time)===time5(slot.booking_time)&&b.status==='confirmed');if(next&&hasBooking){toast('這個時段已有預約，不能重新開放');return}const r=await api(`booking_availability?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({is_open:next})});if(!r.ok){toast('更新失敗');return}await loadAll();toast(next?'時段已開放':'時段已關閉')}
async function cancelBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b||!confirm(`確定取消 ${b.traveler_name} 的 ${b.journey} 預約嗎？\n原時段會重新開放。`))return;const r=await api(`traveler_bookings?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:'cancelled'})});if(!r.ok){toast('取消失敗');return}await loadAll();toast('已取消，原時段重新開放')}
function showPage(page){state.page=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['dashboard','bookings','availability'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==page));render()}
document.getElementById('loginBtn').addEventListener('click',login);document.getElementById('logoutBtn').addEventListener('click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
boot();
</script>
</body>
</html>
