<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><title>拾光所｜預約管理</title><style>html,body{margin:0;width:100%;height:100%;background:#FBF8F4}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="adminFrame" src="admin-v3.html?v=20260820f" title="拾光所預約管理"></iframe><script>
const frame=document.getElementById('adminFrame');
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||typeof w.fullBooking!=='function')return;const st=d.createElement('style');st.textContent=`.notify-box{margin-top:10px;padding:10px 12px;border-radius:15px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.notify-box.sent{background:#EEF6EC;color:#5F745E}.notify-box.pending{background:#EDF4F7;color:#5B7481}.notify-box.failed{background:#FFF1EF;color:#9A615B}.notify-box.none{background:#F4F1EE;color:#8C8580}.notify-box b{font-size:12px}.notify-box .btn{min-height:34px;padding:7px 10px;font-size:11px}`;d.head.appendChild(st);
const oldFull=w.fullBooking;w.retryLineNotification=async function(id){try{w.toast('正在重新送出 LINE 通知…');const r=await w.api('rpc/retry_booking_notification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_booking_id:id})});if(!r.ok){w.toast('重新送出失敗');return}await w.loadAll();w.toast('已送出重試請求');setTimeout(()=>w.loadAll(),1800)}catch(e){console.error(e);w.toast('重新送出失敗')}};
w.fullBooking=function(b){let html=oldFull(b);const s=b.notification_status||'';let cls='none',text='尚無通知紀錄';if(s==='sent'){cls='sent';text='LINE 通知已送出'}else if(s==='failed'){cls='failed';text='LINE 通知失敗'}else if(s==='pending'){cls='pending';text='LINE 通知處理中'}let when='';if(s==='sent'&&b.notification_sent_at){try{when=`・${new Date(b.notification_sent_at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`}catch(e){}}const err=(s==='failed'&&b.notification_error)?`<div style="margin-top:3px;opacity:.8">${w.esc(b.notification_error)}</div>`:'';const retry=s==='failed'?`<button class="btn danger" onclick="retryLineNotification('${b.id}')">重新送出</button>`:'';const box=`<div class="notify-box ${cls}"><div><b>${text}</b>${when}${err}</div>${retry}</div>`;return html.replace(/<\/div>$/,box+'</div>')};
if(typeof w.renderBookings==='function')w.renderBookings();
}catch(e){console.error('admin enhancer failed',e)}});
</script></body></html>
