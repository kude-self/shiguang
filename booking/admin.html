<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><title>拾光所｜預約管理</title><style>html,body{margin:0;width:100%;height:100%;background:#FBF8F4}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="adminFrame" src="admin-v4.html?v=20260820cancel2" title="拾光所預約管理"></iframe><script>
const f=document.getElementById('adminFrame');
function sync(){try{const w=f.contentWindow;if(w&&w.session&&typeof w.loadAll==='function')w.loadAll()}catch(e){}}
function installCancelFix(){try{const w=f.contentWindow,d=f.contentDocument;if(!w||!d||typeof w.loadAll!=='function')return;
const style=d.createElement('style');style.textContent=`.cancel-confirm-layer{position:fixed;inset:0;background:rgba(55,53,47,.38);z-index:9999;display:none;align-items:flex-end;justify-content:center;padding:10px}.cancel-confirm-layer.show{display:flex}.cancel-confirm-card{width:min(520px,100%);background:#FFFDFC;border:1px solid #EAE1DA;border-radius:28px 28px 20px 20px;padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 18px 48px rgba(70,55,45,.18);text-align:center}.cancel-confirm-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:#FFF1EF;color:#A96F66;font-size:24px}.cancel-confirm-card h3{margin:0 0 8px;font-size:21px;color:#4B4540}.cancel-confirm-card p{margin:0 0 16px;color:#786F68;font-size:13px;line-height:1.8}.cancel-confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cancel-confirm-actions button{min-height:48px}.cancel-confirm-card .danger-confirm{border:0;background:#C9938A;color:white}`;d.head.appendChild(style);
const layer=d.createElement('div');layer.id='cancelConfirmLayer';layer.className='cancel-confirm-layer';layer.innerHTML=`<div class="cancel-confirm-card"><div class="cancel-confirm-icon">♡</div><h3>確定取消這筆預約嗎？</h3><p id="cancelConfirmText">取消後，這個時段會重新開放。<br>如果旅人已連結官方 LINE，也會同步通知旅人。</p><div class="cancel-confirm-actions"><button id="cancelBackBtn" class="btn">先不要</button><button id="cancelYesBtn" class="btn danger-confirm">確認取消</button></div></div>`;d.body.appendChild(layer);
let cancelId=null;const back=d.getElementById('cancelBackBtn'),yes=d.getElementById('cancelYesBtn');
back.onclick=()=>{cancelId=null;layer.classList.remove('show')};layer.onclick=e=>{if(e.target===layer){cancelId=null;layer.classList.remove('show')}};
w.cancelBooking=function(id){cancelId=id;const b=w.state?.bookings?.find(x=>x.id===id);const t=d.getElementById('cancelConfirmText');if(t&&b)t.innerHTML=`旅人：<b>${w.esc(b.traveler_name)}</b><br>${b.booking_date}・${w.time5(b.booking_time)}<br><br>取消後，這個時段會重新開放。${b.line_user_id?'<br>旅人也會收到官方 LINE 取消通知。':''}`;layer.classList.add('show')};
yes.onclick=async()=>{if(!cancelId)return;const id=cancelId;yes.disabled=true;yes.textContent='正在取消…';try{w.toast('正在取消預約…');let ok=false,lineFailed=false;try{const r=await fetch(`${w.U}/functions/v1/booking-cancel`,{method:'POST',headers:w.headers({'Content-Type':'application/json'}),body:JSON.stringify({booking_id:id})});ok=r.ok;if(!r.ok)lineFailed=true}catch(e){lineFailed=true}
if(!ok){const r2=await w.api(`traveler_bookings?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'cancelled'})});if(!r2.ok)throw new Error('fallback cancel failed');ok=true}
layer.classList.remove('show');cancelId=null;await w.loadAll();w.toast(lineFailed?'預約已取消、時段已釋放；LINE 通知未送出':'預約已取消，時段已釋放 ♡');}catch(e){console.error(e);w.toast('取消失敗，請再試一次')}finally{yes.disabled=false;yes.textContent='確認取消'}};
}catch(e){console.error('cancel fix failed',e)}}
f.addEventListener('load',()=>{installCancelFix();setTimeout(sync,400)});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});setInterval(sync,30000);
</script></body></html>
