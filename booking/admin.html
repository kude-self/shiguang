led{opacity:.45}.login-card .btn{width:100%;margin-top:17px}.header{position:sticky;top:0;z-index:20;background:rgba(251,248,244,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(234,225,218,.95)}.head,.nav,.wrap{max-width:1080px;margin:auto}.head{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.head-brand{display:flex;gap:10px;align-items:center;min-width:0}.head-brand>div:last-child{min-width:0}.head-brand b{font-size:16px;letter-spacing:.02em}.mini-mark{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--rose2),var(--sage2));color:#8F786D}.who{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav{padding:4px 16px 10px;display:flex;gap:7px;overflow:auto}.nav button{border:0;background:transparent;padding:10px 14px;border-radius:999px;white-space:nowrap;color:var(--soft);font-weight:600}.nav button.active{background:#fff;font-weight:700;box-shadow:0 4px 14px rgba(91,72,59,.06)}.navbadge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rose);color:#fff;align-items:center;justify-content:center;font-size:10px;margin-left:3px}.wrap{padding:22px 16px calc(72px + env(safe-area-inset-bottom))}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-start}.toolbar h2{font-size:26px;margin:0;letter-spacing:.03em}.kicker{font-size:12px;font-weight:700;color:var(--rose);margin-bottom:5px}.kicker:before{content:"✦ ";font-size:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.metric{padding:17px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:54px;height:54px;border-radius:50%;right:-18px;top:-18px;opacity:.55}.metric:nth-child(1):after,.metric:nth-child(3):after{background:var(--rose2)}.metric:nth-child(2):after{background:var(--blue2)}.metric:nth-child(4):after{background:var(--sage2)}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:30px;margin-top:7px}.section{margin-top:16px}.panel{padding:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.panel-head b{font-size:17px}.list{display:grid;gap:10px}.item,.booking-card{border:1px solid var(--line);background:#fff;border-radius:21px;padding:15px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.person{font-size:16px;font-weight:700;line-height:1.6}.meta,.details{font-size:13px;color:var(--muted);line-height:1.8;margin-top:5px}.badge{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700;vertical-align:middle}.initial,.new{background:var(--rose2);color:#8D625A}.light,.completed{background:var(--sage2);color:#617461}.walk,.contacted{background:var(--blue2);color:#5B7481}.cancel{background:#F0EEEC;color:#777}.notice{background:var(--sage2);border-radius:20px;padding:14px;font-size:13px;color:#647264;margin-bottom:14px;line-height:1.7}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px;margin-bottom:12px}.calendar-card{padding:16px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}.cal-title{display:flex;align-items:center;gap:8px}.cal-head h3{margin:0;font-size:18px}.circle{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:87px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px;text-align:left;color:var(--ink);position:relative}.day.has{background:linear-gradient(180deg,#fff,var(--sage2))}.day.today{outline:1px dashed #B9A89D}.num{font-size:12px;font-weight:700}.count{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.45}.modal{position:fixed;inset:0;background:rgba(55,53,47,.34);display:none;place-items:center;padding:16px;z-index:50}.modal.show{display:grid}.modal-card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#FBF8F4;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 60px rgba(55,53,47,.16)}.modal-head,.modal-foot{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:8px}.modal-body{padding:18px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.hour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.hour-option{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 7px;color:var(--soft);font-weight:700}.hour-option.selected{background:var(--sage2);border-color:#B8C9B5;color:#5D715E}.hour-option.booked{background:#F1EFED;color:#A39A93;text-decoration:line-through}.slot-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.legend-chip{font-size:11px;padding:5px 9px;border-radius:999px}.legend-open{background:var(--sage2);color:#617461}.legend-booked{background:#F1EFED;color:#888}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-section{padding:18px;border-radius:26px}.settings-section>b{display:block;font-size:18px;margin-bottom:6px}.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed #E8DED6}.switchrow:last-child{border-bottom:0}.switchrow input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--sage)}.setting-help{font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;background:#554D47;color:#fff;padding:11px 15px;border-radius:999px;transition:.2s;z-index:70;max-width:calc(100vw - 30px);text-align:center;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{text-align:center;padding:24px;color:var(--muted)}
@media(max-width:820px){.metrics{grid-template-columns:1fr 1fr}.filters,.settings-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){body{background:radial-gradient(circle at 12% 0,#F8E7E3 0,transparent 25%),radial-gradient(circle at 100% 8%,#E8F0E5 0,transparent 26%),#FBF8F4}.wrap{padding:16px 12px calc(68px + env(safe-area-inset-bottom))}.head{padding:12px 12px 8px}.head-brand{gap:8px}.mini-mark{width:38px;height:38px}.head-brand b{font-size:15px}.who{max-width:180px}.head>.btn{padding:9px 13px;min-height:40px}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 12px 12px;overflow:visible}.nav button{width:100%;padding:10px 3px;font-size:12px;text-align:center;line-height:1.25}.navbadge{min-width:16px;height:16px;font-size:9px;padding:0 4px}.toolbar{gap:12px;margin-bottom:14px}.toolbar h2{font-size:25px}.toolbar .actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar .actions .btn{width:100%;min-width:0;white-space:normal;line-height:1.3}.metrics{gap:8px}.metric{padding:14px;border-radius:22px}.metric strong{font-size:25px}.filters,.settings-grid{grid-template-columns:1fr}.settings-grid{gap:12px}.settings-section{padding:16px;border-radius:24px}.settings-section>b{font-size:17px}.day{min-height:62px;padding:6px;border-radius:13px}.calendar{gap:4px}.count{font-size:9px}.actions{width:100%}.booking-card .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.booking-card .actions .btn{width:100%;white-space:normal}.booking-card .actions .btn.danger{grid-column:1/-1}.item{flex-direction:column;align-items:flex-start}.item .btn{width:100%}.hour-grid{grid-template-columns:repeat(3,1fr)}.modal{padding:10px;align-items:end}.modal-card{width:100%;max-height:88vh;border-radius:28px 28px 18px 18px}.modal-head{padding:14px 16px}.modal-head b{font-size:18px}.modal-body{padding:16px}.modal-foot{padding:14px 16px}.modal-foot .btn{flex:1}.field{margin-top:13px}.btn{font-size:14px}.login-card{border-radius:30px;padding:28px 20px}.cal-head{align-items:center}.cal-title{flex-direction:column;gap:2px}.cal-title .btn{min-height:34px;padding:6px 10px;font-size:11px}}

<body>
<div id="loginView" class="login"><div class="login-card"><div class="login-mark">𓇼</div><div class="brand">拾 光 所</div><h1>預約管理</h1><p class="sub">把旅人的預約、時間與聯絡狀態，好好整理在這裡。</p><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label for="password">密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">進入管理後台</button><div id="loginMsg" class="sub" style="margin-top:10px;color:#9A615B"></div></div></div>
<div id="appView" class="hidden"><header class="header"><div class="head"><div class="head-brand"><div class="mini-mark">𓇼</div><div><b>拾光所｜預約管理</b><div id="who" class="who"></div></div></div><button id="logoutBtn" class="btn">登出</button></div><nav class="nav"><button data-page="dashboard" class="active">總覽</button><button data-page="bookings">旅人預約 <span id="navNewBadge" class="navbadge hidden">0</span></button><button data-page="calendar">開放月曆</button><button data-page="settings">設定</button></nav></header><main class="wrap"><section id="dashboard"></section><section id="bookings" class="hidden"></section><section id="calendarPage" class="hidden"></section><section id="settingsPage" class="hidden"></section></main></div>
<div id="slotModal" class="modal"><div class="modal-card"><div class="modal-head"><b id="slotTitle">設定時段</b><button class="btn" onclick="closeSlotModal()">關閉</button></div><div class="modal-body"><div class="sub">從 10:00 到 20:00，每小時一個時段。點一下切換開放／關閉。</div><div class="slot-legend"><span class="legend-chip legend-open">綠色＝開放</span><span class="legend-chip legend-booked">劃線＝已有預約</span></div><div id="hourGrid" class="hour-grid"></div><button id="saveSlotsBtn" class="btn primary" style="width:100%;margin-top:14px" onclick="saveSlots()">儲存開放時段</button></div></div></div>
<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><b>旅人預約資料</b><button class="btn" onclick="closeEdit()">關閉</button></div><div id="editBody" class="modal-body"></div><div class="modal-foot"><button class="btn" onclick="closeEdit()">取消</button><button id="saveEditBtn" class="btn primary" onclick="saveEdit()">儲存變更</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',BOOKING_URL='https://kude-self.github.io/shiguang/booking/',STORE='sg_booking_admin_v6',HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`);
let session=null,autoTimer=null;let S={page:'dashboard',bookings:[],availability:[],settings:null,month:new Date().toISOString().slice(0,7),slotDate:'',selectedHours:new Set(),editing:null,lastUpdated:null,loading:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const time5=t=>String(t||'').slice(0,5);
const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`};
const badge=j=>j==='初遇'?'initial':j==='拾光'?'light':'walk';
const contactLabel=s=>s==='contacted'?'已聯絡':s==='completed'?'已完成':'新預約';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function jwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(e){return {}}}
function isAdmin(t){return jwt(t)?.app_metadata?.role==='admin'}
function headers(x={}){return {apikey:K,Authorization:`Bearer ${session.access_token}`,...x}}
async function refreshSession(){if(!session?.refresh_token)return false;try{const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const d=await r.json();if(!isAdmin(d.access_token))return false;session=d;localStorage.setItem(STORE,JSON.stringify(d));return true}catch(e){return false}}
async function api(path,opt={},retry=true){let r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});if(r.status===401&&retry&&await refreshSession())r=await fetch(`${U}/rest/v1/${path}`,{...opt,headers:headers(opt.headers||{})});return r}
async function login(){loginMsg.textContent='';const e=email.value.trim(),p=password.value;if(!e||!p){loginMsg.textContent='請輸入 Email 與密碼';return}loginBtn.disabled=true;loginBtn.textContent='登入中…';try{const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const d=await r.json();if(!r.ok||!isAdmin(d.access_token))throw Error();session=d;localStorage.setItem(STORE,JSON.stringify(d));await enter()}catch(e){loginMsg.textContent='登入失敗，請確認帳號密碼'}finally{loginBtn.disabled=false;loginBtn.textContent='進入管理後台'}}
async function enter(){loginView.classList.add('hidden');appView.classList.remove('hidden');who.textContent=jwt(session.access_token).email||'管理者';await loadAll(false);startAutoRefresh()}
function logout(){clearInterval(autoTimer);localStorage.removeItem(STORE);location.reload()}
async function boot(){try{const raw=localStorage.getItem(STORE);if(!raw)return;session=JSON.parse(raw);if(!isAdmin(session.access_token)&&!(await refreshSession()))throw Error();await enter()}catch(e){localStorage.removeItem(STORE)}}
async function loadAll(showToast=true){if(S.loading)return;S.loading=true;try{const [br,ar,sr]=await Promise.all([api('traveler_bookings?select=*&order=booking_date.asc,booking_time.asc'),api('booking_availability?select=*&order=booking_date.asc,booking_time.asc'),api('booking_page_settings?id=eq.1&select=*')]);if(!br.ok||!ar.ok||!sr.ok)throw Error();S.bookings=await br.json();S.availability=await ar.json();S.settings=(await sr.json())[0]||{};S.lastUpdated=new Date();render();if(showToast)toast('資料已更新')}catch(e){toast('讀取資料失敗，請稍後再試')}finally{S.loading=false}}
function startAutoRefresh(){clearInterval(autoTimer);autoTimer=setInterval(()=>{if(!document.hidden&&session)loadAll(false)},60000)}
function showPage(p){S.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));dashboard.classList.toggle('hidden',p!=='dashboard');bookings.classList.toggle('hidden',p!=='bookings');calendarPage.classList.toggle('hidden',p!=='calendar');settingsPage.classList.toggle('hidden',p!=='settings');render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){renderDashboard();renderBookings();renderCalendar();renderSettings();const n=S.bookings.filter(b=>b.status==='confirmed'&&(b.contact_status||'new')==='new').length;navNewBadge.textContent=n;navNewBadge.classList.toggle('hidden',!n)}
function renderDashboard(){const now=localToday(),c=S.bookings.filter(b=>b.status==='confirmed'),future=c.filter(b=>b.booking_date>=now),next=[...future].sort((a,b)=>(a.booking_date+a.booking_time).localeCompare(b.booking_date+b.booking_time)).slice(0,6),newCount=c.filter(b=>(b.contact_status||'new')==='new').length;dashboard.innerHTML=`<div class="toolbar"><div><div class="kicker">今天的拾光所</div><h2>總覽</h2><div class="sub">${fmt(now)}${S.lastUpdated?`・${S.lastUpdated.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})} 更新`:''}</div></div><div class="actions"><button class="btn soft" onclick="copyLink()">複製預約網址</button><button class="btn primary" onclick="showPage('calendar')">開放時段</button></div></div><div class="notice">♡ 這裡只顯示管理者能看到的旅人資料。旅人端無法讀取其他人的姓名、IG、生日或預約內容。</div><div class="metrics"><div class="card metric"><span>今日預約</span><strong>${c.filter(b=>b.booking_date===now).length}</strong></div><div class="card metric"><span>本月預約</span><strong>${c.filter(b=>b.booking_date.startsWith(now.slice(0,7))).length}</strong></div><div class="card metric"><span>新預約待聯絡</span><strong>${newCount}</strong></div><div class="card metric"><span>可預約時段</span><strong>${S.availability.filter(a=>a.is_open&&a.booking_date>=now).length}</strong></div></div><div class="card panel section"><div class="panel-head"><b>近期預約</b><button class="btn" onclick="showPage('bookings')">看全部</button></div><div class="list">${next.length?next.map(b=>bookingMini(b)).join(''):'<div class="empty">目前沒有近期預約 ♡</div>'}</div></div><div class="card panel section"><div class="panel-head"><b>快速工具</b></div><div class="actions"><button class="btn sage" onclick="downloadCSV()">匯出預約 CSV</button><button class="btn soft" onclick="downloadBackup()">下載完整備份</button><button class="btn" onclick="loadAll()">重新整理資料</button></div></div>`}
function bookingMini(b){return `<div class="item"><div><div class="person">${esc(b.traveler_name)} <span class="badge ${badge(b.journey)}">${b.journey}</span> <span class="badge ${b.contact_status||'new'}">${contactLabel(b.contact_status||'new')}</span></div><div class="meta">${fmt(b.booking_date)}・${time5(b.booking_time)}・${esc(b.instagram)}</div></div><button class="btn" onclick="openEdit('${b.id}')">查看</button></div>`}
function renderBookings(){bookings.innerHTML=`<div class="toolbar"><div><div class="kicker">旅人資料</div><h2>旅人預約</h2><div class="sub">搜尋、聯絡、備註、改期與取消。</div></div><div class="actions"><button class="btn soft" onclick="downloadCSV()">匯出 CSV</button><button class="btn" onclick="loadAll()">重新整理</button></div></div><div class="filters"><input id="q" placeholder="搜尋姓名或 IG" oninput="filterRows()"><select id="fj" onchange="filterRows()"><option value="">全部旅程</option><option>初遇</option><option>拾光</option><option>同行</option></select><select id="fs" onchange="filterRows()"><option value="confirmed">已確認</option><option value="">全部預約狀態</option><option value="cancelled">已取消</option></select><select id="fc" onchange="filterRows()"><option value="">全部聯絡狀態</option><option value="new">新預約</option><option value="contacted">已聯絡</option><option value="completed">已完成</option></select></div><div id="bookingList" class="list"></div>`;setTimeout(filterRows)}
function filterRows(){const list=document.getElementById('bookingList');if(!list)return;const qv=(document.getElementById('q')?.value||'').toLowerCase(),j=document.getElementById('fj')?.value||'',s=document.getElementById('fs')?.value||'',cs=document.getElementById('fc')?.value||'';const rows=[...S.bookings].sort((a,b)=>(a.booking_date+a.booking_time).localeCompare(b.booking_date+b.booking_time)).filter(b=>(!qv||(b.traveler_name+' '+b.instagram).toLowerCase().includes(qv))&&(!j||b.journey===j)&&(!s||b.status===s)&&(!cs||(b.contact_status||'new')===cs));list.innerHTML=rows.length?rows.map(b=>`<div class="booking-card"><div class="person">${esc(b.traveler_name)} <span class="badge ${badge(b.journey)}">${b.journey}</span> <span class="badge ${b.contact_status||'new'}">${contactLabel(b.contact_status||'new')}</span></div><div class="details">${fmt(b.booking_date)}・${time5(b.booking_time)}<br>IG：${esc(b.instagram)}<br>生日：${b.birthday?fmt(b.birthday):'—'}${b.gender?'・'+esc(b.gender):''}${b.admin_note?`<br>備註：${esc(b.admin_note)}`:''}</div>${b.status==='confirmed'?`<div class="actions" style="margin-top:10px"><button class="btn" onclick="openEdit('${b.id}')">查看／編輯</button><button class="btn" onclick="downloadICS('${b.id}')">加入行事曆</button><button class="btn danger" onclick="cancelBooking('${b.id}')">取消預約</button></div>`:'<div style="margin-top:10px"><span class="badge cancel">已取消</span></div>'}</div>`).join(''):'<div class="card empty">沒有符合條件的預約。</div>'}
function renderCalendar(){const [y,m]=S.month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),start=first.getDay();let cells='';for(let i=0;i<start;i++)cells+='<span></span>';for(let n=1;n<=days;n++){const d=`${S.month}-${String(n).padStart(2,'0')}`,slots=S.availability.filter(a=>a.booking_date===d),open=slots.filter(a=>a.is_open).length,booked=S.bookings.filter(b=>b.booking_date===d&&b.status==='confirmed').length;cells+=`<button class="day ${slots.length?'has':''} ${d===localToday()?'today':''}" onclick="openSlots('${d}')"><div class="num">${n}</div>${slots.length?`<div class="count">${open} 可約<br>${booked} 已約</div>`:''}</button>`}calendarPage.innerHTML=`<div class="toolbar"><div><div class="kicker">安排可預約時間</div><h2>開放月曆</h2><div class="sub">點日期，直接選擇 10:00～20:00 整點時段。</div></div><button class="btn soft" onclick="jumpToday()">回到本月</button></div><div class="card calendar-card"><div class="cal-head"><button class="circle" onclick="shiftMonth(-1)" aria-label="上個月">‹</button><div class="cal-title"><h3>${y} 年 ${m} 月</h3><button class="btn" onclick="jumpToday()">今天</button></div><button class="circle" onclick="shiftMonth(1)" aria-label="下個月">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}
function shiftMonth(n){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1);S.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar()}
function jumpToday(){S.month=localToday().slice(0,7);renderCalendar()}
function openSlots(date){S.slotDate=date;S.selectedHours=new Set(S.availability.filter(a=>a.booking_date===date&&a.is_open).map(a=>time5(a.booking_time)));slotTitle.textContent=`${fmt(date)}｜設定時段`;renderHourGrid();slotModal.classList.add('show')}
function closeSlotModal(){slotModal.classList.remove('show')}
function renderHourGrid(){const booked=new Set(S.bookings.filter(b=>b.booking_date===S.slotDate&&b.status==='confirmed').map(b=>time5(b.booking_time)));hourGrid.innerHTML=HOURS.map(t=>`<button class="hour-option ${S.selectedHours.has(t)?'selected':''} ${booked.has(t)?'booked':''}" ${booked.has(t)?'disabled':''} onclick="toggleHour('${t}')">${t}</button>`).join('')}
function toggleHour(t){S.selectedHours.has(t)?S.selectedHours.delete(t):S.selectedHours.add(t);renderHourGrid()}
async function saveSlots(){const btn=document.getElementById('saveSlotsBtn');btn.disabled=true;btn.textContent='儲存中…';try{const booked=new Set(S.bookings.filter(b=>b.booking_date===S.slotDate&&b.status==='confirmed').map(b=>time5(b.booking_time)));const rows=HOURS.map(t=>({booking_date:S.slotDate,booking_time:t+':00',is_open:S.selectedHours.has(t)&&!booked.has(t)}));const r=await api('booking_availability?on_conflict=booking_date,booking_time',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok)throw Error();await loadAll(false);renderHourGrid();toast('開放時段已儲存')}catch(e){toast('儲存失敗，請再試一次')}finally{btn.disabled=false;btn.textContent='儲存開放時段'}}
function openEdit(id){const b=S.bookings.find(x=>x.id===id);if(!b)return;S.editing=b;const dates=[...new Set(S.availability.filter(a=>a.is_open||(a.booking_date===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))).map(a=>a.booking_date))].sort();if(!dates.includes(b.booking_date))dates.push(b.booking_date);dates.sort();editBody.innerHTML=`<div class="field" style="margin-top:0"><label>旅人</label><input value="${esc(b.traveler_name)}" disabled></div><div class="field"><label>IG</label><input value="${esc(b.instagram)}" disabled></div><div class="field"><label>生日／性別</label><input value="${b.birthday?fmt(b.birthday):'—'}${b.gender?'・'+esc(b.gender):''}" disabled></div><div class="field"><label>聯絡狀態</label><select id="editContact"><option value="new" ${(b.contact_status||'new')==='new'?'selected':''}>新預約</option><option value="contacted" ${b.contact_status==='contacted'?'selected':''}>已聯絡</option><option value="completed" ${b.contact_status==='completed'?'selected':''}>已完成</option></select></div><div class="field"><label>管理備註</label><textarea id="editNote" placeholder="例如：已透過 IG 確認、需要提前提醒…">${esc(b.admin_note||'')}</textarea></div><div class="field"><label>旅程</label><select id="editJourney">${['初遇','拾光','同行'].map(j=>`<option ${j===b.journey?'selected':''}>${j}</option>`).join('')}</select></div><div class="field"><label>日期</label><select id="editDate" onchange="refreshEditTimes()">${dates.map(d=>`<option value="${d}" ${d===b.booking_date?'selected':''}>${fmt(d)}</option>`).join('')}</select></div><div class="field"><label>時段</label><select id="editTime"></select></div>`;editModal.classList.add('show');refreshEditTimes()}
function refreshEditTimes(){const b=S.editing,d=document.getElementById('editDate').value,slots=S.availability.filter(a=>a.booking_date===d&&(a.is_open||(d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time))));const el=document.getElementById('editTime');el.innerHTML=slots.length?slots.map(a=>`<option value="${time5(a.booking_time)}" ${d===b.booking_date&&time5(a.booking_time)===time5(b.booking_time)?'selected':''}>${time5(a.booking_time)}</option>`).join(''):'<option value="">這天沒有可改期時段</option>'}
function closeEdit(){editModal.classList.remove('show');S.editing=null}
async function saveEdit(){const b=S.editing,time=document.getElementById('editTime')?.value;if(!b||!time)return toast('請選擇可用時段');const btn=document.getElementById('saveEditBtn');btn.disabled=true;btn.textContent='儲存中…';try{const body={journey:editJourney.value,booking_date:editDate.value,booking_time:time+':00',contact_status:editContact.value,admin_note:editNote.value.trim()||null};const r=await api(`traveler_bookings?id=eq.${encodeURIComponent(b.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw Error();closeEdit();await loadAll(false);toast('預約資料已更新')}catch(e){toast('修改失敗，可能該時段已被預約')}finally{btn.disabled=false;btn.textContent='儲存變更'}}
async function cancelBooking(id){const b=S.bookings.find(x=>x.id===id);if(!b||!confirm(`確定取消 ${b.traveler_name} 的預約嗎？`))return;try{const r=await api(`traveler_bookings?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:'cancelled'})});if(!r.ok)throw Error();await loadAll(false);toast('預約已取消，原時段已重新開放')}catch(e){toast('取消失敗，請再試一次')}}
function renderSettings(){const x=S.settings;if(!x)return;settingsPage.innerHTML=`<div class="toolbar"><div><div class="kicker">旅人端內容</div><h2>設定</h2><div class="sub">這裡修改後，旅人預約頁會直接套用。</div></div><div class="actions"><button class="btn soft" onclick="window.open('${BOOKING_URL}?preview=1','_blank')">預覽旅人頁</button><button class="btn primary" onclick="saveSettings()">儲存設定</button></div></div><div class="notice">♡ 建議先調整文字與旅程介紹，按「儲存設定」後再預覽。生日與性別可以自由決定是否讓旅人填寫。</div><div class="settings-grid"><div class="card settings-section"><b>首頁文字</b><div class="setting-help">旅人一打開預約頁最先看到的內容。</div><div class="field"><label>頁面標題</label><input id="stTitle" value="${esc(x.booking_title||'')}"></div><div class="field"><label>主句</label><input id="stHeadline" value="${esc(x.headline||'')}"></div><div class="field"><label>副句</label><input id="stSubheadline" value="${esc(x.subheadline||'')}"></div><div class="field"><label>小字</label><input id="stIntro" value="${esc(x.intro_note||'')}"></div></div><div class="card settings-section"><b>提醒與旅人欄位</b><div class="field"><label>預約前提醒</label><textarea id="stReminder">${esc(x.reminder_text||'')}</textarea></div><div class="field"><label>預約完成文字</label><textarea id="stComplete">${esc(x.completion_text||'')}</textarea></div><div class="switchrow"><span>顯示生日欄位</span><input id="stBirthday" type="checkbox" ${x.show_birthday?'checked':''}></div><div class="switchrow"><span>顯示性別欄位</span><input id="stGender" type="checkbox" ${x.show_gender?'checked':''}></div></div>${journeySetting('初遇','initial',x)}${journeySetting('拾光','light',x)}${journeySetting('同行','walk',x)}</div>`}
function journeySetting(name,key,x){return `<div class="card settings-section"><b>${name}</b><div class="switchrow"><span>旅人端顯示</span><input id="${key}Enabled" type="checkbox" ${x[key+'_enabled']?'checked':''}></div><div class="field"><label>時間標示</label><input id="${key}Time" value="${esc(x[key+'_time_label']||'')}"></div><div class="field"><label>旅程介紹</label><textarea id="${key}Desc">${esc(x[key+'_description']||'')}</textarea></div></div>`}
async function saveSettings(){const required=[stTitle.value.trim(),stHeadline.value.trim(),stSubheadline.value.trim()];if(required.some(x=>!x))return toast('首頁標題、主句與副句請不要留空');const body={booking_title:stTitle.value.trim(),headline:stHeadline.value.trim(),subheadline:stSubheadline.value.trim(),intro_note:stIntro.value.trim(),reminder_text:stReminder.value.trim(),completion_text:stComplete.value.trim(),show_birthday:stBirthday.checked,show_gender:stGender.checked,initial_enabled:initialEnabled.checked,initial_time_label:initialTime.value.trim(),initial_description:initialDesc.value.trim(),light_enabled:lightEnabled.checked,light_time_label:lightTime.value.trim(),light_description:lightDesc.value.trim(),walk_enabled:walkEnabled.checked,walk_time_label:walkTime.value.trim(),walk_description:walkDesc.value.trim(),updated_at:new Date().toISOString()};try{const r=await api('booking_page_settings?id=eq.1',{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw Error();await loadAll(false);toast('旅人頁設定已儲存')}catch(e){toast('設定儲存失敗，請再試一次')}}
async function copyLink(){try{await navigator.clipboard.writeText(BOOKING_URL);toast('旅人預約網址已複製')}catch(e){prompt('請複製網址',BOOKING_URL)}}
function downloadCSV(){const rows=[['旅人姓名','IG','生日','性別','旅程','日期','時間','預約狀態','聯絡狀態','管理備註','建立時間'],...S.bookings.map(b=>[b.traveler_name,b.instagram,b.birthday||'',b.gender||'',b.journey,b.booking_date,time5(b.booking_time),b.status,contactLabel(b.contact_status||'new'),b.admin_note||'',b.created_at||''])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadText(csv,`拾光所_預約_${localToday()}.csv`,'text/csv;charset=utf-8')}
function downloadBackup(){const data={exported_at:new Date().toISOString(),bookings:S.bookings,availability:S.availability,settings:S.settings};downloadText(JSON.stringify(data,null,2),`拾光所_預約備份_${localToday()}.json`,'application/json;charset=utf-8')}
function downloadText(text,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function mins(j){return j==='初遇'?50:75}
function downloadICS(id){const b=S.bookings.find(x=>x.id===id);if(!b)return;const [h,m]=time5(b.booking_time).split(':').map(Number),start=new Date(`${b.booking_date}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`),end=new Date(start.getTime()+mins(b.journey)*60000),pad=n=>String(n).padStart(2,'0'),dt=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;const text=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Shiguang//Booking//ZH-TW\r\nBEGIN:VEVENT\r\nUID:${b.id}@shiguang\r\nDTSTART:${dt(start)}\r\nDTEND:${dt(end)}\r\nSUMMARY:拾光所｜${b.journey}｜${b.traveler_name}\r\nDESCRIPTION:IG ${b.instagram}\r\nEND:VEVENT\r\nEND:VCALENDAR`;downloadText(text,`拾光所_${b.booking_date}_${b.traveler_name}.ics`,'text/calendar;charset=utf-8')}
loginBtn.addEventListener('click',login);password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});logoutBtn.addEventListener('click',logout);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));slotModal.addEventListener('click',e=>{if(e.target===slotModal)closeSlotModal()});editModal.addEventListener('click',e=>{if(e.target===editModal)closeEdit()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session)loadAll(false)});boot();
</script>
</body>
</html>
