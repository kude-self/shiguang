<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6F1">
<title>拾光所｜預約管理</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#FBF8F4;font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC",sans-serif;color:#4B4540}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 12% 0,#F8E7E3 0,transparent 26%),radial-gradient(circle at 100% 8%,#E8F0E5 0,transparent 28%),#FBF8F4;z-index:5}
.loading-card{background:#FFFDFC;border:1px solid #EAE1DA;border-radius:28px;padding:26px 30px;text-align:center;box-shadow:0 12px 30px rgba(91,72,59,.07)}
.mark{width:58px;height:58px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#F5E4E0,#E7EFE5);font-size:24px}.small{font-size:12px;color:#A39A93;margin-top:6px}
iframe{display:none;width:100%;height:100%;border:0;background:#FBF8F4}
</style>
</head>
<body>
<div id="loading"><div class="loading-card"><div class="mark">𓇼</div><b>拾光所｜預約管理</b><div class="small">正在開啟管理後台…</div></div></div>
<iframe id="adminFrame" title="拾光所預約管理"></iframe>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co';
const K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';
const CURRENT='sg_booking_admin_v4';
const OLD_KEYS=['sg_booking_admin_stable_v3','sg_booking_admin_v3','sg_booking_admin_v2','sg_booking_admin'];

function readSession(){
  try{
    let raw=localStorage.getItem(CURRENT);
    if(raw) return JSON.parse(raw);
    for(const key of OLD_KEYS){
      raw=localStorage.getItem(key);
      if(raw){
        const s=JSON.parse(raw);
        if(s?.refresh_token){
          localStorage.setItem(CURRENT,JSON.stringify(s));
          return s;
        }
      }
    }
  }catch(e){}
  return null;
}

async function renew(session){
  if(!session?.refresh_token) return session;
  try{
    const r=await fetch(`${U}/auth/v1/token?grant_type=refresh_token`,{
      method:'POST',
      headers:{apikey:K,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:session.refresh_token})
    });
    if(!r.ok) return session;
    const fresh=await r.json();
    if(fresh?.access_token){
      localStorage.setItem(CURRENT,JSON.stringify(fresh));
      return fresh;
    }
  }catch(e){}
  return session;
}

async function start(){
  const session=readSession();
  if(session?.refresh_token) await renew(session);
  const frame=document.getElementById('adminFrame');
  frame.src='admin-v2.html?v=20260820-loginpersist';
  frame.onload=()=>{
    document.getElementById('loading').style.display='none';
    frame.style.display='block';
  };
}
start();
</script>
</body>
</html>
