<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><title>拾光所｜預約管理</title><style>html,body{margin:0;width:100%;height:100%;background:#FBF8F4}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="adminFrame" src="admin-v3.html?v=20260820g" title="拾光所預約管理"></iframe><script>
const frame=document.getElementById('adminFrame');
frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||typeof w.fullBooking!=='function')return;const st=d.createElement('style');st.textContent=`.notify-box,.confirm-box{margin-top:10px;padding:10px 12px;border-radius:15px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.notify-box.sent,.confirm-box.confirmed{background:#EEF6EC;color:#5F745E}.notify-box.pending{background:#EDF4F7;color:#5B7481}.notify-box.failed{background:#FFF1EF;color:#9A615B}.notify-box.none,.confirm-box.waiting{background:#F4F1EE;color:#8C8580}.confirm-box.ready{background:#FFF6EE;color:#8B6A50}.notify-box b,.confirm-box b{font-size:12px}.notify-box .btn,.confirm-box .btn{min-height:34px;padding:7px 10px;font-size:11px}`;d.head.appendChild(st);
const oldFull=w.fullBooking,oldRenderBookings=w.renderBookings;
w.retryLineNotification=async function(id){try{w.toast('正在重新送出 LINE 通知…');const r=await w.api('rpc/retry_booking_notification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_booking_id:id})});if(!r.ok){w.toast('重新送出失敗');return}await w.loadAll();w.toast('已送出重試請求');setTimeout(()=>w.loadAll(),1800)}catch(e){console.error(e);w.toast('重新送出失敗')}};
w.confirmTravelerBooking=async function(id){const b=w.state.bookings.find(x=>x.id===id);if(!b)return;if(!b.line_user_id){w.toast('旅人還沒有透過官方 LINE 完成綁定');return}if(!confirm('確認這筆預約並由官方 LINE 通知旅人嗎？'))return;try{w.toast('正在確認預約…');const r=await fetch('https://tgfxrbghzzttqbpfwypw.supabase.co/functions/v1/booking-confirm',{method:'POST',headers:w.headers({'Content-Type':'application/json'}),body:JSON.stringify({booking_id:id})});const data=await r.json().catch(()=>({}));if(!r.ok){w.toast(data.reason==='line_not_linked'?'尚未綁定旅人的官方 LINE':'確認失敗，請稍後再試');return}await w.loadAll();w.toast('預約已確認，官方 LINE 已通知旅人 ♡')}catch(e){console.error(e);w.toast('確認失敗，請稍後再試')}};
w.fullBooking=function(b){let html=oldFull(b);const s=b.notification_status||'';let cls='none',text='尚無管理者通知紀錄';if(s==='sent'){cls='sent';text='管理者 LINE 通知已送出'}else if(s==='failed'){cls='failed';text='管理者 LINE 通知失敗'}else if(s==='pending'){cls='pending';text='管理者 LINE 通知處理中'}let when='';if(s==='sent'&&b.notification_sent_at){try{when=`・${new Date(b.notification_sent_at).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`}catch(e){}}const err=(s==='failed'&&b.notification_error)?`<div style="margin-top:3px;opacity:.8">${w.esc(b.notification_error)}</div>`:'';const retry=s==='failed'?`<button class="btn danger" onclick="retryLineNotification('${b.id}')">重新送出</button>`:'';const notifyBox=`<div class="notify-box ${cls}"><div><b>${text}</b>${when}${err}</div>${retry}</div>`;
let cbox='';if(b.status==='pending'){if(b.line_user_id)cbox=`<div class="confirm-box ready"><div><b>官方 LINE 已辨識旅人</b><div style="margin-top:3px">${w.esc(b.line_display_name||'已完成 LINE 綁定')}</div></div><button class="btn primary" onclick="confirmTravelerBooking('${b.id}')">確認預約</button></div>`;else cbox=`<div class="confirm-box waiting"><div><b>等待旅人加入官方 LINE</b><div style="margin-top:3px">旅人傳送預約資料後，這裡會出現確認按鈕。</div></div></div>`}else if(b.status==='confirmed')cbox=`<div class="confirm-box confirmed"><div><b>正式預約已確認</b>${b.confirmation_sent_at?`<div style="margin-top:3px">官方 LINE 確認通知已送出</div>`:''}</div></div>`;
return html.replace(/<\/div>$/,notifyBox+cbox+'</div>')};
w.renderBookings=function(){oldRenderBookings();const fs=d.getElementById('fs');if(fs){if(!Array.from(fs.options).some(o=>o.value==='pending')){const o=d.createElement('option');o.value='pending';o.textContent='待確認';fs.insertBefore(o,fs.firstChild)}fs.value='';if(typeof w.filterBookings==='function')w.filterBookings()}};
if(typeof w.renderBookings==='function')w.renderBookings();
}catch(e){console.error('admin enhancer failed',e)}});
</script></body></html>
