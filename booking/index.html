<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF3EE">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>拾光所｜旅程預約</title>
<style>
:root{--pink:#C9938A;--soft-pink:#E8C4BC;--light-pink:#F5E6E3;--blue:#7A9BAD;--soft-blue:#B8CFDA;--light-blue:#E3EDF3;--sage:#9AAE9B;--light-sage:#E8F0E8;--cream:#FAF3EE;--bg:#FAFAF8;--dark:#37352F;--medium:#5A5248;--gray:#9B9A97;--line:#E8E3DE;--shadow:0 12px 32px rgba(55,53,47,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:24px 16px 74px}.hero{background:linear-gradient(145deg,var(--cream),#fff 56%,var(--light-sage));border:1px solid var(--line);border-radius:26px;padding:28px 22px;box-shadow:var(--shadow);margin-bottom:16px}.logo{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--light-sage);border:1px solid rgba(154,174,155,.35);font-weight:700;margin-bottom:16px}.eyebrow{font-size:13px;color:var(--sage);font-weight:700;letter-spacing:.08em}h1{font-size:30px;line-height:1.25;margin:8px 0 10px}.hero p{margin:0;color:var(--medium);line-height:1.85}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-top:14px}.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.step{background:#F1EFEC;color:var(--gray);padding:10px 6px;border-radius:12px;font-size:12px;text-align:center;font-weight:700}.step.active{background:var(--light-sage);color:#5F765F}.step.done{background:#F5F3F0;color:var(--medium)}h2{font-size:21px;margin:0 0 14px}.journey-grid{display:grid;gap:10px}.journey{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px}.journey.active{background:var(--light-sage);border-color:var(--sage);box-shadow:0 0 0 3px rgba(154,174,155,.12)}.journey strong{display:block;font-size:17px;margin-bottom:5px}.journey span{font-size:13px;color:var(--gray);line-height:1.65}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}label{font-size:13px;font-weight:700;color:var(--medium)}input,select{width:100%;padding:13px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--dark);outline:none}input:focus,select:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(154,174,155,.13)}.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.slot{border:1px solid var(--line);background:var(--light-sage);color:#607760;border-radius:999px;padding:10px 14px}.slot.active{background:var(--dark);color:#fff;border-color:var(--dark)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;color:var(--dark);padding:11px 16px;border-radius:13px;font-weight:700}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.btn.soft{background:var(--cream)}.btn:disabled{opacity:.45;cursor:not-allowed}.summary{background:var(--cream);border:1px dashed #D9C7B5;border-radius:16px;padding:15px;line-height:1.8;margin-bottom:16px}.note{font-size:12px;color:var(--gray);line-height:1.75;margin-top:12px}.hint{background:var(--light-blue);color:#5b7380;border-radius:14px;padding:12px 13px;font-size:12px;line-height:1.7;margin-bottom:14px}.success{text-align:center;padding:30px 18px}.check{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:var(--light-sage);font-size:30px}.success .summary{text-align:left;max-width:520px;margin:18px auto}.loading{text-align:center;padding:28px;color:var(--gray)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:600px){.wrap{padding:16px 13px 58px}.hero{padding:23px 18px;border-radius:22px}h1{font-size:27px}.card{padding:18px;border-radius:18px}.stepper{gap:5px}.step{font-size:10px;padding:9px 4px}.slot{flex:1 0 calc(33.333% - 8px);text-align:center;min-height:44px}.actions .btn{min-height:44px}.journey strong{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div class="logo">𓇼</div><div class="eyebrow">與你相遇之前</div><h1>拾光所｜旅程預約</h1><p>每一次相遇，都從願意靠近自己開始。<br>選擇適合你的旅程與時間，再留下基本資料，完成這次預約。</p></div>
  <div class="stepper"><div id="s1" class="step active">選擇旅程</div><div id="s2" class="step">日期時段</div><div id="s3" class="step">基本資料</div><div id="s4" class="step">確認預約</div></div>
  <div id="content"><div class="card loading">正在讀取可預約時段…</div></div>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://tgfxrbghzzttqbpfwypw.supabase.co';
const SUPABASE_KEY='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN';
const state={step:1,journey:'',date:'',time:'',name:'',ig:'',birthday:'',gender:'',done:false,availability:{},loading:true,submitting:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function loadAvailability(){state.loading=true;render();try{const u=`${SUPABASE_URL}/rest/v1/booking_availability?select=booking_date,booking_time&is_open=eq.true&booking_date=gte.${today()}&order=booking_date.asc,booking_time.asc`;const r=await fetch(u,{headers:{apikey:SUPABASE_KEY,'Cache-Control':'no-cache'}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();state.availability={};rows.forEach(x=>{const t=String(x.booking_time).slice(0,5);(state.availability[x.booking_date]??=[]).push(t)})}catch(e){console.error(e);toast('目前無法讀取預約時段')}finally{state.loading=false;render()}}
function render(){['s1','s2','s3','s4'].forEach((id,i)=>{const el=document.getElementById(id),n=i+1;el.classList.toggle('active',state.step===n);el.classList.toggle('done',state.step>n)});const root=document.getElementById('content');if(state.loading){root.innerHTML='<div class="card loading">正在讀取可預約時段…</div>';return}if(state.done){root.innerHTML=`<div class="card success"><div class="check">✓</div><h2>預約已送出</h2><p>謝謝你願意留下這段旅程的時間。<br>拾光所已收到你的預約資料。</p><div class="summary"><strong>${esc(state.name)}</strong><br>旅程：${esc(state.journey)}<br>日期：${fmtDate(state.date)}<br>時段：${esc(state.time)}<br>IG：${esc(state.ig)}${state.birthday?`<br>生日：${fmtDate(state.birthday)}`:''}${state.gender?`<br>性別：${esc(state.gender)}`:''}</div><p class="note">若之後需要調整時間，請直接透過 IG 與拾光所聯繫。</p></div>`;return}root.innerHTML=state.step===1?step1():state.step===2?step2():state.step===3?step3():step4()}
function step1(){const opts=[['初遇','第一次相遇，整理此刻的感受與正在經歷的事。'],['拾光','四週陪伴，慢慢看見、分辨並找回自己的方向。'],['同行','三個月陪伴，把看見與選擇真正帶回生活。']];return `<div class="card"><h2>你想預約哪一段旅程？</h2><div class="journey-grid">${opts.map(([j,t])=>`<button class="journey ${state.journey===j?'active':''}" onclick="chooseJourney('${j}')"><strong>${j}</strong><span>${t}</span></button>`).join('')}</div><div class="actions"><span></span><button class="btn primary" onclick="nextStep()" ${state.journey?'':'disabled'}>下一步</button></div></div>`}
function chooseJourney(j){state.journey=j;render()}
function step2(){const dates=Object.keys(state.availability).sort();if(!dates.length)return '<div class="card"><h2>目前尚未開放預約日期</h2><p class="note">新的日期與時段開放後，會自動顯示在這裡。</p><div class="actions"><button class="btn" onclick="prevStep()">上一步</button><button class="btn soft" onclick="loadAvailability()">重新整理</button></div></div>';return `<div class="card"><h2>選擇日期與時段</h2><div class="hint">頁面只會顯示目前仍可預約的時間。已被預約或已關閉的時段不會出現在這裡。</div><div class="field"><label>可預約日期</label><select onchange="pickDate(this.value)"><option value="">請選擇日期</option>${dates.map(d=>`<option value="${d}" ${state.date===d?'selected':''}>${fmtDate(d)}</option>`).join('')}</select></div><div class="field"><label>可預約時段</label><div class="slots">${renderSlots()}</div></div><div class="actions"><button class="btn" onclick="prevStep()">上一步</button><button class="btn primary" onclick="nextStep()" ${state.date&&state.time?'':'disabled'}>下一步</button></div></div>`}
function pickDate(d){state.date=d;state.time='';render()}
function renderSlots(){if(!state.date)return '<span class="note">請先選擇日期。</span>';return (state.availability[state.date]||[]).map(t=>`<button class="slot ${state.time===t?'active':''}" onclick="pickTime('${t}')">${t}</button>`).join('')}
function pickTime(t){state.time=t;render()}
function step3(){return `<div class="card"><h2>留下你的基本資料</h2><div class="summary"><strong>${esc(state.journey)}</strong><br>${fmtDate(state.date)}・${esc(state.time)}</div><div class="field"><label>名字 *</label><input id="name" maxlength="80" autocomplete="name" value="${esc(state.name)}" placeholder="怎麼稱呼你"></div><div class="field"><label>IG 帳號 *</label><input id="ig" maxlength="120" autocapitalize="none" value="${esc(state.ig)}" placeholder="@username"></div><div class="field"><label>生日</label><input id="birthday" type="date" value="${esc(state.birthday)}"></div><div class="field"><label>性別</label><select id="gender"><option value="">請選擇</option>${['女','男','其他／不指定'].map(g=>`<option ${state.gender===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="actions"><button class="btn" onclick="prevStep()">上一步</button><button class="btn primary" onclick="saveProfileAndNext()">確認資料</button></div></div>`}
function saveProfileAndNext(){const name=document.getElementById('name').value.trim(),ig=document.getElementById('ig').value.trim();if(!name||!ig){toast('請填寫名字與 IG 帳號');return}state.name=name;state.ig=ig;state.birthday=document.getElementById('birthday').value||'';state.gender=document.getElementById('gender').value||'';state.step=4;render()}
function step4(){return `<div class="card"><h2>最後確認</h2><div class="summary"><strong>${esc(state.name)}</strong><br><br>旅程：${esc(state.journey)}<br>日期：${fmtDate(state.date)}<br>時段：${esc(state.time)}<br>IG：${esc(state.ig)}${state.birthday?`<br>生日：${fmtDate(state.birthday)}`:''}${state.gender?`<br>性別：${esc(state.gender)}`:''}</div><div class="hint">送出後，這個時段會立即停止開放，避免其他旅人重複預約。</div><div class="actions"><button class="btn" onclick="prevStep()">返回修改</button><button id="submitBtn" class="btn primary" onclick="submitForm()">送出預約</button></div></div>`}
function nextStep(){if(state.step===1&&!state.journey){toast('請先選擇旅程');return}if(state.step===2&&(!state.date||!state.time)){toast('請先選擇日期與時段');return}state.step++;render()}
function prevStep(){state.step=Math.max(1,state.step-1);render()}
async function submitForm(){if(state.submitting)return;state.submitting=true;const btn=document.getElementById('submitBtn');if(btn){btn.disabled=true;btn.textContent='送出中…'}try{const r=await fetch(`${SUPABASE_URL}/rest/v1/traveler_bookings`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({traveler_name:state.name,instagram:state.ig,birthday:state.birthday||null,gender:state.gender||null,journey:state.journey,booking_date:state.date,booking_time:state.time+':00'})});if(r.status===201){state.done=true;render();return}const detail=await r.text();console.error(detail);if(r.status===409||r.status===400){toast('這個時段已不可預約，請重新選擇');state.step=2;state.date='';state.time='';await loadAvailability()}else toast('送出失敗，請稍後再試')}catch(e){console.error(e);toast('網路連線異常，請再試一次')}finally{state.submitting=false;const b=document.getElementById('submitBtn');if(b){b.disabled=false;b.textContent='送出預約'}}}
loadAvailability();
</script>
</body>
</html>
