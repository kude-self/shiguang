<style>
:root{--rose:#C9938A;--rose2:#F5E4E0;--blue2:#E8F1F5;--sage:#93A994;--sage2:#E7EFE5;--cream:#FBF3EA;--ink:#4B4540;--soft:#786F68;--muted:#A39A93;--line:#EAE1DA;--shadow:0 14px 36px rgba(91,72,59,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 3%,#F8E7E3 0,transparent 25%),radial-gradient(circle at 92% 18%,#E7F0E5 0,transparent 28%),#FBF8F4;font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:720px;margin:auto;padding:16px 14px calc(72px + env(safe-area-inset-bottom))}.hero,.card{background:rgba(255,253,252,.97);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{position:relative;overflow:hidden;border-radius:34px;padding:31px 22px 29px;text-align:center}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.hero:before{width:140px;height:140px;background:#F7E6E2;left:-60px;top:-66px}.hero:after{width:160px;height:160px;background:#E7EFE5;right:-70px;bottom:-90px}.mark{position:relative;width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#F8E7E2,#EEF3E9);font-size:26px}.brand{position:relative;margin-top:11px;font-size:13px;font-weight:700;letter-spacing:.2em;color:#8D8077}.hero h1{position:relative;font-size:29px;margin:8px 0}.lead{position:relative;font-size:15px;line-height:1.9;color:var(--soft);margin:0}.tiny{position:relative;display:inline-block;margin-top:11px;padding:7px 12px;border-radius:999px;background:#FFF7F4;color:#A17F76;font-size:12px}.progress-wrap{margin:17px 0 14px;text-align:center}.progress{display:flex;justify-content:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#E3DDD8}.dot.active{width:29px;border-radius:99px;background:var(--rose)}.dot.done{background:#B9C8B8}.step-caption{margin-top:7px;font-size:11px;color:var(--muted)}.card{border-radius:29px;padding:23px 20px}.kicker{font-size:12px;font-weight:700;color:var(--rose);margin-bottom:6px}.kicker:before{content:"✦ ";font-size:9px}h2{font-size:22px;margin:0 0 7px;line-height:1.5}.sub{font-size:13px;color:var(--muted);line-height:1.75;margin-top:0}.journeys{display:grid;gap:12px;margin-top:15px}.journey{position:relative;width:100%;border:1px solid var(--line);background:#fff;text-align:left;border-radius:24px;padding:18px;color:var(--ink)}.journey:after{content:"♡";position:absolute;right:16px;top:15px;color:#D7CBC5}.journey.active:after{content:"♥";color:var(--rose)}.journey strong{display:block;font-size:18px}.time{display:inline-block;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;margin:6px 0 8px}.desc{display:block;font-size:13px;color:var(--soft);line-height:1.7;padding-right:20px}.j1 .time{background:var(--rose2);color:#8D625A}.j2 .time{background:var(--sage2);color:#617461}.j3 .time{background:var(--blue2);color:#5B7481}.j1.active{background:#FFF9F7}.j2.active{background:#F8FBF7}.j3.active{background:#F7FBFD}.selected-chip{display:inline-flex;padding:7px 11px;background:#FFF7F4;border:1px solid #F0DDD8;border-radius:999px;color:#946F66;font-size:12px;font-weight:700;margin-bottom:13px}.calendar-box{background:#FFFEFD;border:1px solid #EFE7E1;border-radius:23px;padding:13px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.circle{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{aspect-ratio:1;border:0;background:transparent;border-radius:14px;color:#BBB3AD;font-size:13px}.day.open{background:#F0F6EE;color:#617561;font-weight:700}.day.selected{background:var(--rose);color:#fff}.slots-title{margin:18px 0 8px;font-size:13px;font-weight:700}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px solid #DDE8DA;background:#F5F9F3;color:#617661;border-radius:999px;padding:11px 15px;min-width:76px;font-weight:700}.slot.active{background:#70816F;color:#fff}.legend{text-align:center;margin-top:10px;font-size:11px;color:var(--muted)}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field-row{display:grid;grid-template-columns:128px 1fr;gap:8px}.required{color:#B77F75}input,select{width:100%;min-width:0;border:1px solid var(--line);background:#FFFDFC;border-radius:18px;padding:13px 14px;color:var(--ink);outline:none;font-size:16px}.summary{background:linear-gradient(145deg,var(--cream),#FFFDFC);border:1px dashed #DCCEC3;border-radius:22px;padding:18px;margin-bottom:16px;text-align:left}.summary-row{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed #E8DED6}.summary-row:last-child{border:0}.summary-label{font-size:11px;color:var(--muted)}.summary-value{font-size:14px;font-weight:700;word-break:break-word}.reminder{background:#F2F7F0;border-radius:21px;padding:16px;color:#657365;font-size:13px;line-height:1.8;margin:14px 0}.checkline{display:flex;gap:9px;font-size:13px;align-items:flex-start}.checkline input{width:18px;height:18px;flex:0 0 auto}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:1px solid var(--line);background:#fff;color:var(--soft);padding:12px 17px;border-radius:999px;font-weight:700;min-height:46px}.btn.primary{background:linear-gradient(135deg,#B98279,#C9958C);color:#fff;border:0}.btn.sage{background:var(--sage2);color:#617461;border-color:#D8E4D5}.btn:disabled{opacity:.4}.loading,.success,.empty{text-align:center}.success-mark,.empty-mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:auto auto 14px;background:linear-gradient(145deg,#F5E4DF,#EAF1E7);font-size:29px}.confirm-card{margin:18px 0 12px;padding:18px;border-radius:24px;background:linear-gradient(150deg,#FFF7F4,#FBF7EF 55%,#F0F6EE);border:1px solid #EADFD7;text-align:left;position:relative;overflow:hidden}.confirm-card:after{content:"♡";position:absolute;right:15px;top:11px;color:#D7BBB2;font-size:20px}.confirm-date{font-size:20px;font-weight:800;line-height:1.55}.confirm-time{display:inline-block;margin-top:4px;padding:6px 11px;border-radius:999px;background:#fff;color:#8D625A;font-size:13px;font-weight:800}.confirm-trip{margin-top:12px;font-size:14px;font-weight:800}.confirm-name{margin-top:5px;font-size:12px;color:var(--soft)}.next-card{margin-top:12px;padding:16px;border-radius:21px;background:#F2F7F0;color:#617061;text-align:left;font-size:13px;line-height:1.8}.success-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}.success-actions .btn{width:100%}.success-note{margin:14px 5px 0;font-size:11px;line-height:1.7;color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;background:#554D47;color:#fff;padding:11px 15px;border-radius:999px;z-index:30;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1}@media(max-width:600px){.wrap{padding:12px 12px 58px}.hero{border-radius:29px;padding:27px 17px 25px}.hero h1{font-size:27px}.card{border-radius:26px;padding:20px 16px}.calendar{gap:3px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{width:100%;min-width:0;padding:11px 5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions>span{display:none}.actions .btn{width:100%;padding:11px 8px}.summary-row{grid-template-columns:68px 1fr}.field-row{grid-template-columns:108px 1fr}.confirm-date{font-size:19px}}
</style>

<body>
<div class="wrap"><header class="hero"><div class="mark">𓇼</div><div class="brand">拾 光 所</div><h1 id="heroTitle">旅程預約</h1><p class="lead"><b id="headline">為自己，留一段時間。</b><br><span id="subheadline">選擇一段適合此刻的旅程。</span></p><div id="introNote" class="tiny">慢慢來，照著自己的步調就好 ♡</div></header><div class="progress-wrap"><div class="progress"><i id="p1" class="dot active"></i><i id="p2" class="dot"></i><i id="p3" class="dot"></i><i id="p4" class="dot"></i></div><div id="stepCaption" class="step-caption">選擇旅程</div></div><main id="content"><div class="card loading">正在讀取預約時間…</div></main></div><div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`),STEPS=['選擇旅程','選擇日期與時間','留下資料','最後確認'];
const DEF={booking_title:'旅程預約',headline:'為自己，留一段時間。',subheadline:'選擇一段適合此刻的旅程。',intro_note:'慢慢來，照著自己的步調就好 ♡',reminder_text:'請確認這段時間能完整留給自己，並選擇一個能安心、不被打擾的空間。旅程開始前，我也會再將需要準備的內容傳給你。',initial_enabled:true,initial_time_label:'40–50 分鐘',initial_description:'一次相遇，先從此刻的自己開始。看見現在的狀態、感受與最在意的事。',light_enabled:true,light_time_label:'四週旅程',light_description:'不只看見，而是用四週的時間，慢慢整理、分辨，找回自己的方向。',walk_enabled:true,walk_time_label:'三個月陪伴',walk_description:'把已經看見的，真正帶回生活。在一次次經歷與選擇裡，練習走自己的路。'};
const S={step:1,journey:'',date:'',time:'',name:'',contactMethod:'IG',contactValue:'',birthday:'',gender:'',agree:false,done:false,availability:{},month:'',settings:{...DEF},loading:true,error:false,submitting:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()} 年 ${x.getMonth()+1} 月 ${x.getDate()} 日`};const content=document.getElementById('content'),toastEl=document.getElementById('toast');function toast(x){toastEl.textContent=x;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),2200)}
async function load(){S.loading=true;render(false);try{const [ar,sr]=await Promise.all([fetch(`${U}/rest/v1/booking_availability?select=booking_date,booking_time&is_open=eq.true&booking_date=gte.${today()}&order=booking_date.asc,booking_time.asc`,{headers:{apikey:K}}),fetch(`${U}/rest/v1/booking_page_settings?id=eq.1&select=*`,{headers:{apikey:K}})]);if(!ar.ok)throw Error();const a=await ar.json();if(sr.ok){const x=(await sr.json())[0];if(x)S.settings={...DEF,...x}}S.availability={};a.forEach(x=>{const t=String(x.booking_time).slice(0,5);if(HOURS.includes(t))(S.availability[x.booking_date]??=[]).push(t)});Object.values(S.availability).forEach(v=>v.sort());const dates=Object.keys(S.availability).sort();S.month=(dates[0]||today()).slice(0,7);applySettings();S.error=false}catch(e){S.error=true}finally{S.loading=false;render(false)}}
function applySettings(){document.getElementById('heroTitle').textContent=S.settings.booking_title||DEF.booking_title;document.getElementById('headline').textContent=S.settings.headline||DEF.headline;document.getElementById('subheadline').textContent=S.settings.subheadline||DEF.subheadline;document.getElementById('introNote').textContent=S.settings.intro_note||DEF.intro_note}
function progress(){for(let i=1;i<=4;i++){const e=document.getElementById('p'+i);e.classList.toggle('active',S.step===i&&!S.done);e.classList.toggle('done',S.step>i||S.done)}document.getElementById('stepCaption').textContent=S.done?'預約完成':STEPS[S.step-1]}
function render(moveTop=false){const y=window.scrollY;progress();if(S.loading)content.innerHTML='<div class="card loading">正在讀取預約時間…</div>';else if(S.error)content.innerHTML='<section class="card empty"><div class="empty-mark">♡</div><h2>暫時連不上預約時間</h2><button type="button" class="btn primary" onclick="load()">重新整理</button></section>';else content.innerHTML=S.done?success():S.step===1?one():S.step===2?two():S.step===3?three():four();if(moveTop)requestAnimationFrame(()=>document.querySelector('.progress-wrap')?.scrollIntoView({behavior:'smooth',block:'start'}));else requestAnimationFrame(()=>window.scrollTo(0,y))}
function journeys(){return [['初遇',S.settings.initial_time_label,S.settings.initial_description,'j1',S.settings.initial_enabled],['拾光',S.settings.light_time_label,S.settings.light_description,'j2',S.settings.light_enabled],['同行',S.settings.walk_time_label,S.settings.walk_description,'j3',S.settings.walk_enabled]].filter(x=>x[4])}
function one(){return `<section class="card"><div class="kicker">選擇你的旅程</div><h2>此刻，你想從哪一段旅程開始？</h2><p class="sub">沒有標準答案，選一個現在最靠近你的就好。</p><div class="journeys">${journeys().map(([j,t,d,c])=>`<button type="button" class="journey ${c} ${S.journey===j?'active':''}" onclick="chooseJourney('${j}')"><strong>${j}</strong><span class="time">${esc(t)}</span><span class="desc">${esc(d)}</span></button>`).join('')}</div><div class="actions"><span></span><button type="button" class="btn primary" onclick="next()" ${S.journey?'':'disabled'}>下一步・選時間</button></div></section>`}
function chooseJourney(j){S.journey=j;S.date='';S.time='';render(false)}function monthShift(n){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1);S.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;S.date='';S.time='';render(false)}
function cal(){const [y,m]=S.month.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let z='';for(let i=0;i<start;i++)z+='<span></span>';for(let n=1;n<=days;n++){const d=`${S.month}-${String(n).padStart(2,'0')}`,open=!!S.availability[d]?.length;z+=`<button type="button" class="day ${open?'open':''} ${S.date===d?'selected':''}" ${open?'':'disabled'} onclick="pickDate('${d}')">${n}</button>`}return z}function pickDate(d){S.date=d;S.time='';render(false)}function pickTime(t){S.time=t;render(false)}
function two(){if(!Object.keys(S.availability).length)return `<section class="card empty"><div class="empty-mark">♡</div><h2>目前還沒有開放的時間</h2><div class="actions"><button type="button" class="btn" onclick="prev()">返回</button><button type="button" class="btn primary" onclick="load()">重新看看</button></div></section>`;const [y,m]=S.month.split('-');return `<section class="card"><div class="kicker">留一段時間給自己</div><div class="selected-chip">♡ ${esc(S.journey)}</div><h2>選一個適合你的日子</h2><p class="sub">淡綠色日期代表目前還有可預約時段。</p><div class="calendar-box"><div class="calendar-head"><button type="button" class="circle" onclick="monthShift(-1)">‹</button><strong>${y} 年 ${Number(m)} 月</strong><button type="button" class="circle" onclick="monthShift(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cal()}</div></div>${S.date?`<div class="slots-title">${fmt(S.date)}・可以選擇的時間</div><div class="slots">${(S.availability[S.date]||[]).map(t=>`<button type="button" class="slot ${S.time===t?'active':''}" onclick="pickTime('${t}')">${t}</button>`).join('')}</div>`:'<div class="legend">先點一個淡綠色日期，再選擇時間 ♡</div>'}<div class="actions"><button type="button" class="btn" onclick="prev()">返回</button><button type="button" class="btn primary" onclick="next()" ${S.date&&S.time?'':'disabled'}>下一步・留資料</button></div></section>`}
function three(){return `<section class="card"><div class="kicker">關於你</div><div class="selected-chip">♡ ${esc(S.journey)}・${fmt(S.date)}・${esc(S.time)}</div><h2>留下一點關於你的資料 ♡</h2><p class="sub">讓我知道這次要與哪位旅人相遇。</p><div class="field"><label for="travelerName">名字／暱稱 <span class="required">*</span></label><input id="travelerName" value="${esc(S.name)}" placeholder="請輸入名字或暱稱"></div><div class="field"><label>聯繫帳號 <span class="required">*</span></label><div class="field-row"><select id="contactMethod" onchange="updateContactPlaceholder()"><option value="IG" ${S.contactMethod==='IG'?'selected':''}>Instagram</option><option value="LINE" ${S.contactMethod==='LINE'?'selected':''}>LINE</option></select><input id="contactValue" value="${esc(S.contactValue)}" placeholder="${S.contactMethod==='LINE'?'請輸入 LINE ID':'請輸入 IG 帳號'}"></div></div><div class="field"><label for="birthdayInput">生日 <span class="required">*</span></label><input id="birthdayInput" type="date" value="${esc(S.birthday)}" max="${today()}"></div><div class="field"><label for="genderInput">性別 <span class="required">*</span></label><select id="genderInput"><option value="">請選擇</option><option value="女" ${S.gender==='女'?'selected':''}>女</option><option value="男" ${S.gender==='男'?'selected':''}>男</option></select></div><div class="reminder"><b>♡ 預約前的小提醒</b><br>${esc(S.settings.reminder_text)}</div><label class="checkline"><input id="agreeInput" type="checkbox" ${S.agree?'checked':''}><span>我已閱讀並確認以上內容</span></label><div class="actions"><button type="button" class="btn" onclick="prev()">返回</button><button type="button" class="btn primary" onclick="saveProfile()">下一步・確認</button></div></section>`}
function updateContactPlaceholder(){const m=document.getElementById('contactMethod'),v=document.getElementById('contactValue');if(!m||!v)return;S.contactMethod=m.value;v.placeholder=m.value==='LINE'?'請輸入 LINE ID':'請輸入 IG 帳號'}
function saveProfile(){try{const nameEl=document.getElementById('travelerName'),methodEl=document.getElementById('contactMethod'),valueEl=document.getElementById('contactValue'),birthdayEl=document.getElementById('birthdayInput'),genderEl=document.getElementById('genderInput'),agreeEl=document.getElementById('agreeInput');if(!nameEl||!methodEl||!valueEl||!birthdayEl||!genderEl||!agreeEl){toast('頁面資料沒有完整載入，請重新整理一次');return}const n=nameEl.value.trim(),method=methodEl.value,value=valueEl.value.trim(),birthday=birthdayEl.value,gender=genderEl.value;if(!n){toast('請填寫名字或暱稱');nameEl.focus();return}if(!value){toast(method==='LINE'?'請填寫 LINE ID':'請填寫 IG 帳號');valueEl.focus();return}if(!birthday){toast('請選擇生日');birthdayEl.focus();return}if(!gender){toast('請選擇性別');genderEl.focus();return}if(!agreeEl.checked){toast('請先確認預約前的小提醒');agreeEl.focus();return}S.name=n;S.contactMethod=method;S.contactValue=value;S.birthday=birthday;S.gender=gender;S.agree=true;S.step=4;render(true)}catch(e){console.error(e);toast('無法進入下一步，請重新整理後再試一次')}}
function summaryRows(){return `<div class="summary-row"><div class="summary-label">旅程</div><div class="summary-value">${esc(S.journey)}</div></div><div class="summary-row"><div class="summary-label">日期</div><div class="summary-value">${fmt(S.date)}</div></div><div class="summary-row"><div class="summary-label">時間</div><div class="summary-value">${esc(S.time)}</div></div><div class="summary-row"><div class="summary-label">旅人</div><div class="summary-value">${esc(S.name)}</div></div><div class="summary-row"><div class="summary-label">聯繫帳號</div><div class="summary-value">${esc(S.contactMethod==='IG'?'Instagram':'LINE')}・${esc(S.contactValue)}</div></div><div class="summary-row"><div class="summary-label">生日</div><div class="summary-value">${fmt(S.birthday)}</div></div><div class="summary-row"><div class="summary-label">性別</div><div class="summary-value">${esc(S.gender)}</div></div>`}
function four(){return `<section class="card"><div class="kicker">最後看一眼</div><h2>再確認一次 ♡</h2><div class="summary">${summaryRows()}</div><div class="actions"><button type="button" class="btn" onclick="prev()">返回修改</button><button type="button" id="submitBtn" class="btn primary" onclick="submitForm()">確認預約 ♡</button></div></section>`}
function journeyTimeLabel(){return S.journey==='初遇'?S.settings.initial_time_label:S.journey==='拾光'?S.settings.light_time_label:S.settings.walk_time_label}
function success(){const next=S.contactMethod==='LINE'?`我會透過你留下的 <b>LINE</b> 與你聯繫。<br>旅程開始前，會再將需要準備的內容傳給你。`:`我會透過你留下的 <b>Instagram</b> 與你聯繫。<br>請留意 IG 訊息，也可以留意陌生訊息匣。`;return `<section class="card success"><div class="success-mark">♡</div><div class="kicker">預約完成</div><h2>這段時間，已經為你留下。</h2><p class="sub">請先把這個時間留給自己，下面是這次的預約資訊。</p><div class="confirm-card"><div class="confirm-date">${fmt(S.date)}</div><div class="confirm-time">${esc(S.time)}</div><div class="confirm-trip">${esc(S.journey)}｜${esc(journeyTimeLabel()||'')}</div><div class="confirm-name">旅人｜${esc(S.name)}</div></div><div class="next-card"><b>接下來 ♡</b><br>${next}</div><div class="success-actions"><button type="button" class="btn sage" onclick="addToCalendar()">加入行事曆</button></div><p class="success-note">建議先將日期加入行事曆，之後只要留意你選擇的聯繫管道即可。</p></section>`}
function addToCalendar(){try{const start=`${S.date.replaceAll('-','')}T${S.time.replace(':','')}00`,h=Number(S.time.slice(0,2))+1,end=`${S.date.replaceAll('-','')}T${String(h).padStart(2,'0')}0000`,desc=`旅人：${S.name}｜聯繫：${S.contactMethod==='IG'?'Instagram':'LINE'} ${S.contactValue}`,ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Shiguang//Booking//ZH\r\nBEGIN:VEVENT\r\nDTSTART:${start}\r\nDTEND:${end}\r\nSUMMARY:拾光所｜${S.journey}\r\nDESCRIPTION:${desc}\r\nEND:VEVENT\r\nEND:VCALENDAR`,blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`拾光所-${S.journey}-${S.date}.ics`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){console.error(e);toast('目前無法加入行事曆，請先截圖保留預約時間')}}
function next(){if(S.step===1&&!S.journey)return;if(S.step===2&&(!S.date||!S.time))return;S.step++;render(true)}function prev(){S.step=Math.max(1,S.step-1);render(true)}
async function submitForm(){if(S.submitting)return;const b=document.getElementById('submitBtn');S.submitting=true;if(b){b.disabled=true;b.textContent='正在送出…'}try{const r=await fetch(`${U}/rest/v1/traveler_bookings`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({traveler_name:S.name,instagram:S.contactValue,contact_method:S.contactMethod,birthday:S.birthday,gender:S.gender,journey:S.journey,booking_date:S.date,booking_time:S.time+':00'})});if(r.status===201){S.done=true;render(true);return}const txt=await r.text();console.error('booking failed',r.status,txt);toast('送出失敗，這個時段可能剛被預約，請重新選擇');S.step=2;S.date='';S.time='';await load()}catch(e){console.error(e);toast('網路好像有點不穩，請再試一次')}finally{S.submitting=false;if(b&&!S.done){b.disabled=false;b.textContent='確認預約 ♡'}}}
load();
</script>
</body>
</html>
