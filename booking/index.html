<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><title>拾光所｜療癒服務預約</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet"><style>:root{--rose:#C9938A;--rose2:#F5E4E0;--sage:#8FA68E;--cream:#FBF3EA;--ink:#4B4540;--soft:#786F68;--muted:#A39A93;--line:#EAE1DA}*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 4%,#F8E7E3 0,transparent 25%),radial-gradient(circle at 92% 18%,#E7F0E5 0,transparent 28%),#FBF8F4;font-family:"Zen Maru Gothic","jf open 粉圓","PingFang TC",ui-rounded,sans-serif}.wrap{max-width:720px;margin:auto;padding:14px 12px 70px}.hero,.card{width:100%;max-width:100%;overflow:hidden;background:#fffdfc;border:1px solid var(--line);box-shadow:0 14px 36px rgba(91,72,59,.08)}.hero{border-radius:30px;padding:27px 18px;text-align:center}.hero h1{font-size:28px;margin:8px 0;font-weight:900;letter-spacing:.055em}.hero p{margin:0;color:var(--soft);line-height:1.8}.mark{font-size:27px}.card{border-radius:26px;padding:20px 16px;margin-top:16px}.kicker{font-size:12px;font-weight:800;color:var(--rose);margin-bottom:6px}h2{font-size:22px;margin:0 0 8px;font-weight:900;letter-spacing:.035em}.sub{font-size:12px;color:var(--muted);line-height:1.7}.journeys{display:grid;gap:11px}.journey{font-family:inherit;width:100%;max-width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:16px;color:var(--ink)}.journey.active{border:2px solid var(--rose);background:#fff7f4}.journey strong{font-size:18px;font-weight:900}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--rose2);font-size:11px;font-weight:800}.price{background:#eef4eb;color:#586b57}.desc{font-size:13px;color:var(--soft);line-height:1.7}.notice{margin:13px 0;padding:14px;border-radius:18px;background:#fff8f3;border:1px solid var(--line);font-size:12px;line-height:1.8}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{font-family:inherit;width:100%;max-width:100%;aspect-ratio:1;border:0;border-radius:14px}.day.open{background:#D8E8D5;color:#526953;font-weight:900}.day.selected{background:var(--rose);color:#fff}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.slot{font-family:inherit;width:100%;max-width:100%;border:1px solid #C9DCC5;background:#F2F8F0;color:#587058;border-radius:16px;padding:11px 5px;font-weight:900}.slot.active{background:var(--rose);color:#fff}.field{margin-bottom:14px;width:100%;max-width:100%}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,select{display:block;width:100%;max-width:100%;height:48px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:0 13px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px;width:100%;max-width:100%}.btn{font-family:inherit;width:100%;max-width:100%;border:1px solid var(--line);background:#fff;color:var(--soft);padding:12px;border-radius:16px;font-weight:800}.btn.primary{background:#B98279;color:#fff;border:0}.btn:disabled{opacity:.4}.summary{background:var(--cream);border:1px dashed #DCCEC3;border-radius:19px;padding:15px}.row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;padding:6px 0}.success{text-align:center}.line{display:block;width:100%;max-width:100%;text-decoration:none;background:#06C755;color:white;padding:14px;border-radius:16px;font-weight:800;margin-top:12px}.error{padding:12px;border-radius:15px;background:#fff0ef;color:#8e554c;margin-top:10px;font-size:12px}.policy{font-size:12px;line-height:1.8;color:#756c66;background:#f6f8f3;border-radius:16px;padding:13px;margin-top:12px}@media(max-width:480px){.wrap{padding-left:12px;padding-right:12px}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:18px 15px}.actions{gap:10px}}.calendar-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.calendar-nav button{border:1px solid #e6d9d4;background:#fff;border-radius:13px;width:43px;height:40px;font-size:26px;color:#956d75}.calendar-nav strong{font-size:16px}.legend{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 17px;font-size:11px;color:#7c716d}.legend span{display:flex;align-items:center;gap:4px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid #ddd}.leg-open,.day.open{background:#d8e8d5!important;color:#526953!important}.leg-booked,.day.booked{background:#f1d7d9!important;color:#9a6672!important}.leg-closed,.day.closed{background:#fff!important;color:#b7aea8!important;border:1px solid #eee4dc!important}.leg-selected,.day.selected{background:#bd8292!important;color:#fff!important}.day:disabled{opacity:1;cursor:not-allowed}.day{font-size:14px}.day:focus-visible,.slot:focus-visible,.journey:focus-visible{outline:3px solid #ac8190;outline-offset:2px}</style><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3">
