<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#FBF6F1">
<title>拾光所｜旅程預約</title>
<style>
:root{--rose:#C9938A;--rose-dark:#A96F66;--rose2:#F5E4E0;--sage:#8FA68E;--sage-dark:#526953;--sage2:#DDEADB;--cream:#FBF3EA;--ink:#4B4540;--soft:#786F68;--muted:#A39A93;--line:#EAE1DA;--shadow:0 14px 36px rgba(91,72,59,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 4%,#F8E7E3 0,transparent 25%),radial-gradient(circle at 92% 18%,#E7F0E5 0,transparent 28%),#FBF8F4;font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:14px 12px calc(70px + env(safe-area-inset-bottom))}.hero,.card{background:rgba(255,253,252,.98);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:32px;padding:28px 18px 25px;text-align:center}.mark{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#F8E7E2,#EEF3E9);font-size:27px}.brand{margin-top:10px;font-size:13px;font-weight:800;letter-spacing:.2em;color:#8D8077}.hero h1{font-size:28px;margin:8px 0}.lead{font-size:15px;line-height:1.85;color:var(--soft);margin:0}.tiny{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:999px;background:#FFF7F4;color:#A17F76;font-size:12px}.progress{display:flex;justify-content:center;gap:7px;margin:17px 0 7px}.dot{width:9px;height:9px;border-radius:50%;background:#E3DDD8}.dot.active{width:28px;border-radius:99px;background:var(--rose)}.dot.done{background:#B9C8B8}.caption{text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px}.card{border-radius:27px;padding:20px 16px}.kicker{font-size:12px;font-weight:800;color:var(--rose);margin-bottom:6px}.kicker:before{content:"✦ ";font-size:9px}h2{font-size:22px;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);line-height:1.75;margin-top:0}.journeys{display:grid;gap:12px;margin-top:15px}.journey{position:relative;width:100%;border:1.5px solid var(--line);background:#fff;text-align:left;border-radius:23px;padding:17px;color:var(--ink);transition:.18s ease;box-shadow:0 4px 12px rgba(91,72,59,.02)}.journey:after{content:"♡";position:absolute;right:17px;top:15px;font-size:21px;color:#D8CCC6;transition:.18s ease}.journey.active{background:linear-gradient(145deg,#FFF5F1,#FFFDFC);border:2px solid var(--rose);box-shadow:0 9px 22px rgba(201,147,138,.18);transform:translateY(-1px)}.journey.active:after{content:"♥";color:var(--rose-dark);transform:scale(1.08)}.journey-head{display:flex;align-items:center;gap:10px;padding-right:34px}.journey-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:#F8F1EC;color:#A9867E;font-size:15px;flex:0 0 auto}.journey.active .journey-icon{background:var(--rose2);color:var(--rose-dark)}.journey strong{display:block;font-size:18px}.time{display:inline-block;font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;margin:7px 0 8px;background:var(--rose2);color:#8D625A}.desc{display:block;font-size:13px;color:var(--soft);line-height:1.7;padding-right:25px}.notice{margin:13px 0 15px;padding:14px 15px;border-radius:20px;background:linear-gradient(145deg,#FFF8F4,#F5F8F1);border:1px solid #E7DDD4;font-size:12px;line-height:1.75;color:#71685F}.notice b{color:#5C554F}.notice .important{color:#95665C;font-weight:900}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{aspect-ratio:1;border:0;background:#F6F3F0;border-radius:16px;color:#C8C0BA;font-weight:700;transition:.16s ease}.day:disabled{opacity:.38}.day.open{background:#D8E8D5;color:var(--sage-dark);font-weight:900;box-shadow:inset 0 0 0 1.5px #B8D0B4}.day.open:active{transform:scale(.96)}.day.selected,.day.open.selected{background:var(--rose);color:#fff;box-shadow:0 6px 13px rgba(201,147,138,.26),inset 0 0 0 2px rgba(255,255,255,.38)}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.circle{width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:50%;font-size:20px}.calendar-legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:13px 0 4px;padding:9px 12px;border-radius:17px;background:#FBF7F3;border:1px solid #EEE4DD;font-size:11px;color:#817870}.legend-item{display:inline-flex;align-items:center;gap:6px;font-weight:700}.legend-dot{width:13px;height:13px;border-radius:5px;display:inline-block}.legend-dot.open{background:#D8E8D5;border:1px solid #B8D0B4}.legend-dot.selected{background:var(--rose)}.legend-dot.closed{background:#F0ECE8;border:1px solid #E5DED8}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.slot{position:relative;border:1px solid #C9DCC5;background:#F2F8F0;color:#587058;border-radius:999px;padding:12px 5px;font-weight:900;transition:.16s ease}.slot.active{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 5px 12px rgba(201,147,138,.24)}.slot.active:after{content:" ✓";font-size:11px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.hint{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.55}.field-row{display:grid;grid-template-columns:108px 1fr;gap:8px}input,select{width:100%;min-width:0;border:1px solid var(--line);background:#FFFDFC;border-radius:18px;padding:13px 14px;color:var(--ink);outline:none;font-size:16px}input:focus,select:focus{border-color:#D3AAA2;box-shadow:0 0 0 3px rgba(201,147,138,.12)}.required{color:#B77F75}.reminder{border-radius:20px;padding:15px;font-size:13px;line-height:1.8;margin:14px 0;background:#F2F7F0;color:#657365}.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13px}.checkline input{width:18px;height:18px;flex:0 0 auto;margin-top:1px}.summary{background:linear-gradient(145deg,var(--cream),#FFFDFC);border:1px dashed #DCCEC3;border-radius:21px;padding:17px;margin-bottom:16px}.summary-row{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed #E8DED6}.summary-row:last-child{border:0}.summary-label{font-size:11px;color:var(--muted)}.summary-value{font-size:14px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;color:var(--soft);padding:12px 12px;border-radius:999px;font-weight:800;min-height:48px}.btn.primary{background:linear-gradient(135deg,#B98279,#C9958C);color:#fff;border:0}.btn.line{background:#06C755;color:#fff;border-color:#06C755}.btn:disabled{opacity:.4}.success{text-align:center}.success-mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:auto auto 14px;background:linear-gradient(145deg,#F5E4DF,#EAF1E7);font-size:29px}.confirm-card{margin:17px 0 12px;padding:18px;border-radius:23px;background:linear-gradient(150deg,#FFF7F4,#FBF7EF 55%,#F0F6EE);border:1px solid #EADFD7;text-align:left}.confirm-date{font-size:20px;font-weight:900}.confirm-time{display:inline-block;margin-top:4px;padding:6px 11px;border-radius:999px;background:#fff;color:#8D625A;font-size:13px;font-weight:900}.confirm-trip{margin-top:12px;font-size:14px;font-weight:900}.next-step{margin-top:14px;padding:16px;border-radius:22px;background:#F3FAF3;border:1px solid #D5E7D4;text-align:left;color:#5E705E;font-size:13px;line-height:1.8}.next-step strong{display:block;font-size:15px;color:#4E664E;margin-bottom:3px}.line-message{margin-top:10px;padding:11px 13px;border-radius:15px;background:#fff;border:1px dashed #CFE0CF;font-weight:800;text-align:left}.success-main{display:grid;gap:9px;margin-top:14px}.success-main .line{font-size:15px;min-height:54px}.success-secondary{border:0;background:transparent;color:#8C817A;text-decoration:underline;min-height:42px}.errorbox{margin:12px 0 0;padding:12px 14px;border-radius:17px;background:#FFF1EF;border:1px solid #EAC9C4;color:#8E554C;font-size:12px;line-height:1.7;text-align:left}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;background:#554D47;color:white;padding:11px 15px;border-radius:999px;z-index:50;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1}@media(max-width:480px){.wrap{padding-left:10px;padding-right:10px}.hero{padding:25px 15px 22px}.card{padding:19px 14px}.journey{padding:16px}.journey-icon{width:29px;height:29px}.calendar{gap:4px}.calendar-legend{gap:8px;font-size:10px}.slots{grid-template-columns:repeat(2,1fr)}.slot{padding:13px 4px}.field-row{grid-template-columns:100px 1fr}.actions{gap:7px}.btn{padding:12px 9px}}
</style>

<body>
<div class="wrap">
<header class="hero"><div class="mark">𓇼</div><div class="brand">拾 光 所</div><h1>旅程預約</h1><p class="lead"><b>為自己，留一段時間。</b><br>選擇一段適合此刻的旅程。</p><div class="tiny">慢慢來，照著自己的步調就好 ♡</div></header>
<div class="progress"><i id="p1" class="dot active"></i><i id="p2" class="dot"></i><i id="p3" class="dot"></i><i id="p4" class="dot"></i></div><div id="caption" class="caption">選擇旅程</div>
<main id="content"><section class="card">正在讀取預約時間…</section></main>
</div><div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',LINE_URL='https://line.me/R/ti/p/@803ubkcf';
const S={step:1,journey:'',date:'',time:'',name:'',contactMethod:'IG',contactValue:'',birthday:'',gender:'',agree:false,done:false,availability:{},month:'',loading:true,submitting:false,lastError:''};
const STEPS=['選擇旅程','選擇日期與時間','留下資料','最後確認'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()} 年 ${x.getMonth()+1} 月 ${x.getDate()} 日`};
const content=document.getElementById('content'),toastEl=document.getElementById('toast');
function toast(x){toastEl.textContent=x;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),2400)}
function progress(){for(let i=1;i<=4;i++){const e=document.getElementById('p'+i);e.classList.toggle('active',S.step===i&&!S.done);e.classList.toggle('done',S.step>i||S.done)}document.getElementById('caption').textContent=S.done?'等待官方 LINE 確認':STEPS[S.step-1]}
function render(top=false){progress();content.innerHTML=S.loading?'<section class="card">正在讀取預約時間…</section>':S.done?success():S.step===1?one():S.step===2?two():S.step===3?three():four();if(top)requestAnimationFrame(()=>document.querySelector('.progress')?.scrollIntoView({behavior:'smooth',block:'start'}))}
async function fetchAvailability(){const r=await fetch(`${U}/rest/v1/booking_availability?select=booking_date,booking_time&is_open=eq.true&booking_date=gte.${today()}&order=booking_date.asc,booking_time.asc`,{headers:{apikey:K}});if(!r.ok)throw new Error('availability');const a=await r.json();S.availability={};a.forEach(x=>{const t=String(x.booking_time).slice(0,5);(S.availability[x.booking_date]??=[]).push(t)});Object.values(S.availability).forEach(v=>v.sort());return a}
async function load(){try{await fetchAvailability();const ds=Object.keys(S.availability).sort();S.month=(ds[0]||today()).slice(0,7)}catch(e){S.lastError='目前暫時無法載入可預約時間，請稍後重新整理。'}finally{S.loading=false;render()}}
function one(){const opts=[['初遇','40–50 分鐘','第一次相遇，先從此刻的自己開始。','✧'],['拾光','四週旅程','慢慢整理、分辨，找回自己的方向。','𓇼'],['同行','三個月陪伴','把看見與選擇真正帶回生活。','♡']];return `<section class="card"><div class="kicker">選擇你的旅程</div><h2>此刻，你想從哪一段旅程開始？</h2><p class="sub">沒有標準答案，選一個現在最靠近你的就好。</p><div class="journeys">${opts.map(x=>`<button type="button" class="journey ${S.journey===x[0]?'active':''}" onclick="S.journey='${x[0]}';render()"><div class="journey-head"><span class="journey-icon">${x[3]}</span><strong>${x[0]}</strong></div><span class="time">${x[1]}</span><span class="desc">${x[2]}</span></button>`).join('')}</div><div class="actions"><span></span><button type="button" class="btn primary" onclick="next()" ${S.journey?'':'disabled'}>下一步・選時間</button></div></section>`}
function monthShift(n){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1),cur=new Date(today().slice(0,7)+'-01T12:00:00');if(d<cur)return toast('過去的月份不能預約囉 ♡');S.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;S.date='';S.time='';render()}
function cal(){const [y,m]=S.month.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let z='';for(let i=0;i<start;i++)z+='<span></span>';for(let n=1;n<=days;n++){const d=`${S.month}-${String(n).padStart(2,'0')}`,open=!!S.availability[d]?.length;z+=`<button type="button" class="day ${open?'open':''} ${S.date===d?'selected':''}" ${open?'':'disabled'} onclick="S.date='${d}';S.time='';render()">${n}</button>`}return z}
function two(){const [y,m]=S.month.split('-');return `<section class="card"><div class="kicker">留一段時間給自己</div><h2>選一個適合你的日子</h2><div class="notice"><b>預約方式</b><br>送出資料後，系統會先幫你保留這個時段。<br><span class="important">加入拾光所官方 LINE 並收到確認通知後，才算正式預約成功。</span></div><div class="calendar-head"><button type="button" class="circle" onclick="monthShift(-1)">‹</button><strong>${y} 年 ${Number(m)} 月</strong><button type="button" class="circle" onclick="monthShift(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cal()}</div><div class="calendar-legend"><span class="legend-item"><i class="legend-dot open"></i>開放預約日</span><span class="legend-item"><i class="legend-dot selected"></i>已選日期</span><span class="legend-item"><i class="legend-dot closed"></i>未開放</span></div>${S.date?`<p class="sub" style="margin-top:15px"><b>${fmt(S.date)}</b>・選擇時間</p><div class="slots">${(S.availability[S.date]||[]).map(t=>`<button type="button" class="slot ${S.time===t?'active':''}" onclick="S.time='${t}';render()">${t}</button>`).join('')}</div>`:''}${S.lastError?`<div class="errorbox">${esc(S.lastError)}</div>`:''}<div class="actions"><button type="button" class="btn" onclick="prev()">返回</button><button type="button" class="btn primary" onclick="next()" ${S.date&&S.time?'':'disabled'}>下一步・留資料</button></div></section>`}
function three(){return `<section class="card"><div class="kicker">關於你</div><h2>留下一點關於你的資料 ♡</h2><div class="field"><label>名字／暱稱 <span class="required">*</span></label><input id="name" value="${esc(S.name)}" placeholder="希望我怎麼稱呼你？" autocomplete="name"></div><div class="field"><label>你在 LINE／IG 上的名字 <span class="required">*</span></label><div class="field-row"><select id="method" onchange="updatePH()"><option value="IG" ${S.contactMethod==='IG'?'selected':''}>Instagram</option><option value="LINE" ${S.contactMethod==='LINE'?'selected':''}>LINE</option></select><input id="contact" value="${esc(S.contactValue)}" placeholder="${S.contactMethod==='LINE'?'LINE 顯示名稱':'IG 名字／帳號'}" autocapitalize="off"></div><span class="hint">方便我核對你的預約資料；不論選 LINE 或 IG，最後都需要加入拾光所官方 LINE。</span></div><div class="field"><label>生日 <span class="required">*</span></label><input id="birthday" type="date" value="${esc(S.birthday)}" max="${today()}"></div><div class="field"><label>性別 <span class="required">*</span></label><select id="gender"><option value="">請選擇</option><option value="女" ${S.gender==='女'?'selected':''}>女</option><option value="男" ${S.gender==='男'?'selected':''}>男</option></select></div><div class="reminder"><b>♡ 預約前的小提醒</b><br>請確認這段時間能完整留給自己，並選擇一個能安心、不被打擾的空間。</div><label class="checkline"><input id="agree" type="checkbox" ${S.agree?'checked':''}><span>我已閱讀並確認以上內容</span></label><div class="actions"><button type="button" class="btn" onclick="prev()">返回</button><button type="button" class="btn primary" onclick="saveProfile()">下一步・確認</button></div></section>`}
function updatePH(){const m=document.getElementById('method'),v=document.getElementById('contact');v.placeholder=m.value==='LINE'?'LINE 顯示名稱':'IG 名字／帳號'}
function saveProfile(){const n=document.getElementById('name').value.trim(),m=document.getElementById('method').value,c=document.getElementById('contact').value.trim(),b=document.getElementById('birthday').value,g=document.getElementById('gender').value,a=document.getElementById('agree').checked;if(!n)return toast('請告訴我怎麼稱呼你 ♡');if(!c)return toast(`請填寫你的 ${m==='LINE'?'LINE 顯示名稱':'IG 名字／帳號'}`);if(!b)return toast('請選擇生日');if(b>today())return toast('生日不能是未來日期');if(!g)return toast('請選擇性別');if(!a)return toast('請先確認預約前的小提醒');Object.assign(S,{name:n,contactMethod:m,contactValue:c,birthday:b,gender:g,agree:true,step:4,lastError:''});render(true)}
function rows(){return [['旅程',S.journey],['日期',fmt(S.date)],['時間',S.time],['旅人',S.name],['聯繫',`${S.contactMethod}・${S.contactValue}`],['生日',fmt(S.birthday)],['性別',S.gender]].map(x=>`<div class="summary-row"><div class="summary-label">${x[0]}</div><div class="summary-value">${esc(x[1])}</div></div>`).join('')}
function four(){return `<section class="card"><div class="kicker">最後看一眼</div><h2>再確認一次 ♡</h2><p class="sub">送出後這個時段會先為你保留；正式成功仍以官方 LINE 的確認通知為準。</p><div class="summary">${rows()}</div>${S.lastError?`<div class="errorbox">${esc(S.lastError)}</div>`:''}<div class="actions"><button type="button" class="btn" onclick="prev()">返回修改</button><button id="submit" type="button" class="btn primary" onclick="submitForm()">送出預約資料 ♡</button></div></section>`}
function success(){const msg=`已預約｜${esc(S.name)}<br>${esc(S.journey)}・${fmt(S.date)}・${esc(S.time)}<br>聯繫名字：${esc(S.contactValue)}`;return `<section class="card success"><div class="success-mark">♡</div><div class="kicker">預約資料已送出</div><h2>最後只要完成一件事</h2><p class="sub">你的時段已先保留，但目前<strong>還不是正式預約成功</strong>。</p><div class="confirm-card"><div class="confirm-date">${fmt(S.date)}</div><div class="confirm-time">${esc(S.time)}</div><div class="confirm-trip">${esc(S.journey)}｜旅人 ${esc(S.name)}</div></div><div class="next-step"><strong>♡ 前往拾光所官方 LINE</strong>我會先幫你複製下面的預約資料。到官方 LINE 後直接貼上，等待拾光所的確認通知即可。<div class="line-message">${msg}</div><br><b>收到官方 LINE 的「預約成功」通知，才代表正式完成。</b></div><div class="success-main"><button type="button" class="btn line" onclick="finishLine()">複製資料・前往官方 LINE</button><button type="button" class="success-secondary" onclick="copyMsg()">只複製預約資料</button></div></section>`}
async function copyMsg(silent=false){const t=`已預約｜${S.name}\n${S.journey}・${fmt(S.date)}・${S.time}\n聯繫名字：${S.contactValue}`;try{await navigator.clipboard.writeText(t);if(!silent)toast('預約資料已複製 ♡');return true}catch(e){if(!silent)toast('請長按上方預約資料複製');return false}}
async function finishLine(){await copyMsg(true);location.href=LINE_URL}
function next(){S.step++;S.lastError='';render(true)}function prev(){S.step=Math.max(1,S.step-1);S.lastError='';render(true)}
async function selectedSlotStillOpen(){try{const r=await fetch(`${U}/rest/v1/booking_availability?select=is_open&booking_date=eq.${S.date}&booking_time=eq.${S.time}:00`,{headers:{apikey:K}});if(!r.ok)return null;const a=await r.json();return a[0]?.is_open===true}catch{return null}}
async function submitForm(){if(S.submitting)return;S.submitting=true;S.lastError='';const b=document.getElementById('submit');if(b){b.disabled=true;b.textContent='正在確認時段…'}try{const open=await selectedSlotStillOpen();if(open===false){S.lastError='這個時段剛剛已被其他旅人保留了。請返回重新選擇日期或時間。';await fetchAvailability().catch(()=>{});S.step=2;S.date='';S.time='';render(true);return}if(b)b.textContent='正在送出…';const r=await fetch(`${U}/rest/v1/traveler_bookings`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({traveler_name:S.name,instagram:S.contactValue,contact_method:S.contactMethod,birthday:S.birthday,gender:S.gender,journey:S.journey,booking_date:S.date,booking_time:S.time+':00',status:'pending'})});if(r.status===201){S.done=true;render(true);return}let detail='';try{detail=await r.text()}catch{};if(r.status===409||/duplicate|unique|not available|slot/i.test(detail)){S.lastError='這個時段剛剛被其他旅人保留了，請重新選擇一個時間。';await fetchAvailability().catch(()=>{});S.step=2;S.date='';S.time='';render(true)}else if(r.status===400||r.status===422){S.lastError='有一項資料沒有通過檢查，請返回確認生日、性別與聯繫名字是否完整。';render()}else if(r.status===401||r.status===403){S.lastError='預約系統暫時無法送出資料，請稍後再試；你的資料還沒有送出。';render()}else{S.lastError='目前暫時無法完成送出，請確認網路後再試一次。你的預約資料還沒有送出。';render()}}catch(e){S.lastError='網路連線似乎不穩定。你的資料還沒有送出，請確認網路後再試一次。';render()}finally{S.submitting=false;const btn=document.getElementById('submit');if(btn&&!S.done){btn.disabled=false;btn.textContent='送出預約資料 ♡'}}}
load();
</script>
