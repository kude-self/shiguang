<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><title>拾光所｜旅人預約</title><style>:root{--rose:#C9938A;--rose2:#F5E4E0;--sage:#8FA68E;--cream:#FBF3EA;--ink:#4B4540;--soft:#786F68;--muted:#A39A93;--line:#EAE1DA}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 4%,#F8E7E3 0,transparent 25%),radial-gradient(circle at 92% 18%,#E7F0E5 0,transparent 28%),#FBF8F4;font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:720px;margin:auto;padding:14px 12px 70px}.hero,.card{background:#fffdfc;border:1px solid var(--line);box-shadow:0 14px 36px rgba(91,72,59,.08)}.hero{border-radius:30px;padding:27px 18px;text-align:center}.hero h1{font-size:28px;margin:8px 0}.hero p{margin:0;color:var(--soft);line-height:1.8}.mark{font-size:27px}.card{border-radius:26px;padding:20px 16px;margin-top:16px}.kicker{font-size:12px;font-weight:800;color:var(--rose);margin-bottom:6px}h2{font-size:22px;margin:0 0 8px}.sub,.hint{font-size:12px;color:var(--muted);line-height:1.7}.journeys{display:grid;gap:11px}.journey{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:16px;color:var(--ink)}.journey.active{border:2px solid var(--rose);background:#fff7f4}.journey strong{font-size:18px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--rose2);font-size:11px;font-weight:800}.price{background:#eef4eb;color:#586b57}.desc{font-size:13px;color:var(--soft);line-height:1.7}.notice{margin:13px 0;padding:14px;border-radius:18px;background:#fff8f3;border:1px solid var(--line);font-size:12px;line-height:1.8}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border:0;border-radius:14px}.day.open{background:#D8E8D5;color:#526953;font-weight:900}.day.selected{background:var(--rose);color:#fff}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.slot{border:1px solid #C9DCC5;background:#F2F8F0;color:#587058;border-radius:999px;padding:11px 5px;font-weight:900}.slot.active{background:var(--rose);color:#fff}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 13px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.btn{border:1px solid var(--line);background:#fff;color:var(--soft);padding:12px;border-radius:999px;font-weight:800}.btn.primary{background:#B98279;color:#fff;border:0}.btn:disabled{opacity:.4}.summary{background:var(--cream);border:1px dashed #DCCEC3;border-radius:19px;padding:15px}.row{display:grid;grid-template-columns:74px 1fr;gap:8px;padding:6px 0}.success{text-align:center}.line{display:block;text-decoration:none;background:#06C755;color:white;padding:14px;border-radius:999px;font-weight:800;margin-top:12px}.error{padding:12px;border-radius:15px;background:#fff0ef;color:#8e554c;margin-top:10px;font-size:12px}.policy{font-size:12px;line-height:1.8;color:#756c66;background:#f6f8f3;border-radius:16px;padding:13px;margin-top:12px}@media(max-width:480px){.slots{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header class="hero"><div class="mark">𓇼</div><div>拾 光 所</div><h1>旅人入口</h1><p>不用先整理好自己。<br>從現在的你，開始就好。</p></header><main id="content"></main></div><script>const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',LINE_URL='https://line.me/R/ti/p/@803ubkcf';const S={step:1,journey:'',date:'',time:'',name:'',contact:'',birthday:'',gender:'',availability:{},month:'',loading:true,error:'',done:false};const SERVICES={初遇:{time:'40–60 分鐘',price:'NT$580',desc:'第一次相遇，整理此刻的感受與正在經歷的事。'},拾光:{time:'4 次・約 4–6 週',price:'NT$2,880',desc:'慢慢看見、分辨，找回自己的方向。'},同行:{time:'3 個月・5 次',price:'NT$4,880',desc:'把看見與選擇真正帶回生活。'},生日拾光:{time:'兩張正反面小卡',price:'NT$111 ＋ 郵寄 NT$40',desc:'留下此刻的光與一個專屬提醒。首批測試價。'}};const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toISOString().slice(0,10),fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});function render(){content.innerHTML=S.loading?'<section class="card">正在讀取可預約時間…</section>':S.done?success():S.step===1?one():S.step===2?two():S.step===3?three():four()}async function load(){try{const r=await fetch(`${U}/rest/v1/booking_availability?select=booking_date,booking_time&is_open=eq.true&booking_date=gte.${today()}&order=booking_date.asc,booking_time.asc`,{headers:{apikey:K}});const a=await r.json();a.forEach(x=>{const t=String(x.booking_time).slice(0,5);(S.availability[x.booking_date]??=[]).push(t)});S.month=(Object.keys(S.availability).sort()[0]||today()).slice(0,7)}catch{S.error='目前暫時無法載入可預約時間。'}S.loading=false;render()}function one(){return `<section class="card"><div class="kicker">這一次，你想從哪裡開始？</div><h2>選擇此刻最靠近你的服務</h2><div class="journeys">${Object.entries(SERVICES).map(([n,v])=>`<button class="journey ${S.journey===n?'active':''}" onclick="choose('${n}')"><strong>${n}</strong><div class="meta"><span class="pill">${v.time}</span><span class="pill price">${v.price}</span></div><div class="desc">${v.desc}</div></button>`).join('')}</div><div class="notice"><b>付款與成立</b><br>目前上線版皆採全額付款後成立。填寫資料不等於預約／訂單成立；完成付款並到官方 LINE 私訊，收到拾光所確認後才正式成立。</div></section>`}function choose(n){if(n==='生日拾光'){location.href='../birthday/?v=20';return}S.journey=n;S.step=2;render()}function cal(){const [y,m]=S.month.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let z='';for(let i=0;i<start;i++)z+='<span></span>';for(let n=1;n<=days;n++){const d=`${S.month}-${String(n).padStart(2,'0')}`,open=!!S.availability[d]?.length;z+=`<button class="day ${open?'open':''} ${S.date===d?'selected':''}" ${open?'':'disabled'} onclick="S.date='${d}';S.time='';render()">${n}</button>`}return z}function two(){return `<section class="card"><div class="kicker">選擇日期與時間</div><h2>${esc(S.journey)}｜${SERVICES[S.journey].price}</h2><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cal()}</div>${S.date?`<div class="slots">${(S.availability[S.date]||[]).map(t=>`<button class="slot ${S.time===t?'active':''}" onclick="S.time='${t}';render()">${t}</button>`).join('')}</div>`:''}<div class="actions"><button class="btn" onclick="S.step=1;render()">返回</button><button class="btn primary" ${S.date&&S.time?'':'disabled'} onclick="S.step=3;render()">下一步</button></div></section>`}function three(){return `<section class="card"><div class="kicker">留下資料</div><h2>讓我知道怎麼找到你</h2><div class="field"><label>名字／稱呼 *</label><input id="name" value="${esc(S.name)}"></div><div class="field"><label>LINE 顯示名稱／IG 帳號 *</label><input id="contact" value="${esc(S.contact)}"></div><div class="field"><label>生日</label><input id="birthday" type="date" value="${esc(S.birthday)}"></div><div class="field"><label>性別</label><select id="gender"><option value="">不指定</option><option ${S.gender==='女'?'selected':''}>女</option><option ${S.gender==='男'?'selected':''}>男</option><option ${S.gender==='其他／不指定'?'selected':''}>其他／不指定</option></select></div><div class="policy"><b>改期／取消</b><br>24 小時前可免費改期 1 次。24 小時內臨時取消或未出席，原則上視同使用該次；特殊狀況由拾光所人工協調。拾光／同行開始後若需暫停，也以人工協調為主。</div><div class="actions"><button class="btn" onclick="S.step=2;render()">返回</button><button class="btn primary" onclick="save()">下一步</button></div></section>`}function save(){S.name=$('name').value.trim();S.contact=$('contact').value.trim();S.birthday=$('birthday').value;S.gender=$('gender').value;if(!S.name||!S.contact)return alert('請填寫名字與聯繫名稱');S.step=4;render()}function four(){const v=SERVICES[S.journey];return `<section class="card"><div class="kicker">最後確認</div><h2>送出前再看一次</h2><div class="summary"><div class="row"><span>服務</span><b>${S.journey}</b></div><div class="row"><span>費用</span><b>${v.price}</b></div><div class="row"><span>日期</span><b>${fmt(S.date)}</b></div><div class="row"><span>時間</span><b>${S.time}</b></div><div class="row"><span>旅人</span><b>${esc(S.name)}</b></div></div><div class="notice">送出後系統只會建立「待確認」資料。請完成全額付款後，到官方 LINE 私訊並等待拾光所核對；收到確認後才正式成立。</div>${S.error?`<div class="error">${esc(S.error)}</div>`:''}<div class="actions"><button class="btn" onclick="S.step=3;render()">返回</button><button class="btn primary" onclick="submitForm()">送出預約資料</button></div></section>`}async function submitForm(){S.error='';try{const r=await fetch(`${U}/rest/v1/traveler_bookings`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({traveler_name:S.name,instagram:S.contact,contact_method:'LINE/IG',birthday:S.birthday||null,gender:S.gender||null,journey:S.journey,booking_date:S.date,booking_time:S.time+':00',status:'pending'})});if(!r.ok)throw new Error();S.done=true;render()}catch{S.error='目前暫時無法送出，請確認網路後再試。';render()}}function success(){return `<section class="card success"><div class="kicker">預約資料已送出</div><h2>目前還不是正式成立</h2><p class="sub">請完成全額付款，接著到官方 LINE 私訊「${esc(S.journey)}＋${esc(S.name)}＋預約日期 ${fmt(S.date)}」，等待拾光所核對。</p><a class="line" href="${LINE_URL}">前往拾光所官方 LINE</a></section>`}load();</script></body></html>
