<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6F1">
<title>拾光所｜旅程預約</title>
<style>
:root{--rose:#C9938A;--rose-dark:#A96F66;--rose2:#F5E4E0;--sage:#8FA68E;--sage-dark:#526953;--sage2:#DDEADB;--cream:#FBF3EA;--ink:#4B4540;--soft:#786F68;--muted:#A39A93;--line:#EAE1DA;--shadow:0 14px 36px rgba(91,72,59,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 4%,#F8E7E3 0,transparent 25%),radial-gradient(circle at 92% 18%,#E7F0E5 0,transparent 28%),#FBF8F4;font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:14px 12px 60px}.hero,.card{background:rgba(255,253,252,.98);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{border-radius:32px;padding:28px 18px 26px;text-align:center}.mark{width:62px;height:62px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#F8E7E2,#EEF3E9);font-size:27px}.brand{margin-top:10px;font-size:13px;font-weight:800;letter-spacing:.2em;color:#8D8077}.hero h1{font-size:28px;margin:8px 0}.lead{font-size:15px;line-height:1.85;color:var(--soft);margin:0}.tiny{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:999px;background:#FFF7F4;color:#A17F76;font-size:12px}.progress{display:flex;justify-content:center;gap:7px;margin:17px 0 7px}.dot{width:9px;height:9px;border-radius:50%;background:#E3DDD8}.dot.active{width:28px;border-radius:99px;background:var(--rose)}.dot.done{background:#B9C8B8}.caption{text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px}.card{border-radius:27px;padding:20px 16px}.kicker{font-size:12px;font-weight:800;color:var(--rose);margin-bottom:6px}.kicker:before{content:"✦ ";font-size:9px}h2{font-size:22px;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);line-height:1.75;margin-top:0}.journeys{display:grid;gap:12px;margin-top:15px}.journey{position:relative;width:100%;border:1.5px solid var(--line);background:#fff;text-align:left;border-radius:23px;padding:17px;color:var(--ink);transition:.18s ease;box-shadow:0 4px 12px rgba(91,72,59,.02)}.journey:after{content:"♡";position:absolute;right:17px;top:15px;font-size:21px;color:#D8CCC6;transition:.18s ease}.journey.active{background:linear-gradient(145deg,#FFF7F4,#FFFDFC);border:2px solid var(--rose);box-shadow:0 8px 20px rgba(201,147,138,.16);transform:translateY(-1px)}.journey.active:after{content:"♥";color:var(--rose-dark);transform:scale(1.05)}.journey strong{display:block;font-size:18px;padding-right:34px}.time{display:inline-block;font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;margin:6px 0 8px;background:var(--rose2);color:#8D625A}.desc{display:block;font-size:13px;color:var(--soft);line-height:1.7;padding-right:25px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{aspect-ratio:1;border:0;background:transparent;border-radius:16px;color:#D2CBC6;font-weight:600}.day:disabled{opacity:.62}.day.open{background:#DDEADB;color:var(--sage-dark);font-weight:900;box-shadow:inset 0 0 0 1px #CEDFCB}.day.open:active{transform:scale(.96)}.day.selected,.day.open.selected{background:var(--rose);color:#fff;box-shadow:0 6px 13px rgba(201,147,138,.24),inset 0 0 0 2px rgba(255,255,255,.35)}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.circle{width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:50%;font-size:20px}.calendar-legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:13px 0 4px;font-size:11px;color:#817870}.legend-item{display:inline-flex;align-items:center;gap:6px}.legend-dot{width:13px;height:13px;border-radius:5px;display:inline-block}.legend-dot.open{background:#DDEADB;border:1px solid #C8DCC5}.legend-dot.selected{background:var(--rose)}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.slot{border:1px solid #DDE8DA;background:#F5F9F3;color:#617661;border-radius:999px;padding:11px 5px;font-weight:800}.slot.active{background:#70816F;color:white}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field-row{display:grid;grid-template-columns:108px 1fr;gap:8px}input,select{width:100%;min-width:0;border:1px solid var(--line);background:#FFFDFC;border-radius:18px;padding:13px 14px;color:var(--ink);outline:none;font-size:16px}.required{color:#B77F75}.reminder,.line-guide{border-radius:20px;padding:15px;font-size:13px;line-height:1.8;margin:14px 0}.reminder{background:#F2F7F0;color:#657365}.line-guide{background:#F4FBF5;border:1px solid #D9ECD9;color:#5F705F}.checkline{display:flex;gap:8px;align-items:flex-start;font-size:13px}.checkline input{width:18px;height:18px}.summary{background:linear-gradient(145deg,var(--cream),#FFFDFC);border:1px dashed #DCCEC3;border-radius:21px;padding:17px;margin-bottom:16px}.summary-row{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed #E8DED6}.summary-row:last-child{border:0}.summary-label{font-size:11px;color:var(--muted)}.summary-value{font-size:14px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;color:var(--soft);padding:12px 12px;border-radius:999px;font-weight:800;min-height:46px}.btn.primary{background:linear-gradient(135deg,#B98279,#C9958C);color:#fff;border:0}.btn.sage{background:var(--sage2);color:#617461}.btn.line{background:#06C755;color:#fff;border-color:#06C755}.btn:disabled{opacity:.4}.success{text-align:center}.success-mark{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:auto auto 14px;background:linear-gradient(145deg,#F5E4DF,#EAF1E7);font-size:29px}.confirm-card{margin:18px 0 12px;padding:18px;border-radius:23px;background:linear-gradient(150deg,#FFF7F4,#FBF7EF 55%,#F0F6EE);border:1px solid #EADFD7;text-align:left}.confirm-date{font-size:20px;font-weight:900}.confirm-time{display:inline-block;margin-top:4px;padding:6px 11px;border-radius:999px;background:#fff;color:#8D625A;font-size:13px;font-weight:900}.confirm-trip{margin-top:12px;font-size:14px;font-weight:900}.line-message{margin-top:10px;padding:11px 13px;border-radius:15px;background:#fff;border:1px dashed #CFE0CF;font-weight:800;text-align:left}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);opacity:0;background:#554D47;color:white;padding:11px 15px;border-radius:999px;z-index:50;max-width:calc(100vw - 30px);text-align:center}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="mark">𓇼</div><div class="brand">拾 光 所</div><h1>旅程預約</h1><p class="lead"><b>為自己，留一段時間。</b><br>選擇一段適合此刻的旅程。</p><div class="tiny">慢慢來，照著自己的步調就好 ♡</div></header>
<div class="progress"><i id="p1" class="dot active"></i><i id="p2" class="dot"></i><i id="p3" class="dot"></i><i id="p4" class="dot"></i></div><div id="caption" class="caption">選擇旅程</div>
<main id="content"><section class="card">正在讀取預約時間…</section></main>
</div><div id="toast" class="toast"></div>
<script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',LINE_URL='https://line.me/R/ti/p/@803ubkcf';
const S={step:1,journey:'',date:'',time:'',name:'',contactMethod:'IG',contactValue:'',birthday:'',gender:'',agree:false,done:false,availability:{},month:'',loading:true,submitting:false};
const STEPS=['選擇旅程','選擇日期與時間','留下資料','最後確認'];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()} 年 ${x.getMonth()+1} 月 ${x.getDate()} 日`};
const content=document.getElementById('content'),toastEl=document.getElementById('toast');
function toast(x){toastEl.textContent=x;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function progress(){for(let i=1;i<=4;i++){const e=document.getElementById('p'+i);e.classList.toggle('active',S.step===i&&!S.done);e.classList.toggle('done',S.step>i||S.done)}document.getElementById('caption').textContent=S.done?'等待官方 LINE 確認':STEPS[S.step-1]}
function render(top=false){progress();content.innerHTML=S.loading?'<section class="card">正在讀取預約時間…</section>':S.done?success():S.step===1?one():S.step===2?two():S.step===3?three():four();if(top)requestAnimationFrame(()=>document.querySelector('.progress')?.scrollIntoView({behavior:'smooth',block:'start'}))}
async function load(){try{const r=await fetch(`${U}/rest/v1/booking_availability?select=booking_date,booking_time&is_open=eq.true&booking_date=gte.${today()}&order=booking_date.asc,booking_time.asc`,{headers:{apikey:K}});const a=await r.json();S.availability={};a.forEach(x=>{const t=String(x.booking_time).slice(0,5);(S.availability[x.booking_date]??=[]).push(t)});const ds=Object.keys(S.availability).sort();S.month=(ds[0]||today()).slice(0,7)}catch(e){toast('目前無法讀取預約時間')}finally{S.loading=false;render()}}
function one(){const opts=[['初遇','40–50 分鐘','第一次相遇，先從此刻的自己開始。'],['拾光','四週旅程','慢慢整理、分辨，找回自己的方向。'],['同行','三個月陪伴','把看見與選擇真正帶回生活。']];return `<section class="card"><div class="kicker">選擇你的旅程</div><h2>此刻，你想從哪一段旅程開始？</h2><p class="sub">沒有標準答案，選一個現在最靠近你的就好。</p><div class="journeys">${opts.map(x=>`<button class="journey ${S.journey===x[0]?'active':''}" onclick="S.journey='${x[0]}';render()"><strong>${x[0]}</strong><span class="time">${x[1]}</span><span class="desc">${x[2]}</span></button>`).join('')}</div><div class="actions"><span></span><button class="btn primary" onclick="next()" ${S.journey?'':'disabled'}>下一步・選時間</button></div></section>`}
function monthShift(n){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1);S.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;S.date='';S.time='';render()}
function cal(){const [y,m]=S.month.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay();let z='';for(let i=0;i<start;i++)z+='<span></span>';for(let n=1;n<=days;n++){const d=`${S.month}-${String(n).padStart(2,'0')}`,open=!!S.availability[d]?.length;z+=`<button class="day ${open?'open':''} ${S.date===d?'selected':''}" ${open?'':'disabled'} onclick="S.date='${d}';S.time='';render()">${n}</button>`}return z}
function two(){const [y,m]=S.month.split('-');return `<section class="card"><div class="kicker">留一段時間給自己</div><h2>選一個適合你的日子</h2><div class="calendar-head"><button class="circle" onclick="monthShift(-1)">‹</button><strong>${y} 年 ${Number(m)} 月</strong><button class="circle" onclick="monthShift(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cal()}</div><div class="calendar-legend"><span class="legend-item"><i class="legend-dot open"></i>開放預約日</span><span class="legend-item"><i class="legend-dot selected"></i>已選日期</span></div>${S.date?`<p class="sub" style="margin-top:15px">${fmt(S.date)}・可以選擇的時間</p><div class="slots">${(S.availability[S.date]||[]).map(t=>`<button class="slot ${S.time===t?'active':''}" onclick="S.time='${t}';render()">${t}</button>`).join('')}</div>`:''}<div class="actions"><button class="btn" onclick="prev()">返回</button><button class="btn primary" onclick="next()" ${S.date&&S.time?'':'disabled'}>下一步・留資料</button></div></section>`}
function three(){return `<section class="card"><div class="kicker">關於你</div><h2>留下一點關於你的資料 ♡</h2><div class="field"><label>名字／暱稱 <span class="required">*</span></label><input id="name" value="${esc(S.name)}" placeholder="請輸入名字或暱稱"></div><div class="field"><label>LINE／IG 名字 <span class="required">*</span></label><div class="field-row"><select id="method" onchange="updatePH()"><option value="IG" ${S.contactMethod==='IG'?'selected':''}>Instagram</option><option value="LINE" ${S.contactMethod==='LINE'?'selected':''}>LINE</option></select><input id="contact" value="${esc(S.contactValue)}" placeholder="${S.contactMethod==='LINE'?'請輸入你在 LINE 顯示的名字':'請輸入你的 IG 名字／帳號'}"></div></div><div class="field"><label>生日 <span class="required">*</span></label><input id="birthday" type="date" value="${esc(S.birthday)}" max="${today()}"></div><div class="field"><label>性別 <span class="required">*</span></label><select id="gender"><option value="">請選擇</option><option value="女" ${S.gender==='女'?'selected':''}>女</option><option value="男" ${S.gender==='男'?'selected':''}>男</option></select></div><div class="reminder"><b>♡ 預約前的小提醒</b><br>請確認這段時間能完整留給自己，並選擇一個能安心、不被打擾的空間。</div><label class="checkline"><input id="agree" type="checkbox" ${S.agree?'checked':''}><span>我已閱讀並確認以上內容</span></label><div class="actions"><button class="btn" onclick="prev()">返回</button><button class="btn primary" onclick="saveProfile()">下一步・確認</button></div></section>`}
function updatePH(){const m=document.getElementById('method'),v=document.getElementById('contact');v.placeholder=m.value==='LINE'?'請輸入你在 LINE 顯示的名字':'請輸入你的 IG 名字／帳號'}
function saveProfile(){const n=document.getElementById('name').value.trim(),m=document.getElementById('method').value,c=document.getElementById('contact').value.trim(),b=document.getElementById('birthday').value,g=document.getElementById('gender').value,a=document.getElementById('agree').checked;if(!n)return toast('請填寫名字或暱稱');if(!c)return toast('請填寫 LINE／IG 名字');if(!b)return toast('請選擇生日');if(!g)return toast('請選擇性別');if(!a)return toast('請先確認預約前的小提醒');Object.assign(S,{name:n,contactMethod:m,contactValue:c,birthday:b,gender:g,agree:true,step:4});render(true)}
function rows(){return [['旅程',S.journey],['日期',fmt(S.date)],['時間',S.time],['旅人',S.name],['聯繫',`${S.contactMethod}・${S.contactValue}`],['生日',fmt(S.birthday)],['性別',S.gender]].map(x=>`<div class="summary-row"><div class="summary-label">${x[0]}</div><div class="summary-value">${esc(x[1])}</div></div>`).join('')}
function four(){return `<section class="card"><div class="kicker">最後看一眼</div><h2>再確認一次 ♡</h2><div class="summary">${rows()}</div><div class="actions"><button class="btn" onclick="prev()">返回修改</button><button id="submit" class="btn primary" onclick="submitForm()">送出預約資料 ♡</button></div></section>`}
function success(){const msg=`已預約｜${esc(S.name)}<br>${esc(S.journey)}・${fmt(S.date)}・${esc(S.time)}<br>聯繫名字：${esc(S.contactValue)}`;return `<section class="card success"><div class="success-mark">♡</div><div class="kicker">預約資料已送出</div><h2>還差最後一步 ♡</h2><p class="sub">這筆資料已經送到拾光所，但<strong>尚未代表預約成功</strong>。</p><div class="confirm-card"><div class="confirm-date">${fmt(S.date)}</div><div class="confirm-time">${esc(S.time)}</div><div class="confirm-trip">${esc(S.journey)}｜旅人 ${esc(S.name)}</div></div><div class="line-guide"><b>請務必加入拾光所官方 LINE</b><br>無論你上面留下的是 LINE 名字或 IG 名字，都請加入官方 LINE，並傳送下面這段資料。<div class="line-message">${msg}</div><br><b>是否預約成功，一律以官方 LINE 發出的確認通知為準。</b></div><div style="display:grid;gap:9px"><button class="btn" onclick="copyMsg()">複製預約資料</button><button class="btn line" onclick="location.href='${LINE_URL}'">加入拾光所官方 LINE</button></div></section>`}
async function copyMsg(){const t=`已預約｜${S.name}\n${S.journey}・${fmt(S.date)}・${S.time}\n聯繫名字：${S.contactValue}`;try{await navigator.clipboard.writeText(t);toast('預約資料已複製 ♡')}catch(e){toast('請長按上方資料複製')}}
function next(){S.step++;render(true)}function prev(){S.step=Math.max(1,S.step-1);render(true)}
async function submitForm(){if(S.submitting)return;S.submitting=true;const b=document.getElementById('submit');if(b){b.disabled=true;b.textContent='正在送出…'}try{const r=await fetch(`${U}/rest/v1/traveler_bookings`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({traveler_name:S.name,instagram:S.contactValue,contact_method:S.contactMethod,birthday:S.birthday,gender:S.gender,journey:S.journey,booking_date:S.date,booking_time:S.time+':00',status:'pending'})});if(r.status===201){S.done=true;render(true)}else{console.error(await r.text());toast('送出失敗，請重新選擇時段')}}catch(e){toast('網路好像不穩，請再試一次')}finally{S.submitting=false;if(b&&!S.done){b.disabled=false;b.textContent='送出預約資料 ♡'}}}
load();
</script>
</body>
</html>
