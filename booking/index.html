<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FBF6F1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>拾光所｜旅程預約</title><style>
:root{--rose:#C9938A;--rose2:#F5E4E0;--blue:#89A8B8;--blue2:#E8F1F5;--sage:#93A994;--sage2:#E7EFE5;--ink:#4B4540;--soft:#786F68;--muted:#A39A93;--line:#EAE1DA;--shadow:0 14px 36px rgba(91,72,59,.08)}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 3%,#F8E7E3 0,transparent 25%),radial-gradient(circle at 91% 18%,#E7F0E5 0,transparent 28%),#FBF8F4;font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;letter-spacing:.01em}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:720px;margin:auto;padding:16px 14px 72px}.hero,.card{background:rgba(255,253,252,.96);border:1px solid var(--line);box-shadow:var(--shadow)}.hero{position:relative;overflow:hidden;border-radius:34px;padding:31px 22px 29px;text-align:center}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.hero:before{width:135px;height:135px;background:#F7E6E2;left:-58px;top:-64px}.hero:after{width:155px;height:155px;background:#E7EFE5;right:-68px;bottom:-86px}.mark{position:relative;width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#F8E7E2,#EEF3E9);font-size:26px;box-shadow:inset 0 0 0 1px rgba(201,147,138,.18)}.brand{position:relative;margin-top:11px;font-size:13px;font-weight:700;letter-spacing:.2em;color:#8D8077}.hero h1{position:relative;font-size:29px;margin:8px 0;letter-spacing:.05em}.lead{position:relative;font-size:15px;line-height:1.9;color:var(--soft)}.tiny{position:relative;display:inline-block;margin-top:10px;padding:7px 12px;border-radius:999px;background:#FFF7F4;color:#A17F76;font-size:12px}.progress{display:flex;justify-content:center;gap:7px;margin:18px 0 14px}.dot{width:9px;height:9px;border-radius:50%;background:#E3DDD8;transition:.2s}.dot.active{width:28px;border-radius:99px;background:var(--rose)}.dot.done{background:#B9C8B8}.card{border-radius:29px;padding:23px 20px}.kicker{font-size:12px;font-weight:700;color:var(--rose);margin-bottom:6px}.kicker:before{content:"✦ ";font-size:9px}h2{font-size:22px;margin:0 0 7px;letter-spacing:.025em;line-height:1.5}.sub,.note{font-size:13px;color:var(--muted);line-height:1.75}.journeys{display:grid;gap:12px}.journey{position:relative;width:100%;border:1px solid var(--line);background:#fff;text-align:left;border-radius:24px;padding:18px;color:var(--ink);transition:.18s}.journey:after{content:"♡";position:absolute;right:16px;top:15px;color:#D7CBC5;font-size:17px}.journey.active:after{content:"♥";color:var(--rose)}.journey strong{display:block;font-size:18px;letter-spacing:.02em}.time{display:inline-block;font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;margin:6px 0 8px}.desc{display:block;font-size:13px;color:var(--soft);line-height:1.7;padding-right:20px}.j1 .time{background:var(--rose2);color:#8D625A}.j2 .time{background:var(--sage2);color:#617461}.j3 .time{background:var(--blue2);color:#5B7481}.journey.active{transform:translateY(-2px);box-shadow:0 8px 22px rgba(91,72,59,.08)}.j1.active{background:#FFF9F7}.j2.active{background:#F8FBF7}.j3.active{background:#F7FBFD}.calendar-box{background:#FFFEFD;border:1px solid #EFE7E1;border-radius:23px;padding:13px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-head strong{font-size:16px}.circle{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%;color:var(--soft)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{aspect-ratio:1;border:0;background:transparent;border-radius:14px;color:#BBB3AD;font-size:13px}.day.open{background:#F0F6EE;color:#617561;font-weight:700}.day.selected{background:var(--rose);color:#fff;box-shadow:0 6px 14px rgba(201,147,138,.22)}.slots-title{margin:18px 0 8px;font-size:13px;font-weight:700}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px solid #DDE8DA;background:#F5F9F3;color:#617661;border-radius:999px;padding:11px 15px;min-width:76px;font-weight:700}.slot.active{background:#70816F;color:#fff;border-color:#70816F}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.optional{font-size:11px;color:var(--muted);font-weight:400}input,select{width:100%;min-width:0;border:1px solid var(--line);background:#FFFDFC;border-radius:18px;padding:13px 14px;color:var(--ink);outline:none;font-size:16px}input:focus,select:focus{border-color:#CBB7AC;box-shadow:0 0 0 4px #F8EEEA}.summary{background:linear-gradient(145deg,#FBF3EA,#FFFDFC);border:1px dashed #DCCEC3;border-radius:22px;padding:18px;line-height:1.9;margin-bottom:16px}.reminder{background:#F2F7F0;border-radius:21px;padding:16px;color:#657365;font-size:13px;line-height:1.8;margin:14px 0}.checkline{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.6}.checkline input{width:18px;height:18px;accent-color:#93A994;flex:0 0 auto}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:1px solid var(--line);background:#fff;color:var(--soft);padding:12px 17px;border-radius:999px;font-weight:700;min-height:46px}.btn.primary{background:linear-gradient(135deg,#B98279,#C9958C);color:#fff;border:0;box-shadow:0 8px 18px rgba(201,147,138,.2)}.btn:disabled{opacity:.4}.loading,.success{text-align:center}.success-mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:auto auto 14px;background:linear-gradient(145deg,#F5E4DF,#EAF1E7);font-size:29px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(15px);opacity:0;background:#554D47;color:#fff;padding:11px 15px;border-radius:999px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:600px){body{background:radial-gradient(circle at 12% 0,#F8E7E3 0,transparent 25%),radial-gradient(circle at 100% 10%,#E7F0E5 0,transparent 28%),#FBF8F4}.wrap{padding:12px 12px 58px}.hero{border-radius:29px;padding:27px 17px 25px}.mark{width:58px;height:58px;font-size:24px}.hero h1{font-size:27px}.lead{font-size:14px}.tiny{font-size:11px;padding:6px 10px}.card{border-radius:26px;padding:20px 16px}.journey{border-radius:22px;padding:17px 16px}.journey strong{font-size:17px}.calendar-box{padding:11px;border-radius:21px}.calendar{gap:3px}.day{border-radius:12px;font-size:12px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{width:100%;min-width:0;text-align:center;padding:11px 5px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:8px}.actions>span{display:none}.actions .btn{width:100%;min-width:0;padding:11px 8px;white-space:normal;line-height:1.35}.field{margin-bottom:14px}.summary{border-radius:20px;padding:16px}.reminder{border-radius:20px;padding:15px}.success-mark{width:68px;height:68px}}
</style></head><body><div class="wrap"><header class="hero"><div class="mark">𓇼</div><div class="brand">拾 光 所</div><h1 id="heroTitle">旅程預約</h1><p class="lead"><b id="headline">為自己，留一段時間。</b><br><span id="subheadline">選擇一段適合此刻的旅程。</span></p><div id="introNote" class="tiny">慢慢來，照著自己的步調就好 ♡</div></header><div class="progress"><i id="p1" class="dot active"></i><i id="p2" class="dot"></i><i id="p3" class="dot"></i><i id="p4" class="dot"></i></div><main id="content"><div class="card loading">正在看看有哪些時間可以留給你…</div></main></div><div id="toast" class="toast"></div><script>
const U='https://tgfxrbghzzttqbpfwypw.supabase.co',K='sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN',HOURS=Array.from({length:11},(_,i)=>`${String(i+10).padStart(2,'0')}:00`);const DEF={booking_title:'旅程預約',headline:'為自己，留一段時間。',subheadline:'選擇一段適合此刻的旅程。',intro_note:'慢慢來，照著自己的步調就好 ♡',reminder_text:'請確認這段時間能完整留給自己，並選擇一個能安心、不被打擾的空間。旅程開始前，我也會再將需要準備的內容傳給你。',completion_text:'謝謝你願意為自己留下一段時間。旅程開始前，請留意 IG 的訊息，我會再將這次旅程需要準備的內容傳給你。',show_birthday:true,show_gender:true,initial_enabled:true,initial_time_label:'40–50 分鐘',initial_description:'一次相遇，先從此刻的自己開始。看見現在的狀態、感受與最在意的事。',light_enabled:true,light_time_label:'四週旅程',light_description:'不只看見，而是用四週的時間，慢慢整理、分辨，找回自己的方向。',walk_enabled:true,walk_time_label:'三個月陪伴',walk_description:'把已經看見的，真正帶回生活。在一次次經歷與選擇裡，練習走自己的路。'};const S={step:1,journey:'',date:'',time:'',name:'',ig:'',birthday:'',gender:'',agree:false,done:false,availability:{},month:'',settings:{...DEF},loading:true,submitting:false};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const fmt=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()} 年 ${x.getMonth()+1} 月 ${x.getDate()} 日`};function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}async function load(){S.loading=true;render();try{const [ar,sr]=await Promise.all([fetch(`${U}/rest/v1/booking_availability?select=booking_date,booking_time&is_open=eq.true&booking_date=gte.${today()}&order=booking_date.asc,booking_time.asc`,{headers:{apikey:K}}),fetch(`${U}/rest/v1/booking_page_settings?id=eq.1&select=*`,{headers:{apikey:K}})]);if(!ar.ok)throw Error();const a=await ar.json();if(sr.ok){const x=(await sr.json())[0];if(x)S.settings={...DEF,...x}}S.availability={};a.forEach(x=>{const t=String(x.booking_time).slice(0,5);if(HOURS.includes(t))(S.availability[x.booking_date]??=[]).push(t)});Object.values(S.availability).forEach(v=>v.sort());const dates=Object.keys(S.availability).sort();S.month=(dates[0]||today()).slice(0,7);applySettings()}catch(e){toast('目前無法讀取預約時間')}finally{S.loading=false;render()}}function applySettings(){heroTitle.textContent=S.settings.booking_title;headline.textContent=S.settings.headline;subheadline.textContent=S.settings.subheadline;introNote.textContent=S.settings.intro_note}function progress(){for(let i=1;i<=4;i++){const e=document.getElementById('p'+i);e.classList.toggle('active',S.step===i);e.classList.toggle('done',S.step>i)}}function render(){progress();if(S.loading)return;content.innerHTML=S.done?success():S.step===1?one():S.step===2?two():S.step===3?three():four()}function journeys(){return [['初遇',S.settings.initial_time_label,S.settings.initial_description,'j1',S.settings.initial_enabled],['拾光',S.settings.light_time_label,S.settings.light_description,'j2',S.settings.light_enabled],['同行',S.settings.walk_time_label,S.settings.walk_description,'j3',S.settings.walk_enabled]].filter(x=>x[4])}function one(){return `<section class="card"><div class="kicker">選擇你的旅程</div><h2>此刻，你想從哪一段旅程開始？</h2><p class="sub">沒有標準答案，選一個現在最靠近你的就好。</p><div class="journeys">${journeys().map(([j,t,d,c])=>`<button class="journey ${c} ${S.journey===j?'active':''}" onclick="S.journey='${j}';render()"><strong>${j}</strong><span class="time">${esc(t)}</span><span class="desc">${esc(d)}</span></button>`).join('')}</div><div class="actions"><span></span><button class="btn primary" onclick="next()" ${S.journey?'':'disabled'}>下一步・選時間</button></div></section>`}function monthShift(n){const [y,m]=S.month.split('-').map(Number),d=new Date(y,m-1+n,1);S.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;S.date='';S.time='';render()}function cal(){const [y,m]=S.month.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),start=first.getDay();let z='';for(let i=0;i<start;i++)z+='<span></span>';for(let n=1;n<=days;n++){const d=`${S.month}-${String(n).padStart(2,'0')}`,open=!!S.availability[d];z+=`<button class="day ${open?'open':''} ${S.date===d?'selected':''}" ${open?'':'disabled'} onclick="S.date='${d}';S.time='';render()">${n}</button>`}return z}function two(){if(!Object.keys(S.availability).length)return `<section class="card"><h2>目前還沒有開放的時間</h2><p class="sub">新的日期開放後，就會出現在這裡 ♡</p><div class="actions"><button class="btn" onclick="prev()">返回</button><button class="btn primary" onclick="load()">重新看看</button></div></section>`;const [y,m]=S.month.split('-');return `<section class="card"><div class="kicker">留一段時間給自己</div><h2>選一個適合你的日子</h2><p class="sub">你選擇的是「${esc(S.journey)}」</p><div class="calendar-box"><div class="calendar-head"><button class="circle" onclick="monthShift(-1)">‹</button><strong>${y} 年 ${Number(m)} 月</strong><button class="circle" onclick="monthShift(1)">›</button></div><div class="calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="dow">${x}</div>`).join('')}${cal()}</div></div>${S.date?`<div class="slots-title">${fmt(S.date)}・可以選擇的時間</div><div class="slots">${(S.availability[S.date]||[]).map(t=>`<button class="slot ${S.time===t?'active':''}" onclick="S.time='${t}';render()">${t}</button>`).join('')}</div>`:'<p class="note" style="text-align:center">淡綠色日期，是目前可以預約的日子。</p>'}<div class="actions"><button class="btn" onclick="prev()">返回</button><button class="btn primary" onclick="next()" ${S.date&&S.time?'':'disabled'}>下一步・留資料</button></div></section>`}function three(){return `<section class="card"><div class="kicker">關於你</div><h2>讓我知道，這一次要與誰相遇</h2><p class="sub">只需要留下簡單資料，其餘的，我們在旅程裡慢慢說。</p><div class="summary"><b>${esc(S.journey)}</b><br>${fmt(S.date)}・${esc(S.time)}</div><div class="field"><label>怎麼稱呼你？ *</label><input id="name" value="${esc(S.name)}" placeholder="你的名字或暱稱"></div><div class="field"><label>IG 帳號 *</label><input id="ig" value="${esc(S.ig)}" placeholder="@username"></div>${S.settings.show_birthday?`<div class="field"><label>生日 <span class="optional">選填</span></label><input id="birthday" type="date" value="${esc(S.birthday)}"></div>`:''}${S.settings.show_gender?`<div class="field"><label>性別 <span class="optional">選填</span></label><select id="gender"><option value="">請選擇</option>${['女','男','其他／不指定'].map(g=>`<option ${S.gender===g?'selected':''}>${g}</option>`).join('')}</select></div>`:''}<div class="reminder"><b>♡ 預約前的小提醒</b><br>${esc(S.settings.reminder_text)}</div><label class="checkline"><input id="agree" type="checkbox" ${S.agree?'checked':''}><span>我已閱讀並確認以上內容</span></label><div class="actions"><button class="btn" onclick="prev()">返回</button><button class="btn primary" onclick="saveProfile()">下一步・確認</button></div></section>`}function saveProfile(){const n=name.value.trim(),g=ig.value.trim();if(!n||!g)return toast('請先留下名字與 IG 帳號');if(!agree.checked)return toast('請先確認預約前的小提醒');S.name=n;S.ig=g;S.birthday=S.settings.show_birthday?(birthday?.value||''):'';S.gender=S.settings.show_gender?(gender?.value||''):'';S.agree=true;S.step=4;render()}function four(){return `<section class="card"><div class="kicker">最後看一眼</div><h2>再確認一次 ♡</h2><div class="summary"><b>${esc(S.journey)}</b><br>${fmt(S.date)}・${esc(S.time)}<br><br>${esc(S.name)}<br>${esc(S.ig)}${S.birthday?`<br>${fmt(S.birthday)}`:''}${S.gender?`<br>${esc(S.gender)}`:''}</div><div class="actions"><button class="btn" onclick="prev()">返回修改</button><button id="submitBtn" class="btn primary" onclick="submitForm()">確認預約 ♡</button></div></section>`}function success(){return `<section class="card success"><div class="success-mark">♡</div><div class="kicker">預約完成</div><h2>這段時間，已經為你留下。</h2><p class="sub">${esc(S.settings.completion_text)}</p><div class="summary"><b>${esc(S.journey)}</b><br>${fmt(S.date)}｜${esc(S.time)}<br><br>${esc(S.name)}・${esc(S.ig)}</div><p class="note"><b>期待與你相遇 ♡</b></p></section>`}function next(){if(S.step===1&&!S.journey)return;if(S.step===2&&(!S.date||!S.time))return;S.step++;render()}function prev(){S.step=Math.max(1,S.step-1);render()}async function submitForm(){if(S.submitting)return;S.submitting=true;submitBtn.disabled=true;submitBtn.textContent='正在為你留下時間…';try{const r=await fetch(`${U}/rest/v1/traveler_bookings`,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({traveler_name:S.name,instagram:S.ig,birthday:S.birthday||null,gender:S.gender||null,journey:S.journey,booking_date:S.date,booking_time:S.time+':00'})});if(r.status===201){S.done=true;render()}else{toast('這個時段可能剛被預約，請重新選擇');S.step=2;S.date='';S.time='';await load()}}catch(e){toast('網路好像有點不穩，請再試一次')}finally{S.submitting=false}}load();
</script></body></html>
