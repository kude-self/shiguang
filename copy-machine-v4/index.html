<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>文案製造機｜核心的我 × 此刻的我</title><style>:root{--paper:#fffdf9;--ink:#2d2926;--muted:#81786f;--line:#e8ded3;--sage:#e7ede2;--gold:#b3925f;--sand:#efe5d8;--shadow:0 14px 34px rgba(60,45,35,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f3ede6,#fbf8f4);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 120px}.k{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:800}h1{font-family:"Songti TC",serif;font-size:29px;margin:6px 0 4px}.sub,.note{font-size:13px;line-height:1.7;color:var(--muted)}.screen{display:none}.screen.on{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}.badge{display:inline-block;background:var(--sand);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800;color:#79654a;margin-bottom:10px}h2{font-size:19px;margin:0 0 6px}label.f{display:block;font-size:13px;font-weight:800;margin:15px 0 7px}input,textarea,select{width:100%;border:1px solid var(--line);background:#fbf8f4;border-radius:14px;padding:13px 14px;font:inherit;color:var(--ink)}textarea{min-height:110px;resize:vertical;line-height:1.65}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:13px;color:#615951;cursor:pointer}.choice.sel{background:var(--sage);border-color:#aab8a0;color:#33402f}.btn{width:100%;border:0;border-radius:15px;padding:13px 14px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:var(--sage);color:#3d4938}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.moment{background:linear-gradient(135deg,#f5efe7,#edf1e9);border:1px solid var(--line);border-radius:18px;padding:15px;margin:14px 0}.result{white-space:pre-wrap;background:#f8f4ee;border:1px solid var(--line);border-radius:18px;padding:17px;line-height:1.85;font-size:14px;min-height:120px}.minirow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:12px}.saved{border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px;background:#fbf8f4;white-space:pre-wrap;font-size:13px;line-height:1.65}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 7px calc(8px + env(safe-area-inset-bottom));background:rgba(250,247,242,.96);border-top:1px solid var(--line);z-index:20}.nav{border:0;background:none;color:#8b827a;font-size:10px;padding:6px 2px}.nav b{display:block;font-size:18px}.nav.on{color:#2e2a27}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:#2c2926;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.2s;z-index:30}.toast.on{opacity:1}@media(max-width:390px){.grid{grid-template-columns:1fr}.app{padding-left:12px;padding-right:12px}}</style></head><body><div class="app"><header><div class="k">COPY MACHINE · WEB APP</div><h1>文案製造機</h1><div class="sub">核心的你可以被記住；每一篇，也可以是此刻完全不同的你。</div></header><section id="home" class="screen on"><div class="card"><span class="badge">QUICK START</span><h2>核心的我 × 此刻的我</h2><div class="note">核心人設長期保存，但每一篇都可以重新選擇今天的心情、語氣與觀看世界的角度。</div><div class="grid"><button class="btn secondary" data-go="persona">設定核心人設</button><button class="btn primary" data-go="gen">開始這一篇</button></div></div></section><section id="persona" class="screen"><div class="card"><span class="badge">CORE PERSONA</span><h2>核心的我</h2><div class="note">這些設定可以隨時修改，不會把你綁死。</div><label class="f">品牌／暱稱</label><input id="name"><label class="f">我是做什麼的</label><input id="role"><label class="f">一句話定位</label><textarea id="position"></textarea><label class="f">主要受眾</label><input id="audience"><label class="f">產品／服務</label><textarea id="offer"></textarea><label class="f">核心特質</label><div id="traits" class="choices"></div><label class="f">價值觀</label><div id="values" class="choices"></div><label class="f">禁用詞／不喜歡的文案語氣</label><textarea id="banned"></textarea><button id="savePersona" class="btn primary" style="margin-top:14px">儲存核心人設</button></div></section><section id="gen" class="screen"><div class="card"><span class="badge">TODAY'S ME</span><h2>今天的你，是什麼狀態？</h2><div class="note">這裡只影響這一篇，下一篇可以完全不一樣。</div><div class="moment"><label class="f">此刻的我</label><div id="feelings" class="choices"></div><label class="f">或自己描述今天的感受</label><textarea id="feelingText" placeholder="例：今天有點累，不想講大道理，只想像朋友一樣分享。"></textarea></div><div class="moment"><label class="f">這次想從哪個角度看？</label><div id="perspectives" class="choices"></div><label class="f">自訂視角</label><input id="perspectiveText" placeholder="例：站在第一次接觸我的人角度"></div><label class="f">平台</label><select id="platform"><option>IG 貼文</option><option>IG 輪播</option><option>限時動態</option><option>Threads</option><option>短影音腳本</option><option>商品銷售文案</option><option>服務介紹</option><option>品牌故事</option></select><label class="f">今天想說什麼？</label><textarea id="idea" style="min-height:150px" placeholder="想到什麼就寫什麼，不用整理…"></textarea><label class="f">這篇想帶給別人什麼？</label><div id="goals" class="choices"></div><button id="generate" class="btn primary" style="margin-top:16px">用現在的我，寫這一篇 ✦</button></div></section><section id="result" class="screen"><div class="card"><span class="badge">RESULT</span><h2>這一刻的版本</h2><div id="output" class="result">還沒有產生內容。</div><div class="minirow"><button class="mini" id="changeMood">換個心情，再寫一次</button><button class="mini" id="changeAngle">換個角度看同一件事</button><button class="mini" id="shorter">再短一點</button></div><div class="grid" style="margin-top:14px"><button id="regen" class="btn secondary">同設定再寫一版</button><button id="saveCopy" class="btn primary">收藏</button></div></div></section><section id="ideas" class="screen"><div class="card"><span class="badge">IDEA</span><h2>今天不知道說什麼？</h2><button id="randomIdea" class="btn primary">給我一個生活化題目</button><div id="ideaOut" class="result" style="margin-top:12px">按一下開始。</div><button id="useIdea" class="btn secondary" style="margin-top:9px">拿這個去寫</button></div></section><section id="library" class="screen"><div class="card"><span class="badge">LIBRARY</span><h2>我的文案庫</h2><div id="saved"></div></div></section></div><nav class="bottom"><button class="nav on" data-go="home"><b>⌂</b>首頁</button><button class="nav" data-go="persona"><b>◌</b>核心</button><button class="nav" data-go="gen"><b>＋</b>這一篇</button><button class="nav" data-go="ideas"><b>✦</b>靈感</button><button class="nav" data-go="library"><b>♡</b>文案庫</button></nav><div id="toast" class="toast"></div><script>(function(){'use strict';var q=function(s){return document.querySelector(s)},qa=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};var sets={traits:['溫柔細膩','真誠直接','幽默風趣','理性清楚','親切好聊','專業可靠','有個性','故事感','接地氣','有觀點'],values:['真誠透明','持續學習','以人為本','自由選擇','尊重差異','言之有物','品質優先','做真正的自己'],feelings:['平靜','感性','有力量','幽默','犀利','溫柔','興奮','真誠脆弱','專業','想聊天','想分享','想賣東西','今天不想做人設'],perspectives:['觀察者','陪伴者','過來人','專業者','挑戰者','說故事的人','朋友','創作者','品牌主理人','消費者視角','初學者視角','未來的自己'],goals:['共鳴','分享','互動','建立信任','轉換','銷售']};function render(id,arr,one){var e=q('#'+id);e.innerHTML='';arr.forEach(function(x,i){var b=document.createElement('button');b.type='button';b.className='choice'+(one&&i===0?' sel':'');b.textContent=x;b.dataset.value=x;b.onclick=function(){if(one){qa('#'+id+' .choice').forEach(function(z){z.classList.remove('sel')})}b.classList.toggle('sel')};e.appendChild(b)})}render('traits',sets.traits,false);render('values',sets.values,false);render('feelings',sets.feelings,true);render('perspectives',sets.perspectives,true);render('goals',sets.goals,true);function show(id){qa('.screen').forEach(function(x){x.classList.remove('on')});q('#'+id).classList.add('on');qa('.nav').forEach(function(x){x.classList.toggle('on',x.dataset.go===id)});if(id==='library')renderSaved();window.scrollTo(0,0)}qa('[data-go]').forEach(function(b){b.onclick=function(){show(b.dataset.go)}});function sel(id){return qa('#'+id+' .choice.sel').map(function(x){return x.dataset.value})}function toast(x){var t=q('#toast');t.textContent=x;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1300)}function pdata(){return{name:q('#name').value,role:q('#role').value,position:q('#position').value,audience:q('#audience').value,offer:q('#offer').value,traits:sel('traits'),values:sel('values'),banned:q('#banned').value}}function saveP(){try{localStorage.setItem('copyCoreV4',JSON.stringify(pdata()));toast('核心人設已儲存')}catch(e){toast('已套用核心人設')}}q('#savePersona').onclick=saveP;function loadP(){try{var d=JSON.parse(localStorage.getItem('copyCoreV4')||'null');if(!d)return;['name','role','position','audience','offer','banned'].forEach(function(k){q('#'+k).value=d[k]||''});['traits','values'].forEach(function(k){qa('#'+k+' .choice').forEach(function(b){b.classList.toggle('sel',(d[k]||[]).indexOf(b.dataset.value)>-1)})})}catch(e){}}var hooks={平靜:'最近，我沒有急著找答案。',感性:'有些感受，是過了一陣子才慢慢懂的。',有力量:'有件事，我現在很確定。',幽默:'我最近發現，事情真的很會挑時間來。',犀利:'有些話大家都在說，但我其實不太認同。',溫柔:'想把這段話，留給今天剛好看到這裡的你。',興奮:'我真的很想趕快把這件事說出來。','真誠脆弱':'這篇沒有想教誰什麼，只想誠實說說最近的我。',專業:'先把最重要的事情說清楚。',想聊天:'今天不講大道理，單純想聊一件最近發生的事。',想分享:'最近有一個小發現，我很想記下來。',想賣東西:'如果你最近剛好需要這件事，我想好好介紹它。','今天不想做人設':'今天就照現在的感覺說。'};var angle={觀察者:'我開始注意到，真正有意思的其實是那些很容易被忽略的小地方。',陪伴者:'我不急著替這件事下結論，比較想陪你一起看看它。',過來人:'如果是以前的我，大概也會卡在同一個地方。',專業者:'把它拆開來看，其實核心沒有想像中複雜。',挑戰者:'但我想反過來問：我們真的一定要照原本那套方式嗎？','說故事的人':'事情是從一個很普通的瞬間開始的。',朋友:'如果今天坐在你旁邊，我大概會直接這樣跟你說。',創作者:'我很喜歡把普通的事情，多看一層。','品牌主理人':'站在做這個品牌的角度，我一直很在意一件事。','消費者視角':'如果我是第一次看到這個東西的人，我最先在意的其實不是功能。','初學者視角':'如果我什麼都還不懂，我第一個問題會是：這跟我有什麼關係？','未來的自己':'如果把時間拉遠一點回頭看，現在這一步也許比想像中重要。'};function generate(){var idea=q('#idea').value.trim();if(!idea){toast('先寫下今天想說什麼');return}var feeling=q('#feelingText').value.trim()||sel('feelings')[0]||'平靜',pers=q('#perspectiveText').value.trim()||sel('perspectives')[0]||'觀察者',goal=sel('goals')[0]||'分享';var h=hooks[feeling]||('今天的狀態是「'+feeling+'」，所以我想照這個感覺說。'),a=angle[pers]||('這一次，我想從「'+pers+'」的角度看這件事。'),end=goal==='互動'?'如果是你，你會怎麼看這件事？':goal==='銷售'?'如果它剛好是你現在需要的方式，再來了解就好。':goal==='建立信任'?'不需要急著認同，先把這個角度留給你。':'我只是想把此刻真正想到的，留在這裡。';q('#output').textContent=h+'\n\n'+a+'\n\n'+idea+'\n\n'+end;show('result')}q('#generate').onclick=generate;q('#regen').onclick=generate;q('#changeMood').onclick=function(){var bs=qa('#feelings .choice'),cur=bs.findIndex(function(b){return b.classList.contains('sel')}),n=(cur+1)%bs.length;bs.forEach(function(b){b.classList.remove('sel')});bs[n].classList.add('sel');generate()};q('#changeAngle').onclick=function(){var bs=qa('#perspectives .choice'),cur=bs.findIndex(function(b){return b.classList.contains('sel')}),n=(cur+1)%bs.length;bs.forEach(function(b){b.classList.remove('sel')});bs[n].classList.add('sel');generate()};q('#shorter').onclick=function(){q('#output').textContent=q('#output').textContent.split('\n\n').slice(0,3).join('\n\n')};q('#saveCopy').onclick=function(){var a=[];try{a=JSON.parse(localStorage.getItem('copySavedV4')||'[]')}catch(e){}a.unshift({id:Date.now(),text:q('#output').textContent});try{localStorage.setItem('copySavedV4',JSON.stringify(a))}catch(e){}toast('已收藏')};function renderSaved(){var a=[];try{a=JSON.parse(localStorage.getItem('copySavedV4')||'[]')}catch(e){}q('#saved').innerHTML=a.length?a.map(function(x){return '<div class="saved">'+x.text.replace(/</g,'&lt;').slice(0,260)+'</div>'}).join(''):'<div class="note">目前還沒有收藏。</div>'}var ideas=['最近有哪一件小事，讓你突然改變原本的想法？','分享一個你現在不再勉強自己做的事情。','如果不談產品功能，你最希望客人真正得到什麼？','最近一次「原來我以前想錯了」是什麼？','把今天很普通的一個片段，寫成你對生活的一個看法。'];q('#randomIdea').onclick=function(){q('#ideaOut').textContent=ideas[Math.floor(Math.random()*ideas.length)]};q('#useIdea').onclick=function(){q('#idea').value=q('#ideaOut').textContent;show('gen')};loadP()})();</script></body></html>
