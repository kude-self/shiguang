<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f4ec">
<title>拾光所｜關鍵詞抽取</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:#4f4a43;background:#f8f4ec}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(circle at 15% 15%,rgba(203,219,198,.38),transparent 34%),radial-gradient(circle at 85% 82%,rgba(229,207,198,.35),transparent 36%),#f8f4ec}.wrap{width:min(100%,480px);text-align:center}.mark{font-size:17px;letter-spacing:8px;color:#b89c67;margin-bottom:16px}.eyebrow{font-size:13px;letter-spacing:3px;color:#888074;margin-bottom:8px}.title{font-family:"Noto Serif TC","Songti TC",serif;font-size:28px;letter-spacing:4px;font-weight:600;margin:0 0 9px}.sub{font-size:14px;line-height:1.8;color:#81796f;margin:0 0 26px}.card{min-height:300px;border:1px solid rgba(184,156,103,.35);border-radius:28px;background:rgba(255,253,248,.9);box-shadow:0 18px 55px rgba(83,72,57,.09);padding:42px 26px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden}.card:before,.card:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}.card:before{width:150px;height:150px;background:rgba(203,219,198,.22);left:-60px;top:-55px}.card:after{width:170px;height:170px;background:rgba(229,207,198,.2);right:-65px;bottom:-70px}.hint{font-size:13px;letter-spacing:2px;color:#a0978b;margin-bottom:24px;z-index:1}.word{font-family:"Noto Serif TC","Songti TC",serif;font-size:42px;line-height:1.35;letter-spacing:3px;color:#554d43;font-weight:600;z-index:1;min-height:58px;display:flex;align-items:center;justify-content:center}.word.drawing{animation:pulse .16s linear infinite alternate}@keyframes pulse{from{opacity:.35;transform:scale(.97)}to{opacity:1;transform:scale(1.02)}}.date{font-size:12px;color:#aaa196;margin-top:24px;z-index:1;min-height:18px}.actions{display:grid;grid-template-columns:1fr;gap:11px;margin-top:18px}button{appearance:none;border:0;border-radius:18px;padding:16px 18px;font-size:16px;letter-spacing:1px;cursor:pointer}.primary{background:#6f7f6a;color:white;box-shadow:0 8px 22px rgba(111,127,106,.18)}.secondary{background:#eee7dc;color:#625b52}.confirm{background:#d9c8a5;color:#4f493f}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.saved{margin-top:20px;padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.55);font-size:13px;line-height:1.8;color:#777066;display:none}.foot{font-size:11px;color:#aaa196;margin-top:22px;line-height:1.7}.locked .primary,.locked .secondary{display:none}@media(max-width:380px){.word{font-size:36px}.card{min-height:280px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div class="mark">✦ ♡ ✦</div>
<div class="eyebrow">拾光所｜內部製作工具</div>
<h1 class="title">關鍵詞抽取</h1>
<p class="sub">為《我的字｜給你的提醒》抽出這一次的關鍵詞。<br>系統只負責抽取，不替關鍵詞定義答案。</p>
<section class="card" id="card">
<div class="hint" id="hint">準備好時，開始抽取</div>
<div class="word" id="word">—</div>
<div class="date" id="date"></div>
</section>
<div class="actions" id="actions">
<button class="primary" id="draw">開始抽取</button>
<div class="row" id="after" style="display:none">
<button class="secondary" id="again">重新抽取</button>
<button class="confirm" id="confirm">確認這個關鍵詞</button>
</div>
</div>
<div class="saved" id="saved"></div>
<div class="foot">確認後會保留在此裝置的抽取紀錄。<br>關鍵詞本身沒有固定好壞或固定解讀。</div>
</main>
<script>
(function(){
var words=[
"溝通","情緒","反應","自由","關心","愛","理解","信任","界線","距離",
"安全感","自我價值","期待","責任","選擇","關係","連結","陪伴","支持","依靠",
"表達","傾聽","回應","坦白","說出感受","保持沉默","被理解","理解自己","看見自己","接住自己",
"接受","允許","相信","放下","等待","靠近","離開","拒絕","停下來","重新開始",
"照顧自己","保護自己","為自己選擇","給自己空間","回到自己","忠於自己","相信自己","肯定自己","接納自己","尊重自己",
"勇氣","真實","柔軟","堅定","自在","平靜","穩定","敏感","脆弱","坦然",
"害怕","委屈","失落","憤怒","不安","焦慮","安心","喜悅","孤單","疲憊",
"改變","行動","嘗試","前進","休息","調整","轉身","決定","開始","結束",
"方向","節奏","時間","空間","可能性","未知","成長","轉變","生活","當下",
"需求","渴望","習慣","控制","比較","討好","依賴","承擔","放手","平衡"
];
var word=document.getElementById('word'),hint=document.getElementById('hint'),date=document.getElementById('date'),draw=document.getElementById('draw'),again=document.getElementById('again'),confirm=document.getElementById('confirm'),after=document.getElementById('after'),saved=document.getElementById('saved'),card=document.getElementById('card');
var current='',timer=null;
function pick(){return words[Math.floor(Math.random()*words.length)];}
function run(){
 if(timer)return;
 hint.textContent='正在抽取…';date.textContent='';word.className='word drawing';after.style.display='none';draw.style.display='none';
 var count=0;timer=setInterval(function(){word.textContent=pick();count++;if(count>=18){clearInterval(timer);timer=null;current=pick();word.textContent=current;word.className='word';hint.textContent='這一次抽到的關鍵詞';after.style.display='grid';}},70);
}
function fmt(d){var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),day=('0'+d.getDate()).slice(-2),h=('0'+d.getHours()).slice(-2),mi=('0'+d.getMinutes()).slice(-2);return y+'-'+m+'-'+day+' '+h+':'+mi;}
function save(){if(!current)return;var now=new Date(),rec={keyword:current,time:fmt(now)};var list=[];try{list=JSON.parse(localStorage.getItem('shiguangKeywordHistory')||'[]');}catch(e){}list.unshift(rec);if(list.length>50)list=list.slice(0,50);try{localStorage.setItem('shiguangKeywordHistory',JSON.stringify(list));}catch(e){}hint.textContent='已確認';date.textContent=rec.time;after.style.display='none';draw.style.display='block';draw.textContent='為下一位旅人抽取';saved.style.display='block';saved.innerHTML='已留下紀錄：<strong>'+current+'</strong><br>'+rec.time;current='';}
function resetDraw(){saved.style.display='none';draw.textContent='開始抽取';run();}
draw.onclick=resetDraw;again.onclick=run;confirm.onclick=save;
})();
</script>
</body>
</html>
