<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5eee4"><title>拾光所｜旅人陪伴系統</title><style>html,body{margin:0;width:100%;height:100%;background:#f5eee4;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#f5eee4}</style></head><body><iframe id="appFrame" src="app.html?v=mobilefix3" title="拾光所｜旅人陪伴系統"></iframe><script>const f=document.getElementById('appFrame');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;if(!d.querySelector('link[data-shiguang-theme]')){const l=d.createElement('link');l.rel='stylesheet';l.href='shiguang-theme.css?v=3';l.dataset.shiguangTheme='1';d.head.appendChild(l)}const s=d.createElement('style');s.dataset.mobileFix='3';s.textContent=`@media(max-width:760px){html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}.shell{padding-left:12px!important;padding-right:12px!important}.hero{grid-template-columns:1fr!important}.hero-copy{padding:22px 18px!important}.hero-scene{min-height:185px!important}.quick-grid,.dashboard,.traveler-grid,.journey-layout,.form-layout,.create-layout,.library-grid{grid-template-columns:1fr!important}.nav{width:calc(100% - 18px)!important}.auth,.modal{position:fixed!important;inset:0!important;padding:10px!important;align-items:flex-start!important;justify-content:center!important;overflow:hidden!important}.auth.show,.modal.show{display:flex!important}.auth-card,.modal-card{width:100%!important;max-width:100%!important;max-height:calc(100dvh - 20px)!important;margin:0!important;padding:18px 16px 24px!important;border-radius:24px!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch!important}.modal-card .field input,.modal-card .field textarea,.modal-card .field select,.auth-card input{width:100%!important;max-width:100%!important;font-size:16px!important}.modal-card textarea{min-height:110px!important}.form-actions{position:sticky!important;bottom:-24px!important;background:#fffaf3!important;padding:12px 0 calc(10px + env(safe-area-inset-bottom))!important;z-index:2!important}.page-head{align-items:flex-start!important;flex-direction:column!important}.topbar{overflow:hidden!important}.top-actions{flex-wrap:wrap!important;justify-content:flex-end!important}}`;d.head.appendChild(s)}catch(e){console.warn(e)}});</script></body></html>
