<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<title>我的日常生活</title>
<style>
:root{--bg:#f7f5f2;--card:#fffdfb;--ink:#4e4a50;--muted:#8d8790;--line:#e9e3df;--sage:#eef5ef;--blue:#eef5fa;--lav:#f4eff8;--deep:#606b78;--shadow:0 10px 28px rgba(72,62,67,.08)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 8% 0,rgba(224,235,245,.9),transparent 30%),radial-gradient(circle at 100% 8%,rgba(235,228,243,.85),transparent 28%),var(--bg);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:16px 14px 90px}.hero{background:rgba(255,253,251,.92);border:1px solid #fff;border-radius:28px;padding:23px 20px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.18em;color:#918996}h1{font-size:28px;margin:7px 0 5px}.quote{font-size:15px;color:#706a73}.tabs{margin:14px 0 8px;background:#ffffffb8;border:1px solid var(--line);border-radius:18px;padding:5px;display:grid;grid-template-columns:1fr 1fr;gap:5px}.tab{border:0;background:transparent;border-radius:14px;padding:11px 8px;color:#817a84;font-weight:700}.tab.active{background:#fff;color:#4f5965;box-shadow:0 3px 12px rgba(72,62,67,.08)}.page{display:none}.page.active{display:block}.datebar,.vacdays{display:flex;gap:9px;overflow-x:auto;padding:9px 1px 4px;scrollbar-width:none}.datebar::-webkit-scrollbar,.vacdays::-webkit-scrollbar{display:none}.datebtn,.vacday{flex:0 0 auto;border:0;background:#fff;border-radius:17px;padding:9px 13px;color:#7a747c;box-shadow:0 3px 12px rgba(72,62,67,.05);min-width:61px}.datebtn small{display:block;font-size:11px}.datebtn.active{background:var(--deep);color:#fff}.vacday{border:1px solid var(--line);box-shadow:none}.vacday.active{background:#6a6574;color:#fff}.section{margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin:0 3px 10px;gap:10px}.head h2{font-size:18px;margin:0}.pill{font-size:12px;color:#837c84;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 9px;white-space:nowrap}.progress{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 15px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}.track{height:9px;border-radius:999px;background:#eee9e6;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#b9d3c1,#c9c0df,#c2d8e9);transition:.2s}.tasks{display:grid;gap:10px}.task{display:flex;gap:12px;align-items:flex-start;padding:15px;border-radius:20px;border:1px solid var(--line)}.sage{background:linear-gradient(135deg,#fff,var(--sage))}.blue{background:linear-gradient(135deg,#fff,var(--blue))}.lav{background:linear-gradient(135deg,#fff,var(--lav))}.check{width:27px;height:27px;border:1.6px solid #bbb4ba;background:#fff;border-radius:9px;flex:0 0 27px;display:grid;place-items:center;color:#fff;font-weight:700}.check.done{background:#68756c;border-color:#68756c}.tasktitle{font-weight:800;font-size:15px}.tasksub{font-size:13px;line-height:1.55;color:var(--muted);margin-top:3px}.task.isdone .tasktitle{text-decoration:line-through;opacity:.48}.task.isdone .tasksub{opacity:.45}.card{background:#fffdfbf2;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.list{padding:5px 14px}.empty{padding:20px 6px;color:#aaa3a9;font-size:13px;text-align:center}.item{display:grid;grid-template-columns:68px 1fr 34px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px dashed #e8e1dd}.item:last-child{border-bottom:0}.itemtime{font-size:13px;color:#7d7680}.itemtext{font-size:14px}.del{border:0;background:none;color:#b2a9b0;font-size:20px}.add{display:grid;grid-template-columns:94px 1fr 44px;gap:8px;background:#faf7f4;padding:12px}.add input,.pick input{width:100%;min-width:0;border:1px solid #e2dbd6;border-radius:13px;padding:10px;background:#fff}.add button,.pick button{border:0;border-radius:13px;background:#677381;color:#fff;font-size:18px}.pick{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.pick button{padding:0 14px;font-size:14px;font-weight:700}textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:20px;background:#fffdfbf2;padding:14px 15px;color:var(--ink);resize:vertical}.vacintro{background:linear-gradient(135deg,#fff,var(--lav));border:1px solid var(--line);border-radius:22px;padding:17px 16px}.vacintro p{font-size:13px;line-height:1.6;color:var(--muted);margin:6px 0 0}.footer{text-align:center;color:#aaa2a8;font-size:12px;margin-top:24px}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#505760;color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:640px){.tasks{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="eyebrow">MY DAILY LIFE</div><h1>我的日常生活</h1><div class="quote">平凡的生活，過著不平凡的人生。</div></header>
<nav class="tabs"><button class="tab active" data-page="daily">日常生活</button><button class="tab" data-page="vacation">休假安排</button></nav>
<main id="daily" class="page active">
<div id="dailyDates" class="datebar"></div>
<section class="section"><div class="head"><h2>每天必做</h2><span id="dailyLabel" class="pill">今天</span></div><div class="progress"><div class="meta"><span>今日完成度</span><span id="progressText">0 / 3</span></div><div class="track"><div id="progressFill" class="fill"></div></div></div></section>
<section class="section"><div class="tasks">
<div class="task sage" data-routine="morning"><button class="check" type="button"></button><div><div class="tasktitle">早晨冥想・10 分鐘</div><div class="tasksub">與龍連結，也與祭壇上的力量動物連結。</div></div></div>
<div class="task blue" data-routine="story"><button class="check" type="button"></button><div><div class="tasktitle">限時動態・1–2 則</div><div class="tasksub">分享真實生活，不需要刻意營業。</div></div></div>
<div class="task lav" data-routine="night"><button class="check" type="button"></button><div><div class="tasktitle">睡前冥想・七脈輪統整</div><div class="tasksub">睡覺前回到自己，完成一天的能量整理。</div></div></div>
</div></section>
<section class="section"><div class="head"><h2>今天其他要做的事</h2><span class="pill">自行新增</span></div><div class="card"><div id="dailyList" class="list"></div><div class="add"><input id="dailyTime" type="time" value="10:00"><input id="dailyTask" type="text" placeholder="例如：上班、買東西、運動"><button id="dailyAdd" type="button">＋</button></div></div></section>
<section class="section"><div class="head"><h2>今天想記下來的事</h2><span class="pill">自動保存</span></div><textarea id="dailyNote" placeholder="心情、靈感、今天發生的事……"></textarea></section>
</main>
<main id="vacation" class="page">
<section class="section"><div class="vacintro"><strong>休假安排</strong><p>這裡只放休假日。先選休假日期，再安排那一天想做的事情，不會和每天必做混在一起。</p><div class="pick"><input id="vacDate" type="date"><button id="vacAddDate" type="button">加入休假日</button></div></div><div id="vacDays" class="vacdays"></div></section>
<section id="vacContent" class="section" style="display:none"><div class="head"><h2 id="vacTitle">休假行程</h2><span class="pill">自由安排</span></div><div class="card"><div id="vacList" class="list"></div><div class="add"><input id="vacTime" type="time" value="10:00"><input id="vacTask" type="text" placeholder="例如：睡到自然醒、散步、約會"><button id="vacAddTask" type="button">＋</button></div></div><section class="section"><div class="head"><h2>休假備註</h2><span class="pill">自動保存</span></div><textarea id="vacNote" placeholder="想去的地方、想吃的東西、提醒自己留白……"></textarea></section></section>
<div id="noVac" class="empty">先加入一個休假日期，就可以開始安排。</div>
</main>
<div class="footer">𓇼 每天照顧好自己的節奏，休假再留一點空白給生活。</div>
</div><div id="toast" class="toast">已保存 ♡</div>
<script>
(function(){
'use strict';
var KEY='myDailyLifePlanner_v2',state=load(),selectedDaily=dateKey(new Date()),selectedVacation='';
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return{daily:{},vacations:{}}}
function save(show){localStorage.setItem(KEY,JSON.stringify(state));if(show)toast()}
function toast(){var e=document.getElementById('toast');e.classList.add('show');setTimeout(function(){e.classList.remove('show')},800)}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}
function dn(d){return['日','一','二','三','四','五','六'][d.getDay()]}
function full(k){var d=parse(k);return(d.getMonth()+1)+' 月 '+d.getDate()+' 日・週'+dn(d)}
function ed(k){if(!state.daily)state.daily={};if(!state.daily[k])state.daily[k]={routines:{},tasks:[],note:''}}
function ev(k){if(!state.vacations)state.vacations={};if(!state.vacations[k])state.vacations[k]={tasks:[],note:''}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function renderDates(){var w=document.getElementById('dailyDates');w.innerHTML='';var base=new Date();for(var i=-2;i<=7;i++){var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i,12),k=dateKey(d),b=document.createElement('button');b.type='button';b.className='datebtn'+(k===selectedDaily?' active':'');b.innerHTML='<small>週'+dn(d)+'</small><b>'+(d.getMonth()+1)+'/'+d.getDate()+'</b>';b.dataset.k=k;b.onclick=function(){selectedDaily=this.dataset.k;renderDaily()};w.appendChild(b)}}
function renderList(id,arr,del){var w=document.getElementById(id);w.innerHTML='';if(!arr.length){w.innerHTML='<div class="empty">目前還沒有安排。</div>';return}arr.forEach(function(it,i){var row=document.createElement('div');row.className='item';row.innerHTML='<div class="itemtime">'+esc(it.time||'')+'</div><div class="itemtext">'+esc(it.text||'')+'</div><button class="del" type="button">×</button>';row.querySelector('.del').onclick=function(){del(i)};w.appendChild(row)})}
function renderDaily(){ed(selectedDaily);renderDates();document.getElementById('dailyLabel').textContent=selectedDaily===dateKey(new Date())?'今天':full(selectedDaily);var done=0;document.querySelectorAll('.task[data-routine]').forEach(function(row){var k=row.dataset.routine,on=!!state.daily[selectedDaily].routines[k];if(on)done++;row.classList.toggle('isdone',on);var c=row.querySelector('.check');c.classList.toggle('done',on);c.textContent=on?'✓':''});document.getElementById('progressText').textContent=done+' / 3';document.getElementById('progressFill').style.width=(done/3*100)+'%';renderList('dailyList',state.daily[selectedDaily].tasks,function(i){state.daily[selectedDaily].tasks.splice(i,1);save(true);renderDaily()});document.getElementById('dailyNote').value=state.daily[selectedDaily].note||''}
document.querySelectorAll('.check').forEach(function(c){c.onclick=function(){var k=this.closest('.task').dataset.routine;ed(selectedDaily);state.daily[selectedDaily].routines[k]=!state.daily[selectedDaily].routines[k];save(true);renderDaily()}});
function addDaily(){var inp=document.getElementById('dailyTask'),text=inp.value.trim();if(!text)return;ed(selectedDaily);state.daily[selectedDaily].tasks.push({time:document.getElementById('dailyTime').value,text:text});inp.value='';save(true);renderDaily()}
document.getElementById('dailyAdd').onclick=addDaily;document.getElementById('dailyTask').onkeydown=function(e){if(e.key==='Enter')addDaily()};document.getElementById('dailyNote').oninput=function(){ed(selectedDaily);state.daily[selectedDaily].note=this.value;save(false)};
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});this.classList.add('active');var p=this.dataset.page;document.getElementById('daily').classList.toggle('active',p==='daily');document.getElementById('vacation').classList.toggle('active',p==='vacation');if(p==='vacation')renderVac()}});
document.getElementById('vacDate').value=dateKey(new Date());document.getElementById('vacAddDate').onclick=function(){var k=document.getElementById('vacDate').value;if(!k)return;ev(k);selectedVacation=k;save(true);renderVac()};
function renderVac(){var keys=Object.keys(state.vacations||{}).sort(),w=document.getElementById('vacDays');w.innerHTML='';if(keys.length&&(!selectedVacation||!state.vacations[selectedVacation]))selectedVacation=keys[0];keys.forEach(function(k){var b=document.createElement('button');b.type='button';b.className='vacday'+(k===selectedVacation?' active':'');b.textContent=full(k);b.onclick=function(){selectedVacation=k;renderVac()};w.appendChild(b)});var has=!!selectedVacation&&!!state.vacations[selectedVacation];document.getElementById('vacContent').style.display=has?'block':'none';document.getElementById('noVac').style.display=has?'none':'block';if(has){ev(selectedVacation);document.getElementById('vacTitle').textContent=full(selectedVacation)+'・休假行程';renderList('vacList',state.vacations[selectedVacation].tasks,function(i){state.vacations[selectedVacation].tasks.splice(i,1);save(true);renderVac()});document.getElementById('vacNote').value=state.vacations[selectedVacation].note||''}}
function addVacTask(){if(!selectedVacation)return;var inp=document.getElementById('vacTask'),text=inp.value.trim();if(!text)return;ev(selectedVacation);state.vacations[selectedVacation].tasks.push({time:document.getElementById('vacTime').value,text:text});inp.value='';save(true);renderVac()}
document.getElementById('vacAddTask').onclick=addVacTask;document.getElementById('vacTask').onkeydown=function(e){if(e.key==='Enter')addVacTask()};document.getElementById('vacNote').oninput=function(){if(!selectedVacation)return;ev(selectedVacation);state.vacations[selectedVacation].note=this.value;save(false)};
renderDaily();
})();
</script>
</body></html>
