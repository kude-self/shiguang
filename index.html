<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf7f1"><title>拾光所｜系統入口</title><style>:root{--bg:#fbf7f1;--paper:#fffdf9;--ink:#514a43;--muted:#938c84;--line:#e8ddd2;--rose:#f1dfdc;--sage:#dfe8dd;--blue:#dfe8ee;--gold:#aa8a66}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 0 0,var(--rose),transparent 28%),radial-gradient(circle at 100% 16%,var(--sage),transparent 25%),var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC",sans-serif}body{padding:calc(24px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}.wrap{max-width:620px;margin:auto}.hero{text-align:center;padding:18px 10px 24px}.mark{font-size:30px;color:var(--gold)}h1{margin:8px 0 6px;font-size:30px;letter-spacing:.08em}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}.grid{display:grid;gap:14px}.card{display:block;text-decoration:none;color:inherit;background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 14px 34px rgba(105,87,67,.07)}.card:active{transform:scale(.99)}.head{display:flex;align-items:center;gap:13px}.icon{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:22px}.record .icon{background:var(--sage)}.admin .icon{background:var(--rose)}.booking .icon{background:var(--blue)}.title{font-size:20px;font-weight:800}.desc{margin:10px 0 14px;color:var(--muted);font-size:13px;line-height:1.7}.go{border-top:1px dashed var(--line);padding-top:13px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}.footer{text-align:center;color:#a59a90;font-size:11px;line-height:1.7;margin-top:24px}@media(max-width:420px){body{padding-left:12px;padding-right:12px}.hero{padding-top:10px}.card{padding:18px}h1{font-size:27px}}</style></head><body><main class="wrap"><header class="hero"><div class="mark">𓇼</div><h1>拾光所｜我的系統</h1><p>只保留正式使用中的三個入口。<br>之後從這一頁進入，不再混用舊版本。</p></header><section class="grid"><a class="card record" href="https://kude-self.github.io/shiguang-journey/"><div class="head"><div class="icon">✦</div><div class="title">旅人紀錄</div></div><div class="desc">旅人資料、初遇／拾光／同行旅程、相遇紀錄與拾光冊。</div><div class="go"><span>進入旅人紀錄系統</span><span>→</span></div></a><a class="card admin" href="./booking/admin-calendar.html"><div class="head"><div class="icon">◷</div><div class="title">預約管理</div></div><div class="desc">查看預約、確認或取消、管理開放日期與時段。</div><div class="go"><span>進入預約管理</span><span>→</span></div></a><a class="card booking" href="./booking/"><div class="head"><div class="icon">♡</div><div class="title">旅人預約</div></div><div class="desc">給旅人使用的公開預約頁面。</div><div class="go"><span>開啟旅人預約頁</span><span>→</span></div></a></section><div class="footer">𓇼 拾光所<br>拾起內在的光，真誠看見自己，安心走自己的路。</div></main></body></html>
