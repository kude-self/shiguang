<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eee4"><title>拾光所｜旅人陪伴系統</title><style>:root{--paper:#fffaf2;--line:#e4d7c3;--text:#40362e;--muted:#82766b;--sage:#778460;--soft:#e8ecdc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:var(--text);background:linear-gradient(180deg,#fbf7f0,#efe6da);min-height:100vh}.app{max-width:980px;margin:auto;padding:14px 12px 100px}.top,.card,.quick button{border:1px solid var(--line);background:rgba(255,250,242,.95);box-shadow:0 8px 24px rgba(80,60,40,.06)}.top{padding:18px 18px 22px;border-radius:0 0 28px 28px;background:linear-gradient(135deg,#fffaf4,#eee2cf)}h1,h2,h3{font-family:"Songti TC","Noto Serif TC",serif}.brand{display:flex;align-items:center;gap:12px}.brand img{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 8px 18px rgba(80,60,40,.08)}.brand-copy h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted)}.card{padding:18px;border-radius:22px;margin:14px 0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.quick button{padding:18px;border-radius:20px;text-align:left;color:var(--text)}.quick strong{display:block;font-size:17px;margin-bottom:5px}.grid2,.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:14px;padding:12px;font-size:16px;color:var(--text)}textarea{min-height:90px}.btn{border:0;border-radius:14px;padding:12px 15px;font-size:15px}.primary{background:var(--sage);color:#fff}.ghost{background:#f2e9dc;color:var(--text)}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:16px;background:#fffdf9;padding:13px;margin:9px 0}.pill{display:inline-block;background:var(--soft);padding:4px 8px;border-radius:99px;font-size:12px}.view{display:none}.view.active{display:block}.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(920px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:rgba(255,250,242,.96);border:1px solid var(--line);border-radius:20px;z-index:20}.nav button{border:0;background:none;padding:10px 2px}.nav button.active{background:var(--soft);border-radius:14px}.modal,.auth{position:fixed;inset:0;background:rgba(45,37,30,.38);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show,.auth.show{display:flex}.modal .card,.auth .card{width:min(600px,100%);max-height:90vh;overflow:auto}.auth .card{max-width:430px}.preview{white-space:pre-wrap;line-height:1.9;border:1px solid var(--line);background:#fffdf9;border-radius:18px;padding:20px}.status{font-size:13px;padding:7px 10px;border-radius:99px;background:var(--soft);display:inline-block}.timeline{border-left:2px solid #d8ccb9;padding-left:16px}.quote{text-align:center;font-family:"Songti TC",serif;font-size:20px;line-height:1.8}.print-sheet{display:none}@media(max-width:720px){.quick,.grid2,.row{grid-template-columns:1fr}.brand img{width:72px;height:72px}.brand-copy h1{font-size:28px}.nav button{font-size:12px}}@media print{body>*{display:none!important}.print-sheet{display:block!important;padding:14mm;font-family:"Songti TC",serif}.print-sheet h1{text-align:center}.print-sheet .print-body{white-space:pre-wrap;line-height:2}}</style></head><body><div class="app" id="app"><header class="top"><div class="actions"><span id="cloudStatus" class="status">連線中…</span><button class="btn ghost" onclick="logout()">登出</button></div><div class="brand"><img src="assets/shiguang-logo.jpg" alt="拾光所 Logo"><div class="brand-copy"><h1>拾光所</h1><p class="muted">陪伴每一位旅人，拾起內在的光。</p></div></div></header><section id="home" class="view active"><div class="card"><h2>今天，想從哪裡開始？</h2><p id="today" class="muted"></p></div><div class="quick"><button onclick="openTraveler()"><strong>＋ 新增旅人</strong><small>建立一段新的相遇。</small></button><button onclick="go('journey')"><strong>✦ 開始一次旅程</strong><small>記錄今天看見的事。</small></button><button onclick="go('create')"><strong>⌇ 製作旅程紀錄</strong><small>整理成可以留下的文字。</small></button></div><div class="grid2"><div class="card"><h3>正在同行</h3><div id="homeTravelers"></div></div><div class="card"><h3>最近相遇</h3><div id="homeSessions"></div></div></div><div class="card quote">有些答案，不需要急著找到。<br>先把自己聽清楚一點。</div></section><section id="travelers" class="view"><div class="card"><div class="actions"><button class="btn primary" onclick="openTraveler()">＋ 新增旅人</button></div><h2>旅人</h2><div id="travelerList"></div></div></section><section id="journey" class="view"><div class="grid2"><div><div class="card"><h2>開始一次旅程</h2><div class="field"><label>選擇旅人</label><select id="journeyTraveler" onchange="renderJourney()"></select></div><div id="journeySummary"></div></div><div class="card"><h3>旅程時間軸</h3><div id="timeline" class="timeline"></div></div></div><div class="card"><h2>新增一次相遇</h2><form id="sessionForm"><div class="row"><div class="field"><label>日期</label><input id="sessionDate" type="date"></div><div class="field"><label>這次走到哪裡</label><select id="sessionStage"><option>初遇</option><option>看見</option><option>分辨</option><option>找回</option><option>選擇</option><option>生活練習</option><option>同行</option></select></div></div><div class="field"><label>今天她帶著什麼來？</label><textarea id="sessionBring"></textarea></div><div class="field"><label>今天最大的看見？</label><textarea id="sessionInsight"></textarea></div><div class="field"><label>有沒有一句很重要的話？</label><textarea id="sessionQuote"></textarea></div><div class="field"><label>與之前相比，有什麼不同？</label><textarea id="sessionChange"></textarea></div><div class="field"><label>今天使用的方式</label><input id="sessionMethod" placeholder="對話／書寫／圖像／靈氣／其他"></div><div class="field"><label>這次想留下什麼給她？</label><textarea id="sessionLeave"></textarea></div><div class="field"><label>這次拾起的光</label><input id="sessionLight"></div><div class="actions"><button class="btn primary">儲存這次相遇</button></div></form></div></div></section><section id="create" class="view"><div class="card"><h2>製作旅程紀錄</h2><div class="row"><div class="field"><label>旅人</label><select id="createTraveler" onchange="buildDraft()"></select></div><div class="field"><label>紀錄類型</label><select id="recordType" onchange="buildDraft()"><option>初遇紀錄</option><option>拾光紀錄</option><option>旅程紀錄</option></select></div></div><div class="field"><label id="draftTitle">紀錄草稿</label><textarea id="draftText" style="min-height:300px"></textarea></div><p id="draftStatus" class="muted"></p><div class="actions"><button class="btn ghost" onclick="buildDraft()">重新整理草稿</button><button class="btn primary" onclick="confirmDraft()">✓ 確認這份文案</button></div></div><div id="recordPreviewCard" class="card" style="display:none"><h2 id="previewTitle"></h2><p id="previewSub" class="muted"></p><div id="previewBody" class="preview"></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="printRecord()">儲存 PDF</button></div></div></section><section id="library" class="view"><div class="card"><h2>拾光庫</h2><p class="muted">旅程前提醒、小卡、書寫題目與固定文案會集中放在這裡。</p></div></section></div><nav class="nav"><button class="active" data-v="home" onclick="go('home')">首頁</button><button data-v="travelers" onclick="go('travelers')">旅人</button><button data-v="journey" onclick="go('journey')">旅程</button><button data-v="create" onclick="go('create')">製作</button><button data-v="library" onclick="go('library')">拾光庫</button></nav><div id="travelerModal" class="modal"><div class="card"><div class="actions"><button class="btn ghost" onclick="closeTraveler()">關閉</button></div><h2>新增旅人</h2><form id="travelerForm"><div class="field"><label>旅人稱呼</label><input id="travelerName" required></div><div class="row"><div class="field"><label>第一次相遇日期</label><input id="travelerDate" type="date"></div><div class="field"><label>目前旅程</label><select id="travelerJourney"><option>初遇</option><option>拾光｜四週旅程</option><option>同行｜三個月陪伴</option><option>尚未決定</option></select></div></div><div class="field"><label>目前最在意的事情</label><textarea id="travelerConcern"></textarea></div><div class="field"><label>她希望帶走什麼？</label><textarea id="travelerHope"></textarea></div><div class="field"><label>私人備註</label><textarea id="travelerNote"></textarea></div><div class="actions"><button class="btn primary">建立旅人</button></div></form></div></div><div id="auth" class="auth show"><div class="card"><div class="brand"><img src="assets/shiguang-logo.jpg" alt="拾光所 Logo"><div class="brand-copy"><h2>回到拾光所</h2><p class="muted">登入後，旅人與旅程資料會儲存在你的雲端空間。</p></div></div><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>密碼</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password"></div><p id="authMsg" class="muted"></p><div class="actions"><button class="btn ghost" onclick="signup()">第一次使用｜建立帳號</button><button class="btn primary" onclick="login()">登入</button></div></div></div><div id="printSheet" class="print-sheet"><img src="assets/shiguang-logo.jpg" alt="拾光所 Logo" style="display:block;width:90px;height:90px;border-radius:50%;object-fit:cover;margin:0 auto 16px"><h1 id="printTitle"></h1><p id="printSub"></p><div id="printBody" class="print-body"></div><p style="text-align:center;margin-top:30px">拾光所</p></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://tgfxrbghzzttqbpfwypw.supabase.co','sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN');window.sb=sb;window.data={travelers:[],sessions:[],confirmed:[]};window.$=id=>document.getElementById(id);window.uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());async function boot(){const{data:{session}}=await sb.auth.getSession();if(session){$('auth').classList.remove('show');await loadCloud()}else $('auth').classList.add('show')}window.signup=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<6)return $('authMsg').textContent='請輸入 Email，密碼至少 6 個字元。';$('authMsg').textContent='建立帳號中…';const{data:d,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://kude-self.github.io/shiguang/'}});if(error)return $('authMsg').textContent='無法建立：'+error.message;if(d.session){$('auth').classList.remove('show');await loadCloud()}else $('authMsg').textContent='帳號已建立。請到 Email 收信確認後，再回來登入。'};window.login=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});if(error)return $('authMsg').textContent='登入失敗：'+error.message;$('auth').classList.remove('show');await loadCloud()};window.logout=async()=>{await sb.auth.signOut();location.reload()};async function loadCloud(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const{data:row,error}=await sb.from('app_data').select('data').eq('user_id',user.id).maybeSingle();if(error){$('cloudStatus').textContent='雲端讀取失敗';return}if(row?.data)window.data=row.data;else{const old=JSON.parse(localStorage.getItem('shiguang_site_v1')||'null');if(old?.travelers?.length||old?.sessions?.length)window.data=old;await persist()}$('cloudStatus').textContent='☁︎ 已同步雲端';renderAll()}window.persist=async()=>{const{data:{user}}=await sb.auth.getUser();if(!user)return;const{error}=await sb.from('app_data').upsert({user_id:user.id,data:window.data,updated_at:new Date().toISOString()});$('cloudStatus').textContent=error?'同步失敗':'☁︎ 已同步雲端';if(error)alert('雲端儲存失敗：'+error.message);renderAll()};sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&s){$('auth').classList.remove('show')}});boot();</script><script>function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='journey')renderJourney();if(v==='create')buildDraft()}function openTraveler(){$('travelerModal').classList.add('show');$('travelerDate').value=new Date().toISOString().slice(0,10)}function closeTraveler(){$('travelerModal').classList.remove('show')}travelerForm.onsubmit=async e=>{e.preventDefault();data.travelers.push({id:uid(),name:$('travelerName').value.trim(),date:$('travelerDate').value,journey:$('travelerJourney').value,concern:$('travelerConcern').value,hope:$('travelerHope').value,note:$('travelerNote').value});e.target.reset();closeTraveler();await persist()};sessionForm.onsubmit=async e=>{e.preventDefault();const tid=$('journeyTraveler').value;if(!tid)return alert('請先新增旅人');data.sessions.push({id:uid(),travelerId:tid,date:$('sessionDate').value,stage:$('sessionStage').value,bring:$('sessionBring').value,insight:$('sessionInsight').value,quote:$('sessionQuote').value,change:$('sessionChange').value,method:$('sessionMethod').value,leave:$('sessionLeave').value,light:$('sessionLight').value});['sessionBring','sessionInsight','sessionQuote','sessionChange','sessionMethod','sessionLeave','sessionLight'].forEach(id=>$(id).value='');await persist();renderJourney()};function fillSelect(id){const el=$(id),cur=el.value;el.innerHTML=data.travelers.map(t=>`<option value="${t.id}">${t.name}｜${t.journey}</option>`).join('');if(data.travelers.some(t=>t.id===cur))el.value=cur}function renderAll(){$('today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('homeTravelers').innerHTML=data.travelers.slice(-3).reverse().map(t=>`<div class="item"><strong>${t.name}</strong> <span class="pill">${t.journey}</span><div class="muted">${t.concern||'尚未留下目前最在意的事情'}</div></div>`).join('')||'<p class="muted">還沒有旅人。</p>';$('homeSessions').innerHTML=data.sessions.slice(-3).reverse().map(s=>{const t=data.travelers.find(x=>x.id===s.travelerId);return `<div class="item"><strong>${t?.name||'旅人'}｜${s.stage}</strong><div class="muted">${s.light||s.insight||'已留下這次相遇'}</div></div>`}).join('')||'<p class="muted">還沒有相遇紀錄。</p>';$('travelerList').innerHTML=data.travelers.map(t=>`<div class="item"><strong>${t.name}</strong> <span class="pill">${t.journey}</span><div class="muted">${t.concern||''}</div></div>`).join('')||'<p class="muted">尚未建立旅人。</p>';fillSelect('journeyTraveler');fillSelect('createTraveler');renderJourney()}function renderJourney(){const tid=$('journeyTraveler').value,t=data.travelers.find(x=>x.id===tid);if(!t){$('journeySummary').innerHTML='<p class="muted">請先建立旅人。</p>';$('timeline').innerHTML='';return}$('journeySummary').innerHTML=`<h3>${t.name}的旅程</h3><span class="pill">${t.journey}</span><p class="muted">${t.concern||''}</p>`;const ss=data.sessions.filter(s=>s.travelerId===tid).sort((a,b)=>(a.date||'').localeCompare(b.date||''));$('timeline').innerHTML=ss.map(s=>`<div class="item"><strong>${s.date||''}｜${s.stage}</strong><div class="muted">${s.insight||s.bring||''}</div>${s.light?`<span class="pill">拾起的光：${s.light}</span>`:''}</div>`).join('')||'<p class="muted">還沒有相遇紀錄。</p>'}function buildDraft(){const tid=$('createTraveler').value,t=data.travelers.find(x=>x.id===tid),type=$('recordType').value;if(!t){$('draftText').value='';return}const ss=data.sessions.filter(s=>s.travelerId===tid).sort((a,b)=>(a.date||'').localeCompare(b.date||''));let body=`${t.name}｜${type}\n\n`;if(type==='初遇紀錄'){const s=ss[0];body+=s?`這次，你帶著「${s.bring||'一些還說不清楚的感受'}」來到拾光所。\n\n這次最大的看見：\n${s.insight||'—'}\n\n重要的一句話：\n${s.quote||'—'}\n\n這次拾起的光：\n${s.light||s.leave||'—'}`:'尚未有相遇紀錄。'}else body+=ss.map((s,i)=>`第 ${i+1} 次｜${s.stage}｜${s.date||''}\n${s.insight||s.bring||'—'}\n拾起的光：${s.light||'—'}\n`).join('\n');$('draftTitle').textContent=`${t.name}｜《${type}》草稿`;$('draftText').value=body;$('draftStatus').textContent='你可以先修改，再確認文案。';$('recordPreviewCard').style.display='none'}async function confirmDraft(){const tid=$('createTraveler').value,t=data.travelers.find(x=>x.id===tid);if(!t)return alert('請先選擇旅人');const type=$('recordType').value,text=$('draftText').value;data.confirmed.push({id:uid(),travelerId:tid,type,text,date:new Date().toISOString()});await persist();$('draftStatus').textContent='✓ 文案已確認，正式電子版預覽已顯示。';$('previewTitle').textContent=`《${type}》`;$('previewSub').textContent=type==='初遇紀錄'?'一場相遇，留下第一次看見。':type==='拾光紀錄'?'四週整理，把一路看見的自己留下來。':'三個月，把真正發生在生活裡的改變留下來。';$('previewBody').textContent=text;$('recordPreviewCard').style.display='block';$('recordPreviewCard').scrollIntoView({behavior:'smooth'})}function printRecord(){$('printTitle').textContent=$('previewTitle').textContent;$('printSub').textContent=$('previewSub').textContent;$('printBody').textContent=$('previewBody').textContent;window.print()}$('sessionDate').value=new Date().toISOString().slice(0,10);renderAll();</script></body></html>
