<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5eee4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>拾光所｜旅人陪伴系統</title><style>html,body{margin:0;width:100%;height:100%;background:#f5eee4;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#f5eee4}</style></head><body><iframe id="appFrame" src="app.html?v=7" title="拾光所｜旅人陪伴系統"></iframe><script>const f=document.getElementById('appFrame');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;let l=d.querySelector('link[data-shiguang-theme]');if(!l){l=d.createElement('link');l.rel='stylesheet';l.dataset.shiguangTheme='1';d.head.appendChild(l)}l.href='shiguang-theme.css?v=7';const old=d.querySelector('style[data-mobile-fix]');if(old)old.remove();const s=d.createElement('style');s.dataset.mobileFix='1';s.textContent='@media(max-width:760px){.hero{grid-template-columns:1fr!important}.quick-grid,.dashboard,.traveler-grid,.journey-layout,.form-layout,.create-layout,.library-grid{grid-template-columns:1fr!important}.page-head{gap:10px!important}.page-head .primary,.page-head .btn{width:100%!important}.record-row{grid-template-columns:1fr!important}.nav{padding-bottom:max(6px,env(safe-area-inset-bottom))!important}}';d.head.appendChild(s);if(!d.querySelector('script[data-final-polish]')){const js=d.createElement('script');js.src='shiguang-final.js?v=7';js.dataset.finalPolish='1';d.body.appendChild(js);js.onload=()=>{const ex=d.createElement('script');ex.src='shiguang-export-fix.js?v=3';ex.dataset.exportFix='1';d.body.appendChild(ex)}}catch(e){console.warn(e)}});</script></body></html>
