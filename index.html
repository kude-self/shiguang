<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e7"><title>拾光所｜旅人陪伴系統</title><style>:root{--paper:#fffaf3;--line:#e6d8c2;--text:#40362e;--muted:#82766b;--sage:#718055;--soft:#edf0e2;--bg:#f6efe5}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:var(--text);background:linear-gradient(180deg,#fbf7f0 0%,#f3ebdf 100%);min-height:100vh}.app{max-width:980px;margin:auto;padding:0 14px 112px}.top,.card,.quick button{border:1px solid var(--line);background:rgba(255,251,245,.94);box-shadow:0 5px 18px rgba(80,60,40,.045)}.top{margin:0 -14px 18px;padding:18px 22px 22px;border-radius:0 0 30px 30px;background:linear-gradient(135deg,rgba(255,251,245,.98),rgba(241,231,214,.95))}.top .actions{margin-bottom:2px}h1,h2,h3{font-family:"Songti TC","Noto Serif TC",serif}.brand{display:flex;align-items:center;gap:14px}.brand img{width:112px;height:112px;object-fit:contain;border:0;box-shadow:none;mix-blend-mode:multiply}.brand-copy h1{margin:0 0 6px;font-size:32px;letter-spacing:.03em}.brand-copy p{margin:0;font-size:17px;line-height:1.6}.muted{color:var(--muted)}.card{padding:22px;border-radius:26px;margin:16px 0}.card h2{font-size:27px;margin:4px 0 12px}.card h3{font-size:21px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.quick button{min-height:126px;padding:22px;border-radius:24px;text-align:left;color:var(--text);cursor:pointer}.quick strong{display:block;font-family:"Songti TC","Noto Serif TC",serif;font-size:20px;margin-bottom:8px}.quick small{font-size:14px;color:var(--muted)}.grid2,.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:14px;padding:13px;font-size:16px;color:var(--text)}textarea{min-height:90px}.btn{border:0;border-radius:999px;padding:11px 16px;font-size:15px}.primary{background:var(--sage);color:#fff}.ghost{background:#f7efe4;color:var(--text)}.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:17px;background:#fffdf9;padding:14px;margin:9px 0}.pill{display:inline-block;background:var(--soft);padding:4px 8px;border-radius:99px;font-size:12px}.view{display:none}.view.active{display:block}.traveler-page{padding:22px}.traveler-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}.traveler-header h2{margin:0;font-size:29px}.traveler-header p{margin:6px 0 0}.traveler-count{font-size:13px;color:var(--muted);margin-top:3px}.traveler-list{display:grid;gap:12px}.traveler-card{border:1px solid var(--line);background:linear-gradient(180deg,#fffdf9,#fffaf3);border-radius:20px;padding:17px 18px}.traveler-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.traveler-name{font-family:"Songti TC","Noto Serif TC",serif;font-size:23px;font-weight:700}.traveler-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:14px}.traveler-concern{margin:13px 0 0;padding-top:12px;border-top:1px solid #eee2d1;line-height:1.6}.traveler-card-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.mini-btn{border:1px solid var(--line);background:#f8f1e7;color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px}.mini-btn.primary-mini{background:var(--soft);color:#58703c;border-color:#dfe5cf;font-weight:700}.empty-state{text-align:center;padding:28px 12px;color:var(--muted)}.nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(920px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);padding:8px;background:rgba(255,251,244,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 28px rgba(80,60,40,.08);z-index:20}.nav button{border:0;background:none;padding:11px 2px;color:var(--text);font-size:14px}.nav button.active{background:var(--soft);color:#58703c;border-radius:16px;font-weight:700}.modal,.auth{position:fixed;inset:0;background:rgba(45,37,30,.38);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show,.auth.show{display:flex}.modal .card,.auth .card{width:min(600px,100%);max-height:90vh;overflow:auto}.auth .card{max-width:430px}.auth .brand img{width:104px;height:104px}.preview{white-space:pre-wrap;line-height:1.9;border:1px solid var(--line);background:#fffdf9;border-radius:18px;padding:20px}.status{font-size:13px;padding:8px 12px;border-radius:99px;background:var(--soft);display:inline-block;color:#586440}.timeline{border-left:2px solid #d8ccb9;padding-left:16px}.quote{text-align:center;font-family:"Songti TC",serif;font-size:20px;line-height:1.8}.print-sheet{display:none}#journey>.grid2{align-items:start;gap:16px}#journey>.grid2>div:first-child{display:grid;gap:12px}#journey>.grid2>div:first-child>.card{margin:0}#journey>.grid2>div:first-child>.card:first-child{padding:20px}#journey>.grid2>div:first-child>.card:nth-child(2){padding:18px 20px}#journey>.grid2>.card{margin:0;padding:20px 22px}#journey h2{margin-top:0}#journey .timeline{border-left:0;padding-left:0}#journey .timeline>.item{position:relative;padding-left:18px}#journey .timeline>.item:before{content:"";position:absolute;left:7px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--sage)}#journey .timeline>.muted{margin:0;padding:4px 0;color:var(--muted)}#journey form .field{margin:10px 0}#journey form textarea{min-height:76px;line-height:1.6}#journey form .actions{margin-top:14px}#journey form .actions .primary{min-width:150px}#journey #journeySummary .item{margin-bottom:0;background:linear-gradient(180deg,#fffdf9,#fbf5eb)}@media(max-width:720px){.app{padding:0 12px 132px}.top{margin:0 -12px 14px;padding:14px 16px 18px;border-radius:0 0 28px 28px}.top .actions{margin-bottom:6px}.brand{gap:10px}.brand img{width:104px;height:104px;margin-left:-2px}.brand-copy h1{font-size:29px}.brand-copy p{font-size:15px;line-height:1.5}.quick,.grid2,.row{grid-template-columns:1fr}.card{padding:20px;border-radius:24px;margin:14px 0}.card h2{font-size:25px}.quick{gap:12px}.quick button{min-height:132px;padding:22px}.quick strong{font-size:21px}.traveler-page{padding:18px}.traveler-header{align-items:center}.traveler-header h2{font-size:27px}.traveler-header .primary{white-space:nowrap}.traveler-card{padding:16px}.traveler-name{font-size:22px}#journey>.grid2{gap:12px}#journey>.grid2>div:first-child{gap:12px}#journey>.grid2>div:first-child>.card:first-child,#journey>.grid2>div:first-child>.card:nth-child(2),#journey>.grid2>.card{padding:18px;border-radius:22px}#journey>.grid2>div:first-child>.card:nth-child(2):has(.timeline:empty){display:none}#journey .field input,#journey .field select,#journey .field textarea{padding:12px}#journey form textarea{min-height:72px}#journey .card h2{font-size:25px;margin-bottom:10px}#journey .card h3{margin:0 0 8px;font-size:21px}#journey .timeline>.item{margin:8px 0}.nav{width:calc(100% - 20px);bottom:max(10px,env(safe-area-inset-bottom));padding:7px}.nav button{font-size:13px;padding:11px 1px}}@media(max-width:390px){.brand img{width:92px;height:92px}.brand-copy h1{font-size:27px}.brand-copy p{font-size:14px}.status{font-size:12px}.btn{padding:9px 13px}.traveler-header{align-items:flex-start;flex-direction:column}.traveler-header .primary{align-self:flex-start}}@media print{body>*{display:none!important}.print-sheet{display:block!important;padding:14mm;font-family:"Songti TC",serif}.print-sheet h1{text-align:center}.print-sheet .print-body{white-space:pre-wrap;line-height:2}}</style></head><body><div class="app" id="app"><header class="top"><div class="actions"><span id="cloudStatus" class="status">連線中…</span><button class="btn ghost" onclick="logout()">登出</button></div><div class="brand"><img src="32CCD19A-16B9-451E-8559-4A40F8CA3D92.png" alt="拾光所 Logo"><div class="brand-copy"><h1>拾光所</h1><p class="muted">陪伴每一位旅人，拾起內在的光。</p></div></div></header><section id="home" class="view active"><div class="card"><h2>今天，想從哪裡開始？</h2><p id="today" class="muted"></p></div><div class="quick"><button onclick="openTraveler()"><strong>＋ 新增旅人</strong><small>建立一段新的相遇。</small></button><button onclick="go('journey')"><strong>✦ 開始一次旅程</strong><small>記錄今天看見的事。</small></button><button onclick="go('create')"><strong>⌇ 製作旅程紀錄</strong><small>整理成可以留下的文字。</small></button></div><div class="grid2"><div class="card"><h3>正在同行</h3><div id="homeTravelers"></div></div><div class="card"><h3>最近相遇</h3><div id="homeSessions"></div></div></div><div class="card quote">有些答案，不需要急著找到。<br>先把自己聽清楚一點。</div></section><section id="travelers" class="view"><div class="card traveler-page"><div class="traveler-header"><div><h2>旅人</h2><p class="muted">每一段相遇，都從這裡開始。</p><div id="travelerCount" class="traveler-count"></div></div><button class="btn primary" onclick="openTraveler()">＋ 新增旅人</button></div><div id="travelerList" class="traveler-list"></div></div></section><section id="journey" class="view"><div class="grid2"><div><div class="card"><h2>開始一次旅程</h2><div class="field"><label>選擇旅人</label><select id="journeyTraveler" onchange="renderJourney()"></select></div><div id="journeySummary"></div></div><div class="card"><h3>旅程時間軸</h3><div id="timeline" class="timeline"></div></div></div><div class="card"><h2>新增一次相遇</h2><form id="sessionForm"><div class="row"><div class="field"><label>日期</label><input id="sessionDate" type="date"></div><div class="field"><label>這次走到哪裡</label><select id="sessionStage"><option>初遇</option><option>看見</option><option>分辨</option><option>找回</option><option>選擇</option><option>生活練習</option><option>同行</option></select></div></div><div class="field"><label>今天她帶著什麼來？</label><textarea id="sessionBring"></textarea></div><div class="field"><label>今天最大的看見？</label><textarea id="sessionInsight"></textarea></div><div class="field"><label>有沒有一句很重要的話？</label><textarea id="sessionQuote"></textarea></div><div class="field"><label>與之前相比，有什麼不同？</label><textarea id="sessionChange"></textarea></div><div class="field"><label>今天使用的方式</label><input id="sessionMethod" placeholder="對話／書寫／圖像／靈氣／其他"></div><div class="field"><label>這次想留下什麼給她？</label><textarea id="sessionLeave"></textarea></div><div class="field"><label>這次拾起的光</label><input id="sessionLight"></div><div class="actions"><button class="btn primary">儲存這次相遇</button></div></form></div></div></section><section id="create" class="view"><div class="card"><h2>製作旅程紀錄</h2><div class="row"><div class="field"><label>旅人</label><select id="createTraveler" onchange="buildDraft()"></select></div><div class="field"><label>紀錄類型</label><select id="recordType" onchange="buildDraft()"><option>初遇紀錄</option><option>拾光紀錄</option><option>旅程紀錄</option></select></div></div><div class="field"><label id="draftTitle">紀錄草稿</label><textarea id="draftText" style="min-height:300px"></textarea></div><p id="draftStatus" class="muted"></p><div class="actions"><button class="btn ghost" onclick="buildDraft()">重新整理草稿</button><button class="btn primary" onclick="confirmDraft()">✓ 確認這份文案</button></div></div><div id="recordPreviewCard" class="card" style="display:none"><h2 id="previewTitle"></h2><p id="previewSub" class="muted"></p><div id="previewBody" class="preview"></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="printRecord()">儲存 PDF</button></div></div></section><section id="library" class="view"><div class="card"><h2>拾光庫</h2><p class="muted">旅程前提醒、小卡、書寫題目與固定文案會集中放在這裡。</p></div></section></div><nav class="nav"><button class="active" data-v="home" onclick="go('home')">首頁</button><button data-v="travelers" onclick="go('travelers')">旅人</button><button data-v="journey" onclick="go('journey')">旅程</button><button data-v="create" onclick="go('create')">製作</button><button data-v="library" onclick="go('library')">拾光庫</button></nav><div id="travelerModal" class="modal"><div class="card"><div class="actions"><button class="btn ghost" onclick="closeTraveler()">關閉</button></div><h2>新增旅人</h2><form id="travelerForm"><div class="field"><label>旅人稱呼</label><input id="travelerName" required></div><div class="row"><div class="field"><label>第一次相遇日期</label><input id="travelerDate" type="date"></div><div class="field"><label>目前旅程</label><select id="travelerJourney"><option>初遇</option><option>拾光｜四週旅程</option><option>同行｜三個月陪伴</option><option>尚未決定</option></select></div></div><div class="field"><label>目前最在意的事情</label><textarea id="travelerConcern"></textarea></div><div class="field"><label>她希望帶走什麼？</label><textarea id="travelerHope"></textarea></div><div class="field"><label>私人備註</label><textarea id="travelerNote"></textarea></div><div class="actions"><button class="btn primary">建立旅人</button></div></form></div></div><div id="auth" class="auth show"><div class="card"><div class="brand"><img src="32CCD19A-16B9-451E-8559-4A40F8CA3D92.png" alt="拾光所 Logo"><div class="brand-copy"><h2>回到拾光所</h2><p class="muted">登入後，旅人與旅程資料會儲存在你的雲端空間。</p></div></div><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>密碼</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password"></div><p id="authMsg" class="muted"></p><div class="actions"><button class="btn ghost" onclick="signup()">第一次使用｜建立帳號</button><button class="btn primary" onclick="login()">登入</button></div></div></div><div id="printSheet" class="print-sheet"><img src="32CCD19A-16B9-451E-8559-4A40F8CA3D92.png" alt="拾光所 Logo" style="display:block;width:110px;height:110px;object-fit:contain;margin:0 auto 16px"><h1 id="printTitle"></h1><p id="printSub"></p><div id="printBody" class="print-body"></div><p style="text-align:center;margin-top:30px">拾光所</p></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://tgfxrbghzzttqbpfwypw.supabase.co','sb_publishable_ZtAF_kDvx1WGNM3RPIhxzA_nMjHQwyN');window.sb=sb;window.data={travelers:[],sessions:[],confirmed:[]};window.$=id=>document.getElementById(id);window.uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());async function boot(){const{data:{session}}=await sb.auth.getSession();if(session){$('auth').classList.remove('show');await loadCloud()}else $('auth').classList.add('show')}window.signup=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<6)return $('authMsg').textContent='請輸入 Email，密碼至少 6 個字元。';$('authMsg').textContent='建立帳號中…';const{data:d,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://kude-self.github.io/shiguang/'}});if(error)return $('authMsg').textContent='無法建立：'+error.message;if(d.session){$('auth').classList.remove('show');await loadCloud()}else $('authMsg').textContent='帳號已建立。請到 Email 收信確認後，再回來登入。'};window.login=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});if(error)return $('authMsg').textContent='登入失敗：'+error.message;$('auth').classList.remove('show');await loadCloud()};window.logout=async()=>{await sb.auth.signOut();location.reload()};async function loadCloud(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const{data:row,error}=await sb.from('app_data').select('data').eq('user_id',user.id).maybeSingle();if(error){$('cloudStatus').textContent='雲端讀取失敗';return}if(row?.data)window.data=row.data;else{const old=JSON.parse(localStorage.getItem('shiguang_site_v1')||'{"travelers":[],"sessions":[],"confirmed":[]}');window.data=old;await saveCloud()}$('cloudStatus').textContent='☁ 已同步雲端';renderAll()}window.saveCloud=async()=>{const{data:{user}}=await sb.auth.getUser();if(!user)return;$('cloudStatus').textContent='同步中…';const{error}=await sb.from('app_data').upsert({user_id:user.id,data:window.data,updated_at:new Date().toISOString()},{onConflict:'user_id'});$('cloudStatus').textContent=error?'同步失敗':'☁ 已同步雲端'};window.go=v=>{document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='journey')renderJourney();if(v==='create')buildDraft();scrollTo({top:0,behavior:'smooth'})};window.openTraveler=()=>{$('travelerModal').classList.add('show');$('travelerDate').value=new Date().toISOString().slice(0,10)};window.closeTraveler=()=>{$('travelerModal').classList.remove('show')};window.openTravelerJourney=id=>{go('journey');$('journeyTraveler').value=id;renderJourney()};window.openTravelerRecord=id=>{go('create');$('createTraveler').value=id;buildDraft()};$('travelerForm').onsubmit=async e=>{e.preventDefault();data.travelers.unshift({id:uid(),name:$('travelerName').value.trim(),date:$('travelerDate').value,journey:$('travelerJourney').value,concern:$('travelerConcern').value.trim(),hope:$('travelerHope').value.trim(),note:$('travelerNote').value.trim(),created:Date.now()});e.target.reset();closeTraveler();await saveCloud();renderAll()};$('sessionForm').onsubmit=async e=>{e.preventDefault();const travelerId=$('journeyTraveler').value;if(!travelerId)return alert('請先新增並選擇旅人');data.sessions.unshift({id:uid(),travelerId,date:$('sessionDate').value,stage:$('sessionStage').value,bring:$('sessionBring').value.trim(),insight:$('sessionInsight').value.trim(),quote:$('sessionQuote').value.trim(),change:$('sessionChange').value.trim(),method:$('sessionMethod').value.trim(),leave:$('sessionLeave').value.trim(),light:$('sessionLight').value.trim(),created:Date.now()});e.target.reset();$('sessionDate').value=new Date().toISOString().slice(0,10);await saveCloud();renderAll();renderJourney()};window.renderAll=()=>{const opts=data.travelers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');['journeyTraveler','createTraveler'].forEach(id=>{const old=$(id).value;$(id).innerHTML='<option value="">請選擇</option>'+opts;if(data.travelers.some(t=>t.id===old))$(id).value=old});$('travelerCount').textContent=data.travelers.length?`目前共有 ${data.travelers.length} 位旅人`:'尚未建立旅人';$('travelerList').innerHTML=data.travelers.length?data.travelers.map(t=>`<div class="traveler-card"><div class="traveler-card-top"><div class="traveler-name">${esc(t.name)}</div><span class="pill">${esc(t.journey)}</span></div><div class="traveler-meta"><span>${esc(t.date||'未填日期')}</span>${t.hope?'<span>・有留下期待</span>':''}</div><div class="traveler-concern"><span class="muted">目前最在意</span><br>${esc(t.concern||'尚未留下目前最在意的事情')}</div><div class="traveler-card-actions"><button class="mini-btn primary-mini" onclick="openTravelerJourney('${t.id}')">開始／查看旅程</button><button class="mini-btn" onclick="openTravelerRecord('${t.id}')">製作紀錄</button></div></div>`).join(''):'<div class="empty-state">還沒有旅人。<br>從第一段相遇開始吧。</div>';$('homeTravelers').innerHTML=data.travelers.slice(0,4).map(t=>`<div class="item"><strong>${esc(t.name)}</strong><br><span class="muted">${esc(t.journey)}</span></div>`).join('')||'<p class="muted">從新增第一位旅人開始。</p>';$('homeSessions').innerHTML=data.sessions.slice(0,4).map(s=>{const t=data.travelers.find(x=>x.id===s.travelerId);return`<div class="item"><strong>${esc(t?.name||'旅人')}</strong> · ${esc(s.stage)}<br><span class="muted">${esc(s.date)}</span></div>`}).join('')||'<p class="muted">旅程紀錄會出現在這裡。</p>'};window.renderJourney=()=>{const id=$('journeyTraveler').value,t=data.travelers.find(x=>x.id===id);if(!t){$('journeySummary').innerHTML='<p class="muted">選一位旅人，開始今天的相遇。</p>';$('timeline').innerHTML='';return}$('journeySummary').innerHTML=`<div class="item"><strong>${esc(t.name)}</strong><p>目前：${esc(t.journey)}</p><p class="muted">最在意：${esc(t.concern||'—')}</p></div>`;const ss=data.sessions.filter(s=>s.travelerId===id);$('timeline').innerHTML=ss.length?ss.map(s=>`<div class="item"><strong>${esc(s.date)}｜${esc(s.stage)}</strong><p>${esc(s.insight||s.bring||'')}</p>${s.light?`<span class="pill">拾起的光：${esc(s.light)}</span>`:''}</div>`).join(''):'<p class="muted">還沒有旅程紀錄。</p>'};window.buildDraft=()=>{const id=$('createTraveler').value,t=data.travelers.find(x=>x.id===id),type=$('recordType').value;$('recordPreviewCard').style.display='none';if(!t){$('draftText').value='';$('draftStatus').textContent='先選擇一位旅人。';return}const ss=data.sessions.filter(s=>s.travelerId===id).sort((a,b)=>a.date.localeCompare(b.date));let text='';if(type==='初遇紀錄'){const s=ss[ss.length-1]||{};text=`今天的你，帶著「${s.bring||t.concern||'此刻的自己'}」來到這裡。\n\n在這次相遇裡，我們一起看見：\n${s.insight||'＿＿＿＿＿＿'}\n\n想替你留下的一句話：\n${s.leave||s.quote||'＿＿＿＿＿＿'}\n\n這一次，你拾起的光：\n${s.light||'＿＿＿＿＿＿'}`}else{text=`這段旅程從「${t.concern||'一個想更靠近自己的念頭'}」開始。\n\n`;ss.forEach((s,i)=>text+=`${i+1}. ${s.date}｜${s.stage}\n看見：${s.insight||'—'}\n變化：${s.change||'—'}\n拾起的光：${s.light||'—'}\n\n`);text+=`一路走到這裡，真正留下來的，不只是答案，而是你越來越能分辨自己的聲音。`} $('draftText').value=text;$('draftTitle').textContent=type+'｜文案確認';$('draftStatus').textContent='先閱讀、修改。確認後才會進入正式電子版。'};window.confirmDraft=async()=>{const id=$('createTraveler').value,t=data.travelers.find(x=>x.id===id);if(!t)return alert('請先選擇旅人');const type=$('recordType').value,text=$('draftText').value.trim();if(!text)return alert('目前沒有文案');data.confirmed.unshift({id:uid(),travelerId:id,type,text,date:new Date().toISOString(),created:Date.now()});await saveCloud();$('previewTitle').textContent=type;$('previewSub').textContent=type==='初遇紀錄'?'一場相遇，留下第一次看見。':type==='拾光紀錄'?'四週整理，把一路看見的自己留下來。':'三個月，把真正發生在生活裡的改變留下來。';$('previewBody').textContent=text;$('recordPreviewCard').style.display='block';$('draftStatus').textContent='✓ 文案已確認。現在可以查看正式版並儲存 PDF。'};window.printRecord=()=>{$('printTitle').textContent=$('previewTitle').textContent;$('printSub').textContent=$('previewSub').textContent;$('printBody').textContent=$('previewBody').textContent;window.print()};window.esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('today').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(new Date());$('sessionDate').value=new Date().toISOString().slice(0,10);boot();</script></body></html>
