<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eee4"><title>拾光所｜旅人陪伴系統</title><style>:root{--bg:#f4eee4;--paper:#fffaf2;--line:#e4d7c3;--text:#3f352d;--muted:#83766a;--sage:#7f8d64;--sage2:#e8ecdc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--text);background:linear-gradient(180deg,#fbf7f0,#efe6da);min-height:100vh}.app{max-width:980px;margin:auto;padding:22px 16px 90px}.top{padding:28px 22px 36px;border-radius:0 0 28px 28px;background:linear-gradient(135deg,#fffaf4,#eee2cf);box-shadow:0 12px 30px rgba(84,65,43,.08)}h1,h2,h3{font-family:"Noto Serif TC","Songti TC",serif}.top h1{margin:0 0 8px;font-size:34px}.top p{margin:0;color:var(--muted)}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(920px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:7px;border:1px solid var(--line);border-radius:22px;background:rgba(255,250,242,.96);backdrop-filter:blur(12px);z-index:20}.nav button{border:0;background:transparent;padding:11px 6px;border-radius:16px;color:var(--text)}.nav button.active{background:var(--sage2);color:#63704f}.view{display:none}.view.active{display:block}.hero{margin-top:18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card,.quick button{border:1px solid var(--line);background:rgba(255,250,242,.94);border-radius:22px;box-shadow:0 8px 20px rgba(84,65,43,.06)}.quick button{padding:18px;text-align:left}.quick strong{display:block;font-size:17px;margin-bottom:6px}.quick small,.muted{color:var(--muted)}.card{padding:18px;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--line);background:#fffdf9;border-radius:16px;padding:13px}.pill{display:inline-block;background:var(--sage2);padding:4px 8px;border-radius:999px;font-size:12px}.field{margin-bottom:12px}.field label{display:block;font-weight:650;font-size:14px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:14px;padding:12px;color:var(--text)}.field textarea{min-height:94px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:11px 15px;min-height:44px}.primary{background:linear-gradient(#89966f,#72805a);color:#fff}.ghost{background:#f3eadf;color:var(--text)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.modal{position:fixed;inset:0;background:rgba(43,36,29,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.modal .card{width:min(680px,100%);max-height:88vh;overflow:auto}.timeline{border-left:2px solid #d7cbb9;margin-left:8px;padding-left:18px}.t{margin-bottom:16px}.preview{white-space:pre-wrap;line-height:1.8;border:1px solid var(--line);background:#fffdf9;border-radius:18px;padding:18px}.quote{text-align:center;font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;line-height:1.8;background:linear-gradient(90deg,#efe4d3,#fffaf2,#edf0e2)}@media(max-width:720px){.quick,.grid2,.row{grid-template-columns:1fr}.top h1{font-size:29px}.nav button{font-size:12px;padding:10px 3px}.app{padding:12px 10px 86px}}</style></head><body><div class="app"><header class="top"><h1>𓇼 拾光所</h1><p>陪伴每一位旅人，拾起內在的光。</p></header><section id="home" class="view active"><div class="hero card"><h2>今天，想從哪裡開始？</h2><p class="muted" id="today"></p></div><div class="quick"><button onclick="openTraveler()"><strong>＋ 新增旅人</strong><small>建立一段新的相遇。</small></button><button onclick="go('journey')"><strong>✦ 開始一次旅程</strong><small>記錄今天看見的事。</small></button><button onclick="go('create')"><strong>⌇ 製作旅程紀錄</strong><small>整理成可以留下的文字。</small></button></div><div class="grid2"><div class="card"><h3>正在同行</h3><div id="homeTravelers" class="list"></div></div><div class="card"><h3>最近相遇</h3><div id="homeSessions" class="list"></div></div></div><div class="card quote">有些答案，不需要急著找到。<br>先把自己聽清楚一點。</div></section><section id="travelers" class="view"><div class="card"><div class="actions"><button class="btn primary" onclick="openTraveler()">＋ 新增旅人</button></div><h2>旅人</h2><div id="travelerList" class="list"></div></div></section><section id="journey" class="view"><div class="grid2"><div><div class="card"><h2>開始一次旅程</h2><div class="field"><label>選擇旅人</label><select id="journeyTraveler" onchange="renderJourney()"></select></div><div id="journeySummary"></div></div><div class="card"><h3>旅程時間軸</h3><div id="timeline" class="timeline"></div></div></div><div class="card"><h2>新增一次相遇</h2><form id="sessionForm"><div class="row"><div class="field"><label>日期</label><input id="sessionDate" type="date"></div><div class="field"><label>這次走到哪裡</label><select id="sessionStage"><option>初遇</option><option>看見</option><option>分辨</option><option>找回</option><option>選擇</option><option>生活練習</option><option>同行</option></select></div></div><div class="field"><label>今天她帶著什麼來？</label><textarea id="sessionBring"></textarea></div><div class="field"><label>今天最大的看見？</label><textarea id="sessionInsight"></textarea></div><div class="field"><label>有沒有一句很重要的話？</label><textarea id="sessionQuote"></textarea></div><div class="field"><label>與之前相比，有什麼不同？</label><textarea id="sessionChange"></textarea></div><div class="field"><label>今天使用的方式</label><input id="sessionMethod" placeholder="對話／書寫／圖像／靈氣／其他"></div><div class="field"><label>這次想留下什麼給她？</label><textarea id="sessionLeave"></textarea></div><div class="field"><label>這次拾起的光</label><input id="sessionLight"></div><div class="actions"><button class="btn primary">儲存這次相遇</button></div></form></div></div></section><section id="create" class="view"><div class="card"><h2>製作旅程紀錄</h2><div class="row"><div class="field"><label>旅人</label><select id="createTraveler" onchange="buildDraft()"></select></div><div class="field"><label>紀錄類型</label><select id="recordType" onchange="buildDraft()"><option>初遇紀錄</option><option>拾光紀錄</option><option>旅程紀錄</option></select></div></div><div class="field"><label id="draftTitle">紀錄草稿</label><textarea id="draftText" style="min-height:300px"></textarea></div><p class="muted" id="draftStatus"></p><div class="actions"><button class="btn ghost" onclick="buildDraft()">重新整理草稿</button><button class="btn primary" onclick="confirmDraft()">✓ 確認這份文案</button></div></div><div id="recordPreviewCard" class="card" style="display:none"><h2 id="previewTitle">正式電子版預覽</h2><p class="muted" id="previewSub"></p><div class="preview" id="previewBody"></div><div class="actions" style="margin-top:12px"><button class="btn ghost" onclick="window.print()">列印／儲存 PDF</button></div></div></section><section id="library" class="view"><div class="card"><h2>拾光庫</h2><p class="muted">這一區之後會放旅程前提醒、小卡、書寫題目與固定文案。</p></div></section></div><nav class="nav"><button class="active" data-v="home" onclick="go('home')">首頁</button><button data-v="travelers" onclick="go('travelers')">旅人</button><button data-v="journey" onclick="go('journey')">旅程</button><button data-v="create" onclick="go('create')">製作</button><button data-v="library" onclick="go('library')">拾光庫</button></nav><div class="modal" id="travelerModal"><div class="card"><div class="actions"><button class="btn ghost" onclick="closeTraveler()">關閉</button></div><h2>新增旅人</h2><form id="travelerForm"><div class="field"><label>旅人稱呼</label><input id="travelerName" required></div><div class="row"><div class="field"><label>第一次相遇日期</label><input id="travelerDate" type="date"></div><div class="field"><label>目前旅程</label><select id="travelerJourney"><option>初遇</option><option>拾光｜四週旅程</option><option>同行｜三個月陪伴</option><option>尚未決定</option></select></div></div><div class="field"><label>目前最在意的事情</label><textarea id="travelerConcern"></textarea></div><div class="field"><label>她希望帶走什麼？</label><textarea id="travelerHope"></textarea></div><div class="field"><label>私人備註</label><textarea id="travelerNote"></textarea></div><div class="actions"><button class="btn primary">建立旅人</button></div></form></div></div><script>const KEY='shiguang_site_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"travelers":[],"sessions":[],"confirmed":[]}');const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));renderAll()};function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v==='journey')renderJourney();if(v==='create')buildDraft()}function openTraveler(){$('travelerModal').classList.add('show');$('travelerDate').value=new Date().toISOString().slice(0,10)}function closeTraveler(){$('travelerModal').classList.remove('show')}$('travelerForm').onsubmit=e=>{e.preventDefault();data.travelers.push({id:uid(),name:$('travelerName').value.trim(),date:$('travelerDate').value,journey:$('travelerJourney').value,concern:$('travelerConcern').value,hope:$('travelerHope').value,note:$('travelerNote').value});e.target.reset();closeTraveler();save()};$('sessionForm').onsubmit=e=>{e.preventDefault();const tid=$('journeyTraveler').value;if(!tid)return alert('請先新增旅人');data.sessions.push({id:uid(),travelerId:tid,date:$('sessionDate').value,stage:$('sessionStage').value,bring:$('sessionBring').value,insight:$('sessionInsight').value,quote:$('sessionQuote').value,change:$('sessionChange').value,method:$('sessionMethod').value,leave:$('sessionLeave').value,light:$('sessionLight').value});['sessionBring','sessionInsight','sessionQuote','sessionChange','sessionMethod','sessionLeave','sessionLight'].forEach(id=>$(id).value='');save();renderJourney()};function fillSelect(id){const el=$(id),cur=el.value;el.innerHTML=data.travelers.map(t=>`<option value="${t.id}">${t.name}｜${t.journey}</option>`).join('');if(data.travelers.some(t=>t.id===cur))el.value=cur}function renderAll(){$('today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('homeTravelers').innerHTML=data.travelers.slice(-3).reverse().map(t=>`<div class="item"><strong>${t.name}</strong> <span class="pill">${t.journey}</span><div class="muted">${t.concern||'尚未留下目前最在意的事情'}</div></div>`).join('')||'<div class="muted">還沒有旅人。</div>';$('homeSessions').innerHTML=data.sessions.slice(-3).reverse().map(s=>{const t=data.travelers.find(x=>x.id===s.travelerId);return `<div class="item"><strong>${t?.name||'旅人'}｜${s.stage}</strong><div class="muted">${s.light||s.insight||'已留下這次相遇'}</div></div>`}).join('')||'<div class="muted">還沒有相遇紀錄。</div>';$('travelerList').innerHTML=data.travelers.map(t=>`<div class="item"><strong>${t.name}</strong> <span class="pill">${t.journey}</span><div class="muted">${t.concern||''}</div></div>`).join('')||'<div class="muted">尚未建立旅人。</div>';fillSelect('journeyTraveler');fillSelect('createTraveler');renderJourney()}function renderJourney(){const tid=$('journeyTraveler').value,t=data.travelers.find(x=>x.id===tid);if(!t){$('journeySummary').innerHTML='<p class="muted">請先建立旅人。</p>';$('timeline').innerHTML='';return}$('journeySummary').innerHTML=`<h3>${t.name}的旅程</h3><span class="pill">${t.journey}</span><p class="muted">${t.concern||''}</p>`;const ss=data.sessions.filter(s=>s.travelerId===tid).sort((a,b)=>a.date.localeCompare(b.date));$('timeline').innerHTML=ss.map(s=>`<div class="t"><strong>${s.date}｜${s.stage}</strong><div class="muted">${s.insight||s.bring||''}</div>${s.light?`<span class="pill">拾起的光：${s.light}</span>`:''}</div>`).join('')||'<p class="muted">還沒有相遇紀錄。</p>'}function buildDraft(){const tid=$('createTraveler').value,t=data.travelers.find(x=>x.id===tid),type=$('recordType').value;if(!t){$('draftText').value='';return}const ss=data.sessions.filter(s=>s.travelerId===tid).sort((a,b)=>a.date.localeCompare(b.date));let body=`${t.name}｜${type}\n\n`;if(type==='初遇紀錄'){const s=ss[0];body+=s?`這次，你帶著「${s.bring||'一些還說不清楚的感受'}」來到拾光所。\n\n這次最大的看見：\n${s.insight||'—'}\n\n重要的一句話：\n${s.quote||'—'}\n\n這次拾起的光：\n${s.light||s.leave||'—'}`:'尚未有相遇紀錄。'}else{body+=ss.map((s,i)=>`第 ${i+1} 次｜${s.stage}｜${s.date}\n${s.insight||s.bring||'—'}\n拾起的光：${s.light||'—'}\n`).join('\n')} $('draftTitle').textContent=`${t.name}｜《${type}》草稿`;$('draftText').value=body;$('draftStatus').textContent='你可以先修改，再確認文案。';$('recordPreviewCard').style.display='none'}function confirmDraft(){const tid=$('createTraveler').value,t=data.travelers.find(x=>x.id===tid);if(!t)return alert('請先選擇旅人');const type=$('recordType').value,text=$('draftText').value;data.confirmed.push({id:uid(),travelerId:tid,type,text,date:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(data));$('draftStatus').textContent='✓ 文案已確認，正式電子版預覽已顯示。';$('previewTitle').textContent=`《${type}》`;$('previewSub').textContent=type==='初遇紀錄'?'一場相遇，留下第一次看見。':type==='拾光紀錄'?'四週整理，把一路看見的自己留下來。':'三個月，把真正發生在生活裡的改變留下來。';$('previewBody').textContent=text;$('recordPreviewCard').style.display='block';$('recordPreviewCard').scrollIntoView({behavior:'smooth'})}$('sessionDate').value=new Date().toISOString().slice(0,10);renderAll();</script></body></html>
