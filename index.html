<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5eee4"><title>拾光所｜旅人陪伴系統</title><style>html,body{margin:0;width:100%;height:100%;background:#f5eee4;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#f5eee4}</style></head><body><iframe id="appFrame" src="app.html" title="拾光所｜旅人陪伴系統"></iframe><script>const f=document.getElementById('appFrame');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;let l=d.querySelector('link[data-shiguang-theme]');if(!l){l=d.createElement('link');l.rel='stylesheet';l.dataset.shiguangTheme='1';d.head.appendChild(l)}l.href='shiguang-theme.css?v=3';const old=d.querySelector('style[data-mobile-fix]');if(old)old.remove();const s=d.createElement('style');s.dataset.mobileFix='1';s.textContent='@media(max-width:760px){.hero{grid-template-columns:1fr!important}.quick-grid,.dashboard,.traveler-grid,.journey-layout,.form-layout,.create-layout,.library-grid{grid-template-columns:1fr!important}}';d.head.appendChild(s)}catch(e){console.warn(e)}});</script></body></html>
